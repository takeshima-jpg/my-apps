<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="app-title">100LIST</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fa;--sidebar-bg:#1a202c;--sidebar-active:#f6ad55;--sidebar-hover:#2d3748;
  --card:#fff;--border:#e2e8f0;--text:#2d3748;--text-sub:#718096;--text-light:#a0aec0;
  --accent:#f6ad55;--accent-dark:#ed8936;
  --green:#48bb78;--green-bg:#f0fff4;--green-border:#c6f6d5;
  --red:#fc8181;--red-bg:#fff5f5;--red-border:#fed7d7;
  --blue:#63b3ed;--blue-bg:#ebf8ff;--blue-border:#bee3f8;
  --purple-bg:#faf5ff;--purple-border:#e9d8fd;
  --orange-bg:#fffaf0;--orange-border:#feebc8;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
}
body{font-family:'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;display:flex;min-height:100vh;overflow-x:hidden}

/* TOP HEADER（スマホ専用） */
#top-header{background:var(--sidebar-bg);color:#e2e8f0;position:sticky;top:0;z-index:200;flex-shrink:0;width:100%;overflow:hidden;}
#top-header-inner{display:flex;align-items:center;gap:12px;padding:10px 18px;min-width:0;}
#top-logo{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0;}
#top-logo-text{font-size:15px;font-weight:700;color:#fff;letter-spacing:.01em;}
#vision-header{flex:1;min-width:0;overflow:hidden;}
.vision-card{background:transparent;border:none;border-radius:0;padding:0;display:flex;align-items:baseline;gap:10px;min-width:0;}
.vision-type{font-family:'JetBrains Mono','Courier New',monospace;font-size:0.56rem;color:#4a5568;letter-spacing:0.12em;white-space:nowrap;min-width:44px;flex-shrink:0}
.vision-body{font-size:0.82rem;color:#718096;line-height:1.4;white-space:normal;overflow:visible;text-overflow:unset;min-width:0;}
.vision-keyword{font-family:'JetBrains Mono','Courier New',monospace;font-size:0.62rem;color:#4a5568;margin-right:6px}
#top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
#top-add-btn{background:var(--accent);color:#1a202c;border:none;border-radius:7px;padding:7px 14px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;}
#top-add-btn:hover{background:var(--accent-dark);}

/* TAB NAV（スマホ専用） */
#tab-nav{background:#111827;border-bottom:1px solid #2d3748;overflow-x:auto;scrollbar-width:none;width:100%;}
#tab-nav::-webkit-scrollbar{display:none;}
#tab-nav #nav{display:flex;padding:0 10px;}
#tab-nav #nav button{display:flex;align-items:center;gap:6px;padding:9px 12px;border:none;border-bottom:2px solid transparent;background:none;color:#718096;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;margin-bottom:-1px;}
#tab-nav #nav button:hover{color:#cbd5e0;}
#tab-nav #nav button.active{color:#f6ad55;border-bottom-color:#f6ad55;font-weight:600;}

/* SIDEBAR（PC専用） */
#sidebar{width:220px;background:var(--sidebar-bg);color:#e2e8f0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
#sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid #2d3748;cursor:pointer;}
#sidebar-logo-inner{display:flex;align-items:center;gap:10px;}
#sidebar-logo-text{font-size:16px;font-weight:700;color:#fff;}
#sidebar .vision-area{padding:10px 12px 8px;border-bottom:1px solid #2d3748;}
#sidebar .vision-card{display:flex;flex-direction:column;gap:4px;}
#sidebar .vision-body{font-size:0.78rem;color:#718096;line-height:1.5;white-space:normal;overflow:visible;text-overflow:unset;}
#sidebar-nav{flex:1;padding:10px 8px;}
#sidebar-nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 13px;border-radius:8px;border:none;background:none;color:#cbd5e0;font-size:15px;font-weight:500;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;}
#sidebar-nav button:hover{background:rgba(255,255,255,.07);color:#fff;}
#sidebar-nav button.active{background:rgba(246,173,85,.15);color:#f6ad55;font-weight:600;border-left:3px solid #f6ad55;padding-left:10px;}
#sidebar-nav button .nav-icon{font-size:17px;flex-shrink:0;width:18px;text-align:center;opacity:.8;}
#sidebar-footer{padding:10px 8px 18px;border-top:1px solid #2d3748;}
#sidebar-footer button{display:block;width:100%;text-align:center;padding:11px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:5px;transition:background .15s;}
.btn-new-side{background:var(--accent);color:#1a202c;}
.btn-new-side:hover{background:var(--accent-dark);}
.btn-sm-side{background:rgba(255,255,255,.08);color:#a0aec0;font-size:13px!important;padding:8px!important;}
.btn-sm-side:hover{background:rgba(255,255,255,.14);}


/* MAIN */
#main{flex:1;overflow-x:hidden;overflow-y:auto;padding:24px 28px;max-width:1180px;box-sizing:border-box;width:100%;}
h2.page-title{font-size:26px;font-weight:800;color:var(--text);margin-bottom:5px}
.page-sub{color:var(--text-sub);font-size:15px;margin-bottom:24px}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:20px 22px;margin-bottom:16px}
.card-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px}

/* STATS */
.stat-grid{display:grid;gap:12px;margin-bottom:16px}
.stat-grid-4{grid-template-columns:repeat(4,1fr)}
.stat-grid-5{grid-template-columns:repeat(5,1fr)}
.stat-grid-3{grid-template-columns:repeat(3,1fr)}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);padding:16px 18px}
.stat-label{font-size:14px;color:var(--text-sub);margin-bottom:4px}
.stat-value{font-size:32px;font-weight:800;line-height:1}
.stat-sub{font-size:13px;color:var(--text-light);margin-top:3px}
.stat-green .stat-value{color:#276749}
.stat-red .stat-value{color:#c53030}
.stat-blue .stat-value{color:#2b6cb0}
.stat-yellow .stat-value{color:#c05621}
.stat-orange .stat-value{color:#9c4221}
.stat-warn{border-color:#fed7d7;background:#fff5f5}
.stat-warn .stat-value{color:#c53030}

/* PROGRESS */
.progress-header{display:flex;justify-content:space-between;font-size:15px;margin-bottom:6px}
.progress-bar-bg{background:#edf2f7;border-radius:999px;height:10px;overflow:hidden}
.progress-bar{height:100%;border-radius:999px;transition:width .5s}
.progress-bar.green{background:var(--green)}
.progress-bar.orange{background:var(--accent)}
.progress-bar.blue{background:var(--blue)}
.progress-bar.red{background:var(--red)}

/* GRID LAYOUT */
.dash-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;align-items:start;}
.dash-grid .card{margin-bottom:0;height:fit-content;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.two-col .card{margin-bottom:0}

/* LIST */
.filter-bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;align-items:center}
.filter-bar input[type=text],.filter-bar select{border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:15px;color:var(--text);background:#fff;min-width:110px}
.filter-bar input[type=text]{min-width:190px}
.filter-bar input[type=text]:focus,.filter-bar select:focus{outline:none;border-color:var(--accent)}
.toggle-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--text-sub);transition:all .15s}
.toggle-btn.on{background:var(--accent);border-color:var(--accent);color:#1a202c}

.list-table{width:100%;border-collapse:collapse}
.list-table th{padding:10px 13px;text-align:left;font-size:13px;font-weight:700;color:var(--text-sub);background:#f7fafc;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.list-table th:hover{color:var(--text)}
.list-table td{padding:11px 13px;border-bottom:1px solid #f0f4f8;font-size:15px;vertical-align:top}
.list-table tr:hover td{background:#fafcff}
.list-table tr.done td{opacity:.55}
.list-table tr.done .item-title{text-decoration:line-through}

/* TAGS */
.tag{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700;margin:1px}
.tag-high{background:#fed7d7;color:#c53030}
.tag-medium{background:#feebc8;color:#c05621}
.tag-low{background:#edf2f7;color:#718096}
.tag-focus{background:#bee3f8;color:#2b6cb0}
.tag-recurring{background:#c6f6d5;color:#276749}
.tag-count{background:var(--purple-border);color:#553c9a}
.tag-uncat{background:#fed7d7;color:#c53030}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--accent);color:#1a202c}
.btn-primary:hover{background:var(--accent-dark)}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#38a169}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#e53e3e}
.btn-gray{background:#edf2f7;color:var(--text)}
.btn-gray:hover{background:#e2e8f0}
.btn-blue{background:var(--blue);color:#fff}
.btn-blue:hover{background:#4299e1}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:#f7fafc}
.btn-sm{padding:4px 10px;font-size:13px}
.btn-lg{padding:11px 20px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* COMPLETE BUTTON */
.complete-btn{width:30px;height:30px;border-radius:50%;border:2px solid #cbd5e0;background:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.complete-btn:hover{border-color:var(--green);background:var(--green-bg)}
.complete-btn.done{background:var(--green);border-color:var(--green);color:#fff}

/* FORM */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:14px;font-weight:700;color:var(--text-sub);margin-bottom:5px}
.form-input,.form-select,.form-textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:9px 13px;font-size:16px;color:var(--text);background:#fff;transition:border-color .15s;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(246,173,85,.2)}
.form-input.error{border-color:var(--red)}
.form-textarea{resize:vertical;min-height:72px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.form-check-group{display:flex;gap:18px;flex-wrap:wrap}
.form-check{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:15px;font-weight:500}
.form-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.priority-btns{display:flex;gap:7px}
.priority-btn{flex:1;padding:8px;border-radius:8px;border:2px solid var(--border);text-align:center;font-size:14px;font-weight:700;cursor:pointer;background:#fff;transition:all .15s}
.priority-btn.sel-high{border-color:#fc8181;background:var(--red-bg);color:#c53030}
.priority-btn.sel-medium{border-color:#f6ad55;background:var(--orange-bg);color:#c05621}
.priority-btn.sel-low{border-color:#cbd5e0;background:#f7fafc;color:#4a5568}

/* MODAL */
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
#modal-overlay.show{display:flex}
#modal-box{background:#fff;border-radius:16px;padding:28px;width:660px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal-box h3{font-size:20px;font-weight:800;margin-bottom:20px}

/* COUNT PAGE */
.count-group-card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);padding:22px;margin-bottom:14px}
.count-theme{font-size:20px;font-weight:800;margin-bottom:4px}
.count-big{font-size:46px;font-weight:800;line-height:1}
.count-controls{display:flex;align-items:center;gap:10px;margin-top:14px}
.count-btn{width:42px;height:42px;border-radius:50%;border:2px solid var(--border);font-size:22px;font-weight:700;cursor:pointer;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit}
.count-btn:hover{border-color:var(--accent);background:var(--orange-bg)}
.count-btn.minus:hover{border-color:var(--red);background:var(--red-bg)}
.count-note{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:15px;font-family:inherit}
.count-note:focus{outline:none;border-color:var(--accent)}
.milestone-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f0f4f8}
.milestone-row:last-child{border-bottom:none}
.milestone-num{font-size:17px;font-weight:700;width:60px;flex-shrink:0}
.milestone-bar-wrap{flex:1}
.milestone-done{color:var(--green);font-weight:700}
.milestone-undone{color:var(--text-light)}

/* MONTH ITEM */
.month-item{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);border-left:4px solid transparent;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.month-item.high{border-left-color:#fc8181}
.month-item.medium{border-left-color:var(--accent)}
.month-item.low{border-left-color:#cbd5e0}
.month-item.done{opacity:.6}
.month-item-header{display:flex;align-items:flex-start;gap:13px}
.month-item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;padding-left:43px}

/* TOP100 */
.focus-item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-bottom:1px solid #f0f4f8}
.focus-item:last-child{border-bottom:none}
.focus-no{font-size:13px;color:var(--text-light);width:26px;flex-shrink:0}

/* REVIEW */
.review-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.review-grid .card{margin-bottom:0}
.month-chart{display:flex;align-items:flex-end;gap:5px;height:90px}
.month-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.month-bar{width:100%;border-radius:3px 3px 0 0;min-height:3px;transition:height .3s}
.month-bar.current{background:var(--accent)}
.month-bar.past{background:var(--blue)}
.month-bar.future{background:#edf2f7}
.month-label{font-size:10px;color:var(--text-light)}
.month-count-lbl{font-size:10px;font-weight:700;color:var(--text-sub)}
.cat-bar-row{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.cat-label{width:76px;font-size:14px;flex-shrink:0}
.cat-bar-bg{flex:1;height:9px;background:#edf2f7;border-radius:999px;overflow:hidden}
.cat-bar-fill{height:100%;background:var(--blue);border-radius:999px}
.cat-count{font-size:14px;font-weight:700;width:22px;text-align:right}

/* UNCAT PAGE */
.uncat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f0f4f8}
.uncat-row:last-child{border-bottom:none}

/* SETTINGS */
.settings-section{margin-bottom:24px}
.settings-section h3{font-size:17px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f7fafc}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:16px;font-weight:600}
.settings-desc{font-size:14px;color:var(--text-sub);margin-top:2px}

/* UTILS */
.flex{display:flex}.flex-1{flex:1}.items-center{align-items:center}.items-start{align-items:flex-start}
.gap-8{gap:8px}.gap-10{gap:10px}.gap-12{gap:12px}
.justify-between{justify-content:space-between}.flex-wrap{flex-wrap:wrap}
.text-green{color:#276749}.text-red{color:#c53030}.text-blue{color:#2b6cb0}
.text-sub{color:var(--text-sub)}.text-light{color:var(--text-light)}
.text-sm{font-size:15px}.text-xs{font-size:13px}.font-bold{font-weight:700}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}
.truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.empty-state{text-align:center;padding:50px 0;color:var(--text-light)}
.empty-state .empty-icon{font-size:44px;margin-bottom:10px}
.empty-state p{font-size:16px}
.divider{border:none;border-top:1px solid var(--border);margin:16px 0}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.section-head h3{font-size:17px;font-weight:700}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:9999;background:#2d3748;color:#fff;padding:11px 18px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:var(--shadow-md);transform:translateY(70px);opacity:0;transition:all .25s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{background:#276749}
#toast.error{background:#c53030}
#toast.info{background:#2b6cb0}

/* PRINT */
@media print{
  @page{size:A3;margin:14mm}
  #top-header,#tab-nav,.no-print{display:none!important}
  #main{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #ccc}
  body{background:#fff}
}

/* ── LAYOUT（スマホ基準） ── */
body{flex-direction:column;}
html,body{max-width:100%;overflow-x:hidden;}
#layout{display:flex;flex-direction:column;min-height:0;flex:1;}

/* モバイル用 */
.mob-header{display:none!important;}
.mob-data-bar{display:none!important;}
.mob-data-btn{display:none;}
.sidebar-overlay{display:none!important;}

/* ── PC レイアウト上書き ── */
@media(min-width:768px){
  #top-header,#tab-nav{display:none!important;}
  body{flex-direction:row!important;overflow:hidden!important;}
  #layout{flex-direction:row!important;height:100vh;overflow:hidden;}
  #sidebar{display:flex!important;}
  #main{overflow-y:auto!important;height:100vh;}
}
/* ── MOBILE RESPONSIVE ── */
@media(max-width:767px){
  #sidebar{display:none!important;}
  #top-header,#tab-nav{display:block;}
  #layout{display:flex!important;flex-direction:column!important;overflow-x:hidden;}
  body{overflow-x:hidden!important;}

  /* ヘッダー */
  #top-header-inner{padding:8px 10px;gap:7px;}
  #top-logo-text{font-size:14px;}
  #top-add-btn{padding:6px 10px;font-size:13px;}
  #vision-header{display:none;}
  #vision-bar-mob{display:block!important;}

  /* タブ */
  #tab-nav #nav button{padding:7px 8px;font-size:12px;}

  /* メイン */
  #main{padding:10px 10px;overflow-x:hidden!important;width:100%!important;box-sizing:border-box!important;}
  .page-title{font-size:20px;}
  .page-sub{font-size:13px;margin-bottom:14px;}

  /* カード */
  .card{padding:12px;margin-bottom:10px;width:100%;box-sizing:border-box;}

  /* グリッド → 全て1列 */
  .dash-grid{display:flex!important;flex-direction:column!important;gap:10px!important;}
  .two-col{display:flex!important;flex-direction:column!important;gap:10px!important;}
  .stat-grid-3{display:flex!important;flex-direction:column!important;gap:10px!important;}
  .stat-grid-4{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;}
  .stat-grid-5{display:grid!important;grid-template-columns:1fr 1fr!important;gap:8px!important;}
  .dash-grid .card,.two-col .card,.stat-grid-3 .card{width:100%;margin-bottom:0;}

  /* 統計値 */
  .stat-value{font-size:24px!important;}
  .stat-sub{font-size:12px;}
  .stat-label{font-size:13px;}

  /* stat-card内のflex wrap */
  .stat-card{display:flex!important;flex-wrap:wrap!important;gap:8px 16px!important;}
  .stat-card > div{min-width:80px;}

  /* フィルター */
  .filter-bar{flex-wrap:wrap;}
  .filter-bar input[type=text]{width:100%;min-width:0;box-sizing:border-box;}
  .filter-bar select{min-width:calc(50% - 4px);}
  .truncate{max-width:100%;}
  .uncat-row{flex-wrap:wrap;gap:6px;}
  .uncat-row .flex-1{width:100%;flex-basis:100%;}
  .uncat-row select{flex:1;min-width:0;font-size:14px;}
  .uncat-row button{flex-shrink:0;}
  .uncat-row > select, .uncat-row > button{flex-basis:auto;}
  .form-grid{grid-template-columns:1fr!important;}
  .form-grid-3{grid-template-columns:1fr 1fr!important;}

  /* リストテーブル → スマホ用カードリスト */
  .list-table thead{display:none;}
  .list-table,.list-table tbody,.list-table tr,.list-table td{display:block;width:100%;box-sizing:border-box;}
  .list-table tr{border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;padding:10px 12px;background:#fff;position:relative;}
  .list-table tr.done{opacity:.6;background:#f7fafc;}
  .list-table td{padding:2px 0;border:none;}
  /* 完了ボタンを右上に */
  .list-table td:first-child{position:absolute;top:10px;right:10px;width:auto;}
  /* NO非表示 */
  .list-table td:nth-child(2){display:none;}
  /* カテゴリ・優先度・タグ非表示（タイトル行に集約） */
  .list-table td:nth-child(4),.list-table td:nth-child(5),
  .list-table td:nth-child(6),.list-table td:nth-child(7){display:none;}
  /* 操作ボタン */
  .list-table td:last-child{margin-top:6px;}

  /* 重点リスト・捨てるリスト カード */
  .focus-card,.discard-card{width:100%!important;box-sizing:border-box;}
  .focus-card .card-title,.discard-card .card-title{white-space:normal!important;}

  /* 今週・今月 */
  .week-grid{grid-template-columns:1fr!important;}
  .month-grid{grid-template-columns:1fr!important;}

  /* ボタン群の折り返し */
  .btn-group{flex-wrap:wrap!important;gap:6px!important;}
  .bulk-assign-grid{grid-template-columns:1fr 1fr!important;}

  /* 固定幅解除 */
  [style*="width:115px"],[style*="width:100px"]{width:auto!important;min-width:0!important;}
  [style*="min-width:180px"]{min-width:0!important;width:100%!important;}

  /* filter-bar */
  .filter-bar input[type=text]{width:100%!important;min-width:0!important;box-sizing:border-box!important;}
  .filter-bar select{width:calc(50% - 4px)!important;min-width:0!important;}

  /* 月別チャート */
  #month-chart-inner{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}

const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GDRIVE_FILE_NAME = '100list-backup.json';
const GDRIVE_REDIRECT_URI = (location.origin + (location.pathname.endsWith('/index.html') ? location.pathname : location.pathname.replace(/\/$/, '') + '/index.html'));

let gdriveToken = null;
let gdriveFolderId = null;

// 新しいタブで開く方式（iframe内・Task OS両対応）
function gdriveConnect() {
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: GDRIVE_REDIRECT_URI,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
    prompt: 'select_account',
  });
  const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();

  // 新しいタブで開く（iframe内でもTask OS経由でも動作）
  window.open(authUrl, '_blank');
  toast('Googleのログイン画面を新しいタブで開きました。ログイン後、このページに戻ってください。', 'info');
}

// 認証後のURLフラグメントからトークンを取得
function gdriveHandleRedirect() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('access_token');
  if (token) {
    // localStorageに保存（新しいタブ・リダイレクト共通）
    localStorage.setItem('gdrive_token', token);
    history.replaceState(null, '', location.pathname);

    if (window.opener) {
      // popupとして開かれた場合は親に通知して閉じる（旧方式の互換性維持）
      try {
        window.opener.postMessage({ type: 'gdrive_token', token }, '*');
      } catch(e) {}
      window.close();
      return;
    }

    // 新しいタブとして開かれた場合：トークン保存済みメッセージを表示して閉じる
    if (window.history.length <= 1) {
      document.body.innerHTML = `
        <div style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;background:#0f172a;color:#e2e8f0;">
          <div style="font-size:48px">✅</div>
          <div style="font-size:18px;font-weight:700;">Googleドライブの接続が完了しました</div>
          <div style="font-size:14px;color:#718096;">このタブを閉じて100LISTに戻ってください</div>
          <button onclick="window.close()" style="margin-top:8px;padding:10px 24px;background:#f6ad55;color:#1a202c;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">このタブを閉じる</button>
        </div>`;
      return;
    }

    // 通常リダイレクトの場合
    gdriveToken = token;
    gdriveUpdateUI(true);
    // gdriveAutoLoad(); // ログイン直後の自動確認を無効化（トークン誤削除防止）
    toast('Googleドライブに接続しました', 'success');
  } else {
    // 保存済みトークンを確認
    const saved = localStorage.getItem('gdrive_token');
    if (saved) {
      gdriveToken = saved;
      gdriveUpdateUI(true);
    }
  }
}

async function gdriveFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + gdriveToken, ...(options.headers||{}) }
  });
  if (res.status === 401) {
    gdriveToken = null;
    localStorage.removeItem('gdrive_token');
    gdriveUpdateUI(false);
    throw new Error('認証期限切れ。再ログインしてください。');
  }
  return res;
}

async function gdriveFindFile() {
  const res = await gdriveFetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22${GDRIVE_FILE_NAME}%22&fields=files(id,name)`
  );
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

async function gdriveSave() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  dot.className = 'gdrive-dot saving';
  status.textContent = '保存中...';
  try {
    const payload = JSON.stringify({ items: items, savedAt: new Date().toISOString() }, null, 2);
    const fileId = await gdriveFindFile();
    const metadata = { name: GDRIVE_FILE_NAME, parents: fileId ? undefined : ['appDataFolder'] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', new Blob([payload], {type:'application/json'}));
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    await gdriveFetch(url, { method: fileId ? 'PATCH' : 'POST', body: form });
    dot.className = 'gdrive-dot connected';
    status.textContent = 'Googleドライブに保存済み (' + new Date().toLocaleTimeString('ja-JP') + ')';
    toast('Googleドライブに保存しました');
  } catch(e) {
    dot.className = 'gdrive-dot connected';
    status.textContent = '保存エラー: ' + e.message;
  }
}

async function gdriveLoad() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  try {
    const fileId = await gdriveFindFile();
    if (!fileId) { alert('Googleドライブにバックアップが見つかりません'); return; }
    const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.items) {
      if (!confirm(`Googleドライブから読み込みます。現在のデータは上書きされます。よろしいですか？`)) return;
      items = data.items || [];
      saveItems(items);
      renderPage();
      toast('Googleドライブから読み込みました');
    }
  } catch(e) {
    alert('読込エラー: ' + e.message);
  }
}

async function gdriveAutoLoad() {
  // 接続直後に自動でファイルの存在確認
  try {
    const fileId = await gdriveFindFile();
    if (fileId) {
      document.getElementById('gdriveStatusText').textContent = 'Googleドライブ接続済み（バックアップあり）';
    }
  } catch(e) {
    // 401等のエラーはgdriveFetch内で処理済み（UI未接続に戻る）
  }
}

// 起動時に自動保存（ログインしている場合）
function gdriveAutoSave() {
  if (gdriveToken) gdriveSave();
}

// ===== DATA LAYER =====
function migrateItems(arr){
  // discarded デフォルト付与 + カテゴリ移行
  let changed = false;
  arr.forEach(i=>{
    if(i.discarded === undefined){ i.discarded = false; i.discardedAt = null; changed = true; }
    if(CAT_MIGRATE[i.category]){ i.category = CAT_MIGRATE[i.category]; changed = true; }
  });
  if(changed) saveItems(arr);
  return arr;
}

function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw){
      const seed = JSON.parse(JSON.stringify(SEED));
      migrateItems(seed);
      saveItems(seed);
      return seed;
    }
    const parsed = JSON.parse(raw);
    if(!Array.isArray(parsed) || parsed.length === 0){
      const seed = JSON.parse(JSON.stringify(SEED));
      migrateItems(seed);
      saveItems(seed);
      return seed;
    }
    return migrateItems(parsed);
  }catch{
    const seed = JSON.parse(JSON.stringify(SEED));
    migrateItems(seed);
    saveItems(seed);
    return seed;
  }
}

function reinitSeed(){
  if(items.length>0){
    if(!confirm(`現在のデータ（${items.length}件）をバックアップしてから初期データを再投入します。\n\nよろしいですか？`)) return;
    downloadFile(JSON.stringify(items,null,2),'application/json','yaritai-backup-before-reinit-'+today()+'.json');
  } else {
    if(!confirm('初期データ（385件）を投入します。よろしいですか？')) return;
  }
  setTimeout(()=>{
    items = JSON.parse(JSON.stringify(SEED));
    saveItems(items);
    toast('初期データを投入しました（'+items.length+'件）','success');
    updateUncatBadge();
    renderPage(currentPage);
  }, 500);
}
function saveItems(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }

let items = loadItems();

function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function maxNo(){ return items.length ? Math.max(...items.map(i=>i.no)) : 0; }
function getItem(id){ return items.find(i=>i.id===id); }

function addItem(data){
  const now = new Date().toISOString();
  const it = Object.assign({
    no:maxNo()+1, id:genId(), createdAt:now, updatedAt:now,
    countHistory:[], countCurrent:0, countTarget:null,
    countTheme:null, countMilestones:[],
    discarded:false, discardedAt:null
  }, data);
  items.push(it);
  saveItems(items);
  updateUncatBadge();
}

function updateItem(id, data){
  const idx = items.findIndex(i=>i.id===id);
  if(idx<0) return;
  items[idx] = Object.assign({}, items[idx], data, {updatedAt:new Date().toISOString()});
  saveItems(items);
  updateUncatBadge();
}

// インライン編集用: データ保存のみ、並び替えなし（行の位置を固定したまま表示を更新）
function updateItemInline(id, data){
  const idx = items.findIndex(i=>i.id===id);
  if(idx<0) return;
  items[idx] = Object.assign({}, items[idx], data, {updatedAt:new Date().toISOString()});
  saveItems(items);
  updateUncatBadge();
  // 並び替えせずセルだけ視覚更新（ボタンの選択状態など）
  renderListInPlace();
}

// 並び替えなし・スクロール位置保持で再描画
function renderListInPlace(){
  const scrollY = window.scrollY;
  renderList();
  window.scrollTo(0, scrollY);
}

function deleteItem(id){
  items = items.filter(i=>i.id!==id);
  saveItems(items);
  updateUncatBadge();
}

function toggleComplete(id){
  const it = getItem(id);
  if(!it) return;
  const now = new Date().toISOString();
  const completing = !it.completed;
  updateItem(id, {completed:completing, completedAt:completing?now:null});

  // 毎年繰り返し: 完了時に翌年同月のタスクを自動追加
  if(completing && it.isRecurringYearly && it.year && it.month){
    const nextYear = it.year + 1;
    // 同タイトル・翌年・同月が既に存在しないか確認
    const alreadyExists = items.some(i =>
      i.title === it.title && i.year === nextYear && i.month === it.month && i.id !== id
    );
    // discarded なアイテムも重複チェック対象
    if(!alreadyExists){
      const nextItem = {
        ...it,
        id: genId(),
        no: maxNo() + 1,
        year: nextYear,
        completed: false,
        completedAt: null,
        countCurrent: 0,
        countHistory: [],
        discarded: false,
        discardedAt: null,
        createdAt: now,
        updatedAt: now,
      };
      items.push(nextItem);
      saveItems(items);
      updateUncatBadge();
      toast(`✅ 完了！「${it.title}」を${nextYear}年${it.month}月に自動追加しました`, 'success');
      return;
    }
  }
}

// ===== COUNT OPERATIONS =====
// カウント系は「親テーマ」でグループ化
// countTheme: 親テーマ名（例: "本を読む"）
// countMilestones: [{target:10,label:'10冊'}, {target:25,...}]
// countCurrent: 現在のカウント数（テーマ全体で共有）

function getCountGroups(){
  const countItems = items.filter(i=>i.isCountGoal);
  const groups = {};
  countItems.forEach(i=>{
    const theme = i.countTheme || i.title;
    if(!groups[theme]) groups[theme] = [];
    groups[theme].push(i);
  });
  return groups;
}

// 親テーマの現在カウントは items の中の isCountGoal&&isMaster フラグのアイテムで管理
// シンプルに: countTheme が同じアイテムの中で最もnoが小さいものを「マスター」とする
function getThemeMaster(theme){
  const grp = items.filter(i=>i.isCountGoal && (i.countTheme||i.title)===theme);
  if(!grp.length) return null;
  return grp.sort((a,b)=>a.no-b.no)[0];
}

function getThemeCurrent(theme){
  const master = getThemeMaster(theme);
  return master ? (master.countCurrent||0) : 0;
}

function incrementTheme(theme, note){
  const master = getThemeMaster(theme);
  if(!master) return;
  const now = new Date().toISOString();
  const newCur = (master.countCurrent||0)+1;
  const hist = [...(master.countHistory||[]), {date:now.split('T')[0], delta:1, note:note||''}];
  // check milestones completion
  const grp = items.filter(i=>i.isCountGoal && (i.countTheme||i.title)===theme);
  grp.forEach(it=>{
    if(it.countTarget && newCur >= it.countTarget && !it.completed){
      updateItem(it.id, {completed:true, completedAt:now, countCurrent:newCur, countHistory:hist});
    } else {
      updateItem(it.id, {countCurrent:newCur, countHistory:hist});
    }
  });
}

function decrementTheme(theme){
  const master = getThemeMaster(theme);
  if(!master) return;
  const newCur = Math.max(0, (master.countCurrent||0)-1);
  const hist = [...(master.countHistory||[]), {date:new Date().toISOString().split('T')[0], delta:-1}];
  const grp = items.filter(i=>i.isCountGoal && (i.countTheme||i.title)===theme);
  grp.forEach(it=>{
    const wasDone = it.completed && it.countTarget && newCur < it.countTarget;
    updateItem(it.id, {countCurrent:newCur, countHistory:hist, completed:wasDone?false:it.completed, completedAt:wasDone?null:it.completedAt});
  });
}

function postponeToNextMonth(id){
  const it = getItem(id);
  if(!it) return;
  let mo = (it.month||new Date().getMonth()+1)+1;
  let yr = it.year||new Date().getFullYear();
  if(mo>12){ mo=1; yr++; }
  updateItem(id, {month:mo, year:yr});
  toast('翌月へ延期しました');
}

// ===== DUPLICATE FOR YEAR (重複チェック付き) =====
function duplicateForYear(id, year){
  const it = getItem(id);
  if(!it) return;
  // 同タイトル・同年のデータが既に存在するかチェック
  const exists = items.some(i=>i.title===it.title && i.year===year && i.id!==id);
  if(exists){
    toast(`「${it.title}」の${year}年分はすでに存在します`, 'error');
    return;
  }
  if(!confirm(`「${it.title}」を${year}年分として複製しますか？`)) return;
  addItem({
    ...it, id:undefined, no:maxNo()+1, year,
    completed:false, completedAt:null,
    countCurrent:0, countHistory:[],
    discarded:false, discardedAt:null
  });
  toast(`${year}年分として複製しました`);
  renderPage(currentPage);
}

// ===== HELPERS =====
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ return s?s.split('T')[0]:''; }
function thisYear(){ return new Date().getFullYear(); }
function thisMonth(){ return new Date().getMonth()+1; }
function today(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function prioTag(p){
  if(p==='High') return `<span class="tag tag-high">高</span>`;
  if(p==='Medium') return `<span class="tag tag-medium">中</span>`;
  return `<span class="tag tag-low">低</span>`;
}
function pct(cur,tgt){ return tgt>0?Math.min(100,Math.round(cur/tgt*100)):0; }
function progressBar(cur,tgt,color='green'){
  const p=pct(cur,tgt);
  return `<div class="progress-bar-bg"><div class="progress-bar ${color}" style="width:${p}%"></div></div>`;
}

function thisWeekRange(){
  const now = new Date();
  const day = now.getDay(); // 0=sun
  const mon = new Date(now); mon.setDate(now.getDate()-(day===0?6:day-1));
  const sun = new Date(mon); sun.setDate(mon.getDate()+6);
  return {mon, sun};
}

function next30Days(){
  const now = new Date();
  const end = new Date(now); end.setDate(now.getDate()+30);
  return {now, end};
}

// ===== DASHBOARD =====
function buildMonthChart(activeItems, yr, mo){
  const byMonth = Array.from({length:12}, function(_,idx){
    var m2=idx+1;
    var its=activeItems.filter(function(i){return !i.completed&&i.year===yr&&i.month===m2;});
    return {m:m2, total:its.length,
      high:its.filter(function(i){return i.priority==='High';}).length,
      med:its.filter(function(i){return i.priority==='Medium';}).length,
      low:its.filter(function(i){return i.priority==='Low';}).length};
  });
  var maxC = Math.max.apply(null, byMonth.map(function(b){return b.total;}));
  if(maxC<1) maxC=1;
  var bars = byMonth.map(function(b){
    var barH = b.total>0 ? Math.max(18, Math.round(b.total/maxC*100)) : 4;
    var isCur = b.m===mo;
    var labelColor = isCur ? '#c05621' : (b.total>0 ? 'var(--text)' : 'var(--text-light)');
    var labelW = isCur ? '700' : '400';
    var innerBar = '';
    if(b.total>0){
      innerBar = '<div style="width:100%;height:100%;display:flex;flex-direction:column">'
        +'<div style="flex:'+b.low+';background:#e2e8f0;min-height:'+(b.low>0?2:0)+'px"></div>'
        +'<div style="flex:'+b.med+';background:#fbd38d;min-height:'+(b.med>0?2:0)+'px"></div>'
        +'<div style="flex:'+b.high+';background:#fc8181;min-height:'+(b.high>0?2:0)+'px"></div>'
        +'</div>';
    } else {
      innerBar = '<div style="width:100%;height:4px;background:#f0f4f8;border-radius:4px"></div>';
    }
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:130px;justify-content:flex-end"'
      +' onclick="listF.month=\''+b.m+'\';listF.year=\''+yr+'\';navigate(\'list\')"'
      +' title="'+b.m+'月: '+b.total+'件（高'+b.high+' 中'+b.med+' 低'+b.low+'）">'
      +'<div style="font-size:13px;font-weight:'+labelW+';color:'+labelColor+'">'+(b.total||'')+'</div>'
      +'<div style="width:100%;height:'+barH+'px;border-radius:4px 4px 0 0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end">'+innerBar+'</div>'
      +'<div style="font-size:10px;color:'+labelColor+';font-weight:'+labelW+'">'+b.m+'月</div>'
      +'</div>';
  });
  return '<div class="card" style="margin-bottom:0">'
    +'<div class="card-title">📆 月別タスク分布（'+yr+'年・未完了）'
    +'<span style="font-size:13px;color:var(--text-sub);font-weight:400;margin-left:8px">クリックでその月のリストへ</span></div>'
    +'<div id="month-chart-inner" style="overflow-x:auto;-webkit-overflow-scrolling:touch;">'
    +'<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;align-items:end;height:130px;min-width:340px">'+bars.join('')+'</div>'
    +'</div>'
    +'<div style="display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--text-sub)">'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#fc8181;border-radius:2px;display:inline-block"></span>高</span>'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#fbd38d;border-radius:2px;display:inline-block"></span>中</span>'
    +'<span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;background:#e2e8f0;border-radius:2px;display:inline-block"></span>低</span>'
    +'</div></div>';
}

function renderList(){
  const el = document.getElementById('page-list');
  const focusName = settings.focusListName||'重点リスト';
  const prioOrd = {High:0,Medium:1,Low:2};
  const yr = thisYear(), mo = thisMonth();

  // フィルター（statusはtabで上書き）
  let allRows = items.filter(i=>!i.discarded).filter(i=>{
    if(listF.search){const q=listF.search.toLowerCase(); if(!i.title.toLowerCase().includes(q) && !(i.memo||'').toLowerCase().includes(q)) return false;}
    if(listF.year!=='all' && String(i.year)!==listF.year) return false;
    if(listF.month!=='all' && String(i.month)!==listF.month) return false;
    if(listF.cat!=='all'){
      if(listF.cat==='未分類' && i.category && i.category!=='未分類') return false;
      else if(listF.cat!=='未分類' && i.category!==listF.cat) return false;
    }
    if(listF.focus && !i.isFocus) return false;
    if(listF.recurring && !i.isRecurringYearly) return false;
    if(listF.count && !i.isCountGoal) return false;
    return true;
  });

  const incompleteRows = allRows.filter(i=>!i.completed);
  const completeRows = allRows.filter(i=>i.completed);

  // 未完了: 期日あり→期日順、期日なし→優先度順で後ろ
  function sortIncomplete(rows){
    return rows.slice().sort((a,b)=>{
      const aHasDate = a.year || a.month;
      const bHasDate = b.year || b.month;
      if(aHasDate && !bHasDate) return -1;
      if(!aHasDate && bHasDate) return 1;
      if(aHasDate && bHasDate){
        const ay = (a.year||9999)*100+(a.month||99);
        const by = (b.year||9999)*100+(b.month||99);
        if(ay!==by) return ay-by;
      }
      // 同日付 or 両方なし → 優先度順
      return (prioOrd[a.priority]??2)-(prioOrd[b.priority]??2);
    });
  }

  // 完了: 完了日が新しい順
  function sortComplete(rows){
    return rows.slice().sort((a,b)=>{
      const da = a.completedAt||'';
      const db = b.completedAt||'';
      if(da>db) return -1;
      if(da<db) return 1;
      return 0;
    });
  }

  const rows = listTab==='incomplete' ? sortIncomplete(incompleteRows) : sortComplete(completeRows);
  const years = [...new Set(items.map(i=>i.year).filter(Boolean))].sort();

  el.innerHTML = `

      <option value="all">年: すべて</option>
      ${years.map(y=>`<option value="${y}" ${String(listF.year)===String(y)?'selected':''}>${y}年</option>`).join('')}
    </select>
    <select onchange="listF.month=this.value;renderList()">
      <option value="all">月: すべて</option>
      ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${String(listF.month)===String(i+1)?'selected':''}>${i+1}月</option>`).join('')}
    </select>
    <select onchange="listF.cat=this.value;renderList()">
      <option value="all">カテゴリ: すべて</option>
      ${[...CATS,'未分類'].map(c=>`<option value="${c}" ${listF.cat===c?'selected':''}>${c}</option>`).join('')}
    </select>
  </div>
  <div class="filter-bar">
    <button class="toggle-btn ${listF.focus?'on':''}" onclick="listF.focus=!listF.focus;renderList()">◎ ${esc(focusName)}のみ</button>
    <button class="toggle-btn ${listF.recurring?'on':''}" onclick="listF.recurring=!listF.recurring;renderList()">🔄 毎年繰り返し</button>
    <button class="toggle-btn ${listF.count?'on':''}" onclick="listF.count=!listF.count;renderList()">🎯 カウント系</button>
  </div>
</div>

<div class="flex gap-8" style="margin-bottom:14px;align-items:center;flex-wrap:nowrap">
  <button onclick="listTab='incomplete';renderList()" style="flex:1;padding:8px 6px;border-radius:10px;border:2px solid ${listTab==='incomplete'?'#f6ad55':'#e2e8f0'};background:${listTab==='incomplete'?'#fffaf0':'#fff'};font-size:14px;font-weight:700;cursor:pointer;color:${listTab==='incomplete'?'#c05621':'#718096'};white-space:nowrap;text-align:center;min-width:0;">
    📋 未完了 <span style="background:#f6ad55;color:#1a202c;border-radius:999px;padding:1px 8px;font-size:13px;margin-left:4px">${incompleteRows.length}</span>
  </button>

        </td>

          <td class="text-sm text-sub">${i.category||'未分類'}</td>

// ===== WEEK/MONTH PAGE =====
let weekTab = 'month'; // 'week' | 'month' | 'next30'

function renderWeek(){
  const el = document.getElementById('page-week');
  const yr = thisYear(), mo = thisMonth();
  const now = new Date();

  let title='', filteredItems=[];

  if(weekTab==='week'){
    const {mon,sun} = thisWeekRange();
    title = `今週（${mon.getMonth()+1}/${mon.getDate()}〜${sun.getMonth()+1}/${sun.getDate()}）`;
    filteredItems = items.filter(i=>!i.discarded).filter(i=>{
      if(i.completed) return false;
      if(i.scheduledDate){
        const d=new Date(i.scheduledDate);
        return d>=mon && d<=sun;
      }
      return i.year===yr && i.month===mo;
    });
  } else if(weekTab==='month'){
    title = `${yr}年${mo}月 やること`;
    filteredItems = items.filter(i=>!i.discarded&&i.year===yr&&i.month===mo);
  } else {
    const {now:n, end} = next30Days();
    title = `次の30日（〜${end.getMonth()+1}/${end.getDate()}）`;
    filteredItems = items.filter(i=>!i.discarded).filter(i=>{
      if(i.completed) return false;
      if(i.scheduledDate){
        const d=new Date(i.scheduledDate);
        return d>=n && d<=end;
      }
      if(i.year===yr){
        if(i.month===mo) return true;
        if(i.month===mo+1) return true;
      }
      return false;
    });
  }

  filteredItems.sort((a,b)=>{
    if(a.completed!==b.completed) return a.completed?1:-1;
    const po={High:0,Medium:1,Low:2};
    return (po[a.priority]??2)-(po[b.priority]??2);
  });

  const done = filteredItems.filter(i=>i.completed).length;
  const total = filteredItems.length;
  const prioMap = {high:'高',medium:'中',low:'低'};

  el.innerHTML = `
<h2 class="page-title">◷ スケジュール管理</h2>
<div class="flex gap-8 mb-16" style="margin-bottom:16px">
  ${['week','month','next30'].map(t=>`<button onclick="weekTab='${t}';renderWeek()" class="btn ${weekTab===t?'btn-primary':'btn-outline'}">${t==='week'?'今週':t==='month'?'今月':'次の30日'}</button>`).join('')}
</div>
<h3 style="font-size:19px;font-weight:700;margin-bottom:12px">${title}</h3>
<div class="flex items-center gap-12 mb-16">
  <span class="text-sub text-sm">${done} / ${total} 件完了</span>
  <div style="flex:1;min-width:180px">${progressBar(done,total,'green')}</div>
</div>
${filteredItems.length===0
  ?`<div class="empty-state"><div class="empty-icon">🗓️</div><p>この期間の予定はありません</p></div>`
  :filteredItems.map(i=>`
  <div class="month-item ${i.priority.toLowerCase()} ${i.completed?'done':''}">
    <div class="month-item-header">
      <button class="complete-btn ${i.completed?'done':''}" onclick="toggleComplete('${i.id}');renderWeek()" style="width:36px;height:36px;font-size:19px">${i.completed?'✓':''}</button>
      <div class="flex-1">
        <div style="font-size:18px;font-weight:700;${i.completed?'text-decoration:line-through;color:var(--text-light)':''}">${esc(i.title)}</div>
        <div class="flex gap-8 mt-8 flex-wrap">
          <span class="text-sm text-sub">${i.category||'未分類'}</span>
          ${prioTag(i.priority)}
          ${i.isFocus?`<span class="tag tag-focus">⭐ ${esc(settings.focusListName||'重点')}</span>`:''}
          ${i.scheduledDate?`<span class="text-sm text-sub">📆 ${i.scheduledDate}</span>`:''}
          ${i.completed&&i.completedAt?`<span class="text-sm text-green">✓ ${fmtDate(i.completedAt)} 完了</span>`:''}
        </div>
        ${i.memo?`<div class="text-xs text-sub" style="margin-top:5px">${esc(i.memo).substring(0,80)}${i.memo.length>80?'…':''}</div>`:''}
      </div>
    </div>
    ${!i.completed?`
    <div class="month-item-actions">
      <button class="btn btn-gray btn-sm" onclick="postponeToNextMonth('${i.id}');renderWeek()">⏭ 翌月へ延期</button>
      <button class="btn btn-outline btn-sm" onclick="openForm('${i.id}')">📝 編集・メモ</button>
    </div>`:''}
  </div>`).join('')
}`;
}

  updateItem(id, {discarded:true, discardedAt:new Date().toISOString()});

// ===== CSV EXPORT =====
function exportCSV(){
  const headers=['id','no','isFocus','title','isCountGoal','countTheme','countTarget','countCurrent','isRecurringYearly','year','month','scheduledDate','completed','completedAt','category','priority','memo','createdAt','updatedAt'];
  const rows=items.map(i=>[
    i.id,i.no,i.isFocus?1:0,
    `"${(i.title||'').replace(/"/g,'""')}"`,
    i.isCountGoal?1:0,
    `"${(i.countTheme||'').replace(/"/g,'""')}"`,
    i.countTarget??'',i.countCurrent??0,
    i.isRecurringYearly?1:0,
    i.year??'',i.month??'',i.scheduledDate??'',
    i.completed?1:0,i.completedAt?fmtDate(i.completedAt):'',
    i.category??'',i.priority,
    `"${(i.memo||'').replace(/"/g,'""')}"`,
    fmtDate(i.createdAt),fmtDate(i.updatedAt)
  ].join(','));
  const csv='\uFEFF'+[headers.join(','),...rows].join('\n');
  downloadFile(csv,'text/csv','yaritai-'+today()+'.csv');
  toast('CSVをエクスポートしました');
}

// ===== JSON IMPORT (復元前に自動バックアップ) =====
function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(!Array.isArray(data)) throw new Error('配列形式のJSONではありません');
      if(!confirm(`${data.length}件のデータで復元します。\n現在のデータ(${items.length}件)は上書きされます。\n\n※ 復元前に現在データのバックアップを自動作成します。\n\n続けますか？`)) return;
      // 自動バックアップ
      downloadFile(JSON.stringify(items,null,2),'application/json','yaritai-auto-backup-before-restore-'+today()+'.json');
      setTimeout(()=>{
        items=data;
        saveItems(items);
        toast(`${data.length}件のデータを復元しました`,'success');
        updateUncatBadge();
        renderPage(currentPage);
      },500);
    }catch(err){ toast('JSONの復元に失敗しました: '+err.message,'error'); }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
}

// ===== CSV IMPORT =====
function importCSV(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=(ev)=>{
    try{
      const txt=ev.target.result.replace(/^\uFEFF/,'');
      const lines=txt.split(/\r?\n/).filter(Boolean);
      const headers=lines[0].split(',');
      const imported=lines.slice(1).map(line=>{
        const vals=[]; let cur='',inQ=false;
        for(let i=0;i<line.length;i++){
          const ch=line[i];
          if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;} else inQ=!inQ; }
          else if(ch===','&&!inQ){ vals.push(cur);cur=''; }
          else cur+=ch;
        }
        vals.push(cur);
        const obj={};
        headers.forEach((h,i)=>{ obj[h.trim()]=vals[i]||''; });
        return {
          id:obj.id||genId(), no:parseInt(obj.no)||maxNo()+1,
          isFocus:obj.isFocus==='1'||obj.isTop100==='1', // 旧フォーマット対応
          title:obj.title||'', isCountGoal:obj.isCountGoal==='1',
          countTheme:obj.countTheme||null,
          countTarget:parseInt(obj.countTarget)||null,
          countCurrent:parseInt(obj.countCurrent)||0, countHistory:[],
          isRecurringYearly:obj.isRecurringYearly==='1',
          year:parseInt(obj.year)||null, month:parseInt(obj.month)||null,
          scheduledDate:obj.scheduledDate||null,
          completed:obj.completed==='1',completedAt:obj.completedAt||null,
          category:obj.category||'未分類', priority:obj.priority||'Medium',
          memo:obj.memo||'', createdAt:obj.createdAt||new Date().toISOString(),
          updatedAt:obj.updatedAt||new Date().toISOString(),
        };
      }).filter(o=>o.title);
      if(!imported.length){ toast('インポートできるデータがありませんでした','error'); return; }
      if(!confirm(`${imported.length}件のデータをインポートします。現在のデータと統合（同一IDは上書き）します。\n\n※ JSONバックアップの利用を推奨します。続けますか？`)) return;
      imported.forEach(ni=>{ const idx=items.findIndex(i=>i.id===ni.id); if(idx>=0)items[idx]=ni; else items.push(ni); });
      saveItems(items);
      toast(`${imported.length}件インポートしました`);
      updateUncatBadge();
      renderPage(currentPage);
    }catch(err){ toast('CSVのインポートに失敗しました: '+err.message,'error'); }
  };
  reader.readAsText(file,'utf-8');
  e.target.value='';
}

// ===== RESET =====
function resetData(){
  if(!confirm('⚠️ 全データを削除して空の状態に初期化します。\n\n事前にJSONバックアップを作成してください。\n\n本当に続けますか？')) return;
  if(!confirm('【最終確認】全データが失われます。本当によろしいですか？')) return;
  // 自動バックアップ
  if(items.length>0){
    downloadFile(JSON.stringify(items,null,2),'application/json','yaritai-auto-backup-before-reset-'+today()+'.json');
  }
  setTimeout(()=>{
    items=[];
    saveItems(items);
    toast('データを初期化しました','info');
    updateUncatBadge();
    renderPage(currentPage);
  },500);
}

// ===== UTILS =====
function downloadFile(content,type,filename){
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// ===== INIT (v2) =====
applySettings();
updateUncatBadge();
renderVision();
navigate('dashboard');
</script>
