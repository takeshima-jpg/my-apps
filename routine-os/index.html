<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine OS v2</title>

<style>
:root{
  --red:#E24B4A;--red-l:#FCEBEB;--red-d:#791F1F;
  --orange:#EF9F27;--orange-l:#FAEEDA;--orange-d:#854F0B;
  --blue:#378ADD;--blue-l:#E6F1FB;--blue-d:#0C447C;
  --gray:#888780;--gray-l:#F1EFE8;--gray-d:#444441;
  --green:#639922;--green-l:#EAF3DE;--green-d:#3B6D11;
  --purple:#7F77DD;--purple-l:#EEEDFE;--purple-d:#3C3489;
  --bg:#F8F7F4;--surface:#fff;--border:rgba(0,0,0,0.1);
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --r:8px;--r-lg:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;background:var(--bg);color:var(--text);font-size:18px;}
.app{display:flex;height:100vh;overflow:hidden;}

.sidebar{width:200px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;}
.sb-hd{padding:14px 16px;border-bottom:1px solid var(--border);}
.sb-logo{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
.sb-title{font-size:16px;font-weight:700;color:var(--text);margin-top:2px;}
.sb-nav{padding:6px 0;flex:1;overflow-y:auto;}
.ni{display:flex;align-items:center;gap:8px;padding:11px 16px;cursor:pointer;color:var(--text2);font-size:16px;border-left:3px solid transparent;transition:background .1s;}
.ni:hover{background:var(--bg);}
.ni.act{color:var(--blue);background:rgba(59,130,246,0.1);border-left-color:var(--blue);border-left-width:3px;font-weight:600;}
.ni-ico{font-size:15px;width:16px;text-align:center;}
.sb-ft{padding:10px 16px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);}

.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:54px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:50;}
.vision-area{padding:8px 20px;border-bottom:1px solid var(--border);}
.vision-card{background:#f7f7f9;border:1px solid #dcdce6;border-radius:10px;padding:10px 16px;display:flex;align-items:baseline;gap:14px;max-width:800px;}
.vision-type{font-family:'JetBrains Mono','Courier New',monospace;font-size:0.6rem;color:#9898a8;letter-spacing:0.1em;white-space:nowrap;min-width:52px;}
.vision-body{font-size:0.905rem;color:#5a5a6e;line-height:1.7;}
.vision-keyword{font-family:'JetBrains Mono','Courier New',monospace;font-size:0.68rem;color:#9898a8;margin-right:8px;}
.tb-t{font-size:19px;font-weight:700;}
.tb-a{display:flex;gap:6px;}
.btn{padding:8px 14px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;color:var(--text);font-family:inherit;transition:all .1s;white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-p{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-p:hover{background:var(--blue-d);}
.btn-d{background:var(--red-l);color:var(--red-d);border-color:var(--red);}
.btn-g{background:var(--green-l);color:var(--green-d);border-color:var(--green);}
.btn-sm{padding:4px 9px;font-size:14px;}
.content{padding:18px;flex:1;}

/* Badges */
.lb{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;font-size:14px;font-weight:700;white-space:nowrap;}
.l1{background:var(--red-l);color:var(--red-d);}
.l2{background:var(--orange-l);color:var(--orange-d);}
.l3{background:var(--blue-l);color:var(--blue-d);}
.l4{background:var(--gray-l);color:var(--gray-d);}
.sb2{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:14px;font-weight:700;}
.s-pend{background:#FFF3CD;color:#856404;}
.s-done{background:var(--green-l);color:var(--green-d);}
.s-ov{background:var(--red-l);color:var(--red-d);}
.s-skip{background:var(--gray-l);color:var(--gray-d);}
.s-stop{background:#eee;color:#888;}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);overflow:hidden;margin-bottom:12px;}
.ch{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ct{font-size:15px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;}
.cc{font-size:14px;background:var(--bg);padding:3px 8px;border-radius:999px;color:var(--text2);}

/* Task rows */
.tr{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.tr:last-child{border-bottom:none;}
.tr:hover{background:var(--bg);}
.tr.pin{background:#FFF8F8;border-left:3px solid var(--red);padding-left:13px;}
.tt{flex:1;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;min-width:0;}
.tm{font-size:15px;color:var(--text3);white-space:nowrap;}
.ta{display:flex;gap:5px;opacity:0;transition:opacity .1s;}
.tr:hover .ta{opacity:1;}
.od{width:7px;height:7px;border-radius:50%;background:var(--red);display:inline-block;margin-right:4px;flex-shrink:0;}

/* Metrics */
.mets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.met{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:14px 16px;}
.ml{font-size:14px;color:var(--text3);margin-bottom:4px;}
.mv{font-size:26px;font-weight:700;color:var(--text);}
.ms{font-size:14px;color:var(--text3);margin-top:2px;}
.met.dan .mv{color:var(--red);}
.met.inf .mv{color:var(--blue);}
.met.grn .mv{color:var(--green);}

/* Dashboard grid */
.dg{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:14px;}

/* Alerts */
.al{padding:10px 14px;border-radius:var(--r);font-size:15px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;}
.al-d{background:var(--red-l);color:var(--red-d);border:1px solid rgba(226,75,74,.3);}
.al-w{background:var(--orange-l);color:var(--orange-d);border:1px solid rgba(239,159,39,.3);}
.al-i{background:var(--blue-l);color:var(--blue-d);border:1px solid rgba(55,138,221,.3);}
.al-g{background:var(--green-l);color:var(--green-d);border:1px solid rgba(99,153,34,.3);}

/* Filter bar */
.fb{display:flex;gap:8px;padding:11px 16px;border-bottom:1px solid var(--border);background:var(--bg);flex-wrap:wrap;align-items:center;}
.fc{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:15px;color:var(--text2);}
.fc.act{background:var(--blue);color:#fff;border-color:var(--blue);}

/* Task table */
.sc{overflow-x:auto;}
.tt2{width:100%;border-collapse:collapse;}
.tt2 th{padding:10px 12px;text-align:left;font-size:15px;font-weight:700;color:var(--text2);border-bottom:2px solid var(--border);background:var(--bg);white-space:nowrap;}
.tt2 td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
.tt2 tr:hover td{background:#F8F7F4;}
.ii{border:none;background:transparent;font-size:16px;font-family:inherit;color:var(--text);width:100%;padding:4px 5px;border-radius:4px;min-height:32px;}
.ii:focus{outline:1px solid var(--blue);background:#fff;}
.is{border:none;background:transparent;font-size:16px;font-family:inherit;color:var(--text);padding:4px 5px;border-radius:4px;cursor:pointer;min-height:32px;}
.is:focus{outline:1px solid var(--blue);background:#fff;}
.ab{padding:5px 9px;border-radius:4px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;color:var(--text2);white-space:nowrap;}
.ab:hover{background:var(--bg);}
.ab.dn{color:var(--green-d);border-color:var(--green);}
.ab.sk{color:var(--orange-d);border-color:var(--orange);}
.ab.dg2{color:var(--red-d);border-color:var(--red);}

/* Calendar */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border);border-radius:var(--r-lg);overflow:hidden;}
.ch2{background:var(--bg);padding:7px;text-align:center;font-size:10px;font-weight:700;color:var(--text2);}
.cd{background:var(--surface);padding:5px;min-height:88px;}
.cd.om{background:var(--bg);opacity:.5;}
.cd.tod{background:#EEF5FF;}
.cdn{font-size:10px;color:var(--text2);margin-bottom:3px;font-weight:700;}
.ct2{font-size:9px;padding:1px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}

/* Execution Mode Cards */
.exec-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:22px 24px;margin-bottom:16px;transition:box-shadow .1s;}
.exec-card:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.exec-card.l1{border-left:4px solid var(--red);}
.exec-card.l2{border-left:4px solid var(--orange);}
.exec-card.l3{border-left:4px solid var(--blue);}
.exec-card.l4{border-left:4px solid var(--gray);}
.exec-card.overdue{background:#FFF5F5;}
.exec-title{font-size:22px;font-weight:700;margin-bottom:10px;line-height:1.35;}
.exec-notify{font-size:17px;color:var(--text2);background:var(--bg);border-radius:var(--r);padding:12px 14px;margin:12px 0;line-height:1.6;border-left:3px solid var(--blue);}
.exec-deliv{font-size:16px;color:var(--green-d);background:var(--green-l);border-radius:var(--r);padding:10px 14px;margin:10px 0;}
.exec-note{font-size:15px;color:var(--text3);margin-top:8px;}
.exec-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.exec-counter{font-size:16px;color:var(--text2);margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);}

/* Reminder cards */
.rc{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:13px;margin-bottom:9px;}
.rc.pri{border-left:3px solid var(--red);}
.rc.deferred{background:var(--bg);border-style:dashed;}
.rt{font-size:10px;color:var(--text3);margin-bottom:5px;display:flex;align-items:center;gap:6px;}
.rm{font-size:15px;font-weight:600;color:var(--text);margin-bottom:9px;line-height:1.45;}
.ra{display:flex;gap:5px;flex-wrap:wrap;}

/* Pinned banner */
.pb{background:#FFF0F0;border-bottom:1px solid rgba(226,75,74,.2);padding:8px 16px;font-size:14px;font-weight:700;color:var(--red-d);display:flex;align-items:center;gap:5px;}
.pb::before{content:'●';color:var(--red);}

/* Review */
.rs h3{font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.rs{margin-bottom:20px;}

/* Log rows */
.log-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:16px;}
.log-row:last-child{border-bottom:none;}
.log-action{padding:3px 8px;border-radius:999px;font-size:14px;font-weight:700;}
.la-done{background:var(--green-l);color:var(--green-d);}
.la-skip{background:var(--gray-l);color:var(--gray-d);}
.la-post{background:var(--orange-l);color:var(--orange-d);}
.la-stop{background:var(--red-l);color:var(--red-d);}

/* Quality check */
.qc-section{margin-bottom:18px;}
.qc-section h3{font-size:15px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);}

.empty{padding:24px;text-align:center;color:var(--text3);font-size:16px;}
.csv-ta{width:100%;height:180px;padding:10px;border:1px solid var(--border);border-radius:var(--r);font-family:monospace;font-size:15px;resize:vertical;}
.hid{display:none!important;}
select,input,textarea{font-family:inherit;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.fr{margin-bottom:14px;}
.fl{font-size:14px;font-weight:700;color:var(--text2);margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.04em;}
.fi{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:16px;font-family:inherit;color:var(--text);}
.fi:focus{outline:none;border-color:var(--blue);}
.fs{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:16px;font-family:inherit;color:var(--text);background:#fff;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;}
.md{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);width:580px;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2);}
.mh{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:5;}
.mt{font-size:18px;font-weight:700;}
.mb{padding:20px;}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:var(--surface);}
.saved-toast{position:fixed;bottom:20px;right:20px;background:#1a1a1a;color:#fff;padding:10px 16px;border-radius:var(--r);font-size:15px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;}
.saved-toast.show{opacity:1;}
.memo-area{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:16px;font-family:inherit;resize:vertical;min-height:70px;}

/* ── MOBILE RESPONSIVE ── */
.mob-header{display:none;align-items:center;gap:10px;padding:0 16px;height:48px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200;flex-shrink:0;}
.mob-logo{font-size:14px;font-weight:700;color:var(--gray);letter-spacing:.05em;}
.mob-title{font-size:16px;font-weight:700;color:var(--text);}
.mob-menu-btn{background:none;border:none;color:var(--gray);font-size:22px;cursor:pointer;padding:4px 8px;margin-left:auto;}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:299;}
@media(max-width:680px){
  .mob-header{display:flex;}
  .app{flex-direction:column;}
  .sidebar{position:fixed;left:-100%;top:0;height:100%;width:220px;z-index:300;transition:left .25s ease;overflow-y:auto;}
  .sidebar.open{left:0;}
  .sidebar-overlay.open{display:block;}
  .main{width:100%;height:calc(100vh - 48px);}
  .pg-content{padding:16px 12px;}
  .card{margin-bottom:10px;}
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="sidebar-overlay" id="sbOverlay" onclick="closeSidebar()"></div>
<div class="mob-header">
  <div style="display:flex;align-items:center;gap:8px;"><img src="icons/icon-32.png" style="width:28px;height:28px;border-radius:7px;"><span style="font-size:15px;font-weight:700;color:var(--text);">Routine OS</span></div>
  <button class="mob-menu-btn" onclick="toggleSidebar()">☰</button>
</div>
<div class="app">
<div class="sidebar">
  <div class="sb-hd">
    <div style="display:flex;align-items:center;gap:10px;padding:2px 0;">
    <img src="icons/icon-32.png" style="width:32px;height:32px;border-radius:8px;flex-shrink:0;">
    <span style="font-size:16px;font-weight:700;color:var(--text);letter-spacing:.01em;">Routine OS</span>
  </div>
  </div>
  <nav class="sb-nav">
    <div class="ni act" data-v="dashboard" onclick="sv(this,'dashboard')"><span class="ni-ico">◉</span>ダッシュボード</div>
    <div class="ni" data-v="list" onclick="sv(this,'list')"><span class="ni-ico">≡</span>タスク一覧</div>
    <div class="ni" data-v="calendar" onclick="sv(this,'calendar')"><span class="ni-ico">◷</span>カレンダー</div>
    <div class="ni" data-v="monthly" onclick="sv(this,'monthly')"><span class="ni-ico">↺</span>月次レビュー</div>
    <div class="ni" data-v="holidays" onclick="sv(this,'holidays')"><span class="ni-ico">◇</span>祝日管理</div>
  </nav>
  <div class="sb-sep" style="margin:4px 14px;height:1px;background:var(--border);"></div>
  <div style="padding:6px 0 4px;">
    <div style="font-size:9px;color:var(--text3);padding:4px 16px 3px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;">設定</div>
    <div style="margin:4px 8px 8px;padding:8px;background:rgba(255,255,255,0.05);border-radius:6px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;font-size:11px;color:var(--text3);">
        <span id="gdriveDot" style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.2);flex-shrink:0;"></span>
        <span id="gdriveStatusText">GDrive未接続</span>
      </div>
      <button id="gdriveConnectBtn" onclick="gdriveConnect()" style="width:100%;padding:5px 8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:var(--text1);font-size:12px;cursor:pointer;margin-bottom:3px;">Googleでログイン</button>
      <button id="gdriveSaveBtn" onclick="gdriveSave()" style="display:none;width:100%;padding:5px 8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:var(--text1);font-size:12px;cursor:pointer;margin-bottom:3px;">⬆ GDrive保存</button>
      <button id="gdriveLoadBtn" onclick="gdriveLoad()" style="display:none;width:100%;padding:5px 8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);border-radius:4px;color:var(--text1);font-size:12px;cursor:pointer;">⬇ GDrive読込</button>
    </div>
    <div class="ni" onclick="exportBackup()" style="font-size:15px;color:var(--text2);">
      <span class="ni-ico">💾</span>JSON保存
    </div>
    <div class="ni" onclick="document.getElementById('routine-import-input').click()" style="font-size:15px;color:var(--text2);">
      <span class="ni-ico">📥</span>JSON読込
    </div>
  </div>
  <div class="sb-ft" id="td-disp"></div>
</div>
<div class="main">
  <div class="topbar">
    <div class="tb-t" id="vt">ダッシュボード</div>
    <div class="tb-a">
      <button class="btn" onclick="showAdd()">＋ タスク追加</button>
      <input type="file" id="routine-import-input" accept=".json" style="display:none" onchange="importBackup(event)">
    </div>
  </div>
  <div class="vision-area" id="visionArea"></div>

  <div id="v-dashboard" class="content"></div>


  <div id="v-list" class="hid content">
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <input id="list-kw" class="fi" placeholder="🔍 タイトル・備考・サイクルで検索" style="flex:1;min-width:160px;padding:8px 12px;font-size:16px;">
      <select id="list-filter-status" class="fc" style="padding:6px 10px;font-size:15px;">
        <option value="">ステータス</option>
        <option value="未完了">未完了</option>
        <option value="スキップ">スキップ</option>
        <option value="停止">停止</option>
      </select>
      <select id="list-filter-layer" class="fc" style="padding:6px 10px;font-size:15px;">
        <option value="">レイヤー</option>
        <option value="1">意思決定・経営</option>
        <option value="2">重要運用</option>
        <option value="3">改善・振り返り</option>
        <option value="4">任意・保守</option>
      </select>
      <button class="btn" onclick="clearListFilter()" style="white-space:nowrap;">✕ クリア</button>
      <span id="list-count" style="font-size:15px;color:var(--text2);white-space:nowrap;"></span>
    </div>
    <div id="list-body"></div>
  </div>

  <div id="v-calendar" class="hid content">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
      <button class="btn btn-sm" onclick="cm(-1)">◀</button>
      <div style="font-size:17px;font-weight:700;" id="cml"></div>
      <button class="btn btn-sm" onclick="cm(1)">▶</button>
    </div>

<script>
// ── GOOGLE DRIVE SYNC (ROUTINE OS) ──
const GDRIVE_CLIENT_ID = '450582924828-c89h2mia7e396dbilpthguhtb77p6fmr.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GDRIVE_FILE_NAME = 'routine-os-backup.json';
const GDRIVE_REDIRECT_URI = (location.origin + (location.pathname.endsWith('/index.html') ? location.pathname : location.pathname.replace(/\/$/, '') + '/index.html'));

let gdriveToken = null;
let gdriveFolderId = null;
let gdriveFileId = null;

// リダイレクト方式（スマホ対応）
function gdriveConnect() {
  // OAuthコード取得後のリダイレクト処理
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: GDRIVE_REDIRECT_URI,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
    prompt: 'select_account',
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

// リダイレクト後にURLフラグメントからトークンを取得
function gdriveHandleRedirect() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('access_token');
  if (token) {
    gdriveToken = token;
    localStorage.setItem('gdrive_token', token);
    // トークンをURLから消す
    history.replaceState(null, '', location.pathname);
    gdriveUpdateUI(true);
    gdriveAutoLoad();
  } else {
    // 保存済みトークンを確認
    const saved = localStorage.getItem('gdrive_token');
    if (saved) {
      gdriveToken = saved;
      gdriveUpdateUI(true);
    }
  }
}

function gdriveUpdateUI(connected) {
  // デスクトップサイドバー
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  const connectBtn = document.getElementById('gdriveConnectBtn');
  const saveBtn = document.getElementById('gdriveSaveBtn');
  const loadBtn = document.getElementById('gdriveLoadBtn');
  // モバイルドロワー
  const dotMob = document.getElementById('gdriveDotMob');
  const statusMob = document.getElementById('gdriveStatusMob');
  const connectMob = document.getElementById('gdriveConnectMob');
  const saveMob = document.getElementById('gdriveSaveMob');
  const loadMob = document.getElementById('gdriveLoadMob');

  if (connected) {
    if (dot) dot.style.background = '#34a853';
    if (status) status.textContent = 'Googleドライブ接続済み';
    if (connectBtn) connectBtn.style.display = 'none';
    if (saveBtn) saveBtn.style.display = '';
    if (loadBtn) loadBtn.style.display = '';
    if (dotMob) dotMob.style.background = '#34a853';
    if (statusMob) statusMob.textContent = '接続済み';
    if (connectMob) connectMob.style.display = 'none';

    if (loadMob) loadMob.style.display = '';

    if (connectBtn) connectBtn.style.display = '';

    if (loadBtn) loadBtn.style.display = 'none';
    if (dotMob) dotMob.style.background = 'var(--border2)';
    if (statusMob) statusMob.textContent = '未接続';
    if (connectMob) connectMob.style.display = '';
    if (saveMob) saveMob.style.display = 'none';
    if (loadMob) loadMob.style.display = 'none';
  }
}

async function gdriveFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + gdriveToken, ...(options.headers||{}) }
  });
  if (res.status === 401) {
    gdriveToken = null;
    localStorage.removeItem('gdrive_token');
    gdriveUpdateUI(false);
    if (confirm('Googleの認証が切れました。再ログインしますか？')) {
      gdriveConnect();
    }
    throw new Error('認証切れ');
  }
  return res;
}

async function gdriveFindFile() {
  const res = await gdriveFetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22${GDRIVE_FILE_NAME}%22&fields=files(id,name)`
  );
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

function toast(msg) {
  let el = document.querySelector('.toast-msg');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}
async function gdriveSave() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  const btn = document.getElementById('gdriveSaveBtn');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '保存中...'; btn.disabled = true; }
  dot.className = 'gdrive-dot saving';
  status.textContent = '保存中...';
  try {
    const payload = JSON.stringify({ exportedAt: new Date().toISOString(), tasks, taskLogs }, null, 2);
    const fileId = await gdriveFindFile();
    const metadata = { name: GDRIVE_FILE_NAME, parents: fileId ? undefined : ['appDataFolder'] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', new Blob([payload], {type:'application/json'}));
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    await gdriveFetch(url, { method: fileId ? 'PATCH' : 'POST', body: form });
    dot.className = 'gdrive-dot connected';
    status.textContent = 'Googleドライブに保存済み (' + new Date().toLocaleTimeString('ja-JP') + ')';
    toast('Googleドライブに保存しました');
  } catch(e) {
    dot.className = 'gdrive-dot connected';
    status.textContent = '保存エラー: ' + e.message;
  } finally {
    if (btn) { btn.textContent = origText; btn.disabled = false; }
  }
}

async function gdriveLoad() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const btn = document.getElementById('gdriveLoadBtn');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '読込中...'; btn.disabled = true; }
  try {
    const fileId = await gdriveFindFile();
    if (!fileId) { alert('Googleドライブにバックアップが見つかりません'); return; }
    const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.tasks) {
      if (!confirm(`Googleドライブから読み込みます。現在のデータは上書きされます。よろしいですか？`)) return;
      tasks = data.tasks || [];
      taskLogs = data.taskLogs || [];
      saveData();
      render();
      toast('Googleドライブから読み込みました');
    }
  } catch(e) {
    alert('読込エラー: ' + e.message);
  } finally {
    if (btn) { btn.textContent = origText; btn.disabled = false; }
  }
}

async function gdriveAutoLoad() {
  // 接続直後に自動でファイルの存在確認
  try {
    const fileId = await gdriveFindFile();
    if (fileId) {
      document.getElementById('gdriveStatusText').textContent = 'Googleドライブ接続済み（バックアップあり）';
    }
  } catch(e) {}
}

// 起動時に自動保存（ログインしている場合）
function gdriveAutoSave() {
  if (gdriveToken) gdriveSave();
}

// ページ読み込み時にリダイレクト後トークンを処理（DOM準備後に実行）
document.addEventListener('DOMContentLoaded', function() {

});

// ========== STATE ==========
var tasks=[], taskLogs=[], holidays=[], nid=1;
// holidays = [{ date: 'YYYY-MM-DD', name: '祝日名' }, ...]
var filt={}, eid=null, calY=new Date().getFullYear(), calM=new Date().getMonth();
var pendingAction=null; // {taskId, action:'complete'|'skip'|'postpone'}
var curView='dashboard';

var today=new Date(); today.setHours(0,0,0,0);
// ローカル日付でYYYY-MM-DDを生成（toISOString()はUTC基準でずれるため使わない）
var tds=(function(){var y=today.getFullYear(),m=String(today.getMonth()+1).padStart(2,'0'),d=String(today.getDate()).padStart(2,'0');return y+'-'+m+'-'+d;})();

// ========== DATE STATE HELPERS ==========
function toDateKey(value){
  if(!value)return '';
  if(typeof value==='string')return value.slice(0,10);
  var d=new Date(value);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getTodayKey(){return tds;}
function getDateState(nextDate){
  var key=toDateKey(nextDate);
  if(!key)return 'none';
  if(key<tds)return 'overdue';
  if(key===tds)return 'today';
  return 'future';
}
var thisYear=today.getFullYear();

var LN={1:'意思決定・経営',2:'重要運用',3:'改善・振り返り',4:'任意・保守'};
var CY=['週次','隔週','月次','隔月','四半期','半期','年次','任意日','不定期'];
var VTITLES={dashboard:'ダッシュボード',list:'タスク一覧',calendar:'カレンダー',monthly:'月次レビュー',holidays:'祝日管理'};

document.getElementById('td-disp').textContent=today.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

// ========== STORAGE ==========
function saveData(){
  try{
    localStorage.setItem('routineOS_tasks', JSON.stringify(tasks));
    localStorage.setItem('routineOS_logs', JSON.stringify(taskLogs));

// 既存タスクのaddBase・addTypeを正規化（移行処理）
function migrateRoutineFields(){
  tasks.forEach(function(t){
    // cycleを正規化（揺れ・空白・レイヤー名混入を修復）
    t.cycle=normalizeCycle(t.cycle);
    // addDaysからcycleを推定（cycleが壊れている場合の救済）
    if(!t.cycle&&t.addDays){
      var days=Number(t.addDays);
      if(days===7)t.cycle='週次';
      else if(days===14)t.cycle='隔週';
      else if(days>=28&&days<=31)t.cycle='月次';
      else if(days>=90&&days<=93)t.cycle='四半期';
      else if(days>=180&&days<=186)t.cycle='半期';
      else if(days>=365)t.cycle='年次';
    }
    if(!t.addBase||t.addBase==='from_last'){t.addBase='from_next';}
    if(!t.addType){t.addType='calendar';}
    if(t.lastScheduledDate===undefined){t.lastScheduledDate='';}
    if(!t.status){t.status='未完了';}
    // updatedAt がない既存タスクには lastDate or nextDate から補完
    if(!t.updatedAt){
      t.updatedAt=t.lastDate?t.lastDate+'T00:00:00.000Z':(t.nextDate?t.nextDate+'T00:00:00.000Z':new Date().toISOString());
    }
    // 日付フィールドを正規化
    if(t.nextDate)t.nextDate=normalizeDate(t.nextDate)||t.nextDate;
    if(t.lastScheduledDate)t.lastScheduledDate=normalizeDate(t.lastScheduledDate)||t.lastScheduledDate;
    if(t.lastDate)t.lastDate=normalizeDate(t.lastDate)||t.lastDate;
  });
}

// ========== CYCLE NORMALIZATION ==========
function normalizeCycle(value){
  var raw=String(value||'').trim();
  if(!raw)return '';
  // レイヤー名が誤ってcycleに入っている場合は除去
  var layerNames=['意思決定・経営','重要運用','改善・振り返り','任意・保守'];
  for(var i=0;i<layerNames.length;i++){if(raw===layerNames[i])return '';}
  if(raw.indexOf('隔週')>=0)return '隔週';
  if(raw.indexOf('週次')>=0||raw.indexOf('毎週')>=0||raw.toLowerCase().indexOf('weekly')>=0)return '週次';
  if(raw.indexOf('隔月')>=0)return '隔月';
  if(raw.indexOf('四半期')>=0||raw.indexOf('3ヶ月')>=0||raw.indexOf('3か月')>=0)return '四半期';
  if(raw.indexOf('半期')>=0||raw.indexOf('半年')>=0||raw.indexOf('6ヶ月')>=0||raw.indexOf('6か月')>=0)return '半期';
  if(raw.indexOf('月次')>=0||raw.indexOf('毎月')>=0||raw.toLowerCase().indexOf('monthly')>=0)return '月次';
  if(raw.indexOf('年次')>=0||raw.indexOf('毎年')>=0||raw.toLowerCase().indexOf('yearly')>=0||raw.toLowerCase().indexOf('annual')>=0)return '年次';
  if(raw.indexOf('任意日')>=0)return '任意日';
  if(raw.indexOf('不定期')>=0)return '不定期';
  return '';
}


function ds(d){if(typeof d==='string')return d.slice(0,10);return d.toLocaleDateString('sv');}
function pd(s){if(!s)return null;return new Date(s+'T00:00:00');}
function isWE(d){var x=new Date(d+'T00:00:00');return x.getDay()===0||x.getDay()===6;}
function isHol(d){
  var s=typeof d==='string'?d.slice(0,10):ds(d);
  return holidays.some(function(h){return h.date===s;});
}

function normalizeDate(v){
  if(!v||typeof v!=='string')return '';
  v=v.trim();
  // Already YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)){var dt=new Date(v+'T00:00:00');return isNaN(dt)?v:v;}
  // YYYY/M/D or YYYY/MM/DD
  var m=v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}
  // M/D or MM/DD (no year)
  m=v.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m){return thisYear+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');}
  // M月D日
  m=v.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m){return thisYear+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');}
  // M月D日YYYY年 or YYYY年M月D日
  m=v.match(/(\d{4})年(\d{1,2})月(\d{1,2})日?/);
  if(m){return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');}
  return v; // keep original for quality check
}
function isValidDate(s){if(!s)return false;var d=new Date(s+'T00:00:00');return !isNaN(d)&&s===ds(d);}

// ========== BUSINESS DAY CALC ==========
function addBD(st,n,ew,eh){
  var d=new Date(st+'T00:00:00'),cnt=0,step=n>=0?1:-1,tgt=Math.abs(n);
  while(cnt<tgt){d.setDate(d.getDate()+step);if(ew&&isWE(ds(d)))continue;if(eh&&isHol(ds(d)))continue;cnt++;}
  return ds(d);
}
function addCD(st,n){var d=new Date(st+'T00:00:00');d.setDate(d.getDate()+n);return ds(d);}
function nBD(y,m,n,eh){var d=new Date(y,m,1),cnt=0;while(d.getMonth()===m){var s=ds(d);if(!isWE(s)&&(!eh||!isHol(s))){cnt++;if(cnt===n)return s;}d.setDate(d.getDate()+1);}return null;}
function nLBD(y,m,n,eh){var d=new Date(y,m+1,0),cnt=0;while(d.getMonth()===m){var s=ds(d);if(!isWE(s)&&(!eh||!isHol(s))){cnt++;if(cnt===Math.abs(n))return s;}d.setDate(d.getDate()-1);}return null;}

function calcNext(t,from){
  if(!from||!isValidDate(from))return null;
  var days=parseInt(t.addDays);if(isNaN(days))return null;
  var tp=t.addType||'calendar',ab=t.addBase||'from_last',eh=t.excludeHolidays,ew=t.excludeWeekends;
  var base=new Date(from+'T00:00:00');
  if(ab==='fixed'&&t.fixedM&&t.fixedD){
    var nx=new Date(base.getFullYear(),t.fixedM-1,t.fixedD);
    if(nx<=base)nx.setFullYear(nx.getFullYear()+1);
    return ds(nx);
  }
  if(ab==='from_ms'){var m=base.getMonth(),y=base.getFullYear(),nm=m+1>11?0:m+1,ny=m+1>11?y+1:y;return tp==='business'?nBD(ny,nm,days,eh):(new Date(ny,nm,days)).toLocaleDateString('sv');}
  if(ab==='from_me'){var m=base.getMonth(),y=base.getFullYear(),nm=m+1>11?0:m+1,ny=m+1>11?y+1:y;return tp==='business'?nLBD(ny,nm,Math.abs(days),eh):ds(new Date(ny,nm+1,days));}
  if(ab==='from_ys'){var y=base.getFullYear()+1;return tp==='business'?nBD(y,0,days,eh):ds(new Date(y,0,days));}
  return tp==='business'?addBD(from,days,ew!==false,eh):addCD(from,days);
}

function isOv(t){if(!t.nextDate||t.status==='完了'||t.status==='停止')return false;return getDateState(t.nextDate)==='overdue';}
function isTod(t){if(!t.nextDate||t.status==='完了'||t.status==='停止')return false;return getDateState(t.nextDate)==='today';}
function isWk(t){if(!t.nextDate)return false;var e=new Date(today);e.setDate(e.getDate()+7);return t.nextDate>=tds&&t.nextDate<=ds(e)&&t.status!=='完了'&&t.status!=='停止';}

// 今日より未来で、3営業日以内かどうか判定
function isWithin3BD(t){
  if(!t.nextDate||t.status==='完了'||t.status==='停止')return false;
  if(t.nextDate<=tds)return false; // 今日以前は対象外
  // 今日から3営業日後を求める
  var d=new Date(tds+'T00:00:00'),cnt=0;
  while(cnt<3){
    d.setDate(d.getDate()+1);
    if(!isWE(ds(d))&&!isHol(ds(d)))cnt++;
  }
  return t.nextDate<=ds(d);
}

function getTomorrowDate(){
  var d=parseLocalDate(getTodayLocalString());
  d.setDate(d.getDate()+1);
  return formatLocalDate(d);
}
// サイクルから周期を推定（addDaysが未設定でも機能する）
// サイクルのみで周期を決定（normalizeCycle経由で揺れを吸収）
// ========== LOCAL DATE FUNCTIONS (タイムゾーン非依存) ==========
function parseLocalDate(dateStr){
  var s=normalizeDate(String(dateStr||'').trim());
  if(!s||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;
  var parts=s.split('-').map(Number);
  var y=parts[0],m=parts[1],d=parts[2];
  var date=new Date(y,m-1,d);
  date.setHours(0,0,0,0);
  if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return null;
  return date;
}
function formatLocalDate(date){
  var y=date.getFullYear();
  var m=String(date.getMonth()+1).padStart(2,'0');
  var d=String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function getTodayLocalString(){
  var d=new Date();d.setHours(0,0,0,0);return formatLocalDate(d);
}
function addDaysLocal(date,days){
  var next=new Date(date.getFullYear(),date.getMonth(),date.getDate()+days);
  next.setHours(0,0,0,0);return next;
}
function addMonthsLocal(date,months){
  var y=date.getFullYear(),m=date.getMonth(),d=date.getDate();
  var target=new Date(y,m+months,1);
  var lastDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
  target.setDate(Math.min(d,lastDay));
  target.setHours(0,0,0,0);return target;
}
function addYearsLocal(date,years){return addMonthsLocal(date,years*12);}

function getRoutineInterval(t){
  var cycle=normalizeCycle(typeof t==='string'?t:(t&&t.cycle?t.cycle:''));
  var map={'週次':{type:'days',value:7},'隔週':{type:'days',value:14},'月次':{type:'months',value:1},'隔月':{type:'months',value:2},'四半期':{type:'months',value:3},'半期':{type:'months',value:6},'年次':{type:'years',value:1}};
  return map[cycle]||null;
}
function getCycleInterval(t){return getRoutineInterval(t);}
function canInferIntervalFromCycle(t){return getRoutineInterval(t)!==null;}
// 既存コードとの後方互換（旧文字列ベース加算は残置）
function addMonthsSafe(dateStr,months){var d=new Date(dateStr+'T00:00:00');var orig=d.getDate();d.setMonth(d.getMonth()+months);if(d.getDate()!==orig)d.setDate(0);return ds(d);}
function addYearsSafe(dateStr,years){var d=new Date(dateStr+'T00:00:00');d.setFullYear(d.getFullYear()+years);return ds(d);}

// 完了・スキップ専用：ローカル日付計算で確実に未来日を返す（最大240回）
function calcNextRoutineDate(t,previousScheduledDate){
  var todayStr=getTodayLocalString();
  var today=parseLocalDate(todayStr);
  var base=parseLocalDate(previousScheduledDate)||parseLocalDate(t.nextDate)||parseLocalDate(t.lastScheduledDate)||today;
  var interval=getRoutineInterval(t);
  if(!interval){
    console.error('サイクル判定失敗',{title:t.title,cycle:t.cycle,normalizedCycle:normalizeCycle(t.cycle),addDays:t.addDays,task:t});
    return null;
  }
  function addOnce(date){
    if(interval.type==='days')return addDaysLocal(date,interval.value);
    if(interval.type==='months')return addMonthsLocal(date,interval.value);
    if(interval.type==='years')return addYearsLocal(date,interval.value);
    return null;
  }
  var next=addOnce(base);
  var guard=0;
  while(next&&next<=today&&guard<240){next=addOnce(next);guard++;}
  if(!next||next<=today){
    console.error('未来日の生成に失敗',{title:t.title,cycle:t.cycle,base:formatLocalDate(base),today:todayStr,interval:interval,task:t});
    return null;
  }
  return formatLocalDate(next);
}
function calcNextBySchedule(t,prev){return calcNextRoutineDate(t,prev);}
// 延期専用（周期計算なし）
function ensureFutureDate(dateValue){
  if(!dateValue||!isValidDate(dateValue)||dateValue<=tds)return getTomorrowDate();
  return dateValue;
}
function doComplete(id,memo){
  var t=tasks.find(function(x){return String(x.id)===String(id);});if(!t)return;
  t.cycle=normalizeCycle(t.cycle);
  var prev=parseLocalDate(t.nextDate);
  var previousScheduledDate=prev?formatLocalDate(prev):getTodayLocalString();
  var nextDate=calcNextRoutineDate(t,previousScheduledDate);
  if(!nextDate){
    alert('次回予定日を計算できません。\n\nタスク名: '+t.title+'\n保存されているサイクル: '+(t.cycle||'空')+'\n次回予定日: '+(t.nextDate||'空')+'\n\nconsoleの診断ログを確認してください。');
    return;
  }
  t.lastScheduledDate=previousScheduledDate;
  t.lastDate=previousScheduledDate;
  t.nextDate=nextDate;
  t.status='未完了';
  t.updatedAt=new Date().toISOString();
  addLog(id,'完了',{prev:previousScheduledDate,next:nextDate,memo:memo});
  saveData();
  // 月次レビュー完了時のみメンテナンス処理を実行
  if(t.title==='月次レビュー'){runMonthlyMaintenance();}
  rAll();
}
function doSkip(id,reason,memo){
  var t=tasks.find(function(x){return String(x.id)===String(id);});if(!t)return;
  t.cycle=normalizeCycle(t.cycle);
  var prev=parseLocalDate(t.nextDate);
  var previousScheduledDate=prev?formatLocalDate(prev):getTodayLocalString();
  var nextDate=calcNextRoutineDate(t,previousScheduledDate);
  if(!nextDate){
    alert('次回予定日を計算できません。\n\nタスク名: '+t.title+'\n保存されているサイクル: '+(t.cycle||'空')+'\n次回予定日: '+(t.nextDate||'空')+'\n\nconsoleの診断ログを確認してください。');
    return;
  }
  t.lastScheduledDate=previousScheduledDate;
  t.lastDate=previousScheduledDate;
  t.nextDate=nextDate;
  t.status='未完了';
  t.updatedAt=new Date().toISOString();
  addLog(id,'スキップ',{prev:previousScheduledDate,next:nextDate,skipReason:reason,memo:memo});
  saveData();rAll();
}
// デバッグ用テスト関数（コンソールで testRoutineDateCalc() を実行）
function testRoutineDateCalc(){
  var samples=[
    {title:'週次テスト',cycle:'週次',nextDate:'2026-05-06'},
    {title:'月次テスト',cycle:'月次',nextDate:'2026-05-03'},
    {title:'年次テスト',cycle:'年次',nextDate:'2026-05-04'}
  ];
  console.table(samples.map(function(t){return{title:t.title,cycle:t.cycle,nextDate:t.nextDate,result:calcNextRoutineDate(t,t.nextDate)};}));
}
function doPostpone(id,memo){
  var t=tasks.find(function(x){return x.id===id;});if(!t)return;
  var prev=t.nextDate;
  // 延期はlastScheduledDateを更新しない（周期計算でなく一時回避）
  var nx=getTomorrowDate();
  addLog(id,'延期',{prev:prev,next:nx,memo:memo});
  t.nextDate=nx;t.status='未完了';t.updatedAt=new Date().toISOString();
  saveData();rAll();
}
function stopT(id){
  var t=tasks.find(function(x){return x.id===id;});if(!t)return;
  addLog(id,'停止',{prev:t.nextDate});
  t.status='停止';t.updatedAt=new Date().toISOString();
  saveData();rAll();
}
function delT(id){
  if(!confirm('削除しますか？'))return;
  var t=tasks.find(function(x){return x.id===id;});
  if(t)addLog(id,'削除',{prev:t.nextDate,title:t.title,layer:t.layer,cycle:t.cycle});
  tasks=tasks.filter(function(x){return x.id!==id;});
  saveData();rAll();
}
function recalc(id){
  var t=tasks.find(function(x){return x.id===id;});if(!t||!t.addDays){alert('加算日数が未設定です');return;}
  var f=t.lastDate||t.nextDate||tds,nx=calcNext(t,f);if(nx){t.nextDate=nx;saveData();rAll();}
}

  var html='<div class="cg">';
  ['日','月','火','水','木','金','土'].forEach(function(d){html+='<div class="ch2">'+d+'</div>';});
  for(var i=0;i<fd;i++){var p=new Date(calY,calM,-fd+i+1);html+='<div class="cd om"><div class="cdn">'+p.getDate()+'</div></div>';}
  for(var d=1;d<=dim;d++){
    var dstr=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var isT=dstr===tds,dts=tbd[dstr]||[];
    html+='<div class="cd'+(isT?' tod':'')+'"><div class="cdn"'+(isT?' style="color:var(--blue);font-weight:800;"':'')+'>'+d+'</div>'+

      (dts.length>3?'<div style="font-size:9px;color:var(--text3)">+'+( dts.length-3)+'</div>':'')+
      '</div>';
  }
  var tc=fd+dim,rem=(7-tc%7)%7;
  for(var i=1;i<=rem;i++)html+='<div class="cd om"><div class="cdn">'+i+'</div></div>';
  html+='</div>';con.innerHTML=html;

function exportBackup(){
  var now=new Date();
  var y=now.getFullYear();
  var m=String(now.getMonth()+1).padStart(2,'0');
  var d=String(now.getDate()).padStart(2,'0');
  var backup={exportedAt:now.toISOString(),tasks:tasks,taskLogs:taskLogs};
  var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='routine-os-backup-'+y+'-'+m+'-'+d+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (!data.tasks && !data.taskLogs) throw new Error('無効なフォーマットです');
      if (!confirm('タスク: ' + (data.tasks||[]).length + '件、ログ: ' + (data.taskLogs||[]).length + '件を復元します。\n現在のデータは上書きされます。続けますか？')) return;
      if (data.tasks) {
        tasks = data.tasks;
        localStorage.setItem('routineOS_tasks', JSON.stringify(tasks));
        if (data.tasks.length > 0) {
          var maxId = Math.max.apply(null, data.tasks.map(function(t){return t.id||0;}));
          nid = maxId + 1;
          localStorage.setItem('routineOS_nid', String(nid));
        }
      }
      if (data.taskLogs) {
        taskLogs = data.taskLogs;
        localStorage.setItem('routineOS_logs', JSON.stringify(taskLogs));
      }
      alert('復元しました（' + (data.tasks||[]).length + '件）');
      rAll();
    } catch(err) { alert('インポートに失敗しました: ' + err.message); }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function runMonthlyMaintenance(){
  // 完了・スキップ履歴を直近300件に制限
  if(Array.isArray(taskLogs)&&taskLogs.length>300){
    taskLogs=taskLogs.slice(-300);
  }
  // 不正なstatusを「未完了」に補正（停止・完了・未完了・スキップ以外）
  var validStatuses=['未完了','完了','スキップ','停止'];
  tasks.forEach(function(t){
    if(!t.status||validStatuses.indexOf(t.status)<0){t.status='未完了';}
  });
  // nextDateが空のアクティブタスクをコンソールに出力（参考情報）
  var noDate=tasks.filter(function(t){return !t.nextDate&&t.status!=='停止';});
  if(noDate.length){console.info('[月次メンテ] 次回予定日未設定タスク '+noDate.length+'件:',noDate.map(function(t){return t.title;}));}
  saveData();
  exportBackup();
}

function importPreset(year){
  var preset=importJapaneseHolidays(year);
  if(!preset.length){
    alert(year+'年のプリセットデータはありません');return;
  }
  var existing=holidays.map(function(h){return h.date;});
  var added=0,skipped=0;
  preset.forEach(function(h){
    if(existing.includes(h.date)){skipped++;}
    else{holidays.push({date:h.date,name:h.name});added++;}
  });
  var res=document.getElementById('h-preset-result');
  if(res){
    res.innerHTML='<div class="al '+(added>0?'al-g':'al-i')+'">' +
      year+'年の祝日：'+added+'件を追加しました'+(skipped?' （'+skipped+'件はすでに登録済みのためスキップ）':'')+'</div>';
    setTimeout(function(){res.innerHTML='';},4000);
  }
  saveData();rHol();
}

function doImport(){
  var raw=document.getElementById('csv-inp').value.trim();if(!raw)return;
  var lines=raw.split('\n'),hdrs=lines[0].split(',').map(function(h){return h.trim();}),cnt=0,errs=[];
  for(var i=1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var vals=lines[i].split(',').map(function(v){return v.trim();}),row={};
    hdrs.forEach(function(h,idx){row[h]=vals[idx]||'';});
    if(!row['タイトル'])continue;
    var cyv=normalizeCycle(row['サイクル']||'')||'不定期';
    var nxv=row['次回予定']||'';
    var nxNorm=normalizeDate(nxv);
    if(nxv&&!isValidDate(nxNorm))errs.push('No.'+(i)+' 「'+row['タイトル']+'」の日付が不正：'+nxv);
    tasks.push({id:nid++,title:row['タイトル'],cycle:cyv,dept:row['部署']||'',nextDate:isValidDate(nxNorm)?nxNorm:nxv,url:row['URL']||'',note:row['備考']||'',layer:4,status:'未完了',addType:'calendar',addBase:'from_next',lastScheduledDate:''});
    cnt++;
  }
  var html='<div class="al al-g">'+cnt+'件を取込みました。レイヤー分類・成果物・通知文を手動設定してください。</div>';
  if(errs.length)html+=errs.map(function(e){return'<div class="al al-w">'+e+'</div>';}).join('');
  document.getElementById('ir').innerHTML=html;
  saveData();rAll();
}

function normalizeSeedDate(v){
  if(!v||typeof v!=='string')return '';
  v=v.trim();
  if(v===''||v==='#VALUE!'||v==='vg')return v; // 不正値はそのまま保持
  if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;
  var m=v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})\/(\d{1,2})$/);
  if(m)return '2026-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  m=v.match(/^(\d{1,2})月(\d{1,2})日?$/);
  if(m)return '2026-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  m=v.match(/(\d{4})年(\d{1,2})月(\d{1,2})日?/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  return v;
}

function classifyLayerFromSeed(seed){
  var t=(seed.title||'')+(seed.dept||'');
  if(/経営計画|予算|四半期|5か年|市場情報|競合|組織図|人事制度|数字進捗|年間スケジュール|3AC年間スケジュール/.test(t))return 1;
  if(/BS|PL|CF|bixid|決算|領収書|クレーム|ワークフロー|Pマーク|内部WEB|内部ＷＥＢ/.test(t))return 2;
  if(/VISION|夢ブック|100リスト|タスク見直し|ソーシャル|ソシログ|ヒトメモ|学習|ミッションステートメント|GPTカスタマイズ|行動探求|コミュニケーションアンケート|構想バックログ|未来年表|100回帳/.test(t))return 3;
  return 4;
}

function seedInitialTasksIfNeeded(){
  var saved=localStorage.getItem('routineOS_tasks');
  if(saved){
    try{
      var parsed=JSON.parse(saved);
      if(Array.isArray(parsed)&&parsed.length>0){
        // 既存データに月次レビュータスクがなければ追加
        var hasMonthly=parsed.some(function(t){return t.title==='月次レビュー';});
        if(!hasMonthly){
          var nextFirst=(function(){
            var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);
            return formatLocalDate(d);
          })();
          tasks.push({id:nid++,title:'月次レビュー',cycle:'月次',layer:3,nextDate:nextFirst,status:'未完了',addType:'calendar',addBase:'from_next',addDays:null,lastScheduledDate:'',notifyMsg:'今月のルーチンを振り返り、不要なタスクを停止・統合する。',deliverable:'月次レビュー完了・バックアップ取得済み',url:'',note:'',excludeWeekends:false,excludeHolidays:false,skippable:false});
          saveData();
        }
        return;
      }
    }catch(e){}
  }
  if(tasks&&tasks.length>0){
    var hasMonthly2=tasks.some(function(t){return t.title==='月次レビュー';});
    if(!hasMonthly2){
      var nextFirst2=(function(){
        var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);
        return formatLocalDate(d);
      })();
      tasks.push({id:nid++,title:'月次レビュー',cycle:'月次',layer:3,nextDate:nextFirst2,status:'未完了',addType:'calendar',addBase:'from_next',addDays:null,lastScheduledDate:'',notifyMsg:'今月のルーチンを振り返り、不要なタスクを停止・統合する。',deliverable:'月次レビュー完了・バックアップ取得済み',url:'',note:'',excludeWeekends:false,excludeHolidays:false,skippable:false});
      saveData();
    }
    return;
  }
  tasks=buildInitialSeedTasks();
  // シードデータにも月次レビューを追加
  var hasMR=tasks.some(function(t){return t.title==='月次レビュー';});
  if(!hasMR){
    var nextFirst3=(function(){
      var d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);
      return formatLocalDate(d);
    })();
    tasks.push({id:nid,title:'月次レビュー',cycle:'月次',layer:3,nextDate:nextFirst3,status:'未完了',addType:'calendar',addBase:'from_next',addDays:null,lastScheduledDate:'',notifyMsg:'今月のルーチンを振り返り、不要なタスクを停止・統合する。',deliverable:'月次レビュー完了・バックアップ取得済み',url:'',note:'',excludeWeekends:false,excludeHolidays:false,skippable:false});
    nid++;
  } else {
    nid=Math.max.apply(null,tasks.map(function(t){return t.id;}))+1;
  }
  saveData();
}

function uQB(){
  var n=tasks.filter(function(t){return(!t.cycle||!normalizeCycle(t.cycle))&&t.status!=='停止';}).length;
  var el=document.getElementById('qb');
  if(el)el.textContent=n>0?n:'';
}

function renderVision(){
  var area=document.getElementById('visionArea');
  if(!area)return;
  // 日付をシードに固定（同じ日は同じ表示、ちらつかない）
  var dateStr=getTodayLocalString().replace(/-/g,'');
  var seed=parseInt(dateStr)%100;
  var types=['vision','principle','direction'];
  var type=types[seed%3];
  var html='';
  if(type==='vision'){
    var item=VISION_DATA.vision[seed%VISION_DATA.vision.length];
    html='<div class="vision-card"><span class="vision-type">VISION</span><span class="vision-body">'+item+'</span></div>';
  }else if(type==='principle'){
    var item=VISION_DATA.principles[seed%VISION_DATA.principles.length];
    html='<div class="vision-card"><span class="vision-type">原則</span><span class="vision-body"><span class="vision-keyword">'+item.title+'</span>'+item.text+'</span></div>';
  }else{
    var item=VISION_DATA.directions[seed%VISION_DATA.directions.length];
    html='<div class="vision-card"><span class="vision-type">指針</span><span class="vision-body"><span class="vision-keyword">'+item.title+'</span>'+item.text+'</span></div>';
  }
  area.innerHTML=html;
}
