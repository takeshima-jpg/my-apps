<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSO Log</title>
<style>
/* ─── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --bg2:       #f9fafb;
  --bg3:       #f3f4f6;
  --bg4:       #e5e7eb;
  --border:    #e5e7eb;
  --border2:   #d1d5db;
  --text:      #111827;
  --text2:     #374151;
  --text3:     #6b7280;
  --text4:     #9ca3af;
  --blue:      #2563eb;
  --blue-lt:   #eff6ff;
  --sidebar:   220px;
  --radius:    10px;
  --shadow:    0 1px 3px rgba(0,0,0,.07);
}

html, body { height: 100%; }
body {
  background: var(--bg3);
  color: var(--text);
  font-family: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }

/* ─── Layout ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: #1e2230;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  min-width: 0;
  background: var(--bg3);
}

/* ─── Sidebar ────────────────────────────────────────────── */
.sidebar-logo {
  padding: 16px 14px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.logo-text { font-weight: 800; font-size: 16px; color: #fff; line-height: 1.1; letter-spacing: -.01em; }
.logo-sub  { font-size: 9px; color: rgba(255,255,255,.3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }

.sidebar-section-label {
  padding: 14px 14px 4px;
  font-size: 9px;
  font-weight: 700;
  color: rgba(255,255,255,.25);
  text-transform: uppercase;
  letter-spacing: .1em;
}

nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 7px;
  background: none;
  color: rgba(255,255,255,.5);
  font-size: 14px;
  font-weight: 500;
  transition: background .12s, color .12s;
  text-align: left;
  width: 100%;
}
.nav-btn:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
.nav-btn.active { background: rgba(37,99,235,0.2); color: #93c5fd; font-weight: 600; border-left: 3px solid #93c5fd; padding-left: 11px; }
.nav-btn .nav-icon { width: 16px; text-align: center; font-size: 14px; opacity: .8; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  font-size: 9px; font-weight: 700;
  padding: 1px 5px;
  border-radius: 9999px;
  min-width: 18px; text-align: center;
  background: rgba(255,255,255,.2); color: rgba(255,255,255,.7);
}

.sidebar-footer { padding: 6px 14px 10px; color: rgba(255,255,255,.2); font-size: 10px; margin-top: auto; }

/* ─── Badges ─────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 10px; font-weight: 700;
  white-space: nowrap; letter-spacing: .02em;
}
.badge-検討中 { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-待機   { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.badge-実行中 { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.badge-完了   { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
.badge-廃棄   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
.badge-pri-S  { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; font-weight: 800; }
.badge-pri-A  { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; font-weight: 800; }
.badge-pri-B  { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; font-weight: 800; }
.badge-pri-C  { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; font-weight: 700; }

/* ─── Page Header ────────────────────────────────────────── */
.page-header { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.page-sub { font-size: 13px; color: var(--text3); margin-top: 3px; }

/* ─── HOME ───────────────────────────────────────────────── */
.home-priority-section { margin-bottom: 20px; }
.home-priority-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0 8px;
  margin-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.home-priority-label {
  font-size: 13px; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase;
}
.home-priority-count {
  font-size: 10px; color: var(--text3); font-weight: 500;
}
.home-pri-s .home-priority-label { color: #b91c1c; }
.home-pri-s .home-priority-header { border-color: #fecaca; }
.home-pri-a .home-priority-label { color: #1d4ed8; }
.home-pri-a .home-priority-header { border-color: #bfdbfe; }
.home-pri-b .home-priority-label { color: #6d28d9; }
.home-pri-b .home-priority-header { border-color: #ddd6fe; }
.home-pri-c .home-priority-label { color: #6b7280; }
.home-pri-c .home-priority-header { border-color: #e5e7eb; }

.home-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: box-shadow .12s, border-color .12s;
  box-shadow: var(--shadow);
}
.home-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.09); border-color: var(--border2); }
.home-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.home-card-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; }
.home-card-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
.home-card-purpose { font-size: 13px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-card-children { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg3); display: none; }
.home-card.expanded .home-card-children { display: block; }
.home-child-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--bg3);
  font-size: 13px; color: var(--text2);
}
.home-child-row:last-child { border-bottom: none; }
.home-child-indent { color: #d1d5db; font-size: 10px; flex-shrink: 0; }
.home-child-id { font-family: monospace; font-size: 10px; color: #7c3aed; }
.home-child-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-empty { padding: 12px 0; color: var(--text4); font-size: 13px; font-style: italic; }
.home-toggle-arrow { font-size: 9px; color: var(--text4); margin-left: auto; transition: transform .15s; }
.home-card.expanded .home-toggle-arrow { transform: rotate(90deg); }

/* ─── 構想ログ一覧 ───────────────────────────────────────── */
.log-list { display: flex; flex-direction: column; gap: 6px; }
.log-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.log-item-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .1s;
}
.log-item-header:hover { background: #f8f9ff; }
.log-toggle { font-size: 9px; color: var(--text4); transition: transform .15s; flex-shrink: 0; }
.log-item.open .log-toggle { transform: rotate(90deg); }
.log-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; flex-shrink: 0; }
.log-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.log-item-body {
  display: none;
  padding: 0 14px 14px;
  border-top: 1px solid var(--bg3);
}
.log-item.open .log-item-body { display: block; }
.log-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 10px; }
.log-detail-item { display: flex; flex-direction: column; gap: 3px; }
.log-detail-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
.log-detail-value { font-size: 14px; color: var(--text2); }
.log-detail-value.empty { color: var(--text4); font-style: italic; }

.log-children { margin-top: 10px; }
.log-children-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.log-child-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 7px;
  margin-bottom: 4px;
}
.log-child-item:last-child { margin-bottom: 0; }
.log-child-marker { color: #d1d5db; font-size: 10px; margin-top: 2px; flex-shrink: 0; }
.log-child-body { flex: 1; min-width: 0; }
.log-child-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.log-child-id { font-family: monospace; font-size: 10px; color: #7c3aed; font-weight: 700; }
.log-child-title { font-size: 14px; font-weight: 600; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-child-purpose { font-size: 10px; color: var(--text4); }

.log-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg3); }
.btn-edit {
  padding: 4px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 700;
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border2);
  transition: background .1s;
}
.btn-edit:hover { background: var(--bg4); }
.btn-del {
  padding: 4px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 700;
  background: #fee2e2; color: #b91c1c;
  border: 1px solid #fecaca;
  transition: background .1s;
}
.btn-del:hover { background: #fecaca; }

/* ─── Filter Bar ─────────────────────────────────────────── */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-bottom: 14px;
}
.filter-input {
  flex: 1; min-width: 160px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 14px;
  transition: border-color .12s;
}
.filter-input:focus { border-color: var(--blue); }
.filter-select {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.filter-select:focus { border-color: var(--blue); }

/* ─── AI Import ──────────────────────────────────────────── */
.ai-import-wrap {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  max-width: 760px;
}
.ai-import-desc { font-size: 14px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }
.ai-textarea {
  width: 100%;
  min-height: 280px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 12px;
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
  resize: vertical;
  transition: border-color .12s;
  font-family: inherit;
}
.ai-textarea:focus { border-color: var(--blue); background: var(--bg); outline: none; }
.ai-btn-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.btn-primary {
  padding: 8px 18px;
  background: var(--blue); color: #fff;
  border-radius: 7px;
  font-size: 14px; font-weight: 700;
  transition: background .12s;
}
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary {
  padding: 8px 18px;
  background: #16a34a; color: #fff;
  border-radius: 7px;
  font-size: 14px; font-weight: 700;
  transition: background .12s;
}
.btn-secondary:hover { background: #15803d; }
.btn-secondary:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }
.ai-preview {
  margin-top: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.ai-preview-title { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.ai-preview-g {
  background: var(--bg);
  border: 1px solid #bfdbfe;
  border-left: 3px solid #2563eb;
  border-radius: 7px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.ai-preview-g-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.ai-preview-g-meta { font-size: 10px; color: var(--text3); }
.ai-preview-e {
  background: #faf5ff;
  border: 1px solid #ddd6fe;
  border-left: 3px solid #7c3aed;
  border-radius: 6px;
  padding: 7px 10px;
  margin: 4px 0 4px 16px;
  font-size: 13px; color: var(--text2);
}
.ai-parse-status { font-size: 13px; color: var(--text3); }
.ai-parse-status.ok { color: #15803d; font-weight: 600; }
.ai-parse-status.err { color: #b91c1c; font-weight: 600; }

/* ─── Archive ────────────────────────────────────────────── */
.archive-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid #dc2626;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.archive-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.archive-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; }
.archive-title { font-weight: 700; font-size: 15px; color: var(--text); flex: 1; }
.archive-date { font-size: 10px; color: var(--text3); font-family: monospace; white-space: nowrap; }
.archive-section-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; margin-top: 8px; }
.archive-reason { font-size: 14px; color: #b91c1c; background: #fee2e2; padding: 6px 10px; border-radius: 6px; border: 1px solid #fecaca; }
.archive-learn { font-size: 14px; color: var(--text2); background: var(--bg3); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }

/* ─── Modal ──────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 26px;
  width: 100%; max-width: 580px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 18px; font-weight: 800; color: var(--text); }
.modal-close {
  background: var(--bg3); color: var(--text3);
  font-size: 20px; line-height: 1; padding: 4px 8px;
  border-radius: 6px; transition: background .12s;
}
.modal-close:hover { background: var(--bg4); color: var(--text); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-col2 { grid-column: span 2; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; }
.form-control {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 7px 10px;
  color: var(--text); font-size: 14px;
  transition: border-color .12s, background .12s;
  width: 100%;
}
.form-control:focus { border-color: var(--blue); background: var(--bg); }
textarea.form-control { resize: vertical; min-height: 56px; }

/* Discard modal */
.discard-box {
  background: #fff5f5; border: 1px solid #fecaca;
  border-radius: 10px; padding: 14px; margin-bottom: 16px;
}
.discard-box-title { font-size: 14px; font-weight: 700; color: #991b1b; margin-bottom: 8px; }
.discard-form-group { margin-bottom: 10px; }
.discard-label { font-size: 9px; font-weight: 700; color: #b91c1c; text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 4px; }
.discard-control {
  width: 100%; background: #fff;
  border: 1px solid #fecaca; border-radius: 6px;
  padding: 7px 10px; color: var(--text); font-size: 14px;
  font-family: inherit; transition: border-color .12s;
}
.discard-control:focus { border-color: #ef4444; outline: none; }

.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  padding: 8px 16px;
  background: var(--bg3); color: var(--text2);
  border-radius: 7px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--border2);
  transition: background .12s;
}
.btn-cancel:hover { background: var(--bg4); }
.btn-save {
  padding: 8px 20px;
  background: var(--blue); color: #fff;
  border-radius: 7px; font-size: 14px; font-weight: 800;
  transition: background .12s;
}
.btn-save:hover { background: #1d4ed8; }
.btn-discard-confirm {
  padding: 8px 20px;
  background: #dc2626; color: #fff;
  border-radius: 7px; font-size: 14px; font-weight: 800;
  transition: background .12s;
}
.btn-discard-confirm:hover { background: #b91c1c; }

/* ─── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1e2230; color: #fff;
  padding: 10px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 600;
  z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(6px);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ─── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ─── Sidebar add btn ────────────────────────────────────── */
.sidebar-add {
  padding: 10px 8px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.btn-add {
  width: 100%;
  padding: 9px;
  background: var(--blue);
  color: #fff;
  border-radius: 7px;
  font-weight: 700;
  font-size: 14px;
  transition: background .12s;
}
.btn-add:hover { background: #1d4ed8; }

/* ─── Misc ───────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 32px; margin-bottom: 10px; }
.priority-inherited { font-size: 9px; color: var(--text4); font-style: italic; }
</style>
</head>
<body>

<!-- ─── Sidebar ──────────────────────────────────────────────── -->
<div id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-text">KOSO Log</div>
    <div class="logo-sub">構想保管ログ</div>
  </div>

  <div class="sidebar-section-label">メニュー</div>
  <nav>
    <button class="nav-btn active" data-view="home" onclick="setView('home')">
      <span class="nav-icon">◉</span> ホーム
    </button>
    <button class="nav-btn" data-view="list" onclick="setView('list')">
      <span class="nav-icon">≡</span> 構想ログ
    </button>
    <button class="nav-btn" data-view="archive" onclick="setView('archive')">
      <span class="nav-icon">⊘</span> 廃棄アーカイブ
      <span class="nav-badge" id="badge-archive" style="display:none"></span>
    </button>
    <button class="nav-btn" data-view="ai-import" onclick="setView('ai-import')">
      <span class="nav-icon">⬇</span> 取り込む
    </button>
  </nav>

  <div class="sidebar-add">
    <button class="btn-add" onclick="openModal(null)">＋ 新規追加</button>
  </div>

  <div class="sidebar-footer" id="sidebar-count">0件登録</div>
</div>

<!-- ─── Toast ────────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = 'kouso_backlog_v1';
const ARCHIVE_KEY = 'kouso_archive_v1';
const STATUSES    = ['検討中','待機','実行中','完了','廃棄'];
const PRIORITIES  = ['S','A','B','C'];
const PRI_LABEL   = {S:'今期コア',A:'重要',B:'探索',C:'保留'};
const PRI_COLOR   = {S:'#b91c1c',A:'#1d4ed8',B:'#6d28d9',C:'#6b7280'};

const SAMPLE = [
  {id:"G01",type:"構想",parentId:"-",title:"挑戦プラットフォーム",purpose:"挑戦の可視化→評価→資本化の仕組み",success:"支援発生数10件/月",trigger:"コミュニティ初期メンバー10名",prereq:"評価軸設計完了",status:"検討中",priority:"A",review:"2026/04/22"},
  {id:"E01",type:"実行",parentId:"G01",title:"挑戦登録機能",purpose:"挑戦内容・価値・VISION・進捗を公開",success:"投稿数100件",trigger:"",prereq:"",status:"待機",priority:"A",review:"2026/04/22"},
  {id:"E02",type:"実行",parentId:"G01",title:"挑戦評価機能",purpose:"自律性・社会価値・学習性・誠実さでプロセス評価",success:"評価数100件/月",trigger:"",prereq:"",status:"待機",priority:"A",review:"2026/04/22"},
  {id:"E03",type:"実行",parentId:"G01",title:"挑戦資本マッチング",purpose:"投資・寄付・スキル・人材の支援接続",success:"支援発生10件",trigger:"",prereq:"",status:"待機",priority:"A",review:"2026/04/22"},
  {id:"G02",type:"構想",parentId:"-",title:"日本国防産業ビルダー",purpose:"戦略産業を創出する仕組み",success:"事業創出1件",trigger:"戦略テーマ確定",prereq:"初期領域選定",status:"検討中",priority:"S",review:"2026/04/22"},
  {id:"E04",type:"実行",parentId:"G02",title:"戦略テーマ設計",purpose:"サイバー等の重点領域を定義",success:"テーマ3件",trigger:"",prereq:"",status:"待機",priority:"S",review:"2026/04/22"},
  {id:"E05",type:"実行",parentId:"G02",title:"産業ビルダー構築",purpose:"テーマ→会社設立→投資→回収の仕組み",success:"1社設立",trigger:"",prereq:"",status:"待機",priority:"S",review:"2026/04/22"},
  {id:"G03",type:"構想",parentId:"-",title:"認証信頼性向上に向けた業界団体構想（JAGO）",purpose:"認証の信頼インフラ再構築（透明化・標準化・監督）",success:"ガイドライン公開＋有識者3名＋行政面談1回",trigger:"不正事例・市場歪みの整理完了",prereq:"中立性設計・外部理事候補確保",status:"検討中",priority:"A",review:"2026/04/22"},
  {id:"E07",type:"実行",parentId:"G03",title:"ガイドライン策定",purpose:"審査品質・利益相反ルール定義",success:"ガイドラインver1.0公開",trigger:"",prereq:"",status:"待機",priority:"A",review:"2026/04/22"},
  {id:"G04",type:"構想",parentId:"-",title:"挑戦・自律インフラ構想（ループ設計）",purpose:"自律→挑戦→成長→信頼→影響力の好循環を社会に実装",success:"ループ設計定義＋実装プロトタイプ1件",trigger:"挑戦プラットフォーム初期運用開始",prereq:"自律・挑戦の定義明確化",status:"検討中",priority:"B",review:"2026/04/22"},
  {id:"E13",type:"実行",parentId:"G04",title:"概念定義（自律・挑戦）",purpose:"自律・挑戦の数式/定義を明文化",success:"定義ドキュメント完成",trigger:"",prereq:"",status:"待機",priority:"B",review:"2026/04/22"},
];

let items    = [];
let archives = [];
let currentView = 'home';
let editingId   = null;
let expandedHome = new Set();
let expandedLog  = new Set();
let filterSearch = '';
let filterPriority = '';
let filterStatus   = '';

let discardPendingId  = '';
let discardPrevStatus = '';

// ─── migrate pj field if exists (compatibility) ───────────
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SAMPLE));
    items.forEach(i => {
      if (!i.priority) i.priority = 'A';
      if (!i.prereq) i.prereq = '';
      if (!i.trigger) i.trigger = '';
    });
  } catch { items = JSON.parse(JSON.stringify(SAMPLE)); }
  try {
    const raw2 = localStorage.getItem(ARCHIVE_KEY);
    archives = raw2 ? JSON.parse(raw2) : [];
  } catch { archives = []; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives)); } catch(e) {}
}

// ─── Utils ────────────────────────────────────────────────
function today() { return new Date().toLocaleDateString('sv').replace(/-/g,'/'); }
function todayInput() { return new Date().toLocaleDateString('sv'); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function priOrder(p) { return {S:0,A:1,B:2,C:3}[p]??9; }
function genId(type) {
  const prefix = type==='構想'?'G':'E';
  const nums = items.filter(i=>i.id.startsWith(prefix)).map(i=>parseInt(i.id.slice(1))||0);
  return prefix + String((nums.length?Math.max(...nums):0)+1).padStart(2,'0');
}

function statusBadge(s) { return `<span class="badge badge-${esc(s)}">${esc(s)}</span>`; }
function priBadge(p) {
  return `<span class="badge badge-pri-${esc(p)}">${esc(p)} ${esc(PRI_LABEL[p]||p)}</span>`;
}

// ─── View routing ─────────────────────────────────────────
function setView(v) {
  currentView = v;
  ['home','list','archive','ai-import'].forEach(name => {
    document.getElementById('view-'+name).style.display = name===v?'':'none';
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view===v);
  });
  renderCurrentView();
}
function renderCurrentView() {
  updateBadges();
  if (currentView==='home')      renderHome();
  else if (currentView==='list') renderList();
  else if (currentView==='archive') renderArchive();
  else if (currentView==='ai-import') renderAiImport();
  const kousoCount = items.filter(i=>i.type==='構想').length;
  const jikkoCount = items.filter(i=>i.type==='実行').length;
  document.getElementById('sidebar-count').textContent = `G:${kousoCount} E:${jikkoCount}`;
}
function updateBadges() {
  const arCount = archives.length;
  const bar = document.getElementById('badge-archive');
  bar.textContent = arCount; bar.style.display = arCount?'':'none';
}

// ─── HOME ─────────────────────────────────────────────────
function renderHome() {
  const el = document.getElementById('view-home');
  const kousos = items.filter(i=>i.type==='構想'&&i.status!=='廃棄'&&i.status!=='完了');
  const groups = [
    { key:'S', label:'S — 今期コア', cls:'home-pri-s', items: kousos.filter(i=>i.priority==='S').sort((a,b)=>a.id.localeCompare(b.id)) },
    { key:'A', label:'A — 重要',     cls:'home-pri-a', items: kousos.filter(i=>i.priority==='A').sort((a,b)=>a.id.localeCompare(b.id)) },
    { key:'B', label:'B — 探索',     cls:'home-pri-b', items: kousos.filter(i=>i.priority==='B').sort((a,b)=>a.id.localeCompare(b.id)) },
    { key:'C', label:'C — 保留',     cls:'home-pri-c', items: kousos.filter(i=>i.priority==='C').sort((a,b)=>a.id.localeCompare(b.id)) },
  ];

  let html = `
    <div class="page-header">
      <div class="page-title">HOME</div>
      <div class="page-sub">今どの構想に集中するか — クリックで詳細を展開</div>
    </div>`;

  groups.forEach(g => {
    if (g.items.length === 0) return;
    html += `<div class="home-priority-section ${g.cls}">
      <div class="home-priority-header">
        <span class="home-priority-label">${esc(g.label)}</span>
        <span class="home-priority-count">${g.items.length}件</span>
      </div>`;
    g.items.forEach(k => {
      const children = items.filter(i=>i.type==='実行'&&i.parentId===k.id&&i.status!=='廃棄');
      const isExpanded = expandedHome.has(k.id);
      const childrenHtml = children.map(e => `
        <div class="home-child-row">
          <span class="home-child-indent">└</span>
          <span class="home-child-id">${esc(e.id)}</span>
          <span class="home-child-title">${esc(e.title)}</span>
          ${statusBadge(e.status)}
        </div>`).join('');

      html += `
        <div class="home-card${isExpanded?' expanded':''}" onclick="toggleHomeCard('${esc(k.id)}')">
          <div class="home-card-header">
            <span class="home-card-id">${esc(k.id)}</span>
            <span class="home-card-title">${esc(k.title)}</span>
            ${statusBadge(k.status)}
            <span class="home-toggle-arrow">▶</span>
          </div>
          ${k.purpose?`<div class="home-card-purpose">${esc(k.purpose)}</div>`:''}
          <div class="home-card-children">
            ${children.length===0
              ? '<div class="home-empty">実行単位なし</div>'
              : childrenHtml}
            <div style="margin-top:8px;display:flex;gap:6px">
              <button class="btn-edit" onclick="event.stopPropagation();openModal('${esc(k.id)}')">編集</button>
            </div>
          </div>
        </div>`;
    });
    html += `</div>`;
  });

  if (kousos.length === 0) {
    html += `<div class="empty-state"><div class="empty-icon">📭</div>構想がありません。<br>AIインポートまたは新規追加で登録してください。</div>`;
  }

  el.innerHTML = html;
}

function toggleHomeCard(id) {
  if (expandedHome.has(id)) expandedHome.delete(id);
  else expandedHome.add(id);
  renderHome();
}

// ─── LIST VIEW ────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('view-list');
  let filtered = items.filter(i=>i.type==='構想');

  if (filterSearch) {
    const q = filterSearch.toLowerCase();
    filtered = filtered.filter(k =>
      [k.id,k.title,k.purpose,k.success].some(v=>(v||'').toLowerCase().includes(q)) ||
      items.filter(e=>e.type==='実行'&&e.parentId===k.id).some(e=>
        [e.id,e.title,e.purpose].some(v=>(v||'').toLowerCase().includes(q))
      )
    );
  }
  if (filterPriority) filtered = filtered.filter(k=>k.priority===filterPriority);
  if (filterStatus)   filtered = filtered.filter(k=>k.status===filterStatus);

  filtered.sort((a,b)=>priOrder(a.priority)-priOrder(b.priority)||a.id.localeCompare(b.id));

  const listHtml = filtered.map(k => {
    const children = items.filter(i=>i.type==='実行'&&i.parentId===k.id);
    const isOpen = expandedLog.has(k.id);

    const detailFields = [
      {label:'目的/概要', value:k.purpose},
      {label:'成功条件', value:k.success},
      {label:'実行トリガー', value:k.trigger},
      {label:'前提条件', value:k.prereq},
    ];
    const detailHtml = detailFields.filter(f=>f.value).map(f=>`
      <div class="log-detail-item">
        <span class="log-detail-label">${esc(f.label)}</span>
        <span class="log-detail-value">${esc(f.value)}</span>
      </div>`).join('');

    const childrenHtml = children.map(e => {
      const parentPri = k.priority;
      return `
        <div class="log-child-item">
          <span class="log-child-marker">└</span>
          <div class="log-child-body">
            <div class="log-child-head">
              <span class="log-child-id">${esc(e.id)}</span>
              <span class="log-child-title">${esc(e.title)}</span>
              ${statusBadge(e.status)}
              <span class="priority-inherited">継承: ${esc(parentPri)}</span>
            </div>
            ${e.purpose?`<div class="log-child-purpose">${esc(e.purpose)}</div>`:''}
          </div>
          <div style="flex-shrink:0;display:flex;gap:4px">
            <button class="btn-edit" onclick="openModal('${esc(e.id)}')">編集</button>
            <button class="btn-del" onclick="deleteItem('${esc(e.id)}')">削除</button>
          </div>
        </div>`;
    }).join('');

    return `
      <div class="log-item${isOpen?' open':''}">
        <div class="log-item-header" onclick="toggleLog('${esc(k.id)}')">
          <span class="log-toggle">▶</span>
          <span class="log-id">${esc(k.id)}</span>
          <span class="log-title">${esc(k.title)}</span>
          <div class="log-meta">
            ${priBadge(k.priority||'A')}
            ${statusBadge(k.status)}
            ${children.length>0?`<span style="font-size:10px;color:var(--text4)">E:${children.length}</span>`:''}
          </div>
        </div>
        <div class="log-item-body">
          ${detailHtml?`<div class="log-detail-grid">${detailHtml}</div>`:''}
          ${k.review?`<div style="font-size:10px;color:var(--text3);margin-bottom:8px">最終レビュー: ${esc(k.review)}</div>`:''}
          ${children.length>0?`<div class="log-children">
            <div class="log-children-label">実行単位 (${children.length})</div>
            ${childrenHtml}
          </div>`:'<div style="font-size:13px;color:var(--text4);margin:6px 0">実行単位なし</div>'}
          <div class="log-actions">
            <button class="btn-edit" onclick="openModal('${esc(k.id)}')">編集</button>
            <button class="btn-del" onclick="deleteItem('${esc(k.id)}')">削除</button>
            <button class="btn-edit" onclick="openModal(null,'${esc(k.id)}')" style="background:#ede9fe;color:#5b21b6;border-color:#ddd6fe">＋ 実行追加</button>
          </div>
        </div>
      </div>`;
  }).join('');

  el.innerHTML = `
    <div class="page-header">
      <div class="page-title">構想ログ</div>
      <div class="page-sub">構想 (G) ${filtered.length}件 — クリックで開閉</div>
    </div>
    <div class="filter-bar">
      <input class="filter-input" type="text" placeholder="🔍 キーワード検索..."
        value="${esc(filterSearch)}" oninput="filterSearch=this.value;renderList()">
      <select class="filter-select" onchange="filterPriority=this.value;renderList()">
        <option value="" ${!filterPriority?'selected':''}>全優先度</option>
        ${PRIORITIES.map(p=>`<option value="${p}" ${filterPriority===p?'selected':''}>${p}：${PRI_LABEL[p]}</option>`).join('')}
      </select>
      <select class="filter-select" onchange="filterStatus=this.value;renderList()">
        <option value="" ${!filterStatus?'selected':''}>全ステータス</option>
        ${STATUSES.map(s=>`<option value="${s}" ${filterStatus===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
    <div class="log-list">
      ${listHtml||'<div class="empty-state"><div class="empty-icon">🔍</div>該当する構想がありません</div>'}
    </div>`;
}

function toggleLog(id) {
  if (expandedLog.has(id)) expandedLog.delete(id);
  else expandedLog.add(id);
  renderList();
}

// ─── ARCHIVE VIEW ─────────────────────────────────────────
function renderArchive() {
  const el = document.getElementById('view-archive');
  const sorted = [...archives].sort((a,b)=>b.date.localeCompare(a.date));

  const cardsHtml = sorted.length===0
    ? `<div class="empty-state"><div class="empty-icon">📂</div>廃棄アーカイブはありません</div>`
    : sorted.map(a=>`
        <div class="archive-card">
          <div class="archive-header">
            ${priBadge(a.priority||'A')}
            <span class="archive-id">${esc(a.id)}</span>
            <span class="archive-title">${esc(a.title)}</span>
            <span class="archive-date">${esc(a.date)}</span>
          </div>
          <div class="archive-section-label">廃棄理由</div>
          <div class="archive-reason">${esc(a.reason)}</div>
          ${a.learn?`
            <div class="archive-section-label">学び</div>
            <div class="archive-learn">${esc(a.learn)}</div>`:''}
        </div>`).join('');

  el.innerHTML = `
    <div class="page-header">
      <div class="page-title">廃棄アーカイブ</div>
      <div class="page-sub">やらない判断を資産化する — ${archives.length}件</div>
    </div>
    ${cardsHtml}`;
}

// ─── AI IMPORT VIEW ───────────────────────────────────────
function renderAiImport() {
  const el = document.getElementById('view-ai-import');
  el.innerHTML = `
    <div class="page-header">
      <div class="page-title">AIインポート</div>
      <div class="page-sub">AIと壁打ちして整理した構想を一括登録</div>
    </div>
    <div class="ai-import-wrap">
      <div class="ai-import-desc">
        AIとの壁打ちで整理した内容を貼り付けて「登録」してください。
      </div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:10px;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;line-height:1.8">
        <strong>入力フォーマット例：</strong><br>
        【構想】<br>
        タイトル：〇〇〇<br>
        目的/概要：〇〇〇<br>
        成功条件：〇〇〇<br>
        実行トリガー：〇〇〇<br>
        前提条件：〇〇〇<br>
        戦略優先順位：A<br>
        <br>
        【実行単位】<br>
        1. タイトル：〇〇〇　目的/概要：〇〇〇　成功条件：〇〇〇<br>
        2. タイトル：〇〇〇　目的/概要：〇〇〇　成功条件：〇〇〇
      </div>
      <textarea class="ai-textarea" id="ai-input" placeholder="ここにAIとの壁打ち結果を貼り付けてください..."></textarea>
      <div class="ai-btn-row">
        <button class="btn-secondary" onclick="registerAiInput()">登録</button>
        <span class="ai-parse-status" id="ai-parse-status"></span>
      </div>
    </div>`;
}

function parseAiText(text) {
  const result = { title:'', purpose:'', success:'', trigger:'', prereq:'', priority:'A', executions:[] };

  // Find 【構想】section
  const kousoMatch = text.match(/【構想】([\s\S]*?)(?=【実行単位】|【実行】|$)/i);
  if (!kousoMatch) return null;
  const kousoBlock = kousoMatch[1];

  function extractField(block, ...keys) {
    for (const key of keys) {
      const re = new RegExp(key + '[：:：]\\s*(.+?)(?=\\n|$)', 'i');
      const m = block.match(re);
      if (m && m[1].trim()) return m[1].trim();
    }
    return '';
  }

  result.title    = extractField(kousoBlock, 'タイトル', 'title');
  result.purpose  = extractField(kousoBlock, '目的/概要', '目的・概要', '概要', '目的');
  result.success  = extractField(kousoBlock, '成功条件');
  result.trigger  = extractField(kousoBlock, '実行トリガー', 'トリガー');
  result.prereq   = extractField(kousoBlock, '前提条件', '前提');
  const rawPri    = extractField(kousoBlock, '戦略優先順位', '優先順位', '優先度');
  result.priority = ['S','A','B','C'].includes(rawPri.slice(0,1).toUpperCase())
    ? rawPri.slice(0,1).toUpperCase() : 'A';

  if (!result.title) return null;

  // Find 【実行単位】section
  const execMatch = text.match(/【実行単位】([\s\S]*?)(?=【|$)/i) ||
                    text.match(/【実行】([\s\S]*?)(?=【|$)/i);
  if (execMatch) {
    const execBlock = execMatch[1];
    // Split by numbered lines
    const execItems = execBlock.split(/\n\s*\d+[.\)、。]/);
    execItems.forEach(block => {
      if (!block.trim()) return;
      // Try "タイトル：xxx" style
      let title   = extractField(block, 'タイトル', 'title');
      let purpose = extractField(block, '目的/概要', '目的・概要', '概要', '目的');
      let success = extractField(block, '成功条件');
      // Fallback: first non-empty line is title
      if (!title) {
        const firstLine = block.trim().split('\n')[0].trim();
        if (firstLine) title = firstLine.replace(/^[-・＊\*]\s*/, '');
      }
      if (title) {
        result.executions.push({ title, purpose, success });
      }
    });
  }

  return result;
}

function registerAiInput() {
  const text = document.getElementById('ai-input').value.trim();
  const statusEl = document.getElementById('ai-parse-status');
  if (!text) {
    statusEl.textContent = '入力が空です';
    statusEl.className = 'ai-parse-status err';
    return;
  }
  let d;
  try {
    d = parseAiText(text);
  } catch(err) {
    statusEl.textContent = `解析エラー: ${err.message}`;
    statusEl.className = 'ai-parse-status err';
    return;
  }
  if (!d || !d.title) {
    statusEl.textContent = '【構想】セクションが見つかりません';
    statusEl.className = 'ai-parse-status err';
    return;
  }
  const gId = genId('構想');
  items.push({
    id: gId, type: '構想', parentId: '-',
    title: d.title, purpose: d.purpose, success: d.success,
    trigger: d.trigger, prereq: d.prereq,
    priority: d.priority, status: '検討中',
    review: today(),
  });
  d.executions.forEach(e => {
    items.push({
      id: genId('実行'), type: '実行', parentId: gId,
      title: e.title, purpose: e.purpose, success: e.success,
      trigger: '', prereq: '',
      priority: d.priority, status: '検討中',
      review: today(),
    });
  });
  save();
  document.getElementById('ai-input').value = '';
  statusEl.textContent = '';
  showToast(`登録しました：G1件 E${d.executions.length}件`);
  setView('list');
}

// ─── CRUD ─────────────────────────────────────────────────
function updateField(id, field, val) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  item[field] = val; save(); renderCurrentView();
}

function deleteItem(id) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (!confirm(`「${item.title}」を削除しますか？`)) return;
  items = items.filter(i=>i.id!==id&&i.parentId!==id);
  save(); showToast('削除しました'); renderCurrentView();
}

// ─── STATUS CHANGE + DISCARD FLOW ─────────────────────────
function changeStatus(id, newStatus) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (newStatus==='廃棄') {
    discardPendingId = id;
    discardPrevStatus = item.status;
    item.status = '廃棄';
    save();
    openDiscardModal(item);
  } else {
    item.status = newStatus;
    save();
    renderCurrentView();
  }
}

function openDiscardModal(item) {
  document.getElementById('discard-item-title').textContent = item.title;
  document.getElementById('d-reason').value = '';
  document.getElementById('d-learn').value = '';
  document.getElementById('discard-modal').classList.add('open');
}
function closeDiscardModal() {
  if (discardPendingId) {
    const item = items.find(i=>i.id===discardPendingId);
    if (item) item.status = discardPrevStatus;
    save();
    discardPendingId=''; discardPrevStatus='';
  }
  document.getElementById('discard-modal').classList.remove('open');
  renderCurrentView();
}
function closeDiscardOutside(e) {
  if (e.target===document.getElementById('discard-modal')) closeDiscardModal();
}
function confirmDiscard() {
  const reason = document.getElementById('d-reason').value.trim();
  if (!reason) { alert('廃棄理由を入力してください'); return; }
  const item = items.find(i=>i.id===discardPendingId);
  if (item) {
    archives.push({
      id: item.id, title: item.title,
      priority: item.priority||'A', type: item.type,
      reason,
      learn: document.getElementById('d-learn').value.trim(),
      date: today(),
    });
    save();
  }
  document.getElementById('discard-modal').classList.remove('open');
  discardPendingId=''; discardPrevStatus='';
  showToast('廃棄アーカイブに記録しました');
  renderCurrentView();
}

// ─── MODAL ────────────────────────────────────────────────
function openModal(id, defaultParentId) {
  editingId = id;
  const item = id ? items.find(i=>i.id===id) : null;
  document.getElementById('modal-title').textContent = item ? '編集' : '新規追加';
  document.getElementById('f-type').value = item ? item.type : (defaultParentId?'実行':'構想');
  document.getElementById('f-priority').value = item ? (item.priority||'A') : 'A';
  document.getElementById('f-title').value = item ? item.title : '';
  document.getElementById('f-purpose').value = item ? item.purpose : '';
  document.getElementById('f-success').value = item ? item.success : '';
  document.getElementById('f-trigger').value = item ? item.trigger : '';
  document.getElementById('f-prereq').value  = item ? item.prereq  : '';
  document.getElementById('f-status').value = item ? item.status : '検討中';
  document.getElementById('f-review').value = item
    ? (item.review||'').replace(/\//g,'-')
    : todayInput();
  rebuildParentOpts(
    item ? item.type : (defaultParentId?'実行':'構想'),
    item ? item.parentId : (defaultParentId||'-')
  );
  updateFormForType();
  document.getElementById('modal').classList.add('open');
  setTimeout(() => document.getElementById('f-title').focus(), 50);
}

function rebuildParentOpts(type, selected) {
  const sel = document.getElementById('f-parent');
  const parents = items.filter(i=>i.type==='構想'&&(editingId?i.id!==editingId:true));
  sel.innerHTML = '<option value="-">-</option>' +
    parents.map(p=>`<option value="${esc(p.id)}"${p.id===selected?' selected':''}>${esc(p.id+': '+p.title)}</option>`).join('');
  sel.disabled = type==='構想';
}

function onTypeChange() {
  const type = document.getElementById('f-type').value;
  rebuildParentOpts(type, '-');
  updateFormForType();
}

function updateFormForType() {
  const type = document.getElementById('f-type').value;
  const isG  = type === '構想';
  // 構想のみ: priority, trigger, prereq, review
  // 実行のみ: parent
  document.getElementById('f-priority-group').style.display = isG ? '' : 'none';
  document.getElementById('f-parent-group').style.display   = isG ? 'none' : '';
  document.getElementById('f-trigger-group').style.display  = isG ? '' : 'none';
  document.getElementById('f-prereq-group').style.display   = isG ? '' : 'none';
  document.getElementById('f-review-group').style.display   = isG ? '' : 'none';
}

function closeModal() { document.getElementById('modal').classList.remove('open'); editingId = null; }
function closeModalOutside(e) { if(e.target===document.getElementById('modal')) closeModal(); }

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  const type = document.getElementById('f-type').value;
  const newStatus = document.getElementById('f-status').value;
  const isG = type === '構想';

  // Inherit priority for 実行 from parent
  let priority = 'A';
  if (isG) {
    priority = document.getElementById('f-priority').value || 'A';
  } else {
    const parentId = document.getElementById('f-parent').value;
    const parent = items.find(i=>i.id===parentId);
    priority = parent ? (parent.priority||'A') : 'A';
  }

  const data = {
    id: editingId || genId(type),
    type,
    parentId: isG ? '-' : (document.getElementById('f-parent').value||'-'),
    title,
    priority,
    purpose: document.getElementById('f-purpose').value.trim(),
    success: document.getElementById('f-success').value.trim(),
    trigger: isG ? document.getElementById('f-trigger').value.trim() : '',
    prereq:  isG ? document.getElementById('f-prereq').value.trim()  : '',
    status: newStatus,
    review:  isG ? document.getElementById('f-review').value.replace(/-/g,'/') : '',
  };

  const prevItem = editingId ? items.find(i=>i.id===editingId) : null;
  const wasDiscard = newStatus==='廃棄' && (!prevItem||prevItem.status!=='廃棄');

  if (editingId) {
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>=0) items[idx] = data;
  } else {
    items.push(data);
  }
  save();
  closeModal();

  if (wasDiscard) {
    discardPendingId = data.id;
    discardPrevStatus = prevItem ? prevItem.status : '検討中';
    openDiscardModal(data);
  } else {
    showToast(editingId?'保存しました':'追加しました');
    renderCurrentView();
  }
}

// ─── TOAST ────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = '✓ ' + msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// ─── KEYBOARD ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeModal(); closeDiscardModal(); }
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter') {
    if (document.getElementById('modal').classList.contains('open')) saveItem();
    if (document.getElementById('discard-modal').classList.contains('open')) confirmDiscard();
  }
});

// ─── INIT ─────────────────────────────────────────────────
load();
setView('home');
</script>

    }
  </script>
