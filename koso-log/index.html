<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KOSOLog</title>
<style>
/* ─── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --bg2:       #f9fafb;
  --bg3:       #f3f4f6;
  --bg4:       #e5e7eb;
  --border:    #e5e7eb;
  --border2:   #d1d5db;
  --text:      #111827;
  --text2:     #374151;
  --text3:     #6b7280;
  --text4:     #9ca3af;
  --blue:      #2563eb;
  --blue-lt:   #eff6ff;
  --blue-mid:  #dbeafe;
  --sidebar:   240px;
  --radius:    10px;
  --shadow:    0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --shadow2:   0 4px 12px rgba(0,0,0,.1);
}

html, body { height: 100%; }
body {
  background: var(--bg3);
  color: var(--text);
  font-family: 'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;
  font-size: 13px;
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }
select { cursor: pointer; }

/* ─── Layout ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: #1e2230;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  min-width: 0;
  background: var(--bg3);
}

/* ─── Sidebar ────────────────────────────────────────────── */
.sidebar-logo {
  padding: 16px 14px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
  display: flex; align-items: center; gap: 10px;
}
.logo-img {
  width: 30px; height: 30px;
  border-radius: 7px;
  flex-shrink: 0;
  object-fit: cover;
}
.logo-text { font-weight: 800; font-size: 14px; color: #fff; line-height: 1.1; letter-spacing: -.01em; }
.logo-sub { font-size: 9px; color: rgba(255,255,255,.35); letter-spacing: .06em; text-transform: uppercase; margin-top: 1px; }

.sidebar-section-label {
  padding: 14px 14px 4px;
  font-size: 9px;
  font-weight: 700;
  color: rgba(255,255,255,.25);
  text-transform: uppercase;
  letter-spacing: .1em;
}

nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 7px;
  background: none;
  color: rgba(255,255,255,.5);
  font-size: 12px;
  font-weight: 500;
  transition: background .12s, color .12s;
  text-align: left;
  width: 100%;
}
.nav-btn:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
.nav-btn.active { background: rgba(37,99,235,.4); color: #93c5fd; font-weight: 700; }
.nav-btn .nav-icon { width: 16px; text-align: center; font-size: 12px; opacity: .8; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  font-size: 9px; font-weight: 700;
  padding: 1px 5px;
  border-radius: 9999px;
  min-width: 18px; text-align: center;
  background: #d97706; color: #fff;
}
.nav-badge.red { background: #dc2626; }
.nav-badge.orange { background: #ea580c; }
.nav-badge.gray { background: rgba(255,255,255,.2); color: rgba(255,255,255,.7); }

/* Sidebar filter group */
.sidebar-filter-section {
  padding: 0 8px 6px;
  display: flex; flex-direction: column; gap: 1px;
}
.filter-kouso-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 10px;
  border-radius: 6px;
  background: none;
  color: rgba(255,255,255,.4);
  font-size: 11px;
  font-weight: 500;
  transition: background .12s, color .12s;
  text-align: left;
  width: 100%;
}
.filter-kouso-btn:hover { background: rgba(255,255,255,.05); color: rgba(255,255,255,.75); }
.filter-kouso-btn.active { background: rgba(37,99,235,.35); color: #93c5fd; font-weight: 700; }
.filter-kouso-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #60a5fa; flex-shrink: 0; }
.filter-kouso-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-filter-clear {
  margin: 2px 8px 4px;
  padding: 5px 10px;
  background: rgba(239,68,68,.2);
  color: #fca5a5;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  width: calc(100% - 16px);
  transition: background .12s;
}
.btn-filter-clear:hover { background: rgba(239,68,68,.35); }

.sidebar-actions {
  padding: 10px 8px;
  border-top: 1px solid rgba(255,255,255,.07);
  display: flex; flex-direction: column; gap: 3px;
}
.btn-add {
  width: 100%;
  padding: 9px;
  background: var(--blue);
  color: #fff;
  border-radius: 7px;
  font-weight: 700;
  font-size: 12px;
  transition: background .12s;
  margin-bottom: 3px;
}
.btn-add:hover { background: #1d4ed8; }
.btn-side {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 10px;
  background: none;
  color: rgba(255,255,255,.35);
  border-radius: 6px;
  font-size: 11px;
  transition: background .12s, color .12s;
  width: 100%;
}
.btn-side:hover { background: rgba(255,255,255,.05); color: rgba(255,255,255,.65); }
.sidebar-footer { padding: 6px 14px 10px; color: rgba(255,255,255,.2); font-size: 10px; }

/* ─── Badges ─────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 10px; font-weight: 700;
  white-space: nowrap; letter-spacing: .02em;
}
/* Status */
.badge-検討中 { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-待機   { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.badge-実行中 { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.badge-完了   { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
.badge-廃棄   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
/* PJ */
.badge-pj-未  { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
.badge-pj-済  { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.badge-pj---  { background: #f3f4f6; color: #9ca3af; border: 1px solid #e5e7eb; }
/* Priority */
.badge-pri-S  { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; font-weight: 800; }
.badge-pri-A  { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; font-weight: 800; }
.badge-pri-B  { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; font-weight: 800; }
.badge-pri-C  { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; font-weight: 700; }
/* Type */
.type-badge-構想 { background: #dbeafe; color: #1e40af; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 4px; letter-spacing: .03em; }
.type-badge-実行 { background: #ede9fe; color: #5b21b6; font-size: 9px; font-weight: 800; padding: 1px 6px; border-radius: 4px; letter-spacing: .03em; }

/* ─── Page Header ────────────────────────────────────────── */
.page-header { margin-bottom: 18px; display: flex; align-items: flex-end; justify-content: space-between; }
.page-title { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.page-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* ─── Dashboard ──────────────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}
.stat-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: box-shadow .15s, border-color .15s;
}
.stat-card:hover { box-shadow: var(--shadow2); border-color: var(--border2); }
.stat-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; }
.stat-value { font-size: 28px; font-weight: 800; margin: 3px 0 1px; }
.stat-sub { font-size: 10px; color: var(--text4); }
.stat-card.hi-s { border-left: 3px solid #ef4444; }
.stat-card.hi-a { border-left: 3px solid #2563eb; }
.stat-card.hi-b { border-left: 3px solid #7c3aed; }
.stat-card.hi-w { border-left: 3px solid #f59e0b; }

.c-red    { color: #dc2626; }
.c-blue   { color: #2563eb; }
.c-purple { color: #7c3aed; }
.c-sky    { color: #0284c7; }
.c-green  { color: #16a34a; }
.c-emerald{ color: #059669; }
.c-amber  { color: #d97706; }
.c-gray   { color: #6b7280; }

.priority-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}
.pri-stat {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 10px;
}
.pri-stat-badge { font-size: 16px; font-weight: 900; width: 28px; text-align: center; }
.pri-stat-info { flex: 1; }
.pri-stat-count { font-size: 22px; font-weight: 800; line-height: 1; }
.pri-stat-label { font-size: 10px; color: var(--text3); margin-top: 1px; }

.attn-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.attn-box-header {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: #fafafa;
}
.attn-box-title { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .08em; }
.link-btn { background: none; color: var(--blue); font-size: 11px; padding: 0; font-weight: 600; }
.link-btn:hover { color: #1d4ed8; }
.attn-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.attn-row:last-child { border-bottom: none; }
.attn-row:hover { background: var(--bg3); }
.id-chip {
  font-family: monospace; font-size: 10px; font-weight: 700;
  padding: 2px 5px; border-radius: 4px; flex-shrink: 0;
}
.id-chip-g { background: #dbeafe; color: #1d4ed8; }
.id-chip-e { background: #ede9fe; color: #5b21b6; }
.attn-title { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attn-title.bold { font-weight: 700; color: var(--text); }
.stale-chip { font-size: 9px; color: #b45309; background: #fef3c7; padding: 2px 6px; border-radius: 9999px; white-space: nowrap; font-weight: 700; }

/* ─── Filter Bar ─────────────────────────────────────────── */
.filter-bar {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  box-shadow: var(--shadow);
}
.filter-input {
  flex: 1; min-width: 160px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 12px;
  transition: border-color .12s;
}
.filter-input:focus { border-color: var(--blue); background: var(--bg); }
.filter-select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 12px;
  transition: border-color .12s;
}
.filter-select:focus { border-color: var(--blue); }
.btn-clear {
  padding: 6px 10px;
  background: #fee2e2;
  color: #b91c1c;
  border-radius: 7px;
  font-size: 11px; font-weight: 700;
  transition: background .12s;
  border: 1px solid #fecaca;
}
.btn-clear:hover { background: #fecaca; }
.active-filter-tag {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 8px;
  background: #dbeafe;
  color: #1d4ed8;
  border-radius: 6px;
  font-size: 11px; font-weight: 700;
  border: 1px solid #bfdbfe;
}
.active-filter-tag button { background:none; color:#1d4ed8; font-size:13px; padding:0; line-height:1; font-weight:700; }

/* ─── Table ──────────────────────────────────────────────── */
.table-wrap {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th {
  background: #f9fafb;
  color: var(--text3);
  font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em;
  padding: 9px 11px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  cursor: pointer; user-select: none;
}
thead th:hover { color: var(--text2); background: #f3f4f6; }
tbody tr { border-bottom: 1px solid #f3f4f6; transition: background .08s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f9fafb; }
tbody tr.stale { background: #fffbeb; }
tbody tr.stale:hover { background: #fef3c7; }
td { padding: 9px 11px; vertical-align: middle; }

.sort-icon { opacity: .25; margin-left: 2px; font-size: 9px; }
.sort-icon.on { opacity: 1; color: var(--blue); }

/* Toggle row (構想 parent) */
.toggle-row { cursor: pointer; }
.toggle-row:hover { background: #f0f4ff !important; }
.toggle-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  font-size: 8px; color: var(--text3);
  transition: transform .15s;
  flex-shrink: 0;
}
.toggle-arrow.open { transform: rotate(90deg); }
.child-row td { background: #fafbff; }
.child-row:hover td { background: #f0f4ff; }

.type-bar {
  width: 3px; height: 26px; border-radius: 2px;
  flex-shrink: 0; display: inline-block;
  vertical-align: middle; margin-right: 7px;
}
.type-bar-g { background: #2563eb; }
.type-bar-e { background: #7c3aed; }

.id-cell { display: flex; align-items: center; }
.id-text { font-family: monospace; font-size: 11px; font-weight: 700; color: var(--text2); }

.title-cell { max-width: 260px; }
.title-indent { padding-left: 22px; }
.indent-arrow { color: #d1d5db; margin-right: 4px; font-size: 10px; }
.title-main { font-weight: 700; color: var(--text); font-size: 13px; }
.title-main.child { font-weight: 500; color: var(--text2); font-size: 12px; }
.title-purpose { font-size: 10px; color: var(--text4); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }

.badge-wrap { position: relative; display: inline-block; }
.badge-wrap select { position: absolute; inset: 0; opacity: 0; width: 100%; cursor: pointer; }

.date-cell { display: flex; flex-direction: column; gap: 1px; }
.date-text { font-family: monospace; font-size: 10px; color: var(--text3); }
.date-text.stale { color: #d97706; font-weight: 700; }
.date-stale-note { font-size: 9px; color: #d97706; }
.btn-today { background: none; color: var(--text4); font-size: 9px; padding: 0; text-align: left; transition: color .12s; }
.btn-today:hover { color: var(--blue); }

.action-btns { display: flex; gap: 3px; }
.btn-edit, .btn-del {
  padding: 3px 8px; border-radius: 5px;
  font-size: 10px; font-weight: 700; transition: background .12s;
}
.btn-edit { background: #f3f4f6; color: var(--text2); border: 1px solid var(--border2); }
.btn-edit:hover { background: #e5e7eb; }
.btn-del { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
.btn-del:hover { background: #fecaca; }

.empty-row td { text-align: center; padding: 40px; color: var(--text3); }

/* ─── Attention / PJ ─────────────────────────────────────── */
.group-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.group-header {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
  background: #fafafa;
}
.group-title { font-size: 12px; font-weight: 700; }
.group-count {
  margin-left: auto;
  background: var(--bg3);
  color: var(--text3);
  font-size: 9px; font-weight: 700;
  padding: 2px 7px; border-radius: 9999px;
  border: 1px solid var(--border);
}
.group-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .08s;
}
.group-row:last-child { border-bottom: none; }
.group-row:hover { background: var(--bg3); }
.group-title-text { flex: 1; font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-title-text.bold { font-weight: 700; color: var(--text); }
.group-empty { padding: 22px; text-align: center; color: var(--text3); font-size: 12px; }

.pj-card {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  transition: background .08s;
}
.pj-card:last-child { border-bottom: none; }
.pj-card:hover { background: var(--bg3); }
.pj-card-top { display: flex; align-items: flex-start; gap: 10px; }
.pj-card-body { flex: 1; min-width: 0; }
.pj-title { font-weight: 700; color: var(--text); font-size: 13px; }
.pj-parent { font-size: 10px; color: var(--text3); margin-top: 2px; }
.pj-purpose { font-size: 11px; color: var(--text2); margin-top: 3px; }
.pj-success { font-size: 10px; color: var(--text3); margin-top: 2px; }
.pj-card-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.btn-pj {
  padding: 6px 12px;
  background: #166534;
  color: #bbf7d0;
  border-radius: 7px;
  font-size: 11px; font-weight: 700;
  transition: background .12s; white-space: nowrap;
}
.btn-pj:hover { background: #15803d; }

/* ─── Archive View ───────────────────────────────────────── */
.archive-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid #dc2626;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.archive-title { font-weight: 700; font-size: 13px; color: var(--text); }
.archive-meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.archive-date { font-size: 10px; color: var(--text3); font-family: monospace; }
.archive-section { margin-top: 8px; }
.archive-section-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.archive-reason { font-size: 12px; color: #b91c1c; background: #fee2e2; padding: 6px 10px; border-radius: 6px; border: 1px solid #fecaca; }
.archive-learn { font-size: 12px; color: var(--text2); background: var(--bg3); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }

/* ─── Modal ──────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 26px;
  width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 16px; font-weight: 800; color: var(--text); }
.modal-close {
  background: var(--bg3); color: var(--text3);
  font-size: 18px; line-height: 1; padding: 4px 8px;
  border-radius: 6px; transition: background .12s;
}
.modal-close:hover { background: var(--bg4); color: var(--text); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-col2 { grid-column: span 2; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label {
  font-size: 9px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .1em;
}
.form-control {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 7px 10px;
  color: var(--text); font-size: 12px;
  transition: border-color .12s, background .12s;
  width: 100%;
}
.form-control:focus { border-color: var(--blue); background: var(--bg); }
textarea.form-control { resize: vertical; min-height: 56px; }

/* Discard modal */
.discard-box {
  background: #fff5f5;
  border: 1px solid #fecaca;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 16px;
}
.discard-box-title { font-size: 12px; font-weight: 700; color: #991b1b; margin-bottom: 8px; }
.discard-form-group { margin-bottom: 10px; }
.discard-label { font-size: 9px; font-weight: 700; color: #b91c1c; text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 4px; }
.discard-control {
  width: 100%;
  background: #fff;
  border: 1px solid #fecaca;
  border-radius: 6px;
  padding: 7px 10px;
  color: var(--text); font-size: 12px;
  font-family: inherit;
  transition: border-color .12s;
}
.discard-control:focus { border-color: #ef4444; outline: none; }

.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  padding: 8px 16px;
  background: var(--bg3); color: var(--text2);
  border-radius: 7px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border2);
  transition: background .12s;
}
.btn-cancel:hover { background: var(--bg4); }
.btn-save {
  padding: 8px 20px;
  background: var(--blue); color: #fff;
  border-radius: 7px; font-size: 12px; font-weight: 800;
  transition: background .12s;
}
.btn-save:hover { background: #1d4ed8; }
.btn-discard-confirm {
  padding: 8px 20px;
  background: #dc2626; color: #fff;
  border-radius: 7px; font-size: 12px; font-weight: 800;
  transition: background .12s;
}
.btn-discard-confirm:hover { background: #b91c1c; }

/* ─── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1e2230; color: #fff;
  padding: 10px 16px; border-radius: 8px;
  font-size: 12px; font-weight: 600;
  z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(6px);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ─── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ─── Vision2026 Area ────────────────────────────────────── */
.vision-area {
  padding: 10px 10px 6px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.vision-card {
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.vision-type {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  color: rgba(255,255,255,.25);
  letter-spacing: .12em;
  text-transform: uppercase;
}
.vision-keyword {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  color: rgba(255,255,255,.3);
  margin-right: 6px;
  letter-spacing: .06em;
}
.vision-body {
  font-size: 10px;
  color: rgba(255,255,255,.45);
  line-height: 1.65;
  word-break: break-all;
}
</style>
</head>

<div id="main">

<!-- ─── Item Modal ──────────────────────────────────────────── -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">新規追加</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">種別</label>
        <select class="form-control" id="f-type" onchange="onTypeChange()">
          <option value="構想">構想</option>
          <option value="実行">実行</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">戦略優先順位</label>
        <select class="form-control" id="f-priority">
          <option value="A">A：重要</option>
          <option value="S">S：今期コア</option>
          <option value="B">B：探索</option>
          <option value="C">C：保留</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">親ID（構想）</label>
        <select class="form-control" id="f-parent">
          <option value="-">-</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">ステータス</label>
        <select class="form-control" id="f-status">
          <option>検討中</option><option>待機</option><option>実行中</option><option>完了</option><option>廃棄</option>
        </select>
      </div>
      <div class="form-group form-col2">
        <label class="form-label">タイトル *</label>
        <input class="form-control" id="f-title" type="text" placeholder="タイトルを入力...">
      </div>
      <div class="form-group form-col2">
        <label class="form-label">目的/概要</label>
        <textarea class="form-control" id="f-purpose" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">成功条件</label>
        <input class="form-control" id="f-success" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">実行トリガー</label>
        <input class="form-control" id="f-trigger" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">前提条件</label>
        <input class="form-control" id="f-prereq" type="text">
      </div>
      <div class="form-group">
        <label class="form-label">PJ化</label>
        <select class="form-control" id="f-pj">
          <option>未</option><option>済</option><option>-</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">最終レビュー日</label>
        <input class="form-control" id="f-review" type="date">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveItem()">保存する</button>
    </div>
  </div>
</div>

<!-- ─── Discard Modal ────────────────────────────────────────── -->
<div class="modal-overlay" id="discard-modal" onclick="closeDiscardOutside(event)">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header">
      <div class="modal-title" style="color:#dc2626">⚠ 廃棄アーカイブに記録</div>
      <button class="modal-close" onclick="closeDiscardModal()">×</button>
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:14px">
      「<strong id="discard-item-title"></strong>」を廃棄します。<br>
      この意思決定を記録として残してください。
    </div>
    <div class="discard-box">

function daysSince(dateStr) {
  if (!dateStr) return 9999;
  const d = new Date(dateStr.replace(/\//g,'-'));
  if (isNaN(d.getTime())) return 9999;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function today() { return new Date().toISOString().slice(0,10).replace(/-/g,'/'); }
function todayInput() { return new Date().toISOString().slice(0,10); }
function genId(type) {
  const prefix = type==='構想'?'G':'E';
  const nums = items.filter(i=>i.id.startsWith(prefix)).map(i=>parseInt(i.id.slice(1))||0);
  return prefix + String((nums.length?Math.max(...nums):0)+1).padStart(2,'0');
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function priOrder(p) { return {S:0,A:1,B:2,C:3}[p]??9; }

function updateBadges() {
  const aCount = items.filter(i=>i.status==='検討中'||i.status==='実行中'||daysSince(i.review)>=30).length;

function getFiltered() {
  return items.filter(item => {
    if (filterType && item.type!==filterType) return false;
    if (filterStatus && item.status!==filterStatus) return false;
    if (filterPriority && item.priority!==filterPriority) return false;
    // Kouso filter: show the parent G + its children
    if (filterParent) {
      if (item.id===filterParent) return true;       // show the G itself
      if (item.parentId===filterParent) return true; // show its children
      return false;
    }
    if (filterSearch) {
      const q=filterSearch.toLowerCase();
      return [item.id,item.title,item.purpose,item.success].some(v=>(v||'').toLowerCase().includes(q));
    }
    return true;
  });
}

function toggleGroup(id) {
  if (expandedGroups.has(id)) expandedGroups.delete(id);
  else expandedGroups.add(id);
  renderList();
}

function clearFilters() {
  filterSearch=''; filterType=''; filterStatus=''; filterParent=''; filterPriority='';

function sortToggle(field) {
  if (sortField===field) sortDir=sortDir==='asc'?'desc':'asc';
  else { sortField=field; sortDir='asc'; }
  renderList();
}
function sortIcon(field) {
  if (sortField!==field) return `<span class="sort-icon">↕</span>`;
  return `<span class="sort-icon on">${sortDir==='asc'?'↑':'↓'}</span>`;
}

// ═══════════════════════════════════════════════════════
// STATUS CHANGE + DISCARD FLOW
// ═══════════════════════════════════════════════════════
function changeStatus(id, newStatus) {
  const item = items.find(i=>i.id===id);
  if (!item) return;
  if (newStatus==='廃棄') {
    discardPendingId = id;
    discardPrevStatus = item.status;
    item.status = '廃棄';
    save();
    openDiscardModal(item);
  } else {
    item.status = newStatus;
    save();
    renderCurrentView();
  }
}

function openDiscardModal(item) {
  document.getElementById('discard-item-title').textContent = item.title;
  document.getElementById('d-reason').value = '';
  document.getElementById('d-learn').value = '';
  document.getElementById('discard-modal').classList.add('open');
}
function closeDiscardModal() {
  // Revert status if cancelled
  if (discardPendingId) {
    const item = items.find(i=>i.id===discardPendingId);
    if (item) item.status = discardPrevStatus;
    save();
    discardPendingId=''; discardPrevStatus='';
  }
  document.getElementById('discard-modal').classList.remove('open');
  renderCurrentView();
}
function closeDiscardOutside(e) {
  if (e.target===document.getElementById('discard-modal')) closeDiscardModal();
}
function confirmDiscard() {
  const reason = document.getElementById('d-reason').value.trim();
  if (!reason) { alert('廃棄理由を入力してください'); return; }
  const item = items.find(i=>i.id===discardPendingId);
  if (item) {
    archives.push({
      id: item.id,
      title: item.title,
      priority: item.priority||'A',
      reason,
      learn: document.getElementById('d-learn').value.trim(),
      date: today(),
      type: item.type,
    });
    save();
  }
  document.getElementById('discard-modal').classList.remove('open');
  discardPendingId=''; discardPrevStatus='';
  showToast('廃棄アーカイブに記録しました');
  renderCurrentView();
}

function updateField(id, field, val) {
  const item=items.find(i=>i.id===id);
  if (!item) return;
  item[field]=val; save(); renderCurrentView();
}
function deleteItem(id) {
  const item=items.find(i=>i.id===id);
  if (!item) return;
  if (!confirm(`「${item.title}」を削除しますか？`)) return;
  items=items.filter(i=>i.id!==id&&i.parentId!==id);
  save(); showToast('削除しました'); renderCurrentView();
}

function openModal(id) {
  editingId=id;
  const item=id?items.find(i=>i.id===id):null;
  document.getElementById('modal-title').textContent=item?'編集':'新規追加';
  document.getElementById('f-type').value=item?item.type:'構想';
  document.getElementById('f-priority').value=item?(item.priority||'A'):'A';
  document.getElementById('f-title').value=item?item.title:'';
  document.getElementById('f-purpose').value=item?item.purpose:'';
  document.getElementById('f-success').value=item?item.success:'';
  document.getElementById('f-trigger').value=item?item.trigger:'';
  document.getElementById('f-prereq').value=item?item.prereq:'';
  document.getElementById('f-status').value=item?item.status:'検討中';
  document.getElementById('f-pj').value=item?item.pj:'-';
  document.getElementById('f-review').value=item?item.review.replace(/\//g,'-'):todayInput();
  rebuildParentOpts(item?item.type:'構想',item?item.parentId:'-');
  document.getElementById('modal').classList.add('open');
  document.getElementById('f-title').focus();
}
function rebuildParentOpts(type,selected) {
  const sel=document.getElementById('f-parent');
  const parents=items.filter(i=>i.type==='構想'&&(editingId?i.id!==editingId:true));
  sel.innerHTML='<option value="-">-</option>'+
    parents.map(p=>`<option value="${esc(p.id)}"${p.id===selected?' selected':''}>${esc(p.id+': '+p.title)}</option>`).join('');
  sel.disabled=type==='構想';
}
function onTypeChange() {
  const type=document.getElementById('f-type').value;
  rebuildParentOpts(type,'-');
  if (type==='構想') { document.getElementById('f-pj').value='-'; document.getElementById('f-parent').value='-'; }
  else { if(document.getElementById('f-pj').value==='-') document.getElementById('f-pj').value='未'; }
}
function closeModal() { document.getElementById('modal').classList.remove('open'); editingId=null; }
function closeModalOutside(e) { if(e.target===document.getElementById('modal')) closeModal(); }
function saveItem() {
  const title=document.getElementById('f-title').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  const type=document.getElementById('f-type').value;
  const newStatus=document.getElementById('f-status').value;
  const data={
    id:editingId||genId(type),
    type,
    parentId:document.getElementById('f-parent').value||'-',
    title,
    priority:document.getElementById('f-priority').value||'A',
    purpose:document.getElementById('f-purpose').value.trim(),
    success:document.getElementById('f-success').value.trim(),
    trigger:document.getElementById('f-trigger').value.trim(),
    prereq:document.getElementById('f-prereq').value.trim(),
    status:newStatus,
    pj:document.getElementById('f-pj').value,
    review:document.getElementById('f-review').value.replace(/-/g,'/'),
  };
  // Check if status changed to 廃棄
  const prevItem = editingId?items.find(i=>i.id===editingId):null;
  const wasDiscard = newStatus==='廃棄' && (!prevItem||prevItem.status!=='廃棄');
  if (editingId) {
    const idx=items.findIndex(i=>i.id===editingId);
    if(idx>=0) items[idx]=data;
  } else {
    items.push(data);
  }
  save();
  closeModal();
  if (wasDiscard) {
    discardPendingId=data.id; discardPrevStatus=prevItem?prevItem.status:'検討中';
    openDiscardModal(data);
  } else {
    showToast(editingId?'保存しました':'追加しました');
    renderCurrentView();
  }
}

// JSON バックアップ
function backupJSON() {
  const data = { items: items, archives: archives, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = 'koso-log-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('JSONバックアップを保存しました');
}

function restoreJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.items && !data.archives) throw new Error('無効なフォーマット');
      if (!confirm(`施策: ${(data.items||[]).length}件、アーカイブ: ${(data.archives||[]).length}件\nを復元します。現在のデータは上書きされます。続けますか？`)) return;
      if (data.items) items = data.items;
      if (data.archives) archives = data.archives;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
      try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives)); } catch(e) {}
      render(); showToast('復元しました');
    } catch(err) { alert('インポートに失敗しました: ' + err.message); }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function doExport() {
  const header=['ID','種別','親ID','タイトル','目的/概要','成功条件','実行トリガー','前提条件','ステータス','PJ化','戦略優先順位','最終レビュー日'];
  const rows=items.map(i=>[i.id,i.type,i.parentId,i.title,i.purpose,i.success,i.trigger,i.prereq,i.status,i.pj,i.priority||'A',i.review]
    .map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(','));
  const csv=[header.join(','),...rows].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`kosolog_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('CSVをエクスポートしました');
}
function doImport(e) {
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const text=ev.target.result;
    const parsed=parseCSV(text);
    if(!parsed.length){ alert('有効なデータが見つかりませんでした'); return; }
    if(!confirm(`${parsed.length}件のデータをインポートしますか？`)) return;
    const map=new Map(items.map(i=>[i.id,i]));
    parsed.forEach(p=>map.set(p.id,p));
    items=Array.from(map.values());
    save(); showToast(`${parsed.length}件をインポートしました`); renderCurrentView();
  };
  reader.readAsText(file,'UTF-8');
  e.target.value='';
}
function parseCSV(text) {
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<2) return [];
  const sep=lines[0].includes('\t')?'\t':',';
  function splitLine(line) {
    const result=[]; let inQ=false,cur='';
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){ if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
      else if(ch===sep[0]&&!inQ){ result.push(cur.trim());cur=''; }
      else cur+=ch;
    }
    result.push(cur.trim()); return result;
  }
  const header=splitLine(lines[0]);
  const idx=name=>header.findIndex(h=>h.includes(name));
  const idIdx=idx('ID'),typeIdx=idx('種別'),parentIdx=idx('親ID'),
    titleIdx=idx('タイトル'),purposeIdx=idx('目的'),
    successIdx=idx('成功'),triggerIdx=idx('トリガー'),prereqIdx=idx('前提'),
    statusIdx=idx('ステータス'),pjIdx=idx('PJ'),priIdx=idx('優先'),reviewIdx=idx('レビュー');
  const result=[];
  for(let i=1;i<lines.length;i++){
    const cols=splitLine(lines[i]);
    if(cols.every(c=>!c)) continue;
    const id=cols[idIdx]||''; if(!id) continue;
    const rawType=cols[typeIdx]||'構想';
    const type=rawType==='実行'?'実行':'構想';
    const rawStatus=cols[statusIdx]||'検討中';
    const status=['検討中','待機','実行中','完了','廃棄'].includes(rawStatus)?rawStatus:'検討中';
    const rawPj=cols[pjIdx]||'-';
    const pj=['未','済','-'].includes(rawPj)?rawPj:'-';
    const rawPri=priIdx>=0?(cols[priIdx]||'A'):'A';
    const priority=['S','A','B','C'].includes(rawPri)?rawPri:'A';
    result.push({
      id,type,parentId:cols[parentIdx]||'-',
      title:cols[titleIdx]||'',purpose:cols[purposeIdx]||'',
      success:cols[successIdx]||'',trigger:cols[triggerIdx]||'',
      prereq:cols[prereqIdx]||'',status,pj,priority,
      review:cols[reviewIdx]||'',
    });
  }
  return result;
}

function doReset() {
  if(!confirm('サンプルデータにリセットしますか？（現在のデータは消えます）')) return;
  items=JSON.parse(JSON.stringify(SAMPLE)); archives=[];
  save(); showToast('リセットしました'); renderCurrentView();
}
let toastTimer=null;
function showToast(msg) {
  const el=document.getElementById('toast');
  el.textContent='✓ '+msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2400);
}

  }
});

function renderVision() {
