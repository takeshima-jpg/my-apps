<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSO Log</title>
<style>
/* UI基準：指で狙えるタップ領域（フィッツの法則） */
button, [role="button"], .btn, .nav a, .nav button, .tab, .tab-btn {
  min-height: 44px; min-width: 44px; box-sizing: border-box;
}
/* 密度が必要な一覧行内の小操作は明示的に例外化（クラス付与で opt-out） */
.dense button, .dense .btn, .tk-meta button { min-height: 32px; min-width: 32px; }
/* flexナビ内では明示min-widthが「内容幅未満への縮小」を許してしまうため、従来のmin-width:auto相当（内容幅で停止）に戻す */
.dense > button, .dense > .btn { flex-shrink: 0; }

/* ─── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #ffffff;
  --bg2:       #f9fafb;
  --bg3:       #f3f4f6;
  --bg4:       #e5e7eb;
  --border:    #e5e7eb;
  --border2:   #d1d5db;
  --text:      #111827;
  --text2:     #374151;
  --text3:     #6b7280;
  --text4:     #9ca3af;
  --blue:      #2563eb;
  --blue-lt:   #eff6ff;
  --sidebar:   220px;
  --radius:    10px;
  --shadow:    0 1px 3px rgba(0,0,0,.07);
}

html, body { height: 100%; }
body {
  background: var(--bg3);
  color: var(--text);
  font-family: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  font-size: 15px;
  line-height: 1.5;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input, select, textarea { font-family: inherit; outline: none; }

/* ─── Layout ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar);
  flex-shrink: 0;
  background: #1e2230;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#main {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px;
  min-width: 0;
  background: var(--bg3);
}

/* ─── Sidebar ────────────────────────────────────────────── */
.sidebar-logo {
  padding: 16px 14px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.logo-text { font-weight: 800; font-size: 16px; color: #fff; line-height: 1.1; letter-spacing: -.01em; }
.logo-sub  { font-size: 9px; color: rgba(255,255,255,.3); letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }

.sidebar-section-label {
  padding: 14px 14px 4px;
  font-size: 9px;
  font-weight: 700;
  color: rgba(255,255,255,.25);
  text-transform: uppercase;
  letter-spacing: .1em;
}

nav { padding: 4px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-btn {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 10px;
  border-radius: 7px;
  background: none;
  color: rgba(255,255,255,.5);
  font-size: 14px;
  font-weight: 500;
  transition: background .12s, color .12s;
  text-align: left;
  width: 100%;
}
.nav-btn:hover { background: rgba(255,255,255,.06); color: rgba(255,255,255,.85); }
.nav-btn.active { background: rgba(37,99,235,0.2); color: #93c5fd; font-weight: 600; border-left: 3px solid #93c5fd; padding-left: 11px; }
.nav-btn .nav-icon { width: 16px; text-align: center; font-size: 14px; opacity: .8; flex-shrink: 0; }
.nav-badge {
  margin-left: auto;
  font-size: 9px; font-weight: 700;
  padding: 1px 5px;
  border-radius: 9999px;
  min-width: 18px; text-align: center;
  background: rgba(255,255,255,.2); color: rgba(255,255,255,.7);
}

.sidebar-footer { padding: 6px 14px 10px; color: rgba(255,255,255,.2); font-size: 10px; margin-top: auto; }

/* ─── Badges ─────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center;
  padding: 2px 8px;
  border-radius: 9999px;
  font-size: 10px; font-weight: 700;
  white-space: nowrap; letter-spacing: .02em;
}
.badge-検討中 { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; }
.badge-待機   { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; }
.badge-実行中 { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
.badge-完了   { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
.badge-廃棄   { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
.badge-PJ化   { background: #ecfeff; color: #0e7490; border: 1px solid #cffafe; }
.badge-pri-S  { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; font-weight: 800; }
.badge-pri-A  { background: #dbeafe; color: #1d4ed8; border: 1px solid #bfdbfe; font-weight: 800; }
.badge-pri-B  { background: #ede9fe; color: #6d28d9; border: 1px solid #ddd6fe; font-weight: 800; }
.badge-pri-C  { background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; font-weight: 700; }

/* ─── Page Header ────────────────────────────────────────── */
.page-header { margin-bottom: 20px; }
.page-title { font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: -.02em; }
.page-sub { font-size: 13px; color: var(--text3); margin-top: 3px; }

/* ─── HOME ───────────────────────────────────────────────── */
.home-priority-section { margin-bottom: 20px; }
.home-priority-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0 8px;
  margin-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.home-priority-label {
  font-size: 13px; font-weight: 800;
  letter-spacing: .06em; text-transform: uppercase;
}
.home-priority-count {
  font-size: 10px; color: var(--text3); font-weight: 500;
}
.home-pri-s .home-priority-label { color: #b91c1c; }
.home-pri-s .home-priority-header { border-color: #fecaca; }
.home-pri-a .home-priority-label { color: #1d4ed8; }
.home-pri-a .home-priority-header { border-color: #bfdbfe; }
.home-pri-b .home-priority-label { color: #6d28d9; }
.home-pri-b .home-priority-header { border-color: #ddd6fe; }
.home-pri-c .home-priority-label { color: #6b7280; }
.home-pri-c .home-priority-header { border-color: #e5e7eb; }

.home-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: box-shadow .12s, border-color .12s;
  box-shadow: var(--shadow);
}
.home-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.09); border-color: var(--border2); }
.home-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.home-card-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; }
.home-card-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; }
.home-card-purpose { font-size: 13px; color: var(--text3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.home-card-children { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg3); display: none; }
.home-card.expanded .home-card-children { display: block; }
.home-child-row {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--bg3);
  font-size: 13px; color: var(--text2);
}
.home-child-row:last-child { border-bottom: none; }
.home-child-indent { color: #d1d5db; font-size: 10px; flex-shrink: 0; }
.home-child-id { font-family: monospace; font-size: 10px; color: #7c3aed; }
.home-child-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.home-empty { padding: 12px 0; color: var(--text4); font-size: 13px; font-style: italic; }
.home-toggle-arrow { font-size: 9px; color: var(--text4); margin-left: auto; transition: transform .15s; }
.home-card.expanded .home-toggle-arrow { transform: rotate(90deg); }

/* ─── 構想ログ一覧 ───────────────────────────────────────── */
.log-list { display: flex; flex-direction: column; gap: 6px; }
.log-item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.log-item-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .1s;
}
.log-item-header:hover { background: #f8f9ff; }
.log-toggle { font-size: 9px; color: var(--text4); transition: transform .15s; flex-shrink: 0; }
.log-item.open .log-toggle { transform: rotate(90deg); }
.log-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; flex-shrink: 0; }
.log-title { font-size: 15px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-meta { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.log-item-body {
  display: none;
  padding: 0 14px 14px;
  border-top: 1px solid var(--bg3);
}
.log-item.open .log-item-body { display: block; }
.log-detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0 10px; }
.log-detail-item { display: flex; flex-direction: column; gap: 3px; }
.log-detail-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
.log-detail-value { font-size: 14px; color: var(--text2); }
.log-detail-value.empty { color: var(--text4); font-style: italic; }

.log-children { margin-top: 10px; }
.log-children-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.log-child-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 7px;
  margin-bottom: 4px;
}
.log-child-item:last-child { margin-bottom: 0; }
.log-child-marker { color: #d1d5db; font-size: 10px; margin-top: 2px; flex-shrink: 0; }
.log-child-body { flex: 1; min-width: 0; }
.log-child-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.log-child-id { font-family: monospace; font-size: 10px; color: #7c3aed; font-weight: 700; }
.log-child-title { font-size: 14px; font-weight: 600; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-child-purpose { font-size: 10px; color: var(--text4); }

.log-actions { display: flex; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--bg3); }
.btn-edit {
  padding: 4px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 700;
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border2);
  transition: background .1s;
}
.btn-edit:hover { background: var(--bg4); }
.btn-del {
  padding: 4px 10px; border-radius: 6px;
  font-size: 13px; font-weight: 700;
  background: #fee2e2; color: #b91c1c;
  border: 1px solid #fecaca;
  transition: background .1s;
}
.btn-del:hover { background: #fecaca; }

/* ─── Filter Bar ─────────────────────────────────────────── */
.filter-bar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-bottom: 14px;
}
.filter-input {
  flex: 1; min-width: 160px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 10px;
  color: var(--text);
  font-size: 14px;
  transition: border-color .12s;
}
.filter-input:focus { border-color: var(--blue); }
.filter-select {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 6px 8px;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
}
.filter-select:focus { border-color: var(--blue); }

/* ─── AI Import ──────────────────────────────────────────── */
.ai-import-wrap {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  max-width: 760px;
}
.ai-import-desc { font-size: 14px; color: var(--text2); margin-bottom: 14px; line-height: 1.6; }
.ai-textarea {
  width: 100%;
  min-height: 280px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 12px;
  font-size: 14px;
  color: var(--text);
  line-height: 1.6;
  resize: vertical;
  transition: border-color .12s;
  font-family: inherit;
}
.ai-textarea:focus { border-color: var(--blue); background: var(--bg); outline: none; }
.ai-btn-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.btn-primary {
  padding: 8px 18px;
  background: var(--blue); color: #fff;
  border-radius: 7px;
  font-size: 14px; font-weight: 700;
  transition: background .12s;
}
.btn-primary:hover { background: #1d4ed8; }
.btn-secondary {
  padding: 8px 18px;
  background: #16a34a; color: #fff;
  border-radius: 7px;
  font-size: 14px; font-weight: 700;
  transition: background .12s;
}
.btn-secondary:hover { background: #15803d; }
.btn-secondary:disabled { background: var(--bg4); color: var(--text3); cursor: not-allowed; }
.ai-preview {
  margin-top: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
}
.ai-preview-title { font-size: 10px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.ai-preview-g {
  background: var(--bg);
  border: 1px solid #bfdbfe;
  border-left: 3px solid #2563eb;
  border-radius: 7px;
  padding: 10px 12px;
  margin-bottom: 8px;
}
.ai-preview-g-title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.ai-preview-g-meta { font-size: 10px; color: var(--text3); }
.ai-preview-e {
  background: #faf5ff;
  border: 1px solid #ddd6fe;
  border-left: 3px solid #7c3aed;
  border-radius: 6px;
  padding: 7px 10px;
  margin: 4px 0 4px 16px;
  font-size: 13px; color: var(--text2);
}
.ai-parse-status { font-size: 13px; color: var(--text3); }
.ai-parse-status.ok { color: #15803d; font-weight: 600; }
.ai-parse-status.err { color: #b91c1c; font-weight: 600; }

/* ─── Archive ────────────────────────────────────────────── */
.archive-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-left: 3px solid #dc2626;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.archive-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.archive-id { font-family: monospace; font-size: 10px; font-weight: 700; color: #2563eb; }
.archive-title { font-weight: 700; font-size: 15px; color: var(--text); flex: 1; }
.archive-date { font-size: 10px; color: var(--text3); font-family: monospace; white-space: nowrap; }
.archive-section-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; margin-top: 8px; }
.archive-reason { font-size: 14px; color: #b91c1c; background: #fee2e2; padding: 6px 10px; border-radius: 6px; border: 1px solid #fecaca; }
.archive-learn { font-size: 14px; color: var(--text2); background: var(--bg3); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }

/* ─── Modal ──────────────────────────────────────────────── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.4);
  backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 26px;
  width: 100%; max-width: 580px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-title { font-size: 18px; font-weight: 800; color: var(--text); }
.modal-close {
  background: var(--bg3); color: var(--text3);
  font-size: 20px; line-height: 1; padding: 4px 8px;
  border-radius: 6px; transition: background .12s;
}
.modal-close:hover { background: var(--bg4); color: var(--text); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-col2 { grid-column: span 2; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 9px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; }
.form-control {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 7px;
  padding: 7px 10px;
  color: var(--text); font-size: 14px;
  transition: border-color .12s, background .12s;
  width: 100%;
}
.form-control:focus { border-color: var(--blue); background: var(--bg); }
textarea.form-control { resize: vertical; min-height: 56px; }

/* Discard modal */
.discard-box {
  background: #fff5f5; border: 1px solid #fecaca;
  border-radius: 10px; padding: 14px; margin-bottom: 16px;
}
.discard-box-title { font-size: 14px; font-weight: 700; color: #991b1b; margin-bottom: 8px; }
.discard-form-group { margin-bottom: 10px; }
.discard-label { font-size: 9px; font-weight: 700; color: #b91c1c; text-transform: uppercase; letter-spacing: .08em; display: block; margin-bottom: 4px; }
.discard-control {
  width: 100%; background: #fff;
  border: 1px solid #fecaca; border-radius: 6px;
  padding: 7px 10px; color: var(--text); font-size: 14px;
  font-family: inherit; transition: border-color .12s;
}
.discard-control:focus { border-color: #ef4444; outline: none; }

.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border);
}
.btn-cancel {
  padding: 8px 16px;
  background: var(--bg3); color: var(--text2);
  border-radius: 7px; font-size: 14px; font-weight: 600;
  border: 1px solid var(--border2);
  transition: background .12s;
}
.btn-cancel:hover { background: var(--bg4); }
.btn-save {
  padding: 8px 20px;
  background: var(--blue); color: #fff;
  border-radius: 7px; font-size: 14px; font-weight: 800;
  transition: background .12s;
}
.btn-save:hover { background: #1d4ed8; }
.btn-discard-confirm {
  padding: 8px 20px;
  background: #dc2626; color: #fff;
  border-radius: 7px; font-size: 14px; font-weight: 800;
  transition: background .12s;
}
.btn-discard-confirm:hover { background: #b91c1c; }

/* ─── Toast ──────────────────────────────────────────────── */
.toast {
  position: fixed; bottom: 20px; right: 20px;
  background: #1e2230; color: #fff;
  padding: 10px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 600;
  z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(6px);
  transition: opacity .2s, transform .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ─── Scrollbar ──────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg3); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border2); }

/* ─── Sidebar add btn ────────────────────────────────────── */
.sidebar-add {
  padding: 10px 8px;
  border-top: 1px solid rgba(255,255,255,.07);
}
.btn-add {
  width: 100%;
  padding: 9px;
  background: var(--blue);
  color: #fff;
  border-radius: 7px;
  font-weight: 700;
  font-size: 14px;
  transition: background .12s;
}
.btn-add:hover { background: #1d4ed8; }

/* ─── Misc ───────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 32px; margin-bottom: 10px; }
.priority-inherited { font-size: 9px; color: var(--text4); font-style: italic; }

/* ─── v2: GOサイン・由来・関連・記録 ─────────────────────── */
.home-card-gosign { font-size: 12px; color: var(--text4); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.log-latest { font-size: 11px; color: var(--text4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

<script>
function toast(msg) {
  let el = document.querySelector('.toast-msg');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = 'kouso_backlog_v1';
const ARCHIVE_KEY = 'kouso_archive_v1';
const STATUSES    = ['検討中','待機','実行中','PJ化','完了','廃棄'];
const LOG_KINDS   = ['気づき','判断','統合','派生','PJ化','見直し'];
const REL_KINDS   = ['派生元','統合先','関連'];
const ORIGIN_KINDS = ['種','壁打ち','1day','本人'];
const DEFAULT_CREATED = '2026/04/22'; // 実データの最古レビュー日
const LASTIMPORT_KEY = 'kouso_backup_lastimport';
const PRIORITIES  = ['S','A','B','C'];
const PRI_LABEL   = {S:'今期コア',A:'重要',B:'探索',C:'保留'};
const PRI_COLOR   = {S:'#b91c1c',A:'#1d4ed8',B:'#6d28d9',C:'#6b7280'};

let items    = [];
let archives = [];
let currentView = 'home';
let editingId   = null;
let expandedHome = new Set();
let expandedLog  = new Set();
let expandedRecAll = new Set();
let filterSearch = '';
let filterPriority = '';
let filterStatus   = '';

let discardPendingId  = '';
let discardPrevStatus = '';

// ─── migrate pj field if exists (compatibility) ───────────
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
    items.forEach(i => {
      if (!i.priority) i.priority = 'A';
      if (!i.prereq) i.prereq = '';
      if (!i.trigger) i.trigger = '';
    });
    migrateV2(raw);
  } catch { items = []; }
  try {
    const raw2 = localStorage.getItem(ARCHIVE_KEY);
    archives = raw2 ? JSON.parse(raw2) : [];
  } catch { archives = []; }
}
// v2 移行（冪等）：createdAt 補完／log・relations を [] に。値は一切変えない（review・origin も触らない）
function migrateV2(raw) {
  const needs = items.some(i => !i.createdAt || !Array.isArray(i.log) || (i.type==='構想' && !Array.isArray(i.relations)));
  if (!needs) return;
  if (raw) {
    const d = new Date();
    const key = 'kouso_backup_v2migration_' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    if (localStorage.getItem(key) === null) { try { localStorage.setItem(key, raw); } catch(e) {} }
  }
  items.forEach(i => {
    if (i.type==='構想' && !i.createdAt) i.createdAt = i.review || DEFAULT_CREATED;
  });
  items.forEach(i => {
    if (i.type!=='構想' && !i.createdAt) {
      const p = items.find(x => x.id===i.parentId);
      i.createdAt = (p && p.createdAt) || DEFAULT_CREATED;
    }
    if (!Array.isArray(i.log)) i.log = [];
    if (i.type==='構想' && !Array.isArray(i.relations)) i.relations = [];
  });
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
}

function doExportJSON() {
  const data = { items, archives, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'koso-log-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// ── 復元ガード（共通仕様：鮮度比較＋直前スナップショット＋アンドゥ。CLAUDE.md参照）──
const RG_OS = 'koso-log';
const RG_KEYS = ['kouso_backlog_v1', 'kouso_archive_v1'];
const RG_SNAP_KEY = 'koso-log_pre_restore_snapshot';

// 主データ({items,archives})から {latest, count} を機械判定（reviewは 'YYYY/MM/DD' → 'YYYY-MM-DD' 正規化）
function rgStat(data) {
  const d = data || {};
  const its = Array.isArray(d.items) ? d.items : [];
  const arcs = Array.isArray(d.archives) ? d.archives : [];
  let latest = '';
  its.forEach(r => {
    if (!r || !r.review) return;
    const p = String(r.review).split('/');
    const norm = p.length === 3
      ? p[0] + '-' + p[1].padStart(2, '0') + '-' + p[2].padStart(2, '0')
      : String(r.review).replace(/\//g, '-');
    if (norm > latest) latest = norm;
  });
  return { latest: latest || '—', count: its.length + arcs.length };
}

// 鮮度比較ダイアログ。巻き戻り時は赤字警告＋「巻き戻す」の入力を要求。resolve(true)で続行
// extra: {detailHtml: 追加表示, rollback: 判定の上書き}（統合復元など向け・省略可）
function rgConfirm(inc, cur, label, extra) {
  extra = extra || {};
  return new Promise(resolve => {
    const rollback = (typeof extra.rollback === 'boolean') ? extra.rollback
      : (cur.latest !== '—' && (inc.latest === '—' || inc.latest < cur.latest || inc.count < cur.count));
    const ov = document.createElement('div');
    ov.id = 'rgConfirmOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#1a1a22;border-radius:10px;max-width:440px;width:100%;padding:20px;font-size:14px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.25);';
    let html = '<div style="font-weight:700;margin-bottom:10px;">' + label + '</div>'
      + '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;">'
      + '読み込むデータ：最新 <b>' + inc.latest + '</b>・' + inc.count + '件<br>'
      + '現在のデータ　：最新 <b>' + cur.latest + '</b>・' + cur.count + '件</div>';
    if (extra.detailHtml) {
      html += '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;max-height:180px;overflow-y:auto;font-size:12px;line-height:1.8;">' + extra.detailHtml + '</div>';
    }
    if (rollback) {
      html += '<div id="rgRollbackWarn" style="color:#d31f2c;font-weight:700;margin-bottom:8px;">⚠ 巻き戻りが発生します（読み込むデータの方が古い／少ない）</div>'
        + '<div style="margin-bottom:6px;">続けるには「巻き戻す」と入力してください：</div>'
        + '<input id="rgWord" type="text" autocomplete="off" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px;font-size:14px;box-sizing:border-box;">';
    } else {
      html += '<div style="margin-bottom:12px;">現在のデータは上書きされます（直前の状態は自動退避されます）。</div>';
    }
    html += '<div style="display:flex;gap:8px;justify-content:flex-end;">'
      + '<button id="rgCancel" style="padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a22;cursor:pointer;">キャンセル</button>'
      + '<button id="rgOk" style="padding:8px 16px;border:none;border-radius:6px;background:' + (rollback ? '#d31f2c' : '#5b51d8') + ';color:#fff;cursor:pointer;">' + (rollback ? '巻き戻して復元' : '復元する') + '</button></div>';
    box.innerHTML = html;
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('#rgCancel').onclick = () => done(false);
    box.querySelector('#rgOk').onclick = () => {
      if (rollback) {
        const w = box.querySelector('#rgWord');
        if (w.value.trim() !== '巻き戻す') { w.style.borderColor = '#d31f2c'; w.focus(); return; }
      }
      done(true);
    };
  });
}

// 復元直前の状態をlocalStorage退避（1世代）＋JSON自動ダウンロード
function rgSnapshot() {
  const snap = { os: RG_OS, savedAt: new Date().toISOString(), data: {} };
  RG_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) snap.data[k] = v; });
  try { localStorage.setItem(RG_SNAP_KEY, JSON.stringify(snap)); } catch(e) {}
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' }));
    a.download = RG_OS + '-pre-restore-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {}
}

function rgShowUndo() {
  if (document.getElementById('rgUndoBtn')) return;
  const b = document.createElement('button');
  b.id = 'rgUndoBtn';
  b.textContent = '↩ 復元前に戻す';
  b.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99998;padding:10px 18px;border:none;border-radius:999px;background:#1a1a22;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);';
  b.onclick = rgUndo;
  document.body.appendChild(b);
}

function rgUndo() {
  try {
    const snap = JSON.parse(localStorage.getItem(RG_SNAP_KEY) || 'null');
    if (!snap || !snap.data) { alert('復元前スナップショットが見つかりません'); return; }
    if (!confirm('復元前（' + (snap.savedAt || '').slice(0, 16).replace('T', ' ') + '）の状態に戻します。よろしいですか？')) return;
    RG_KEYS.forEach(k => { if (k in snap.data) localStorage.setItem(k, snap.data[k]); else localStorage.removeItem(k); });
    location.reload();
  } catch(e) { alert('戻せませんでした: ' + e.message); }
}

function doImportJSON(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.items) { alert('有効なデータが見つかりませんでした'); return; }
      const inc = { items: data.items || [], archives: data.archives || [] };
      const ok = await rgConfirm(rgStat(inc), rgStat({ items, archives }), 'JSONから復元します（' + inc.items.length + '件＋アーカイブ' + inc.archives.length + '件）');
      if (!ok) { e.target.value = ''; return; }
      rgSnapshot();
      items = inc.items;
      archives = inc.archives;
      save();
      renderCurrentView();
      toast('復元しました（' + items.length + '件）');
      rgShowUndo();
    } catch(err) { alert('読込エラー: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch(e) {}
  try { localStorage.setItem(ARCHIVE_KEY, JSON.stringify(archives)); } catch(e) {}
}

// ─── Utils ────────────────────────────────────────────────
function today() { return new Date().toLocaleDateString('sv').replace(/-/g,'/'); }
function todayInput() { return new Date().toLocaleDateString('sv'); }
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function priOrder(p) { return {S:0,A:1,B:2,C:3}[p]??9; }
function genId(type) {
  const prefix = type==='構想'?'G':'E';
  const nums = items.filter(i=>i.id.startsWith(prefix)).map(i=>parseInt(i.id.slice(1))||0);
  return prefix + String((nums.length?Math.max(...nums):0)+1).padStart(2,'0');
}

function statusBadge(s) { return `<span class="badge badge-${esc(s)}">${esc(s)}</span>`; }
function priBadge(p) {
  return `<span class="badge badge-pri-${esc(p)}">${esc(p)} ${esc(PRI_LABEL[p]||p)}</span>`;
}

// ─── View routing ─────────────────────────────────────────
function setView(v) {
  currentView = v;
  ['home','list','archive','ai-import'].forEach(name => {
    document.getElementById('view-'+name).style.display = name===v?'':'none';
  });
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.view===v);
  });
  renderCurrentView();
}
function renderCurrentView() {
  updateBadges();
  if (currentView==='home')      renderHome();
  else if (currentView==='list') renderList();
  else if (currentView==='archive') renderArchive();
  else if (currentView==='ai-import') renderAiImport();
  const kousoCount = items.filter(i=>i.type==='構想').length;
  const jikkoCount = items.filter(i=>i.type==='実行').length;
  document.getElementById('sidebar-count').textContent = `G:${kousoCount} E:${jikkoCount}`;
}
function updateBadges() {
  const arCount = archives.length;
  const bar = document.getElementById('badge-archive');
  bar.textContent = arCount; bar.style.display = arCount?'':'none';
}

    { key:'A', label:'A — 重要',     cls:'home-pri-a', items: kousos.filter(i=>i.priority==='A').sort((a,b)=>a.id.localeCompare(b.id)) },

    { key:'C', label:'C — 保留',     cls:'home-pri-c', items: kousos.filter(i=>i.priority==='C').sort((a,b)=>a.id.localeCompare(b.id)) },

// 'YYYY/MM/DD' → 'M/D'
function shortDate(d) {
  const p = String(d||'').split(/[\/-]/);
  return p.length===3 ? (parseInt(p[1],10)+'/'+parseInt(p[2],10)) : String(d||'');
}
function clip(s, n) { s = String(s||''); return s.length>n ? s.slice(0,n)+'…' : s; }

function addRecord(id, kind) {
  const inp = document.getElementById('rec-in-'+id);
  const text = inp ? inp.value.trim() : '';
  if (!text) return;
  const k = items.find(i=>i.id===id);
  if (!k) return;
  if (!Array.isArray(k.log)) k.log = [];
  k.log.push({date:today(), kind, text, src:'本人'});
  k.review = today();
  save();
  renderList();
  showToast(kind+'を記録しました');
}

function openRelated(id) {
  const k = items.find(i=>i.id===id&&i.type==='構想');
  if (!k) { showToast(id+' が見つかりません'); return; }
  if ((filterPriority&&k.priority!==filterPriority)||(filterStatus&&k.status!==filterStatus)||filterSearch) {
    filterSearch=''; filterPriority=''; filterStatus='';
  }
  expandedLog.add(id);
  renderList();
  const el = document.getElementById('log-'+id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ─── 壁打ち用コピー ───────────────────────────────────────
function latestRecLine(k) {
  const log = Array.isArray(k.log) ? k.log : [];
  if (!log.length) return '';
  const r = log[log.length-1];
  return '最新：'+shortDate(r.date)+' '+r.kind+'｜'+clip(r.text,40);
}
function buildAllKosoText() {
  const head = '【構想ログ 現在地 '+today()+'】';
  const rows = items.filter(i=>i.type==='構想'&&['検討中','待機','実行中'].includes(i.status))
    .sort((a,b)=>priOrder(a.priority)-priOrder(b.priority)||a.id.localeCompare(b.id))
    .map(k => ({pri:k.priority||'A', line:[k.id, k.priority||'A', k.title, 'GOサイン：'+(k.goSign||'未設定'), latestRecLine(k)].filter(Boolean).join('｜')}));
  const total = () => [head, ...rows.map(r=>r.line)].join('\n').length;
  // 800字を超えたら C → B の順に（下から）行を落とす
  ['C','B'].forEach(p => {
    while (total()>800) {
      let idx = -1;
      rows.forEach((r,i)=>{ if (r.pri===p) idx = i; });
      if (idx<0) break;
      rows.splice(idx,1);
    }
  });
  while (total()>800 && rows.length) rows.pop();
  return [head, ...rows.map(r=>r.line)].join('\n');
}
function buildOneKosoText(id) {
  const k = items.find(i=>i.id===id);
  if (!k) return '';
  const kids = items.filter(i=>i.type==='実行'&&i.parentId===id);
  const log = (Array.isArray(k.log)?k.log:[]).slice(-3).reverse();
  const lines = [
    '【構想 '+k.id+'】'+k.title,
    '目的：'+(k.purpose||''),
    'GOサイン：'+(k.goSign||'未設定'),
  ];
  if (kids.length) { lines.push('試し：'); kids.forEach(e=>lines.push('- '+e.id+' '+e.title+'（'+e.status+'）')); }
  if (log.length) { lines.push('記録（直近3件）：'); log.forEach(r=>lines.push('- '+shortDate(r.date)+' '+r.kind+'｜'+r.text)); }
  let t = lines.join('\n');
  if (t.length>400) t = t.slice(0,399)+'…';
  return t;
}
function copyText(t, okMsg) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = t; ta.style.cssText = 'position:fixed;left:-9999px;top:0;';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast(okMsg); } catch(e) { showToast('コピーできませんでした'); }
    ta.remove();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(()=>showToast(okMsg), fallback);
  } else fallback();
}
function copyAllKoso() { const t = buildAllKosoText(); copyText(t, '壁打ち用にコピーしました（'+t.length+'字）'); }
function copyOneKoso(id) { const t = buildOneKosoText(id); copyText(t, id+' をコピーしました（'+t.length+'字）'); }

function toggleLog(id) {
  if (expandedLog.has(id)) expandedLog.delete(id);
  else expandedLog.add(id);
  renderList();
}

function parseAiText(text) {
  const result = { title:'', purpose:'', success:'', trigger:'', prereq:'', priority:'A', executions:[] };

  // Find 【構想】section
  const kousoMatch = text.match(/【構想】([\s\S]*?)(?=【実行単位】|【実行】|$)/i);
  if (!kousoMatch) return null;
  const kousoBlock = kousoMatch[1];

  function extractField(block, ...keys) {
    for (const key of keys) {
      const re = new RegExp(key + '[：:：]\\s*(.+?)(?=\\n|$)', 'i');
      const m = block.match(re);
      if (m && m[1].trim()) return m[1].trim();
    }
    return '';
  }

  result.title    = extractField(kousoBlock, 'タイトル', 'title');
  result.purpose  = extractField(kousoBlock, '目的/概要', '目的・概要', '概要', '目的');
  result.success  = extractField(kousoBlock, '成功条件');
  result.trigger  = extractField(kousoBlock, '実行トリガー', 'トリガー');
  result.prereq   = extractField(kousoBlock, '前提条件', '前提');
  const rawPri    = extractField(kousoBlock, '戦略優先順位', '優先順位', '優先度');
  result.priority = ['S','A','B','C'].includes(rawPri.slice(0,1).toUpperCase())
    ? rawPri.slice(0,1).toUpperCase() : 'A';

  if (!result.title) return null;

  // Find 【実行単位】section
  const execMatch = text.match(/【実行単位】([\s\S]*?)(?=【|$)/i) ||
                    text.match(/【実行】([\s\S]*?)(?=【|$)/i);
  if (execMatch) {
    const execBlock = execMatch[1];
    // Split by numbered lines
    const execItems = execBlock.split(/\n\s*\d+[.\)、。]/);
    execItems.forEach(block => {
      if (!block.trim()) return;
      // Try "タイトル：xxx" style
      let title   = extractField(block, 'タイトル', 'title');
      let purpose = extractField(block, '目的/概要', '目的・概要', '概要', '目的');
      let success = extractField(block, '成功条件');
      // Fallback: first non-empty line is title
      if (!title) {
        const firstLine = block.trim().split('\n')[0].trim();
        if (firstLine) title = firstLine.replace(/^[-・＊\*]\s*/, '');
      }
      if (title) {
        result.executions.push({ title, purpose, success });
      }
    });
  }

  return result;
}

function setAiStatus(text, cls) {
  aiImportStatus = { text, cls };
  const el = document.getElementById('ai-parse-status');
  if (el) { el.textContent = text; el.className = 'ai-parse-status ' + cls; }
}

/* 取り込みの本体（textarea・画面に依存しない）。画面の「登録」と受信箱（inboxApply）の両方が使う。
   返り値 {ok, kind:'empty'|'koso'|'legacy', summary, errors:[], touchedIds:[], message}
   KOSO-IMPORT は従来どおり取り込み前を kouso_backup_lastimport に退避する（受信箱経由でも「直前の取り込みを元に戻す」が効く）。
   opts.links：触った構想・試しに紐づけを付ける（PJ化の projectId は補わない＝本人が決める） */
function kosoImportText(text, opts) {
  opts = opts || {};
  text = String(text||'').trim();
  const res = { ok:false, kind:'', summary:'', errors:[], touchedIds:[], message:'' };
  if (!text) { res.kind='empty'; res.message='入力が空です'; return res; }
  if (text.split('\n')[0].trim().startsWith('【KOSO-IMPORT】')) {
    res.kind = 'koso';
    const blocks = parseKosoImport(text);
    const pre = { items: JSON.parse(JSON.stringify(items)), archives: JSON.parse(JSON.stringify(archives)) };
    const summaries = [];
    blocks.forEach(b => {
      let r;
      try { r = applyKosoBlock(b); } catch(e) { r = { error: true }; }
      if (r.error) res.errors.push('読めませんでした：' + b.head);
      else { summaries.push(r.summary); (r.ids||[]).forEach(id => { if (!res.touchedIds.includes(id)) res.touchedIds.push(id); }); }
    });
    if (!summaries.length) {
      res.message = ['【KOSO-IMPORT】の中に読めるブロックがありません', ...res.errors].join('\n');
      return res;
    }
    kosoAttachLinks(res.touchedIds, opts.links);
    try { localStorage.setItem(LASTIMPORT_KEY, JSON.stringify({ items: pre.items, archives: pre.archives, at: new Date().toISOString() })); } catch(e) {}
    save();
    res.ok = true;
    res.summary = summaries.join('／');
    res.message = [res.summary, ...res.errors].join('\n');
    return res;
  }
  res.kind = 'legacy';
  let d;
  try {
    d = parseAiText(text);
  } catch(err) {
    res.message = `解析エラー: ${err.message}`;
    return res;
  }
  if (!d || !d.title) {
    res.message = '【構想】セクションが見つかりません';
    return res;
  }
  const gId = genId('構想');
  items.push({
    id: gId, type: '構想', parentId: '-',
    title: d.title, purpose: d.purpose, success: d.success,
    trigger: d.trigger, prereq: d.prereq,
    priority: d.priority, status: '検討中',
    review: today(),
    createdAt: today(), log: [], relations: [],
    origin: {kind:'取り込み', date: today()},
  });
  res.touchedIds.push(gId);
  d.executions.forEach(e => {
    const eId = genId('実行');
    items.push({
      id: eId, type: '実行', parentId: gId,
      title: e.title, purpose: e.purpose, success: e.success,
      trigger: '', prereq: '',
      priority: d.priority, status: '検討中',
      review: today(),
      createdAt: today(), log: [],
    });
    res.touchedIds.push(eId);
  });
  kosoAttachLinks(res.touchedIds, opts.links);
  save();
  res.ok = true;
  res.summary = 'G1件 E' + d.executions.length + '件';
  return res;
}

function registerAiInput() {
  const text = document.getElementById('ai-input').value.trim();
  if (!text) { setAiStatus('入力が空です', 'err'); return; }
  /* 本文に「紐づけ：」行があれば、受信箱と同じように触った構想・試しに付ける */
  const r = kosoImportText(text, { links: inboxParseLinks(text) });
  if (r.kind === 'koso') {
    if (!r.ok) { setAiStatus(r.message, 'err'); return; }
    aiImportStatus = { text: r.message, cls: r.errors.length ? 'err' : 'ok' };
    renderCurrentView();
    showToast(r.summary.length <= 60 ? r.summary : ('取り込みました：' + r.summary.split('／').length + '件' + (r.errors.length ? '（読めない ' + r.errors.length + '件）' : '')));
    return;
  }
  if (!r.ok) { setAiStatus(r.message, 'err'); return; }
  document.getElementById('ai-input').value = '';
  aiImportStatus = { text:'', cls:'' };
  showToast(`登録しました：${r.summary}`);
  setView('list');
}

// ═══════════════════════════════════════════════════════
// KOSO-IMPORT（IDあり更新・新規・試し・統合・廃棄・PJ化／1段階）
// ═══════════════════════════════════════════════════════
const KI_KEYS = {
  'タイトル':'title',
  '目的/概要':'purpose', '目的・概要':'purpose', '概要':'purpose', '目的':'purpose',
  '成功条件':'success',
  'GOサイン':'goSign',
  '実行トリガー':'trigger', 'トリガー':'trigger',
  '前提条件':'prereq', '前提':'prereq',
  '戦略優先順位':'priority', '優先順位':'priority', '優先度':'priority',
  'ステータス':'status',
  '由来':'origin',
  '関連':'relations',
  '記録':'log',
  '理由':'reason',
  '学び':'learn',
};
const KI_LABEL = { title:'タイトル', purpose:'目的/概要', success:'成功条件', goSign:'GOサイン', trigger:'実行トリガー', prereq:'前提条件', priority:'優先順位', status:'ステータス', origin:'由来' };
const KI_CLEARABLE = ['goSign','trigger','prereq','purpose','success'];

// 貼り付け文字列 → ブロック配列（解析のみ・データは触らない）
function parseKosoImport(text) {
  const lines = String(text).replace(/\r\n?/g, '\n').split('\n');
  const blocks = [];
  let cur = null;
  lines.slice(1).forEach(raw => {
    const line = raw.replace(/　/g, ' ').trim();
    if (/^■/.test(line)) {
      cur = { head: raw.trim(), headN: line, fields: [] };
      blocks.push(cur);
      return;
    }
    if (!cur || !line) return;
    const m = line.match(/^([^：:]+?)\s*[：:]\s*(.*)$/);
    if (!m) return;
    const key = KI_KEYS[m[1].trim()];
    if (key) cur.fields.push({ key, value: m[2].trim() });
  });
  blocks.forEach(b => {
    const h = b.headN;
    let m;
    if ((m = h.match(/^■\s*(構想|試し|実行)\s*(新規|[GEge]\d+)(?:\s*親\s*[：:]\s*([Gg]\d+))?/))) {
      b.op = m[2]==='新規' ? 'new' : 'update';
      b.type = m[1]==='構想' ? '構想' : '実行';
      b.id = m[2]==='新規' ? '' : m[2].toUpperCase();
      b.parent = m[3] ? m[3].toUpperCase() : '';
    } else if ((m = h.match(/^■\s*統合\s*[：:]\s*([Gg]\d+)\s*(?:→|->|⇒|＞)\s*([Gg]\d+)/))) {
      b.op = 'merge'; b.from = m[1].toUpperCase(); b.to = m[2].toUpperCase();
    } else if ((m = h.match(/^■\s*廃棄\s*[：:]\s*([GEge]\d+)/))) {
      b.op = 'discard'; b.id = m[1].toUpperCase();
    } else if ((m = h.match(/^■\s*PJ化\s*[：:]\s*([Gg]\d+)\s*(?:→|->|⇒)\s*(.+)$/))) {
      b.op = 'pj'; b.id = m[1].toUpperCase(); b.pjName = m[2].trim();
    } else {
      b.op = 'unknown';
    }
  });
  return blocks;
}

function kiNormDate(s) {
  const m = String(s||'').match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  return m ? m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0') : '';
}
// 直近3件に同じ text があれば入れない
function kiPushLog(item, kind, text) {
  if (!Array.isArray(item.log)) item.log = [];
  if (item.log.slice(-3).some(r => r && r.text === text)) return false;
  item.log.push({ date: today(), kind, text, src: '取り込み' });
  return true;
}
function kiAddRelation(item, kind, id) {
  if (!Array.isArray(item.relations)) item.relations = [];
  if (item.relations.some(r => r.kind===kind && r.id===id)) return false;
  item.relations.push({ kind, id });
  return true;
}

// 1ブロック分を item に反映（更新・新規共通）。変更内容のラベル配列を返す
function kiApplyFields(item, fields, isNew) {
  const isG = item.type === '構想';
  const changed = [];
  let logN = 0, relN = 0;
  fields.forEach(({key, value}) => {
    if (key==='reason' || key==='learn') return;
    if (key==='log') {
      if (!value) return;
      const m = value.match(/^([^｜|]+?)\s*[｜|]\s*(.+)$/);
      const kind = m && LOG_KINDS.includes(m[1].trim()) ? m[1].trim() : '気づき';
      const body = m ? m[2].trim() : value;
      if (kiPushLog(item, kind, body)) logN++;
      return;
    }
    if (!value || value==='（変更なし）' || value==='(変更なし)') return;
    const clear = value==='（空にする）' || value==='(空にする)';
    if (key==='relations') {
      if (!isG) return;
      const m = value.split(/\s+/);
      const kind = m[0], id = (m[1]||'').toUpperCase();
      if (!REL_KINDS.includes(kind) || !items.some(i => i.id===id)) return;
      if (kiAddRelation(item, kind, id)) relN++;
      return;
    }
    if (key==='origin') {
      if (!isG || clear) return;
      if (item.origin && item.origin.kind) return; // 由来は変わらない
      const m = value.split(/\s+/);
      if (!ORIGIN_KINDS.includes(m[0])) return;
      item.origin = { kind: m[0], date: kiNormDate(m[1]) || today() };
      changed.push('由来');
      return;
    }
    if (key==='priority') {
      if (!isG || clear) return;
      const p = value.slice(0,1).toUpperCase();
      if (PRIORITIES.includes(p) && item.priority!==p) { item.priority = p; changed.push(KI_LABEL[key]); }
      return;
    }
    if (key==='status') {
      if (STATUSES.includes(value) && item.status!==value) { item.status = value; changed.push(KI_LABEL[key]); }
      return;
    }
    if (!isG && (key==='goSign' || key==='trigger' || key==='prereq')) return;
    if (clear) {
      if (!KI_CLEARABLE.includes(key)) return;
      if (item[key]) { item[key] = ''; changed.push(KI_LABEL[key]); }
      return;
    }
    if (item[key] !== value) { item[key] = value; changed.push(KI_LABEL[key]); }
  });
  if (relN) changed.push('関連'+relN+'件');
  if (logN) changed.push('記録'+logN+'件');
  return changed;
}

// 1ブロック適用。成功時 {summary}、失敗時 {error} を返す（失敗時はデータを変えない）
function applyKosoBlock(b) {
  const fv = k => { const f = b.fields.filter(x=>x.key===k).pop(); return f ? f.value : ''; };
  const findG = id => items.find(i => i.id===id && i.type==='構想');

  if (b.op==='update') {
    const item = items.find(i => i.id===b.id && i.type===b.type);
    if (!item) return { error: true };
    const changed = kiApplyFields(item, b.fields, false);
    if (!changed.length) return { summary: b.id+' 変更なし' };
    if (item.type==='構想') item.review = today();
    return { summary: b.id+' 更新（'+changed.join('・')+'）', ids: [item.id] };
  }

  if (b.op==='new') {
    const title = fv('title');
    if (!title || title==='（変更なし）' || title==='（空にする）') return { error: true };
    let parent = null;
    if (b.type==='実行') {
      parent = b.parent ? findG(b.parent) : null;
      if (!parent) return { error: true };
    }
    const dup = items.find(i => i.type===b.type && i.title===title);
    const item = {
      id: genId(b.type), type: b.type,
      parentId: parent ? parent.id : '-',
      title: '', purpose: '', success: '', trigger: '', prereq: '',
      priority: parent ? (parent.priority||'A') : 'A',
      status: '検討中',
      review: b.type==='構想' ? today() : '',
      createdAt: today(), log: [],
    };
    if (b.type==='構想') { item.goSign = ''; item.relations = []; }
    kiApplyFields(item, b.fields, true);
    if (parent) item.priority = parent.priority || 'A';
    if (b.type==='構想' && !(item.origin && item.origin.kind)) item.origin = { kind:'取り込み', date: today() };
    items.push(item);
    return { summary: item.id+' 新規'+(parent?'（親 '+parent.id+'）':'')+(dup?'（同名 '+dup.id+' あり）':''), ids: [item.id] };
  }

  if (b.op==='merge') {
    const from = findG(b.from), to = findG(b.to);
    if (!from || !to || from===to) return { error: true };
    const reason = fv('reason');
    const r = reason ? '（理由：'+reason+'）' : '';
    from.status = '完了';
    kiAddRelation(from, '統合先', to.id);
    kiPushLog(from, '統合', '→ '+to.id+' に統合'+r);
    kiPushLog(to, '統合', from.id+' を統合'+r);
    from.review = today(); to.review = today();
    return { summary: from.id+'→'+to.id+' 統合', ids: [from.id, to.id] };
  }

  if (b.op==='discard') {
    const item = items.find(i => i.id===b.id);
    const reason = fv('reason');
    if (!item || !reason) return { error: true };
    const learn = fv('learn');
    const already = item.status==='廃棄' && archives.some(a => a.id===item.id && a.reason===reason);
    item.status = '廃棄';
    if (item.type==='構想') item.review = today();
    if (already) return { summary: item.id+' 廃棄済み（アーカイブは追加せず）', ids: [item.id] };
    archives.push({ id:item.id, title:item.title, priority:item.priority||'A', type:item.type, reason, learn, date: today() });
    return { summary: item.id+' 廃棄', ids: [item.id] };
  }

  if (b.op==='pj') {
    const item = findG(b.id);
    if (!item || !b.pjName) return { error: true };
    item.status = 'PJ化';
    item.projectName = b.pjName;
    const pj = findPosProject(b.pjName);
    if (pj && pj.id) item.projectId = pj.id;
    kiPushLog(item, 'PJ化', '→ Project OS「'+b.pjName+'」');
    item.review = today();
    return { summary: item.id+' PJ化', ids: [item.id] };
  }

  return { error: true };
}

/* 旧 registerKosoImport は kosoImportText（KOSO-IMPORT の分岐）へ移した（2026-10-26 受信箱対応） */

function undoLastImport() {
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(LASTIMPORT_KEY) || 'null'); } catch(e) {}
  if (!snap || !Array.isArray(snap.items)) { renderAiImport(); return; }
  items = snap.items;
  archives = Array.isArray(snap.archives) ? snap.archives : [];
  save();
  try { localStorage.removeItem(LASTIMPORT_KEY); } catch(e) {}
  aiImportStatus = { text:'', cls:'' };
  renderCurrentView();
  showToast('戻しました');
}

function deleteItem(id) {

  if (!item) return;
  if (!confirm(`「${item.title}」を削除しますか？`)) return;

    parents.map(p=>`<option value="${esc(p.id)}"${p.id===selected?' selected':''}>${esc(p.id+': '+p.title)}</option>`).join('');
  sel.disabled = type==='構想';
}

function onTypeChange() {

function closeModalOutside(e) { if(e.target===document.getElementById('modal')) closeModal(); }

// Project OS（pos_v4）から同名PJを探す（読むだけ・書かない）
function findPosProject(name) {
  try {
    const pos = JSON.parse(localStorage.getItem('pos_v4') || 'null');
    const list = pos && Array.isArray(pos.projects) ? pos.projects : (Array.isArray(pos) ? pos : []);
    const n = String(name||'').trim();
    const hit = list.find(p => p && (String(p.title||'').trim()===n || String(p.name||'').trim()===n));
    return hit ? { id: hit.id!=null ? String(hit.id) : '', name: String(hit.title||hit.name||'') } : null;
  } catch(e) { return null; }
}

function saveItem() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { alert('タイトルを入力してください'); return; }
  const type = document.getElementById('f-type').value;
  const newStatus = document.getElementById('f-status').value;
  const isG = type === '構想';

  // Inherit priority for 実行 from parent
  let priority = 'A';
  if (isG) {
    priority = document.getElementById('f-priority').value || 'A';
  } else {
    const parentId = document.getElementById('f-parent').value;
    const parent = items.find(i=>i.id===parentId);
    priority = parent ? (parent.priority||'A') : 'A';
  }

  const data = {
    id: editingId || genId(type),
    type,
    parentId: isG ? '-' : (document.getElementById('f-parent').value||'-'),
    title,
    priority,
    purpose: document.getElementById('f-purpose').value.trim(),
    goSign:  isG ? document.getElementById('f-gosign').value.trim() : '',
    success: document.getElementById('f-success').value.trim(),
    trigger: isG ? document.getElementById('f-trigger').value.trim() : '',
    prereq:  isG ? document.getElementById('f-prereq').value.trim()  : '',
    status: newStatus,
    review:  isG ? document.getElementById('f-review').value.replace(/-/g,'/') : '',
  };

  if (!isG) delete data.goSign;
  const prevItem = editingId ? items.find(i=>i.id===editingId) : null;
  const wasDiscard = newStatus==='廃棄' && (!prevItem||prevItem.status!=='廃棄');
  const becamePj  = isG && newStatus==='PJ化' && (!prevItem||prevItem.status!=='PJ化');

  let saved;
  if (editingId) {
    // モーダルで編集しない項目（origin/createdAt/relations/log/projectId/projectName）を引き継ぐ
    const idx = items.findIndex(i=>i.id===editingId);
    if(idx>=0) { saved = {...prevItem, ...data}; items[idx] = saved; }
  } else {
    saved = {...data, createdAt: today(), log: []};
    if (isG) { saved.relations = []; saved.origin = {kind:'本人', date: today()}; }
    items.push(saved);
  }
  if (becamePj && saved) {
    if (!Array.isArray(saved.log)) saved.log = [];
    saved.log.push({date:today(), kind:'PJ化', text:'→ Project OS', src:'本人'});
    const pj = findPosProject(saved.title);
    if (pj) { saved.projectName = pj.name; saved.projectId = pj.id; }
  }
  save();
  closeModal();

  if (wasDiscard) {
    discardPendingId = data.id;
    discardPrevStatus = prevItem ? prevItem.status : '検討中';
    openDiscardModal(data);
  } else {
    showToast(editingId?'保存しました':'追加しました');
    renderCurrentView();
  }
}

// ─── TOAST ────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = '✓ ' + msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

// ─── KEYBOARD ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='Escape') { closeModal(); closeDiscardModal(); }
  if ((e.metaKey||e.ctrlKey) && e.key==='Enter') {
    if (document.getElementById('modal').classList.contains('open')) saveItem();
    if (document.getElementById('discard-modal').classList.contains('open')) confirmDiscard();
  }
});

/* ══ 受信箱 共通部品 v1 ══
   各OSはこのブロックをそのままコピーし、INBOX_OS と（ブロックの外に書く）inboxApply だけ差し替える。
   ・Drive を読むのは Task OS だけ。各OSは localStorage の import_inbox_v1 から自分宛て（targetOS）を取り、
     既存の貼り付けパーサで取り込む（書式は変えない）
   ・inboxApply(block, links, item) は OS ごとに実装し { ok:true, summary } / { ok:false, summary } を返す。
     ok:false は done にしない（保留に残り、次回また試す）
   ・起動時は「自分のデータの読み込みが終わった後」に inboxProcess('load') を呼ぶ（Task OS を経由しなかった日の保険）
   ・Task OS からの合図（postMessage 'myapps-inbox-process'）でも動き、結果を親へ 'myapps-inbox-result' で返す
   ・同じ id は二度と処理しない（import_inbox_done_v1）。未知の行・未知のフィールドは無視 */
const INBOX_OS = 'koso';                       // このOSの targetOS 名（各OSで差し替える）
const INBOX_KEY='import_inbox_v1', INBOX_DONE='import_inbox_done_v1', INBOX_LOG='import_inbox_log_v1';
const INBOX_DONE_MAX=2000, INBOX_LOG_DAYS=60;
function inboxYmd(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function inboxRead(){ try{ const o=JSON.parse(localStorage.getItem(INBOX_KEY)||'null'); return (o&&Array.isArray(o.items))?o:{items:[]}; }catch(e){ return {items:[]}; } }
function inboxDoneList(){ try{ const a=JSON.parse(localStorage.getItem(INBOX_DONE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function inboxDoneSet(){ return new Set(inboxDoneList().map(d=>d&&d.id)); }
function inboxLogList(){ try{ const a=JSON.parse(localStorage.getItem(INBOX_LOG)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
/* 取り込み済みにする：done に追記（新しい順・最大2000）／pending から除く／log に追記（直近60日） */
function inboxMarkDone(item, summary, links){
  const now=new Date();
  const done=inboxDoneList().filter(d=>d&&d.id!==item.id);
  done.unshift({ id:item.id, os:INBOX_OS, doneAt:now.toISOString(), summary:summary||'' });
  localStorage.setItem(INBOX_DONE, JSON.stringify(done.slice(0,INBOX_DONE_MAX)));
  const box=inboxRead();
  box.items=(box.items||[]).filter(it=>it&&it.id!==item.id);
  box.updatedAt=now.toISOString();
  localStorage.setItem(INBOX_KEY, JSON.stringify(box));
  const from=new Date(now); from.setDate(from.getDate()-INBOX_LOG_DAYS); const fromYmd=inboxYmd(from);
  const log=inboxLogList().filter(x=>x&&x.id!==item.id&&String(x.date||'')>=fromYmd);
  log.unshift({ date:inboxYmd(now), os:INBOX_OS, title:item.title||'', summary:summary||'', links:links||item.links||{}, id:item.id });
  localStorage.setItem(INBOX_LOG, JSON.stringify(log));
}
/* 「紐づけ：」行を読む。書式：紐づけ：S03 ③JSS承継税制／PJ：{id} {名前}／人：{id} {名前}, {id} {名前}／問い：{id}
   ID は英数字（数字を1つ以上含む）。ID が無ければ名前だけ。空のものは入れない。行が無ければ {} */
function inboxParseLinks(block){
  const out={};
  const line=String(block||'').split(/\r?\n/).map(s=>s.trim()).find(s=>/^紐づけ[：:]/.test(s));
  if(!line) return out;
  const isId=s=>/^[A-Za-z0-9_-]*\d[A-Za-z0-9_-]*$/.test(s);
  const idName=s=>{ const t=String(s||'').trim(); if(!t) return null; const m=t.match(/^(\S+)\s+(.+)$/);
    if(m&&isId(m[1])) return {id:m[1], name:m[2].trim()}; return isId(t)&&!/[^\x00-\x7F]/.test(t)&&/^[A-Za-z]/.test(t)&&t.length<=12?{id:t, name:''}:{id:'', name:t}; };
  line.replace(/^紐づけ[：:]\s*/,'').split('／').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    let m;
    if((m=part.match(/^PJ[：:]\s*(.*)$/i))){ const r=idName(m[1]); if(r){ if(r.id) out.projectId=r.id; if(r.name) out.projectName=r.name; } }
    else if((m=part.match(/^人[：:]\s*(.*)$/))){
      const ids=[], names=[];
      m[1].split(/[,、，]/).forEach(p=>{ const r=idName(p); if(!r) return; if(r.id) ids.push(r.id); if(r.name) names.push(r.name); });
      if(ids.length) out.personIds=ids; if(names.length) out.personNames=names;
    }
    else if((m=part.match(/^問い[：:]\s*(\S+)/))){ out.questionId=m[1]; }
    else if((m=part.match(/^(S\d+)\b/))){ out.strategyGoalId=m[1]; }
  });
  return out;
}
/* 自分宛ての未処理を取り込む。重なって呼ばれても順番に1回ずつ（同じ item を二重に取り込まない） */
let _inboxChain=Promise.resolve();
function inboxProcess(trigger){
  const run=async()=>{
    const box=inboxRead(); const done=inboxDoneSet();
    const mine=(box.items||[]).filter(it=>it&&it.id&&it.targetOS===INBOX_OS&&!done.has(it.id));
    const results=[];
    for(const it of mine){
      try{
        if(inboxDoneSet().has(it.id)) continue;
        const links=Object.assign({}, inboxParseLinks(it.block||''), it.links||{});   /* item.links 優先 */
        const r=await inboxApply(it.block||'', links, it);
        if(r&&r.ok){ inboxMarkDone(it, r.summary, links); results.push({id:it.id, ok:true, summary:r.summary||''}); }
        else results.push({id:it.id, ok:false, summary:(r&&r.summary)||'取り込めませんでした'});
      }catch(e){ results.push({id:it.id, ok:false, summary:'エラー: '+((e&&e.message)||e)}); }
    }
    if(window.parent!==window){ try{ window.parent.postMessage({type:'myapps-inbox-result', os:INBOX_OS, trigger, results}, location.origin); }catch(e){} }
    return results;
  };
  const p=_inboxChain.then(run, run);
  _inboxChain=p.catch(()=>{});
  return p;
}
window.addEventListener('message', ev=>{ if(ev.origin!==location.origin) return; if(ev.data&&ev.data.type==='myapps-inbox-process') inboxProcess('message'); });
/* ══ 受信箱 共通部品 v1 ここまで ══ */

/* ?inbox=1（Task OS の非表示 iframe）では確認・警告を出さない（confirm は「やめる」扱い） */
if (new URLSearchParams(location.search).get('inbox') === '1') { window.alert = m => console.warn('[inbox]', m); window.confirm = () => false; }
async function inboxApply(block, links, item) {
  load();   /* 別タブで編集された後でも最新から（保存は操作ごとに済んでいる） */
  const r = kosoImportText(block, { silent: true, links });
  if (!r.ok) return { ok:false, summary: r.message.split('\n')[0] || '取り込めませんでした' };
  try { renderCurrentView(); } catch(e) {}
  return { ok:true, summary: [r.summary, ...r.errors].join('／') };
}
/* 戦略目標の対応表（記録の地図 §D-1。Reflect OS・Project OS と同じ内容。地図が変わったら Claude Code が直す） */
const STRATEGY_GOALS = {
  S01:{no:'①', name:'関連当事者取引解消（借金返済）'},
  S02:{no:'②', name:'3AHD構想作成'},
  S03:{no:'③', name:'JSS承継税制'},
  S04:{no:'④', name:'IPO準備'},
  S05:{no:'⑤', name:'仲間づくり'},
};
/* 触った構想・試しに links を付ける（空の項目は落とす。projectId はレコードの projectId に補わない） */
function kosoAttachLinks(ids, links) {
  const l = links || {}, out = {};
  ['strategyGoalId','projectId','projectName','questionId'].forEach(k => { if (l[k]) out[k] = String(l[k]); });
  ['personIds','personNames'].forEach(k => { if (Array.isArray(l[k]) && l[k].length) out[k] = l[k].slice(); });
  if (!Object.keys(out).length) return;
  items.forEach(i => { if ((ids||[]).includes(i.id)) i.links = Object.assign({}, out); });
}
function kosoLinkLabels(l) {
  if (!l || typeof l !== 'object') return [];
  const a = [];
  if (l.strategyGoalId) { const g = STRATEGY_GOALS[l.strategyGoalId]; a.push(l.strategyGoalId + (g ? ' ' + g.no + g.name : '')); }
  (l.personNames || []).forEach(n => a.push('👤 ' + n));
  return a;
}
