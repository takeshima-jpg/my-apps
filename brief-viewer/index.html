<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Brief Viewer — my-apps</title>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/icon-16.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c6fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brief">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7; --bg2: #ffffff; --bg3: #ebebee; --bg4: #e0e0e5;
  --border: #d8d8e0; --border2: #c8c8d4;
  --text: #1a1a22; --text2: #5a5a6e; --text3: #9898a8;
  --accent: #7c6fff; --accent2: #5b51d8;
  --radius: 6px; --radius2: 10px;
  --font-body: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif; --font-mono: 'JetBrains Mono', monospace;
  --transition: 0.18s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 17px; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; -webkit-font-smoothing: antialiased; }

.wrap { display: flex; flex-direction: column; min-height: 100vh; }

/* HEADER */
.bv-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top)); border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 0; z-index: 10; }
.bv-logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.bv-logo .mark { font-size: 18px; }
.bv-logo .mark-img { width: 24px; height: 24px; border-radius: 6px; display: block; flex-shrink: 0; }
.bv-logo .name { font-size: 15px; font-weight: 700; color: var(--text); white-space: nowrap; }
.bv-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text3); }
.bv-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text3); flex-shrink: 0; }
.bv-dot.connected { background: #3ecf8e; }
.bv-dot.loading { background: var(--accent); animation: pulse 1s infinite; }
.bv-dot.error { background: #ff5c5c; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.bv-refresh { background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 12px; font-size: 13px; color: var(--text2); cursor: pointer; font-family: var(--font-body); transition: all var(--transition); white-space: nowrap; }
.bv-refresh:hover { border-color: var(--accent); color: var(--accent); }
.bv-refresh:disabled { opacity: .4; cursor: default; }

/* BODY */
.bv-main { flex: 1; overflow-y: auto; }
.bv-tabs { display: flex; gap: 4px; padding: 8px 18px 0; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 9; }
.bv-tab { flex: 1; max-width: 140px; background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 6px 10px; font-size: 13px; font-weight: 600; color: var(--text3); cursor: pointer; font-family: var(--font-body); transition: all var(--transition); }
.bv-tab:hover { color: var(--text2); }
.bv-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* LOGIN STATE */
.bv-login { max-width: 480px; margin: 0 auto; padding: 64px 24px; text-align: center; }
.bv-login .big-mark { font-size: 44px; margin-bottom: 16px; }
.bv-login .big-mark-img { width: 80px; height: 80px; border-radius: 20px; margin: 0 auto 18px; display: block; }
.bv-login h1 { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--text); }
.bv-login p { font-size: 14px; color: var(--text2); line-height: 1.7; margin-bottom: 28px; }
.bv-login-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 320px; padding: 13px 20px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff; border: none; border-radius: var(--radius2); cursor: pointer; font-family: var(--font-body); transition: all var(--transition); }
.bv-login-btn:hover { background: var(--accent2); }
.bv-login .note { font-size: 12px; color: var(--text3); margin-top: 20px; line-height: 1.6; }

/* BRIEF BODY */
.bv-meta { max-width: 760px; margin: 0 auto; padding: 18px 24px 0; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text3); }
.bv-meta .date-pill { font-family: var(--font-mono); background: var(--bg3); border-radius: 20px; padding: 3px 12px; color: var(--text2); }
.brief-body { max-width: 760px; margin: 0 auto; padding: 14px 24px 60px; line-height: 1.8; width: 100%; }
.brief-body h1 { font-size: 1.4rem; font-weight: 700; margin: 24px 0 12px; color: var(--text); border-bottom: 2px solid var(--border); padding-bottom: 6px; }
.brief-body h2 { font-size: 1.15rem; font-weight: 700; margin: 32px 0 10px; color: var(--text); display: flex; align-items: center; gap: 8px; }
.brief-body h2::before { content: ''; width: 4px; height: 1em; background: var(--accent); border-radius: 2px; flex-shrink: 0; }
.brief-body h3 { font-size: 1rem; font-weight: 700; margin: 16px 0 6px; color: var(--text2); }
.brief-body p { margin: 0 0 15px; color: var(--text); line-height: 1.9; }
.brief-body ul, .brief-body ol { margin: 8px 0 18px 20px; color: var(--text); }
.brief-body li { margin: 0 0 11px; line-height: 1.85; }
.brief-body a, .bv-link { color: #2563eb; text-decoration: none; font-weight: 600; word-break: break-word; }
.brief-body a:active, .bv-link:active { opacity: .55; }
.bv-fav { width: 15px; height: 15px; vertical-align: -3px; margin-right: 5px; border-radius: 3px; }
.brief-body strong { font-weight: 700; color: var(--text); }
.brief-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
.brief-body code { background: var(--bg3); border-radius: 4px; padding: 2px 6px; font-family: var(--font-mono); font-size: 0.9em; }

/* MESSAGE STATE */
.bv-msg { max-width: 480px; margin: 0 auto; padding: 56px 24px; text-align: center; color: var(--text2); }
.bv-msg .icon { font-size: 36px; margin-bottom: 14px; }
.bv-msg h2 { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.bv-msg p { font-size: 13px; line-height: 1.7; margin-bottom: 18px; }
.bv-msg button { padding: 9px 18px; font-size: 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-family: var(--font-body); }
.bv-msg button.ghost { background: none; border: 1px solid var(--border); color: var(--text2); }

@media (max-width: 600px) {
  html { font-size: 16px; }
  .bv-logo .name { font-size: 14px; }
  .brief-body { padding: 14px 18px 56px; }
  .bv-meta { padding: 16px 18px 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="bv-header">
    <div class="bv-logo">
      <img class="mark-img" src="./icons/icon-32.png" alt="">
      <span class="name">Brief Viewer</span>
    </div>
    <div class="bv-status">
      <span class="bv-dot" id="dot"></span>
      <span id="statusText">未接続</span>
    </div>
    <button class="bv-refresh" id="refreshBtn" onclick="loadBrief()" style="display:none">↻ 更新</button>
  </header>
  <nav class="bv-tabs" id="tabs" style="display:none">
    <button class="bv-tab active" data-tab="daily" onclick="switchTab('daily')">毎朝</button>
    <button class="bv-tab" data-tab="weekly" onclick="switchTab('weekly')">週次</button>
    <button class="bv-tab" data-tab="monthly" onclick="switchTab('monthly')">月次</button>
  </nav>
  <main class="bv-main" id="main"></main>
</div>

<script>
// ===== 設定 =====
const CLIENT_ID = '450582924828-c89h2mia7e396dbilpthguhtb77p6fmr.apps.googleusercontent.com';
const SCOPE = 'https://www.googleapis.com/auth/drive.readonly';
const REDIRECT_URI = location.origin + (location.pathname.endsWith('/index.html') ? location.pathname : location.pathname.replace(/\/$/, '') + '/index.html');
const FOLDER_NAME = 'aix-drafts';
const FOLDER_ID = '1dEA4ZZJi5E97Dk_MRNwG6EbBlINlMO3U';
// 毎朝／週次／月次の3レビューをタブで切り替え（各GDriveファイル）
const TABS = {
  daily:   { file: 'aix_draft_latest.json',  label: '毎朝', title: '📋 Morning Brief' },
  weekly:  { file: 'aix_review_weekly.json',  label: '週次', title: '📋 Strategic Review（週次）' },
  monthly: { file: 'aix_review_monthly.json', label: '月次', title: '📋 Executive Review（月次）' },
};
let currentTab = 'daily';
const TOKEN_KEY = 'brief_viewer_token';

let token = null;

// ===== OAuth =====
function connect() {
  const params = new URLSearchParams({
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT_URI,
    response_type: 'token',
    scope: SCOPE,
    prompt: 'select_account',
    include_granted_scopes: 'true',
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

function handleRedirect() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const t = hash.get('access_token');
  if (t) {
    token = t;
    localStorage.setItem(TOKEN_KEY, t);
    history.replaceState(null, '', location.pathname);
  } else {
    const saved = localStorage.getItem(TOKEN_KEY);
    if (saved) token = saved;
  }
}

function clearToken() {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
}

// ===== UI状態 =====
function setStatus(state, text) {
  const dot = document.getElementById('dot');
  dot.className = 'bv-dot' + (state ? ' ' + state : '');
  document.getElementById('statusText').textContent = text;
}

function showLogin() {
  document.getElementById('refreshBtn').style.display = 'none';
  setStatus('', '未接続');
  document.getElementById('main').innerHTML = `
    <div class="bv-login">
      <img class="big-mark-img" src="./icons/icon-192.png" alt="">
      <h1>Morning Brief を表示</h1>
      <p>Coworkが毎朝GDriveに書き出す Morning Brief を、このデバイスで読み取り専用で表示します。Googleアカウントでログインしてください。</p>
      <button class="bv-login-btn" onclick="connect()">Googleでログイン</button>
      <div class="note">drive.readonly（読み取り専用）でアクセスします。初回は「確認されていないアプリ」の警告が出ますが、ご自身のアプリなので「詳細」→「移動」で進めてください。</div>
    </div>`;
}

function showMessage(icon, title, text, actions) {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="bv-msg"><div class="icon">${icon}</div><h2>${title}</h2><p>${text}</p><div id="msgActions"></div></div>`;
  const box = document.getElementById('msgActions');
  (actions || []).forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.label;
    if (a.ghost) b.className = 'ghost';
    b.onclick = a.onclick;
    b.style.margin = '0 4px';
    box.appendChild(b);
  });
}

// ===== Drive取得 =====
async function driveFetch(url) {
  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + token } });
  if (res.status === 401) { const e = new Error('unauthorized'); e.code = 401; throw e; }
  if (res.status === 403) { const e = new Error('forbidden'); e.code = 403; throw e; }
  if (!res.ok) { const e = new Error('http ' + res.status); e.code = res.status; throw e; }
  return res;
}

async function getAccountEmail() {
  try {
    const r = await driveFetch('https://www.googleapis.com/drive/v3/about?fields=user(emailAddress,displayName)');
    const d = await r.json();
    return d.user ? d.user.emailAddress : null;
  } catch (e) { return null; }
}

async function loadBrief() {
  if (!token) { showLogin(); return; }
  const FILE_NAME = TABS[currentTab].file;
  document.getElementById('tabs').style.display = 'flex';
  const btn = document.getElementById('refreshBtn');
  btn.style.display = 'inline-block';
  btn.disabled = true;
  setStatus('loading', '読み込み中…');
  const COMMON = '&includeItemsFromAllDrives=true&supportsAllDrives=true';
  try {
    // 完全一致で探す：① マイドライブ／所有 → ② 共有アイテム(sharedWithMe)
    let file = null;
    for (const cond of [`%22${FOLDER_ID}%22+in+parents+and+name%3D%22${FILE_NAME}%22+and+trashed%3Dfalse`,
                        `name%3D%22${FILE_NAME}%22+and+trashed%3Dfalse`,
                        `name%3D%22${FILE_NAME}%22+and+sharedWithMe%3Dtrue+and+trashed%3Dfalse`]) {
      try {
        const lr = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${cond}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime+desc&pageSize=10${COMMON}`);
        const ld = await lr.json();
        if (ld.files && ld.files.length) { file = ld.files[0]; break; }
      } catch (e) { if (e.code === 401 || e.code === 403) throw e; }
    }

    if (file) {
      const cr = await driveFetch(`https://www.googleapis.com/drive/v3/files/${file.id}?alt=media${COMMON}`);
      const raw = await cr.text();
      let data;
      try { data = JSON.parse(raw); } catch (e) { data = raw; }
      render(toMarkdown(data), file.modifiedTime);
      setStatus('connected', '接続済み');
      return;
    }

    // 見つからない
    setStatus('connected', '接続済み');
    // 週次・月次は未生成のことが多いので穏やかな空状態を出す
    if (currentTab !== 'daily') {
      showMessage('🗓️', `${TABS[currentTab].label}レビューはまだありません`,
        `<code>${FILE_NAME}</code> がまだ生成されていません。<br>Coworkで${TABS[currentTab].label}レビューを実行すると、ここに表示されます。`,
        [{ label: '再読み込み', onclick: loadBrief }]);
      return;
    }
    // 毎朝のみ詳細な診断情報を出す（所有＋共有の両方をリスト）
    setStatus('error', 'ファイルなし');
    const email = await getAccountEmail();
    async function listAix(cond) {
      try {
        const dr = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${cond}&fields=files(name)&pageSize=20${COMMON}`);
        const dd = await dr.json();
        return (dd.files || []).map(f => f.name);
      } catch (e) { return []; }
    }
    const owned = await listAix('name+contains+%22aix%22+and+trashed%3Dfalse');
    const shared = await listAix('name+contains+%22aix%22+and+sharedWithMe%3Dtrue+and+trashed%3Dfalse');
    const fmt = arr => arr.length ? arr.map(n => `・<code>${n}</code>`).join('<br>') : '（なし）';
    showMessage('🔍', 'Briefが見つかりません',
      `ログイン中のアカウント：<code>${email || '不明'}</code><br><br>` +
      `<code>${FILE_NAME}</code> が見つかりませんでした。<br><br>` +
      `<b>所有/マイドライブの「aix」ファイル：</b><br>${fmt(owned)}<br><br>` +
      `<b>共有された「aix」ファイル：</b><br>${fmt(shared)}`,
      [
        { label: '再読み込み', onclick: loadBrief },
        { label: '別アカウントで再ログイン', ghost: true, onclick: () => { clearToken(); connect(); } },
      ]);
  } catch (e) {
    if (e.code === 401) {
      clearToken();
      setStatus('error', '再ログインが必要');
      showMessage('🔑', 'セッションが切れました', 'Googleのアクセストークンが期限切れです。もう一度ログインしてください。', [{ label: 'Googleでログイン', onclick: connect }]);
      return;
    }
    if (e.code === 403) {
      setStatus('error', '権限エラー');
      showMessage('⚠️', 'アクセス権限がありません', 'マイドライブの読み取り権限（drive.readonly）が付与されていない可能性があります。一度ログアウトして、権限を許可して再ログインしてください。', [
        { label: '再ログイン', onclick: () => { clearToken(); connect(); } },
        { label: 'もう一度試す', ghost: true, onclick: loadBrief },
      ]);
      return;
    }
    setStatus('error', 'エラー');
    showMessage('⚠️', '読み込みに失敗しました', '通信エラーが発生しました。電波状況を確認して再読み込みしてください。', [{ label: '再読み込み', onclick: loadBrief }]);
    console.warn('brief load error:', e);
  } finally {
    btn.disabled = false;
  }
}

// ===== 構造化JSON → Markdown（1day OS getAixDraft と同一ロジック） =====
function toMarkdown(d) {
  if (typeof d === 'string') return d;
  if (typeof d !== 'object' || d === null) return String(d);
  let md = '';
  if (d.top_theme) md += `## 今日の最重要テーマ\n${d.top_theme}\n\n`;
  if (d.center_pin) md += `## 今週のセンターピン\n${d.center_pin}\n\n`;
  if (d.changes?.length) md += `## 昨日からの重要変化\n${d.changes.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.decisions?.length) md += `## 今日判断すべきこと\n${d.decisions.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.week_question?.length) md += `## 今週の問い\n${d.week_question.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.engagement?.length) md += `## 今日関わるべき人\n${d.engagement.map(p => `・${p.name}${p.type ? `（${p.type}）` : ''}：${p.reason || ''}`).join('\n')}\n\n`;
  else if (d['育成']?.length) md += `## 今日関わるべき人\n${d['育成'].map(p => `・${p.name}：${p.reason}`).join('\n')}\n\n`;
  if (d['会う価値']?.length) md += `## 今日接触する価値のある人\n${d['会う価値'].map(p => `・${p.name}：${p.purpose}`).join('\n')}\n\n`;
  if (d.risks?.length) md += `## 放置リスク\n${d.risks.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.winning_moves?.length) md += `## 今週の勝ち筋\n${d.winning_moves.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.proposals?.length) md += `## AI参謀からの提言\n${d.proposals.map(p => `・${p.content}${p.partner_relation ? ' — ' + p.partner_relation : ''}`).join('\n')}\n\n`;
  if (d.os_gaps?.length) md += `## OS齟齬レポート\n${d.os_gaps.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.previous_proposal_tracking?.length) md += `## 前回提言の進捗\n${d.previous_proposal_tracking.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.external_env?.length) md += `## 外部環境モニタリング\n${d.external_env.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.structural_alerts?.length) {
    md += `## 構造アラート\n` + d.structural_alerts.map(a => {
      const parts = [];
      const lv = a.level ? `[${a.level}] ` : '';
      const dt = a.date ? `（${a.date}）` : '';
      parts.push(`${lv}${a.title || ''}${dt}`.trim());
      if (Array.isArray(a.summary) && a.summary.length) parts.push(a.summary.join(' / '));
      else if (a.summary) parts.push(a.summary);
      if (a.impact) parts.push(`影響：${a.impact}`);
      if (a.action) parts.push(`アクション：${a.action}`);
      if (a.url) parts.push('[🔗 ' + (a.source || '出典記事') + '](' + a.url + ')');
      return `・${parts.filter(Boolean).join('｜')}`;
    }).join('\n') + `\n\n`;
  }
  if (d.vision_brief) md += `## 今日のVISION\n${d.vision_brief}\n\n`;
  if (d.vision_proposals?.length) md += `## VISIONへの提言\n${d.vision_proposals.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.explore_themes?.length) md += `## 探索テーマ\n${d.explore_themes.map(c => `・${c}`).join('\n')}\n\n`;
  if (d.reflect && (d.reflect.open_questions?.length || d.reflect.active_experiments?.length || d.reflect.proposals?.length)) {
    const rf = d.reflect;
    md += `## 内省（Reflect）\n`;
    if (rf.open_questions?.length) md += `今向き合う問い：\n` + rf.open_questions.map(c => `・${c}`).join('\n') + '\n';
    if (rf.active_experiments?.length) md += `実験中：\n` + rf.active_experiments.map(c => `・${c}`).join('\n') + '\n';
    if (rf.proposals?.length) md += rf.proposals.map(p => {
      const t = (typeof p === 'string') ? p : `${p.based_on ? p.based_on + ' → ' : ''}${p.suggestion || ''}${p.why ? '（' + p.why + '）' : ''}`;
      return `・提案：${t}`;
    }).join('\n') + '\n';
    md += `\n`;
  }
  if (d.life_list && (d.life_list.focus_today?.length || d.life_list.one_joy || d.life_list.proposals?.length)) {
    const ll = d.life_list;
    md += `## やりたいこと（100LIST）\n`;
    if (ll.focus_today?.length) md += ll.focus_today.map(c => `・${c}`).join('\n') + '\n';
    if (ll.one_joy) md += `・今日の彩り：${ll.one_joy}\n`;
    if (ll.proposals?.length) md += ll.proposals.map(p => {
      const t = (typeof p === 'string') ? p : `${p.want || ''}${p.reason ? '（' + p.reason + '）' : ''}`;
      return `・新しい願望の提案：${t}`;
    }).join('\n') + '\n';
    md += `\n`;
  }
  if (d.partner_progress && d.partner_progress.current != null) {
    const pp = d.partner_progress;
    md += `## 経営パートナー進捗（${pp.current ?? 0}/${pp.target ?? 10}）\n`;
    const lines = [].concat(pp.alerts || [], pp.recent_changes || []);
    if (lines.length) md += lines.map(c => `・${c}`).join('\n') + '\n';
    md += `\n`;
  }
  if (d.delete_candidate && d.delete_candidate.target) {
    const dc = d.delete_candidate;
    md += `## 削除候補\n・${dc.target}${dc.type ? `（${dc.type}）` : ''}${dc.reason ? '：' + dc.reason : ''}${dc.effect ? '／効果：' + dc.effect : ''}\n\n`;
  }
  // ===== 週次／月次レビュー専用セクション =====
  const _sec = (t, arr) => { if (Array.isArray(arr) && arr.length) md += `## ${t}\n${arr.map(x => `・${x}`).join('\n')}\n\n`; };
  const _grp = (t, groups) => {
    const body = groups.filter(g => Array.isArray(g[1]) && g[1].length)
      .map(g => `${g[0]}：\n${g[1].map(x => `・${x}`).join('\n')}`).join('\n');
    if (body) md += `## ${t}\n${body}\n\n`;
  };
  // 週次
  if (d.project_review) _grp('Projectレビュー', [['前進', d.project_review.advancing], ['停滞', d.project_review.stalled], ['完了', d.project_review.completed], ['削除候補', d.project_review.delete_candidates]]);
  if (d.engagement_review) _grp('関わり方レビュー', [['育った人（若手）', d.engagement_review.develop], ['共同成長（同世代）', d.engagement_review.co_growth], ['相互学習（年上・専門家）', d.engagement_review.mutual_learning], ['次に経験を渡す人', d.engagement_review.next_experience]]);
  if (d.question_review) _grp('問いレビュー', [['今育てる問い', d.question_review.nurturing], ['答えが出た問い', d.question_review.answered], ['捨てる問い', d.question_review.discard]]);
  if (d.ai_understanding) _grp('AI理解度レビュー', [['AIが重要と認識', d.ai_understanding.recognized], ['実際とのズレ', d.ai_understanding.gaps]]);
  if (d.life_list_review) _grp('100リストレビュー', [['進んだもの', d.life_list_review.advanced], ['止まっているもの', d.life_list_review.stalled], ['最近追加', d.life_list_review.recent], ['AI提案', d.life_list_review.proposals]]);
  if (d.delete_review) _grp('削除候補レビュー', [['Project', d.delete_review.projects], ['人間関係', d.delete_review.people], ['問い', d.delete_review.questions], ['テーマ', d.delete_review.themes], ['構想', d.delete_review.ideas], ['役割', d.delete_review.roles]]);
  // 月次
  if (d.theme_review) _grp('重点テーマレビュー', [['今探求していること', d.theme_review.current], ['増えたテーマ', d.theme_review.added], ['減ったテーマ', d.theme_review.removed]]);
  if (d.thought_shift) _grp('思想変化レビュー', [['新しく信じ始めたこと', d.thought_shift.new_beliefs], ['捨てた考え', d.thought_shift.dropped], ['深まった考え', d.thought_shift.deepened]]);
  if (d.relationship_review) {
    const r = d.relationship_review;
    const g = [['本当に関係を深めたい人', r.deepen], ['優先順位の変化', r.priority_shift]];
    _grp('大切にしたい人レビュー', g);
    if (r.time_spent) md += `最近時間を使えているか：${r.time_spent}\n\n`;
  }
  if (d.partner_candidate_review) _grp('経営パートナー候補レビュー', [['新規追加', d.partner_candidate_review.added], ['昇格', d.partner_candidate_review.promoted], ['停滞', d.partner_candidate_review.stalled], ['除外', d.partner_candidate_review.removed]]);
  if (d.ai_self_check) {
    const a = d.ai_self_check, h = a.hypotheses || {};
    md += `## AI自己点検\n`;
    if (h.aiming) md += `・何を目指しているか：${h.aiming}\n`;
    if (h.struggling) md += `・何に悩んでいるか：${h.struggling}\n`;
    if (h.developing) md += `・誰を育てようとしているか：${h.developing}\n`;
    if (h.discarding) md += `・何を捨てようとしているか：${h.discarding}\n`;
    if (a.takeshima_eval) md += `・竹嶋評価：${a.takeshima_eval}\n`;
    md += `\n`;
  }
  return md.trim() || JSON.stringify(d, null, 2);
}

// ===== Markdown → HTML（1day OS markdownToHtml と同一） =====
function markdownToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  for (let line of lines) {
    line = line
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
    // markdownリンク [label](url) → ファビコン付き青リンク
    line = line.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_m, label, url) {
      let host = ''; try { host = new URL(url.replace(/&amp;/g, '&')).hostname; } catch(e) {}
      const fav = host ? '<img class="bv-fav" src="https://www.google.com/s2/favicons?domain=' + host + '&sz=64" alt="" loading="lazy">' : '';
      return '<a href="' + url + '" target="_blank" rel="noopener" class="bv-link">' + fav + label + '</a>';
    });
    // 生URLも青リンク化（属性内のURLは除外）
    line = line.replace(/(^|[^"'>])(https?:\/\/[^\s｜、。<>"]+)/g, '$1<a href="$2" target="_blank" rel="noopener" class="bv-link">$2</a>');
    if (/^### (.+)/.test(line)) { if (inList) { html += '</ul>'; inList = false; } html += '<h3>' + line.replace(/^### /, '') + '</h3>'; }
    else if (/^## (.+)/.test(line)) { if (inList) { html += '</ul>'; inList = false; } html += '<h2>' + line.replace(/^## /, '') + '</h2>'; }
    else if (/^# (.+)/.test(line)) { if (inList) { html += '</ul>'; inList = false; } html += '<h1>' + line.replace(/^# /, '') + '</h1>'; }
    else if (/^---+$/.test(line)) { if (inList) { html += '</ul>'; inList = false; } html += '<hr>'; }
    else if (/^[-・*] (.+)/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + line.replace(/^[-・*] /, '') + '</li>'; }
    else if (/^\d+\. (.+)/.test(line)) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + line.replace(/^\d+\. /, '') + '</li>'; }
    else if (line.trim() === '') { if (inList) { html += '</ul>'; inList = false; } html += '<br>'; }
    else { if (inList) { html += '</ul>'; inList = false; } html += '<p>' + line + '</p>'; }
  }
  if (inList) html += '</ul>';
  return html;
}

function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  } catch (e) { return iso; }
}

function render(md, modifiedTime) {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="bv-meta">
      <span>${TABS[currentTab].title}</span>
      <span class="date-pill">最終更新 ${fmtDate(modifiedTime)}</span>
    </div>
    <div class="brief-body">${markdownToHtml(md)}</div>`;
}

function switchTab(tab) {
  if (!TABS[tab]) return;
  currentTab = tab;
  document.querySelectorAll('.bv-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  loadBrief();
}

handleRedirect();
if (token) {
  loadBrief();
} else {
  showLogin();
}

// PWA: Service Worker登録（インストール可能化・常に最新）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js').catch(() => {});
}
