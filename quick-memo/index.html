<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Quick Memo — ショット前メモ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0F0F11;
  --surface:#1A1A1F;
  --surface2:#222228;
  --border:rgba(255,255,255,.08);
  --border2:rgba(255,255,255,.14);
  --text:#F0EFE8;
  --text2:#8A8A96;
  --text3:#4A4A56;
  --accent:#E8C547;
  --accent2:#C9A82C;
  --red:#E05555;
  --green:#4EA86B;
  --radius:10px;
  --font:'Meiryo', 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif, 'Meiryo', 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --font-mono:'JetBrains Mono','Courier New',monospace;
}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  max-width:480px;
  margin:0 auto;
}

/* ── HEADER ── */
.header{
  display:flex;
  align-items:center;
  padding:14px 16px 12px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:var(--bg);
  z-index:100;
  gap:10px;
}
.header-logo{
  font-family:var(--font-mono);
  font-size:13px;
  font-weight:700;
  color:var(--accent);
  letter-spacing:.1em;
}
.header-title{
  font-size:15px;
  font-weight:600;
  color:var(--text2);
}
.header-count{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:13px;
  color:var(--text3);
}

/* ── INPUT AREA ── */
.input-area{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  background:var(--surface);
}
.input-row{
  display:flex;
  gap:8px;
  align-items:flex-end;
}
.memo-input{
  flex:1;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:10px 12px;
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  resize:none;
  min-height:44px;
  max-height:120px;
  outline:none;
  transition:border-color .15s;
  line-height:1.5;
}
.memo-input::placeholder{color:var(--text3);}
.memo-input:focus{border-color:var(--accent);}
.add-btn{
  width:44px;
  height:44px;
  background:var(--accent);
  border:none;
  border-radius:var(--radius);
  color:#0F0F11;
  font-size:24px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  font-weight:700;
  transition:background .15s;
}
.add-btn:active{background:var(--accent2);}

/* タグ選択 */
.tag-row{
  display:flex;
  gap:6px;
  margin-top:10px;
  flex-wrap:wrap;
}
.tag-chip{
  padding:4px 10px;
  border-radius:999px;
  font-size:13px;
  border:1px solid var(--border2);
  background:none;
  color:var(--text2);
  cursor:pointer;
  transition:all .12s;
  font-family:var(--font);
}
.tag-chip.selected{
  background:var(--accent);
  border-color:var(--accent);
  color:#0F0F11;
  font-weight:600;
}

/* ── FILTER BAR ── */
.filter-bar{
  display:flex;
  gap:6px;
  padding:10px 16px;
  overflow-x:auto;
  border-bottom:1px solid var(--border);
  scrollbar-width:none;
}
.filter-bar::-webkit-scrollbar{display:none;}
.filter-btn{
  padding:5px 12px;
  border-radius:999px;
  font-size:13px;
  border:1px solid var(--border2);
  background:none;
  color:var(--text2);
  cursor:pointer;
  white-space:nowrap;
  font-family:var(--font);
  transition:all .12s;
}
.filter-btn.active{
  background:var(--surface2);
  color:var(--text);
  border-color:var(--border2);
}

/* ── MEMO LIST ── */
.memo-list{
  flex:1;
  padding:12px 16px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--text3);
  font-size:15px;
  line-height:2;
}
.empty .empty-icon{
  font-size:32px;
  margin-bottom:8px;
  opacity:.4;
}

/* ── MEMO CARD ── */
.memo-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:8px;
  transition:border-color .12s;
  animation:fadeIn .2s ease;
}
.memo-card.done{opacity:.45;}
.memo-card.done .memo-text{text-decoration:line-through;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

.memo-top{
  display:flex;
  align-items:flex-start;
  gap:10px;
}
.memo-check{
  width:20px;
  height:20px;
  border-radius:50%;
  border:2px solid var(--border2);
  background:none;
  cursor:pointer;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all .12s;
  margin-top:2px;
}
.memo-check.checked{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
  font-size:13px;
}
.memo-text{
  flex:1;
  font-size:16px;
  line-height:1.6;
  color:var(--text);
  word-break:break-all;
}
.memo-del{
  background:none;
  border:none;
  color:var(--text3);
  cursor:pointer;
  font-size:18px;
  padding:2px 4px;
  flex-shrink:0;
  transition:color .12s;
}
.memo-del:active{color:var(--red);}

.memo-meta{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.memo-tag{
  padding:2px 8px;
  border-radius:999px;
  font-size:10px;
  font-family:var(--font-mono);
  background:rgba(232,197,71,.12);
  color:var(--accent);
  border:1px solid rgba(232,197,71,.2);
}
.memo-time{
  font-size:10px;
  color:var(--text3);
  font-family:var(--font-mono);
  margin-left:auto;
}

/* ── BOTTOM ACTIONS ── */
.bottom-bar{
  padding:12px 16px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
  background:var(--bg);
  position:sticky;
  bottom:0;
}
.bottom-btn{
  flex:1;
  padding:10px;
  border-radius:var(--radius);
  font-size:14px;
  font-family:var(--font);
  cursor:pointer;
  border:1px solid var(--border2);
  background:var(--surface);
  color:var(--text2);
  transition:all .12s;
}
.bottom-btn:active{background:var(--surface2);}
.bottom-btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:#0F0F11;
  font-weight:600;
}
.bottom-btn.primary:active{background:var(--accent2);}

/* ── EXPORT MODAL ── */
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:200;
  align-items:flex-end;
}
.overlay.open{display:flex;}
.sheet{
  background:var(--surface);
  border-radius:16px 16px 0 0;
  width:100%;
  padding:20px 20px 36px;
  display:flex;
  flex-direction:column;
  gap:12px;
  max-height:80vh;
  overflow-y:auto;
}
.sheet-title{
  font-size:15px;
  font-weight:700;
  color:var(--text2);
  letter-spacing:.05em;
  font-family:var(--font-mono);
  margin-bottom:4px;
}
.export-text{
  background:var(--bg);
  border:1px solid var(--border2);
  border-radius:8px;
  padding:12px;
  font-size:14px;
  font-family:var(--font-mono);
  color:var(--text2);
  white-space:pre-wrap;
  line-height:1.7;
  max-height:300px;
  overflow-y:auto;
  word-break:break-all;
}
.sheet-note{
  font-size:13px;
  color:var(--text3);
  line-height:1.7;
}
.sheet-btns{display:flex;gap:8px;}
.sheet-btn{
  flex:1;
  padding:12px;
  border-radius:var(--radius);
  font-size:15px;
  font-family:var(--font);
  cursor:pointer;
  border:1px solid var(--border2);
  background:var(--surface2);
  color:var(--text);
  transition:all .12s;
}
.sheet-btn.accent{
  background:var(--accent);
  border-color:var(--accent);
  color:#0F0F11;
  font-weight:700;
}

/* Toast */
.toast{
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--surface2);
  border:1px solid var(--border2);
  color:var(--text);
  padding:8px 18px;
  border-radius:999px;
  font-size:14px;
  opacity:0;
  transition:all .25s;
  pointer-events:none;
  z-index:999;
  white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">QUICK MEMO</div>
  <div class="header-title">ショット前メモ</div>
  <div class="header-count" id="countDisplay">0件</div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea class="memo-input" id="memoInput" placeholder="思いついたことをメモ…" rows="1"></textarea>
    <button class="add-btn" onclick="addMemo()">＋</button>
  </div>
  <div class="tag-row" id="tagRow"></div>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="memo-list" id="memoList"></div>

<div class="bottom-bar">
  <button class="bottom-btn" onclick="clearDone()">完了済みを削除</button>
  <button class="bottom-btn primary" onclick="openExport()">⬆ ショットOSへ</button>
</div>

<div class="overlay" id="exportOverlay" onclick="closeExport(event)">
  <div class="sheet">
    <div class="sheet-title">⬆ ショットタスクOSへ転記</div>
    <div class="export-text" id="exportText"></div>
    <div class="sheet-note">
      上記のテキストをコピーして、ショットタスクOSでタスクを登録してください。<br>
      コピー後、完了済みにチェックを入れて削除できます。
    </div>
    <div class="sheet-btns">
      <button class="sheet-btn" onclick="closeExport()">閉じる</button>
      <button class="sheet-btn accent" onclick="copyExport()">📋 コピー</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'quick-memo-v1';
const TAGS = ['仕事','個人','アイデア','急ぎ','後で'];

let memos = [];
let selectedTag = '';
let filterTag = 'all';

// ── STORAGE ──
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    memos = raw ? JSON.parse(raw) : [];
  }catch(e){ memos = []; }
}

// ── INIT ──
function init(){
  load();
  renderTagRow();
  renderFilterBar();
  render();

  // テキストエリア自動リサイズ
  const ta = document.getElementById('memoInput');
  ta.addEventListener('input', ()=>{
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
  // Enterで送信（Shift+Enterで改行）
  ta.addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); addMemo(); }
  });
}

// ── TAG ROW ──
function renderTagRow(){
  const row = document.getElementById('tagRow');
  row.innerHTML = TAGS.map(t => `
    <button class="tag-chip${selectedTag===t?' selected':''}" onclick="selectTag('${t}')">${t}</button>
  `).join('');
}
function selectTag(t){
  selectedTag = selectedTag === t ? '' : t;
  renderTagRow();
}

// ── FILTER BAR ──
function renderFilterBar(){
  const bar = document.getElementById('filterBar');
  const filters = [['all','すべて'], ...TAGS.map(t=>[t,t]), ['done','完了済み']];
  bar.innerHTML = filters.map(([val,label])=>`
    <button class="filter-btn${filterTag===val?' active':''}" onclick="setFilter('${val}')">${label}</button>
  `).join('');
}
function setFilter(f){
  filterTag = f;
  renderFilterBar();
  render();
}

// ── ADD ──
function addMemo(){
  const input = document.getElementById('memoInput');
  const text = input.value.trim();
  if(!text) return;

  memos.unshift({
    id: Date.now(),
    text,
    tag: selectedTag,
    done: false,
    createdAt: new Date().toISOString()
  });
  save();
  input.value = '';
  input.style.height = 'auto';
  selectedTag = '';
  renderTagRow();
  render();
  toast('メモを追加しました');
}

// ── TOGGLE DONE ──
function toggleDone(id){
  const m = memos.find(m=>m.id===id);
  if(m){ m.done = !m.done; save(); render(); }
}

// ── DELETE ──
function deleteMemo(id){
  memos = memos.filter(m=>m.id!==id);
  save();
  render();
}

// ── CLEAR DONE ──
function clearDone(){
  const count = memos.filter(m=>m.done).length;
  if(count === 0){ toast('完了済みのメモはありません'); return; }
  if(!confirm(`完了済み${count}件を削除しますか？`)) return;
  memos = memos.filter(m=>!m.done);
  save();
  render();
  toast(`${count}件を削除しました`);
}

// ── RENDER ──
function render(){
  const list = document.getElementById('memoList');
  const counter = document.getElementById('countDisplay');

  let filtered = memos;
  if(filterTag === 'done') filtered = memos.filter(m=>m.done);
  else if(filterTag !== 'all') filtered = memos.filter(m=>m.tag===filterTag);

  const active = memos.filter(m=>!m.done).length;
  counter.textContent = `未完了${active}件`;

  if(filtered.length === 0){
    list.innerHTML = `<div class="empty"><div class="empty-icon">◇</div>メモがありません<br><span style="font-size:13px">上のフォームから追加できます</span></div>`;
    return;
  }

  list.innerHTML = filtered.map(m => {
    const time = formatTime(m.createdAt);
    return `
      <div class="memo-card${m.done?' done':''}">
        <div class="memo-top">
          <button class="memo-check${m.done?' checked':''}" onclick="toggleDone(${m.id})">${m.done?'✓':''}</button>
          <div class="memo-text">${escHtml(m.text)}</div>
          <button class="memo-del" onclick="deleteMemo(${m.id})">×</button>
        </div>
        <div class="memo-meta">
          ${m.tag ? `<span class="memo-tag">${escHtml(m.tag)}</span>` : ''}
          <span class="memo-time">${time}</span>
        </div>
      </div>
    `;
  }).join('');
}

// ── EXPORT ──
function openExport(){
  const pending = memos.filter(m=>!m.done);
  if(pending.length === 0){ toast('未完了のメモがありません'); return; }

  const text = pending.map((m,i)=>{
    const tag = m.tag ? `[${m.tag}] ` : '';
    return `${i+1}. ${tag}${m.text}`;
  }).join('\n');

  document.getElementById('exportText').textContent = text;
  document.getElementById('exportOverlay').classList.add('open');
}
function closeExport(e){
  if(!e || e.target === document.getElementById('exportOverlay')){
    document.getElementById('exportOverlay').classList.remove('open');
  }
}
function copyExport(){
  const text = document.getElementById('exportText').textContent;
  navigator.clipboard.writeText(text).then(()=>{
    toast('コピーしました');
    closeExport();
  }).catch(()=>{
    // フォールバック
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('コピーしました');
    closeExport();
  });
}

// ── HELPERS ──
function formatTime(iso){
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if(diff < 60) return 'たった今';
  if(diff < 3600) return `${Math.floor(diff/60)}分前`;
  if(diff < 86400) return `${Math.floor(diff/3600)}時間前`;
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function escHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}

init();
</script>
</body>
</html>
