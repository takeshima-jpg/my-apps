<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<!-- 他OSと同様のキャッシュ抑止。シェルHTMLが古いまま配信されると今日タブの修正が反映されない事故を防ぐ -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ランチャーOS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f5f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --bg: #f5f5f7; --bg2: #ffffff; --bg3: #ebebee;
  --border: #d8d8e0; --border2: #c8c8d4;
  --text: #1a1a22; --text2: #5a5a6e; --text3: #9898a8;
  --accent: #5b51d8;
  --radius: 8px;
  --font-body: 'Meiryo', 'Hiragino Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.65; }

.shell { display: flex; height: 100vh; overflow: hidden; }

/* ── 左タブバー ── */
.tabbar { width: 96px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; padding: 0 0 8px; }
.tab-logo { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 4px 10px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
.tab-logo img { width: 26px; height: 26px; }
.tab-logo span { font-size: 11px; font-weight: 700; color: var(--text2); letter-spacing: .06em; text-align: center; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; padding: 11px 4px; background: none; border: none; border-left: 3px solid transparent; color: var(--text2); font-family: var(--font-body); font-size: 12.5px; cursor: pointer; }
.tab .ico { font-size: 19px; line-height: 25px; }
.tab .tab-ico { width: 25px; height: 25px; border-radius: 6px; object-fit: cover; display: block; }
.tab:hover { background: var(--bg3); }
.tab.active { color: var(--accent); border-left-color: var(--accent); font-weight: 700; background: var(--bg3); }
.tab-others { margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--border); }
.tab-others .lbl { font-size: 9px; color: var(--text3); letter-spacing: .12em; margin-bottom: 4px; }
.tab-others a { display: block; font-size: 11px; color: var(--text3); text-decoration: none; padding: 2px 0; }
.tab-others a:hover { color: var(--accent); }
.tab-vision { padding: 8px; font-size: 9px; color: var(--text3); line-height: 1.5; }

/* ── メイン ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.miniheader { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.mh-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mh-name { font-size: 14px; font-weight: 700; color: var(--text2); display: flex; align-items: center; white-space: nowrap; }
.mh-ico { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; margin-right: 6px; }
.mh-badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.mh-badge.ok { background: #e4f5ec; color: #1f8a4c; }
.mh-badge.warn { background: #fdeaea; color: #d31f2c; }
.mh-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.mh-actions button { padding: 6px 12px; font-size: 13px; background: none; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); cursor: pointer; font-family: var(--font-body); white-space: nowrap; }
.mh-actions button:hover { border-color: var(--accent); color: var(--accent); }
.mh-help { font-size: 11px; color: var(--text3); flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage { flex: 1; position: relative; min-height: 0; }
.osframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: var(--bg2); }

/* ── 今日タブ（コンテンツは中央寄せ・最大幅で読みやすく／右の死に余白を無くす）── */
.today { position: absolute; inset: 0; overflow-y: auto; background: var(--bg); }
.today-inner { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
.today h2 { font-size: 14px; color: var(--text3); letter-spacing: .1em; margin: 24px 0 9px; font-weight: 700; }
/* クイック追加バーはスクロールしても上部に固定 */
.qa-wrap { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 10px; box-shadow: 0 1px 0 var(--border); }
.qa-sub { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.qa-ai { padding: 8px 16px; font-size: 14px; font-weight: 700; background: none; border: 1px solid var(--accent); border-radius: 999px; color: var(--accent); cursor: pointer; font-family: var(--font-body); }
.qa-ai:hover { background: #efe9ff; }
.qa-note { font-size: 12px; color: var(--text3); }
.qa-bar { display: flex; gap: 8px; }
.qa-bar input { flex: 1; padding: 12px 15px; font-size: 16px; border: 1px solid var(--border2); border-radius: var(--radius); font-family: var(--font-body); background: var(--bg2); color: var(--text); }
.qa-bar input:focus { outline: none; border-color: var(--accent); }
.qa-bar button { padding: 12px 22px; font-size: 15px; font-weight: 700; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-family: var(--font-body); }
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.task-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--bg3); }
.task-row:last-child { border-bottom: none; }
.task-check { width: 26px; height: 26px; flex-shrink: 0; margin-top: 1px; border: 2px solid var(--border2); border-radius: 50%; background: none; cursor: pointer; font-size: 14px; line-height: 1; color: transparent; }
.task-check:hover { border-color: var(--accent); color: var(--accent); }
.task-title { flex: 1; font-size: 16px; }
.task-tag { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: var(--bg3); color: var(--text2); white-space: nowrap; }
.task-tag.lectica { background: #efe9ff; color: var(--accent); }
.task-overdue { font-size: 11px; color: #d31f2c; white-space: nowrap; }
.empty { font-size: 14px; color: var(--text3); padding: 8px 0; }
.brief-more { margin-top: 10px; padding: 8px 16px; font-size: 13px; background: none; border: 1px solid var(--border); border-radius: 999px; color: var(--text2); cursor: pointer; font-family: var(--font-body); }
.brief-more:hover { border-color: var(--accent); color: var(--accent); }
.lx-row { font-size: 15px; }
.lx-row a { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 14px; }

/* brief markdown（読み物なので可読性重視でやや大きめ） */
.brief-body h1 { font-size: 17px; margin: 14px 0 7px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.brief-body h2 { font-size: 15px; margin: 11px 0 5px; color: var(--text2); display: flex; align-items: center; gap: 8px; }
.brief-body h2::before { content: ''; width: 4px; height: 1em; background: var(--border2); border-radius: 2px; flex-shrink: 0; }
.brief-body h3 { font-size: 14px; margin: 9px 0 4px; color: var(--text2); }
/* Brief見出しのカテゴリ色分け（brief-viewer と完全一致。判定はJS側の _bc） */
.brief-body h1.bcat-key, .brief-body h2.bcat-key { color: #4f46e5; }
.brief-body h1.bcat-key { border-bottom-color: #4f46e5; }
.brief-body h2.bcat-key::before { background: #4f46e5; }
.brief-body h1.bcat-ins, .brief-body h2.bcat-ins { color: #7c3aed; }
.brief-body h1.bcat-ins { border-bottom-color: #7c3aed; }
.brief-body h2.bcat-ins::before { background: #7c3aed; }
.brief-body h1.bcat-fin, .brief-body h2.bcat-fin { color: #0e7490; }
.brief-body h1.bcat-fin { border-bottom-color: #0e7490; }
.brief-body h2.bcat-fin::before { background: #0e7490; }
.brief-body h1.bcat-biz, .brief-body h2.bcat-biz { color: #ea580c; }
.brief-body h1.bcat-biz { border-bottom-color: #ea580c; }
.brief-body h2.bcat-biz::before { background: #ea580c; }
.brief-body h1.bcat-ppl, .brief-body h2.bcat-ppl { color: #15803d; }
.brief-body h1.bcat-ppl { border-bottom-color: #15803d; }
.brief-body h2.bcat-ppl::before { background: #15803d; }
.brief-body h1.bcat-ops, .brief-body h2.bcat-ops { color: #64748b; }
.brief-body h1.bcat-ops { border-bottom-color: #64748b; }
.brief-body h2.bcat-ops::before { background: #64748b; }
.brief-body ul { padding-left: 22px; margin: 5px 0; }
.brief-body li { font-size: 15px; margin: 3px 0; line-height: 1.7; }
.brief-body p { font-size: 15px; margin: 4px 0; line-height: 1.7; }
.brief-body br { line-height: 0.5; }
.brief-body hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
.brief-body code { background: var(--bg3); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
.brief-body .bv-link { color: var(--accent); word-break: break-all; }
.brief-body .bv-fav { width: 14px; height: 14px; vertical-align: -2px; margin-right: 3px; }

/* トースト */
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1a1a22; color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity .25s; pointer-events: none; }
.toast.show { opacity: 1; }

.ios-hint { margin-top: 26px; font-size: 11px; color: var(--text3); text-align: center; }

/* ── モバイル：サイドバーを上部横スクロールタブに ── */
@media (max-width: 768px) {
  .shell { flex-direction: column; }
  .tabbar { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--border); padding: 0 4px; }
  .tab { flex-direction: row; gap: 5px; width: auto; padding: 9px 10px; border-left: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.active { border-bottom-color: var(--accent); background: none; }
  .tab-logo, .tab-others, .tab-vision { display: none; }
  .mh-help { display: none; }
  .today-inner { padding: 0 12px 60px; }
}
</style>
</head>
<body>
<div class="shell">
  <nav class="tabbar" id="tabbar"></nav>
  <div class="main">
    <div class="miniheader">
      <span class="mh-left">
        <span class="mh-name" id="curTabName"></span>
        <span class="mh-badge" id="connBadge" style="display:none"></span>
      </span>
      <span class="mh-help" id="mhHelp"></span>
      <span class="mh-actions">
        <button id="btnInstall" onclick="installApp()" style="display:none" title="ホーム画面／デスクトップにアプリとして追加">📲 アプリ追加</button>
        <button id="btnReload" onclick="reloadCurrent()">⟳ 再読込</button>
        <button id="btnLogin" onclick="openCurrent()" title="OAuthはiframe内で実行できないため、Googleログインは別タブで行います">🔑 ログイン（別タブ）</button>
      </span>
    </div>
    <div class="stage" id="stage">
      <div id="todayView" class="today"></div>
    </div>
  </div>
</div>

<script>
// ── タブ定義（並び替え・追加はここだけ）──
// img は各OSの実ファビコンPNG（左タブと本体を見た目一致させる。iconは画像読込不可時のフォールバック絵文字）
const TABS = [
  { id:'today',    label:'今日',     icon:'🏠', img:null,                              url:null },
  { id:'task',     label:'Task',     icon:'✅', img:'../task-os/icons/icon-32.png',        url:'../task-os/index.html' },
  { id:'shot',     label:'Shot',     icon:'⚡', img:'../shot-task-os/icons/icon-32.png',   url:'../shot-task-os/index.html' },
  { id:'routine',  label:'Routine',  icon:'🔁', img:'../routine-os/icons/icon-32.png',     url:'../routine-os/index.html' },
  { id:'project',  label:'Project',  icon:'📊', img:'../project-os/icons/icon-32.png',     url:'../project-os/index.html' },
  { id:'oneday',   label:'1day',     icon:'📓', img:'../1day/icons/icon-32.png',           url:'../1day/index.html' },
  { id:'reflect',  label:'Reflect',  icon:'💭', img:'../reflect-os/icons/icon-32.png',     url:'../reflect-os/index.html' },
  { id:'koso',     label:'構想',     icon:'💡', img:'../koso-log/icons/icon-32.png',       url:'../koso-log/index.html' },
  { id:'list100',  label:'100',      icon:'💯', img:'../100list/icons/icon-32x32.png',     url:'../100list/index.html' },
  { id:'su',       label:'SU',       icon:'🌌', img:'../social-universe/icons/icon-32.png', url:'../social-universe/index.html' },
  { id:'hitomemo', label:'ヒトメモ', icon:'👥', img:'../hitomemo/icons/icon-32.png',       url:'../hitomemo/index.html' },
];
const OTHER_LINKS = [ { label:'brief-viewer', url:'../brief-viewer/index.html' } ];
const LAST_TAB_KEY = 'launcher_last_tab';

// Googleログインがまだ要るOSと、そのトークンキー（全OSは同一オリジン＝localStorage共有なのでシェルから接続有無を判定できる）。
// ※OAuthはaccounts.google.comがiframe表示を拒否するため、ログインは必ず「別タブ」で行う（下の openInNewTab を使用）。
// 他OSはTask OSの統合バックアップに一本化済みで個別Googleログインは不要。
const TAB_TOKEN_KEYS = {
  task:     'gdrive_token_taskos',
  hitomemo: 'gdrive_token',
  project:  'gdrive_token_projectos',
};

let currentTab = null;
const frames = {};   // タブid → iframe（初回クリックで生成・以後display切替で状態保持）

// 画像アイコン（各OS実物）。読込失敗時は絵文字にフォールバック
function tabIconHtml(t, cls){
  if (t.img) return '<img class="' + cls + '" src="' + t.img + '" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'ico\',textContent:\'' + t.icon + '\'}))">';
  return '<span class="ico">' + t.icon + '</span>';
}

function buildTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '<div class="tab-logo"><img src="favicon.svg" alt=""><span>ランチャーOS</span></div>'
  + TABS.map(t =>
    '<button class="tab" data-id="' + t.id + '" onclick="switchTab(\'' + t.id + '\')">'
    + tabIconHtml(t, 'tab-ico') + '<span>' + t.label + '</span></button>'
  ).join('')
  + '<div class="tab-others"><div class="lbl">その他</div>'
  + OTHER_LINKS.map(l => '<a href="' + l.url + '" target="_blank" rel="noopener">↗ ' + l.label + '</a>').join('')
  + '</div>'
  + '<div class="tab-vision">守りの総合支援を通して、挑戦する人が成長できる社会をつくる</div>';
}

function switchTab(id){
  const tab = TABS.find(t => t.id === id) || TABS[0];
  currentTab = tab.id;
  try { localStorage.setItem(LAST_TAB_KEY, tab.id); } catch(e) {}
  document.querySelectorAll('.tabbar .tab').forEach(b => b.classList.toggle('active', b.dataset.id === tab.id));
  document.getElementById('curTabName').innerHTML = tabIconHtml(tab, 'mh-ico') + escHtml(tab.label);
  const todayView = document.getElementById('todayView');
  const loginBtn = document.getElementById('btnLogin');
  const help = document.getElementById('mhHelp');
  updateConnBadge(tab);
  if (tab.url === null) {
    todayView.style.display = '';
    Object.values(frames).forEach(f => f.style.display = 'none');
    loginBtn.style.display = 'none';
    help.textContent = '';
    renderToday();   // 表示のたびに再読込（他タブでの変更を反映）
  } else {
    todayView.style.display = 'none';
    loginBtn.style.display = '';
    // ログインが要るOSだけ導線を強調。他はTask OS統合バックアップに一本化済み
    help.textContent = (tab.id in TAB_TOKEN_KEYS)
      ? 'このOSはGoogleログインが必要です。「🔑 ログイン」から別タブで（ログイン後 ⟳）'
      : 'GoogleログインはTask OSでまとめて（このOSは統合バックアップ対象）';
    if (!frames[tab.id]) {   // 遅延生成
      const f = document.createElement('iframe');
      f.className = 'osframe';
      f.src = tab.url;
      frames[tab.id] = f;
      document.getElementById('stage').appendChild(f);
    }
    Object.entries(frames).forEach(([k, f]) => { f.style.display = (k === tab.id) ? '' : 'none'; });
  }
}

// Googleログインが要るタブだけ、localStorageトークンの有無で接続バッジを出す
function updateConnBadge(tab){
  const badge = document.getElementById('connBadge');
  const key = TAB_TOKEN_KEYS[tab.id];
  if (!key) { badge.style.display = 'none'; return; }
  let connected = false;
  try { connected = !!localStorage.getItem(key); } catch(e) {}
  badge.style.display = '';
  badge.textContent = connected ? '✓ 接続済み' : '🔑 未接続';
  badge.className = 'mh-badge' + (connected ? ' ok' : ' warn');
}

function reloadCurrent(){
  if (currentTab === 'today') { renderToday(); return; }
  const f = frames[currentTab];
  if (!f) return;
  try { f.contentWindow.location.reload(); } catch(e) { f.src = f.src; }
}

function openCurrent(){
  const tab = TABS.find(t => t.id === currentTab);
  if (!tab || !tab.url) return;
  window.open(tab.url, '_blank');
}

function toast(msg){
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2200);
}

// ══ 今日タブ ══════════════════════════════════════════════
// 書き込みは「クイック追加」と「✓完了」の2つだけ（対象は shot-task-os-v1 のみ）

function todayKey(){ const d = new Date(); const p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()); }
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// shot-task-os の genId() と同一方式
function shotGenId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function readShotTasks(){ try { const a = JSON.parse(localStorage.getItem('shot-task-os-v1')) || []; return Array.isArray(a) ? a : []; } catch(e) { return []; } }
function writeShotTasks(a){ localStorage.setItem('shot-task-os-v1', JSON.stringify(a)); }
function reloadShotFrame(){ if (frames.shot) { try { frames.shot.contentWindow.location.reload(); } catch(e) {} } }

// クイック追加（shot-task-os の addTask と同一フィールド構成）
function quickAdd(){
  const inp = document.getElementById('qaInput');
  const title = inp.value.trim();
  if (!title) { inp.focus(); return; }
  const now = new Date().toISOString();
  const tasks = readShotTasks();
  tasks.push({
    id: shotGenId(),
    title,
    category: '今日のタスク',
    priority: 'high',
    status: 'todo',
    dueDate: todayKey(),
    memo: '',
    createdAt: now, completedAt: null, updatedAt: now
  });
  writeShotTasks(tasks);
  inp.value = '';
  renderTodayTasks();
  reloadShotFrame();
  toast('Shotタスクに追加しました');
}

// ✓完了（shot-task-os の changeStatus(id,'done') と同一の書き方）
function completeTask(id){
  const tasks = readShotTasks();
  const t = tasks.find(x => x && x.id === id);
  if (!t) return;
  t.status = 'done';
  t.completedAt = new Date().toISOString();
  t.updatedAt = t.completedAt;
  writeShotTasks(tasks);
  renderTodayTasks();
  reloadShotFrame();
  toast('完了しました ✓');
}

// ── 以下2関数は 1day/index.html からの転記（brief描画。1day側が正）──
function briefJsonToMarkdown(d) {
  if (typeof d === 'string') return d;
  if (typeof d !== 'object' || d === null) return String(d);
  let md = '';
  if (d.cadence_notice) md += `**📣 ${d.cadence_notice}**\n\n`;
  // ── 📅 今日の予定 ──
  if (d.today_schedule?.length) {
    md += `# 📅 今日の予定\n\n`;
    md += d.today_schedule.map(e => {
      if (e && typeof e === 'object') { const t = [e.time, e.title].filter(Boolean).join(' '); return `・${t}${e.note ? '（' + e.note + '）' : ''}`; }
      return `・${e}`;
    }).join('\n') + '\n\n';
  }
  // ── 今日の要点 ──
  if (d.top_theme || d.center_pin || d.changes?.length || d.decisions?.length) md += `# 今日の要点\n\n`;
  if (d.top_theme) md += `## 今日の最重要テーマ\n${d.top_theme}\n\n`;
  if (d.center_pin) md += `## 今週のセンターピン\n${d.center_pin}\n\n`;
  if (d.changes?.length) md += `## 昨日からの重要変化\n${d.changes.map(c => `・${c}`).join('\n')}\n\n`;

  const _grp = (t, groups) => {
    const body = groups.filter(g => Array.isArray(g[1]) && g[1].length)
      .map(g => `${g[0]}：\n${g[1].map(x=>`・${x}`).join('\n')}`).join('\n');

  if (d.question_review) _grp('問いレビュー', [['今育てる問い', d.question_review.nurturing], ['答えが出た問い', d.question_review.answered], ['捨てる問い', d.question_review.discard]]);
  if (d.ai_understanding) _grp('AI理解度レビュー', [['AIが重要と認識', d.ai_understanding.recognized], ['実際とのズレ', d.ai_understanding.gaps]]);
  if (d.life_list_review) _grp('100リストレビュー', [['進んだもの', d.life_list_review.advanced], ['止まっているもの', d.life_list_review.stalled], ['最近追加', d.life_list_review.recent], ['AI提案', d.life_list_review.proposals]]);
  if (d.delete_review) _grp('削除候補レビュー', [['Project', d.delete_review.projects], ['人間関係', d.delete_review.people], ['問い', d.delete_review.questions], ['テーマ', d.delete_review.themes], ['構想', d.delete_review.ideas], ['役割', d.delete_review.roles]]);
  if (d.theme_review) _grp('重点テーマレビュー', [['今探求していること', d.theme_review.current], ['増えたテーマ', d.theme_review.added], ['減ったテーマ', d.theme_review.removed]]);
  if (d.thought_shift) _grp('思想変化レビュー', [['新しく信じ始めたこと', d.thought_shift.new_beliefs], ['捨てた考え', d.thought_shift.dropped], ['深まった考え', d.thought_shift.deepened]]);
  if (d.relationship_review) {
    const r = d.relationship_review;
    _grp('大切にしたい人レビュー', [['本当に関係を深めたい人', r.deepen], ['優先順位の変化', r.priority_shift]]);
    if (r.time_spent) md += `最近時間を使えているか：${r.time_spent}\n\n`;
  }
  if (d.partner_candidate_review) _grp('経営パートナー候補レビュー', [['新規追加', d.partner_candidate_review.added], ['昇格', d.partner_candidate_review.promoted], ['停滞', d.partner_candidate_review.stalled], ['除外', d.partner_candidate_review.removed]]);
  if (d.ai_self_check) {
    const a = d.ai_self_check, h = a.hypotheses || {};
    md += `## AI自己点検\n`;
    if (h.aiming) md += `・何を目指しているか：${h.aiming}\n`;
    if (h.struggling) md += `・何に悩んでいるか：${h.struggling}\n`;
    if (h.developing) md += `・誰を育てようとしているか：${h.developing}\n`;
    if (h.discarding) md += `・何を捨てようとしているか：${h.discarding}\n`;
    if (a.takeshima_eval) md += `・竹嶋評価：${a.takeshima_eval}\n`;
    md += `\n`;
  }
  return md.trim() || JSON.stringify(d, null, 2);
}

function markdownToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  let curCat = '';
  const _bc = t => /要点|予定/.test(t)?'key':/内省/.test(t)?'ins':/財務|外部/.test(t)?'fin':/事業|実行/.test(t)?'biz':/人材|関係/.test(t)?'ppl':/参謀|運用/.test(t)?'ops':'';
  for (let line of lines) {
    line = line
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/`(.+?)`/g,'<code>$1</code>');
    // markdownリンク [label](url) → ファビコン付き青リンク
    line = line.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, function(_m, label, url) {
      let host = ''; try { host = new URL(url.replace(/&amp;/g, '&')).hostname; } catch(e) {}
      const fav = host ? '<img class="bv-fav" src="https://www.google.com/s2/favicons?domain=' + host + '&sz=64" alt="" loading="lazy">' : '';
      return '<a href="' + url + '" target="_blank" rel="noopener" class="bv-link">' + fav + label + '</a>';
    });
    // 生URLも青リンク化（属性内のURLは除外）
    line = line.replace(/(^|[^"'>])(https?:\/\/[^\s｜、。<>"]+)/g, '$1<a href="$2" target="_blank" rel="noopener" class="bv-link">$2</a>');
    if (/^### (.+)/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h3>' + line.replace(/^### /,'') + '</h3>';
    } else if (/^## (.+)/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<h2 class="bcat-' + curCat + '">' + line.replace(/^## /,'') + '</h2>';
    } else if (/^# (.+)/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      const _t = line.replace(/^# /,''); curCat = _bc(_t); html += '<h1 class="bcat-' + curCat + '">' + _t + '</h1>';
    } else if (/^---+$/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<hr>';
    } else if (/^[-・*] (.+)/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + line.replace(/^[-・*] /,'') + '</li>';
    } else if (/^\d+\. (.+)/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + line.replace(/^\d+\. /,'') + '</li>';
    } else if (line.trim() === '') {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<br>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<p>' + line + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html;
}

// 1day の getAixDraft と同等の3形式判定（オブジェクト／文字列／JSON文字列）。dailyのみ
function getAixDraft(){
  let raw = localStorage.getItem('aix_draft_latest');
  if (!raw) raw = localStorage.getItem('oneday_aix_draft');
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    if (d && typeof d === 'object') return briefJsonToMarkdown(d);
    if (typeof d === 'string') return d;
  } catch(e) {}
  return raw;
}

let briefExpanded = false;
// 既定表示は「# 今日の予定」「# 今日の要点」セクションまで
function briefHeadMarkdown(md){
  const lines = md.split('\n');
  const out = [];
  for (const line of lines) {
    const m = line.match(/^# (.+)/);
    if (m && !/予定|要点/.test(m[1])) break;
    out.push(line);
  }
  return out.join('\n').trim();
}

function renderTodayBrief(){
  const area = document.getElementById('briefArea');
  if (!area) return;
  const md = getAixDraft();
  if (!md) { area.innerHTML = '<div class="empty">今日のBriefはまだありません（Cowork実行後に表示されます）</div>'; return; }
  const head = briefHeadMarkdown(md);
  const shown = briefExpanded ? md : (head || md);
  const hasMore = !briefExpanded && head && head.length < md.trim().length;
  area.innerHTML = '<div class="brief-body">' + markdownToHtml(shown) + '</div>'
    + (briefExpanded || hasMore
        ? '<button class="brief-more" onclick="toggleBrief()">' + (briefExpanded ? '要点だけにする' : '全文を見る') + '</button>'
        : '');
}

function renderTodayTasks(){
  const area = document.getElementById('todayTasks');
  if (!area) return;
  const today = todayKey();
  const tasks = readShotTasks()
    .filter(t => t && t.status === 'todo' && t.dueDate && t.dueDate <= today)
    .sort((a, b) => (a.dueDate || '').localeCompare(b.dueDate || '') || (a.priority === 'high' ? -1 : 1));
  if (!tasks.length) { area.innerHTML = '<div class="empty">今日のタスクはありません 🎉</div>'; return; }
  area.innerHTML = tasks.map(t => {
    const lect = t.category === 'Lectica';
    const overdue = t.dueDate < today;
    return '<div class="task-row">'
      + '<button class="task-check" onclick="completeTask(\'' + escHtml(t.id) + '\')" title="完了にする">✓</button>'
      + '<span class="task-title">' + escHtml(t.title) + '</span>'
      + (overdue ? '<span class="task-overdue">' + escHtml(t.dueDate.slice(5).replace('-', '/')) + '〜</span>' : '')
      + '<span class="task-tag' + (lect ? ' lectica' : '') + '">' + escHtml(t.category || '') + '</span>'
      + '</div>';
  }).join('');
}

function renderTodayLectica(){

let deferredInstall = null;

function installApp(){
  if (!deferredInstall) return;

  deferredInstall.userChoice.finally(() => {
    deferredInstall = null;
    document.getElementById('btnInstall').style.display = 'none';
  });
}

function iosInstallHint(){
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (!isIOS || standalone) return '';
  return '<div class="ios-hint">📲 アプリとして使う：Safariの共有 → ホーム画面に追加</div>';
}

// 別タブ（本体ページ）での変更を今日タブへ反映。トークン変化なら接続バッジも更新
window.addEventListener('storage', e => {
  if (currentTab === 'today' && ['shot-task-os-v1', 'aix_draft_latest', 'oneday_aix_draft', 'aix_lectica_pending'].includes(e.key)) renderToday();
  if (Object.values(TAB_TOKEN_KEYS).includes(e.key)) {
    const tab = TABS.find(t => t.id === currentTab);
    if (tab) updateConnBadge(tab);
  }
});
</script>
