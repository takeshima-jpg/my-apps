<style>
:root{
  --r:#D94F4F;   /* Routine */
  --s:#3A7FD9;   /* Shot    */
  --p:#4EA86B;   /* Project */
  --bg:#F7F6F3;
  --surface:#FFFFFF;
  --border:rgba(0,0,0,0.07);
  --text:#1C1C1E;
  --text2:#6B6B70;
  --text3:#AEAEB2;
  --navy:#18243E;
  --accent:#3A7FD9;
  --r-bg:rgba(217,79,79,.08);
  --s-bg:rgba(58,127,217,.08);
  --p-bg:rgba(78,168,107,.08);
  --sidebar:192px;
  --line:1.7;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background:var(--bg);color:var(--text);font-size:16px;line-height:var(--line);}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;}
.sidebar{width:var(--sidebar);background:var(--navy);display:flex;flex-direction:column;flex-shrink:0;}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── SIDEBAR ── */
.sb-brand{padding:20px 18px 14px;border-bottom:1px solid rgba(255,255,255,0.06);}
.sb-logo{font-size:9px;letter-spacing:.18em;color:rgba(255,255,255,0.25);text-transform:uppercase;font-weight:600;}
.sb-name{font-size:17px;font-weight:700;color:#fff;margin-top:2px;letter-spacing:-.01em;}
.sb-nav{flex:1;padding:8px 0;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 18px;
  color:rgba(255,255,255,0.42);font-size:14px;font-weight:600;
  cursor:pointer;border-left:2px solid transparent;transition:all .12s;letter-spacing:.03em;}
.ni:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04);}
.ni.act{color:#fff;background:rgba(255,255,255,0.08);border-left-color:var(--accent);}
.ni-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}.ni-ico{font-size:16px;width:18px;text-align:center;flex-shrink:0;opacity:.75}.ni-ico-r{color:#D94F4F}.ni-ico-s{color:#3A7FD9}.ni-ico-p{color:#4EA86B}
.ni-dot-r{background:var(--r);} .ni-dot-s{background:var(--s);} .ni-dot-p{background:var(--p);}
.ni-dot-g{background:rgba(255,255,255,0.2);}
.sb-sep{margin:6px 18px;height:1px;background:rgba(255,255,255,0.05);}
.sb-ft{padding:12px 18px;border-top:1px solid rgba(255,255,255,0.05);font-size:10px;color:rgba(255,255,255,0.2);line-height:1.8;}
.sb-backup-panel{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06);}
.sb-backup-btn{width:100%;padding:5px 8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:4px;color:rgba(255,255,255,0.6);font-size:11px;cursor:pointer;margin-bottom:3px;text-align:left;}
.sb-backup-btn:hover{background:rgba(255,255,255,0.12);}

/* ── TOP BAR ── */
.topbar{height:48px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex-shrink:0;}
.vision-area {
  padding: 8px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}
.vision-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px 16px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  max-width: 960px;
}
.vision-type {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.15em;
  white-space: nowrap;
  min-width: 44px;
  text-transform: uppercase;
}
.vision-body { font-size: 13px; color: var(--text2); line-height: 1.6; }
.vision-keyword { font-weight: 700; color: var(--text1); margin-right: 6px; }
.tb-title{font-size:15px;font-weight:600;color:var(--text2);letter-spacing:.02em;}
.tb-right{display:flex;align-items:center;gap:8px;}
.tb-clock{font-size:14px;color:var(--text3);}

/* ── FRAME ── */
.os-frame-wrap{flex:1;overflow:hidden;display:flex;flex-direction:column;}
.os-frame{border:none;width:100%;height:100%;flex:1;}
/* OS フルスクリーンオーバーレイ（サイドバーを隠してOS本来のUIを表示） */
.os-fullscreen{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;}
.os-fullscreen-bar{height:40px;background:var(--navy);display:flex;align-items:center;gap:10px;padding:0 14px;flex-shrink:0;}
.os-fullscreen-back{color:rgba(255,255,255,0.7);background:none;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 10px;border-radius:5px;transition:background .1s;}
.os-fullscreen-back:hover{background:rgba(255,255,255,0.1);color:#fff;}
.os-fullscreen-title{color:rgba(255,255,255,0.5);font-size:14px;font-weight:600;letter-spacing:.05em;}
.hid{display:none!important;}

/* ── CONTENT ── */
.scroll{flex:1;overflow-y:auto;padding:24px 26px;}
.scroll::-webkit-scrollbar{width:4px;}
.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:2px;}

/* ── HOME: STATUS NUMBERS ── */
.status-row{display:flex;gap:12px;margin-bottom:22px;}
.snum{background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:14px 18px;flex:1;cursor:default;}
.snum-v{font-size:28px;font-weight:800;line-height:1;margin-bottom:3px;}
.snum-l{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;}
.snum.ov .snum-v{color:var(--r);}
.snum.td .snum-v{color:#C97A00;}
.snum.wk .snum-v{color:var(--s);}

/* ── HOME: TOP CARD (今日の一手) ── */
.top-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:18px 20px;margin-bottom:22px;position:relative;}
.top-card-label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;}
.top-card-title{font-size:19px;font-weight:700;line-height:1.4;margin-bottom:8px;color:var(--text);}
.top-card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.top-card-actions{display:flex;gap:6px;margin-top:12px;}

/* ── SECTION ── */
.sec{margin-bottom:24px;}
.sec-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sec-label-count{font-size:10px;font-weight:600;color:var(--text3);
  background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:0 7px;}

/* ── TASK ROW ── */
.trow{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin-bottom:4px;transition:background .1s;}
.trow:hover{background:var(--bg);}
.trow.ov{border-left:3px solid var(--r);padding-left:11px;}
.trow.today-due{border-left:3px solid #C97A00;padding-left:11px;}
.src-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.src-r{background:var(--r);} .src-s{background:var(--s);} .src-p{background:var(--p);}
.trow-title{flex:1;font-size:15px;font-weight:500;line-height:1.4;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.trow-date{font-size:13px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.trow-date.ov{color:var(--r);font-weight:600;}
.trow-date.td{color:#C97A00;font-weight:600;}
.trow-actions{display:flex;gap:4px;flex-shrink:0;}

/* ── BUTTONS ── */
.btn-done{padding:3px 10px;border-radius:5px;border:1px solid rgba(78,168,107,.3);
  background:rgba(78,168,107,.08);color:#276745;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap;}
.btn-done:hover{background:rgba(78,168,107,.18);}
.btn-open{padding:3px 10px;border-radius:5px;border:1px solid var(--border);
  background:var(--bg);color:var(--text2);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .1s;white-space:nowrap;}
.btn-open:hover{background:rgba(58,127,217,.08);border-color:rgba(58,127,217,.3);color:var(--s);}
.btn-ghost{padding:3px 10px;border-radius:5px;border:1px solid var(--border);
  background:transparent;color:var(--text3);font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;}
.btn-ghost:hover{color:var(--text2);}
.btn-nav{padding:5px 12px;border-radius:6px;border:1px solid var(--border);
  background:var(--surface);color:var(--text2);font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;}
.btn-nav:hover{background:var(--bg);}

/* ── LINK CHIP ── */
.link-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
  border-radius:4px;background:rgba(127,119,221,.08);color:#4B44A8;
  border:1px solid rgba(127,119,221,.2);font-size:10px;font-weight:600;
  text-decoration:none;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.link-chip:hover{background:rgba(127,119,221,.16);}

/* ── OS TAG ── */
.os-tag{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;
  text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
.tag-r{background:var(--r-bg);color:#8B2020;border:1px solid rgba(217,79,79,.2);}
.tag-s{background:var(--s-bg);color:#1A4F8B;border:1px solid rgba(58,127,217,.2);}
.tag-p{background:var(--p-bg);color:#1E6B3C;border:1px solid rgba(78,168,107,.2);}

/* ── TIMELINE ── */
.tl-scroll{overflow-x:auto;padding-bottom:6px;}
.tl-scroll::-webkit-scrollbar{height:3px;}
.tl-scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);}
.tl-grid{display:grid;gap:4px;min-width:680px;}
.tl-row{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:flex-start;
  padding:3px 0;border-bottom:1px solid var(--border);}
.tl-row:last-child{border-bottom:none;}
.tl-date{font-size:10px;font-weight:700;color:var(--text3);text-align:right;padding-top:2px;white-space:nowrap;}
.tl-date.today{color:var(--accent);}
.tl-date.past{color:var(--text3);opacity:.5;}
.tl-date.weekend{color:var(--r);}
.tl-chips{display:flex;flex-wrap:wrap;gap:3px;}
.tl-chip{font-size:10px;padding:1px 6px;border-radius:3px;white-space:nowrap;
  overflow:hidden;max-width:120px;text-overflow:ellipsis;}
.tl-chip-r{background:var(--r-bg);color:#8B2020;}
.tl-chip-s{background:var(--s-bg);color:#1A4F8B;}
.tl-chip-p{background:var(--p-bg);color:#1E6B3C;}

/* ── PROJECT SUMMARY ── */
.pj-row{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:4px;}
.pj-name{font-size:15px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pj-bar-bg{width:64px;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;flex-shrink:0;}
.pj-bar{height:100%;background:var(--p);border-radius:2px;}
.pj-pct{font-size:13px;color:var(--text3);width:28px;text-align:right;flex-shrink:0;font-weight:600;}

/* ── TODAY ── */
.today-hd{padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.today-hd-title{font-size:17px;font-weight:700;margin-bottom:8px;}
.prog-bg{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;}
.prog-bar{height:100%;background:var(--p);border-radius:2px;transition:width .4s;}
.today-count{font-size:13px;color:var(--text3);margin-top:5px;}
.today-sec{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--text3);padding:10px 22px 5px;background:var(--bg);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
.today-list{padding:10px 22px;display:flex;flex-direction:column;gap:4px;}
.t-row{display:flex;align-items:center;gap:9px;padding:8px 0;
  border-bottom:1px solid var(--border);}
.t-row:last-child{border-bottom:none;}
.t-chk{width:15px;height:15px;cursor:pointer;accent-color:var(--p);flex-shrink:0;}
.t-title{flex:1;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.t-title.done{text-decoration:line-through;color:var(--text3);}
.t-date{font-size:13px;color:var(--text3);white-space:nowrap;flex-shrink:0;}
.t-date.ov{color:var(--r);font-weight:600;}
.t-date.td{color:#C97A00;font-weight:600;}
.t-actions{display:flex;gap:4px;flex-shrink:0;}

/* ── SEARCH ── */
.search-wrap{padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--border);}
.search-in{width:100%;padding:8px 14px;border:1px solid var(--border);border-radius:8px;
  font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);}
.search-in:focus{outline:none;border-color:var(--accent);background:var(--surface);}
.filter-bar{display:flex;gap:5px;padding:8px 22px;border-bottom:1px solid var(--border);}
.fc{padding:3px 10px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);}
.fc.act{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;
  align-items:center;justify-content:center;z-index:500;backdrop-filter:blur(3px);}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--border);
  width:360px;box-shadow:0 8px 32px rgba(0,0,0,.15);}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;}
.modal-t{font-size:16px;font-weight:700;}
.modal-cl{cursor:pointer;font-size:18px;color:var(--text3);background:none;border:none;}
.modal-b{padding:16px 20px;}
.link-list{display:flex;flex-direction:column;gap:6px;}
.link-item{display:flex;align-items:center;gap:10px;padding:10px 12px;
  border-radius:8px;border:1px solid var(--border);background:var(--bg);
  cursor:pointer;text-decoration:none;color:var(--text);}
.link-item:hover{background:rgba(58,127,217,.06);border-color:rgba(58,127,217,.2);}
.link-item-icon{font-size:16px;}
.link-item-body{flex:1;min-width:0;}
.link-item-label{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.link-item-url{font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── PJ MODAL ── */
.fr{margin-bottom:12px;}
.fl{font-size:10px;font-weight:700;color:var(--text2);margin-bottom:4px;
  display:block;text-transform:uppercase;letter-spacing:.05em;}
.fi{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:7px;
  font-size:15px;font-family:inherit;color:var(--text);}
.fi:focus{outline:none;border-color:var(--accent);}
select.fi{cursor:pointer;}
.modal-f{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}

/* ── TOAST ── */
.waiting-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);}
.waiting-row:last-child{border-bottom:none;}
.waiting-row-title{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.waiting-row-meta{font-size:10px;color:var(--text3);flex-shrink:0;}
.btn-wait{padding:3px 9px;border-radius:5px;border:1px solid rgba(155,127,217,.3);
  background:rgba(155,127,217,.08);color:#4B44A8;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;}
.btn-wait:hover{background:rgba(155,127,217,.18);}
.wait-pop{position:absolute;z-index:300;background:var(--surface);border:1px solid var(--border);
  border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:4px;min-width:120px;
  display:flex;flex-direction:column;gap:1px;}
.wait-pop-item{padding:7px 12px;border-radius:5px;font-size:14px;font-weight:600;
  color:var(--text);cursor:pointer;white-space:nowrap;background:none;border:none;
  font-family:inherit;text-align:left;transition:background .08s;}
.wait-pop-item:hover{background:var(--purple-l,rgba(127,119,221,.1));color:#4B44A8;}
.wait-pop-label{padding:5px 12px 3px;font-size:9px;font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.1em;}
.wait-anchor{position:relative;display:inline-flex;}
.empty-waiting{padding:20px;text-align:center;font-size:14px;color:var(--text3);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
  padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;
  z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.2);}
.toast.show{opacity:1;}

/* ── EMPTY ── */
.empty{padding:40px 20px;text-align:center;color:var(--text3);font-size:15px;}
</style>
</head>

// 全OSのデータを収集
// ReflectOS IndexedDB から問い・実験を取得
function readReflectOSFromIDB() {
  const EMPTY = { themes: [], importantQuestions: [], activeExperiments: [] };
  try {
    const o = JSON.parse(localStorage.getItem('reflectOS_v1') || 'null');
    if (!o) return Promise.resolve(EMPTY);
    const logs = o.logs || [];
    const checkMap = {};
    (o.checks || []).forEach(c => { if (c && c.id) checkMap[c.id] = c.state || (c.done ? 'done' : 'todo'); });
    const importantQuestions = [];
    const activeExperiments = [];
    logs.filter(r => r && r.status !== 'draft').forEach(r => {
      if (r.question) r.question.split('\n').filter(l => l.trim()).forEach((line, i) => {
        if ((checkMap['q_'+r.id+'_'+i] || 'todo') === 'important') importantQuestions.push({ text: line.trim(), date: r.date || '' });
      });
      if (r.nextExp) r.nextExp.split('\n').filter(l => l.trim()).forEach((line, i) => {
        if ((checkMap['e_'+r.id+'_'+i] || 'todo') === 'doing') activeExperiments.push({ text: line.trim(), date: r.date || '' });
      });
    });
    const themes = (o.themes || []).filter(t => t && t.status !== '完了')
      .map(t => ({ title: t.title || '', status: t.status || '', priority: t.priority || '', question: t.question || '', hypothesis: t.hypothesis || '' }));
    return Promise.resolve({ themes, importantQuestions, activeExperiments });
  } catch(e) { return Promise.resolve(EMPTY); }
}

// ── Reflect OS 完全バックアップ（localStorage: reflectOS_v1 / stores: logs,themes,settings,checks）──
const REFLECT_STORES = ['logs','themes','settings','checks'];
function dumpReflectIDB() {
  // Reflect OSはlocalStorage(reflectOS_v1)へ移行済み。互換のため{version,stores}形式で返す
  try {
    const o = JSON.parse(localStorage.getItem('reflectOS_v1') || 'null') || {};
    const stores = {}; REFLECT_STORES.forEach(s => { stores[s] = Array.isArray(o[s]) ? o[s] : []; });
    return Promise.resolve({ version: 1, stores });
  } catch(e) { return Promise.resolve({ version: 1, stores: {} }); }
}
function restoreReflectIDB(dump) {
  try {
    if (!dump || !dump.stores) return Promise.resolve(false);
    const cur = JSON.parse(localStorage.getItem('reflectOS_v1') || 'null') || {logs:[],themes:[],settings:[],checks:[]};
    Object.keys(dump.stores).forEach(s => { cur[s] = Array.isArray(dump.stores[s]) ? dump.stores[s] : []; });
    ['logs','themes','settings','checks'].forEach(s => { if(!Array.isArray(cur[s])) cur[s] = []; });
    localStorage.setItem('reflectOS_v1', JSON.stringify(cur));
    return Promise.resolve(true);
  } catch(e) { return Promise.resolve(false); }
}

// パース済みオブジェクト/配列を取り込む共通ロジック（ファイル取込・GDrive自動取込で共用）
// 冪等：ID重複スキップ／ドラフトは日付キー上書き／briefは上書き。全消しはしない。
function applyAixTasks(parsed){
  const isNewFormat = !Array.isArray(parsed) && typeof parsed === 'object' && parsed !== null;
  const tasks = isNewFormat ? (parsed.tasks || []) : parsed;
  if (!Array.isArray(tasks)) throw new Error('形式エラー: tasksが配列ではありません');

  // ① tasks → shot-task-os-v1 にマージ
  const existing = JSON.parse(localStorage.getItem('shot-task-os-v1') || '[]');
  const existingIds = new Set(existing.map(t => t.id));
  let added = 0;
  for (const task of tasks) {
    if (!task.id || existingIds.has(task.id)) continue;
    existing.push(task);
    existingIds.add(task.id);
    added++;
  }
  localStorage.setItem('shot-task-os-v1', JSON.stringify(existing));

  let draftCount = 0;
  let briefLoaded = false;
  if (isNewFormat) {
    // ② aix_drafts → localStorage['aix_drafts'] にマージ（同日付は上書き）
    if (Array.isArray(parsed.aix_drafts) && parsed.aix_drafts.length > 0) {
      const existingDrafts = JSON.parse(localStorage.getItem('aix_drafts') || '[]');
      const draftMap = {};
      const keyOf = d => d && (d.targetDate || d.date);
      for (const d of existingDrafts) { const k = keyOf(d); if (k) draftMap[k] = d; }
      for (const d of parsed.aix_drafts) {
        const k = keyOf(d);
        if (k) { if (!d.targetDate) d.targetDate = d.date; draftMap[k] = d; draftCount++; }
      }
      const mergedDrafts = Object.values(draftMap).sort((a, b) => (((a.targetDate||a.date||'') < (b.targetDate||b.date||'')) ? 1 : -1));
      localStorage.setItem('aix_drafts', JSON.stringify(mergedDrafts));
    }
    // ③ brief → localStorage['aix_draft_latest'] に保存
    if (parsed.brief && typeof parsed.brief === 'object') {
      localStorage.setItem('aix_draft_latest', JSON.stringify(parsed.brief));
      briefLoaded = true;
    }
    // ④ brief_weekly / brief_monthly → 1day OSの週次/月次タブ用（該当日のみ含まれる）
    if (parsed.brief_weekly && typeof parsed.brief_weekly === 'object') {
      localStorage.setItem('aix_review_weekly', JSON.stringify(parsed.brief_weekly));
      briefLoaded = true;
    }
    if (parsed.brief_monthly && typeof parsed.brief_monthly === 'object') {
      localStorage.setItem('aix_review_monthly', JSON.stringify(parsed.brief_monthly));
      briefLoaded = true;
    }
  }
  return { added, draftCount, briefLoaded, isNewFormat };
}

function handleAixTaskImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const res = applyAixTasks(parsed);

      if (res.added === 0 && res.draftCount === 0 && !res.briefLoaded) {
        toast('追加できる新規データはありませんでした');
        e.target.value = '';
        return;
      }

      renderHome();

      if (res.isNewFormat) {
        toast(`✅ AIタスク${res.added}件・1dayドラフト${res.draftCount}件・Briefを取り込みました`);
      } else {
        toast(`✅ ${res.added}件のAIタスクを追加しました`);
      }
    } catch(err) {
      alert('読込エラー: JSONファイルが正しくありません\n' + (err.message || ''));
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function handleJSONImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!confirm(`JSONから読み込みます。現在のデータは上書きされます。よろしいですか？\n（保存日時: ${data.savedAt || '不明'}）`)) return;
      restoreAllOSData(data);
      if (data.reflectOS_idb) await restoreReflectIDB(data.reflectOS_idb);
      renderHome();
      toast('✅ JSONから読み込みました（Reflect含む）');
    } catch(err) {
      alert('読込エラー: JSONファイルが正しくありません');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

// ── DATE ──
const isOv = d => d && d < TODAY;
const isTd = d => d && d === TODAY;
const is3  = d => { if(!d) return false; const diff=(new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000; return diff>0&&diff<=3; };
const is7  = d => { if(!d) return false; const diff=(new Date(d+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000; return diff>3&&diff<=7; };
const addD = (base,n) => { const d=new Date((base||TODAY)+'T00:00:00'); d.setDate(d.getDate()+n); return d.toLocaleDateString('sv'); };
function fmtDate(s){
  if(!s) return '';
  const dt = new Date(s+'T00:00:00');
  const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
  return `${s.slice(5).replace('-','/')}(${dow})`;
}

function get100ListItems(){
  try{
    const raw = localStorage.getItem('yaritai_items_v4');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }

function allTasks(){
  const tasks = [];

  // ── Routine: status は '未完了' が通常。'停止' と '完了' を除外
  getRt().forEach(t => {
    if(t.status==='停止'||t.status==='完了') return;
    tasks.push({ id:'r_'+t.id, rawId:t.id, src:'routine',
      title:t.title||t.name||'', due:t.nextDate||null,
      status:t.status||'未完了', updAt:t.updatedAt||t.lastDone||null,
      addDays:t.addDays||7,
      memo:t.memo||'', url:t.url||'', note:t.note||'', notify:t.notifyMsg||'',
    });
  });

  // ── Shot: status は 'todo'/'doing'/'pending'/'done'/'rejected'。'done'/'pending'/'rejected'(不採用) を除外
  //    dueDate なしのタスクも表示対象（期限未設定として扱う）
  getSh().forEach(t => {
    if(t.status==='done'||t.status==='pending'||t.status==='rejected') return;
    tasks.push({ id:'s_'+t.id, rawId:t.id, src:'shot',
      title:t.title||'', due:t.dueDate||null,
      status:t.status||'todo', updAt:t.updatedAt||null,
      priority:t.priority||'normal',
      memo:t.memo||t.description||'', url:t.url||'', link:t.link||'', note:t.note||'',
    });
  });

  // ── Project: forkのstatus は 'future'/'past'。eventsは '完了' で除外
  //    'past'（実施済み分岐点）と '完了' を除外し、'future' を表示
  const pd = getPj();
  (pd.projects||[]).forEach(p => {
    if(p.status==='完了') return;
    const pn = p.name||p.title||'';
    const addFork = (item) => {
      if(item.status==='past'||item.status==='完了') return;
      tasks.push({ id:`p_fork_${item.id}`, rawId:item.id,
        src:'project', kind:'fork', pId:p.id, pName:pn,
        title:`[${pn}] ${item.title||''}`,
        shortTitle:item.title||'',
        due:item.date||null, status:item.status||'future',
        updAt:item.updatedAt||p.updatedAt||null,
        pImport:p.importance||0,
        memo:item.what||item.memo||'', url:p.sheetUrl||'', note:item.why||'',
      });
    };
    const addEvent = (item) => {
      if(item.status==='完了') return;
      tasks.push({ id:`p_event_${item.id}`, rawId:item.id,
        src:'project', kind:'event', pId:p.id, pName:pn,
        title:`[${pn}] ${item.title||item.content||''}`,
        shortTitle:item.title||item.content||'',
        due:item.date||null, status:item.status||'',
        updAt:item.updatedAt||p.updatedAt||null,
        pImport:p.importance||0,
        memo:item.memo||'', url:p.sheetUrl||'', note:item.note||'',
      });
    };
    (p.forks||[]).forEach(f=>addFork(f));
    (p.events||[]).forEach(e=>addEvent(e));
  });

  // Task OS 専用 WAITING フィルタ（各OS側データは変更しない）
  return tasks.filter(t => !isHidden(t.id));
}

function score(t){
  let s=0;
  if(isOv(t.due)) s+=50;
  if(isTd(t.due)) s+=40;
  if(t.src==='project') s+=8;
  return s;
}

// ── LINK UTILS ──
function extractLinks(t){
  const links=[], seen=new Set();
  const fields=[t.url,t.link,t.memo,t.note,t.notify,t.description,t.detail];
  const re=/https?:\/\/[^\s<>"'）】\]）]+/gi;
  fields.forEach(f=>{
    if(!f||typeof f!=='string') return;
    (f.match(re)||[]).forEach(u=>{
      u=u.replace(/[.,;:!?）】\]）]+$/,'');
      if(!seen.has(u)){ seen.add(u); links.push({ url:u, label:shortUrl(u) }); }
    });
  });
  if(Array.isArray(t.urls)) t.urls.forEach(u=>{
    const url=typeof u==='string'?u:u.url||'';
    if(url&&!seen.has(url)){ seen.add(url); links.push({ url, label:typeof u==='object'?(u.label||shortUrl(url)):shortUrl(url) }); }
  });
  return links;
}
function shortUrl(url){
  try{ const u=new URL(url); return u.hostname.replace(/^www\./,'')+(u.pathname.length>14?u.pathname.slice(0,12)+'…':u.pathname); }catch{ return url.slice(0,24); }
}
function linkIcon(url){
  const os=['routine','shot','project'].find(s=>url.toLowerCase().includes(s));
  if(os) return '◈';
  return url.includes('docs.google')||url.includes('notion')||url.includes('.pdf')||url.includes('drive.google') ? '📄' : '🌐';
}
function renderLinks(t){
  const links=extractLinks(t);
  if(!links.length) return '';
  if(links.length===1){
    const l=links[0];
    const icon=linkIcon(l.url);
    const osMatch=['routine','shot','project'].find(s=>l.url.toLowerCase().includes(s));
    if(osMatch){
      return `<button class="link-chip" onclick="event.stopPropagation();nav('${osMatch}')">${icon} ${esc(l.label)}</button>`;
    }
    return `<a href="${esc(l.url)}" target="_blank" class="link-chip" onclick="event.stopPropagation()">${icon} ${esc(l.label)}</a>`;
  }
  return `<button class="link-chip" onclick="event.stopPropagation();openLinkModal(${J(JSON.stringify(links))})">🔗 ${links.length}件</button>`;
}
function openLinkModal(raw){
  let links; try{ links=typeof raw==='string'?JSON.parse(raw):raw; }catch{return;}
  document.getElementById('linkModalList').innerHTML = links.map(l=>{
    const icon=linkIcon(l.url);
    const osMatch=['routine','shot','project'].find(s=>l.url.toLowerCase().includes(s));
    if(osMatch) return `<div class="link-item" onclick="closeModal('linkModal');nav('${osMatch}')"><span class="link-item-icon">${icon}</span><div class="link-item-body"><div class="link-item-label">${esc(osMatch.toUpperCase()+' OS')}</div><div class="link-item-url">${esc(l.url)}</div></div></div>`;
    return `<a class="link-item" href="${esc(l.url)}" target="_blank" rel="noopener" onclick="closeModal('linkModal')"><span class="link-item-icon">${icon}</span><div class="link-item-body"><div class="link-item-label">${esc(l.label)}</div><div class="link-item-url">${esc(l.url)}</div></div></a>`;
  }).join('');
  document.getElementById('linkModal').classList.remove('hid');
}

// ── WAITING (Task OS専用・各OS非破壊) ──
const WAIT_KEY = 'taskOS_hiddenTasks';

function getWaiting(){
  try{ return JSON.parse(localStorage.getItem(WAIT_KEY))||{}; }catch{ return {}; }
}
function saveWaiting(obj){ localStorage.setItem(WAIT_KEY, JSON.stringify(obj)); }

function isHidden(taskId){
  const w = getWaiting();
  if(!w[taskId]) return false;
  // 復元日が来ていたら自動解除
  if(w[taskId].restoreAt && w[taskId].restoreAt <= TODAY){
    delete w[taskId]; saveWaiting(w); return false;
  }
  return true;
}

// days: 1=明日, 3=3日, 7=1週間, 30=来月
function hideTask(taskId, title, days){
  const w = getWaiting();
  const d = new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()+days);
  const restoreAt = d.toLocaleDateString('sv');
  w[taskId] = { hiddenAt: TODAY, restoreAt, reason:'waiting', title };
  saveWaiting(w);
  updateWaitingCount();
  closeWaitPop();
  toast('⏳ 待ち → '+restoreAt);
  refresh();
}

// ─ ポップオーバー管理
let _popEl = null;
function closeWaitPop(){
  if(_popEl){ _popEl.remove(); _popEl=null; }
}
function showWaitPop(btn){
  closeWaitPop();
  const taskId    = btn.dataset.taskid;
  const taskTitle = btn.dataset.tasktitle || '';
  const options = [
    { label:'明日',   days:1  },
    { label:'3日後',  days:3  },
    { label:'1週間',  days:7  },
    { label:'来月',   days:30 },
  ];
  const pop = document.createElement('div');
  pop.className = 'wait-pop';
  pop.innerHTML =
    `<div class="wait-pop-label">WAIT UNTIL</div>` +
    options.map(o=>
      `<button class="wait-pop-item" data-days="${o.days}">${o.label}</button>`
    ).join('');
  // data属性経由でクリックイベントを付与（HTML属性内の文字列エスケープ問題を回避）
  pop.querySelectorAll('.wait-pop-item').forEach(btn=>{
    btn.addEventListener('click', ()=>hideTask(taskId, taskTitle, parseInt(btn.dataset.days)));
  });
  // ボタン基準で配置
  const anchor = btn.closest('.wait-anchor') || btn.parentElement;
  anchor.style.position = 'relative';
  anchor.appendChild(pop);
  _popEl = pop;
  // 外クリックで閉じる（1回限りのリスナ）
  setTimeout(()=>{
    document.addEventListener('click', function outside(e){
      if(!pop.contains(e.target)){ closeWaitPop(); document.removeEventListener('click', outside); }
    });
  }, 0);
}

function unhideTask(taskId){
  const w = getWaiting();
  delete w[taskId]; saveWaiting(w);
  updateWaitingCount();
  toast('✓ 待ち解除しました');
  refresh();
  renderWaitingList();
}

let _launcherOpen = false;

function toggleLauncher(e){
  e.stopPropagation();
  _launcherOpen ? closeLauncher() : openLauncher();
}
function openLauncher(){
  _launcherOpen = true;
  document.getElementById('launcherOverlay').classList.remove('hid');
  document.getElementById('launcherDrawer').classList.remove('hid');
  renderLauncherList('');
  setTimeout(()=>document.getElementById('launcherSearch').focus(), 80);
}
function closeLauncher(){
  _launcherOpen = false;
  document.getElementById('launcherOverlay').classList.add('hid');
  document.getElementById('launcherDrawer').classList.add('hid');
  document.getElementById('launcherSearch').value = '';
}
function filterLauncher(q){
  renderLauncherList(q.trim().toLowerCase());
}
function renderLauncherList(q){
  const el = document.getElementById('launcherList');
  let h = '';
  let totalHits = 0;
  LAUNCHER_APPS.forEach(group => {
    const items = q
      ? group.items.filter(i => i.name.toLowerCase().includes(q))
      : group.items;
    if(!items.length) return;
    totalHits += items.length;
    h += `<div class="launcher-group-label">${esc(group.group)}</div>`;
    items.forEach(item => {
      // アイコン: base64画像 or フォールバック文字
      const iconHtml = item.iconB64
        ? `<img src="${item.iconB64}" width="28" height="28" style="border-radius:7px;display:block;">`
        : `<span style="font-size:18px;">${item.icon||'◈'}</span>`;
      if(item.internal){
        // Task OS 内部ナビ（サイドバー遷移）
        h += `<div class="launcher-item" onclick="closeLauncher();nav('${item.internal}')">
          <div class="launcher-item-icon">${iconHtml}</div>
          <div class="launcher-item-name">${esc(item.name)}</div>
        </div>`;
      } else if(item.frameId){
        const navKeyMap = {
          'frame-shot': 'shot', 'frame-routine': 'routine', 'frame-project': 'project',
          'frame-reflect': 'reflect', 'frame-1day': '1day', 'frame-hitomemo': 'hitomemo',
          'frame-social': 'social', 'frame-100list': '100list', 'frame-kosolog': 'kosolog'
        };
        const navKey = navKeyMap[item.frameId];
        if(navKey){
          h += `<div class="launcher-item" onclick="closeLauncher();nav('${navKey}')">
            <div class="launcher-item-icon">${iconHtml}</div>
            <div class="launcher-item-name">${esc(item.name)}</div>
          </div>`;
        } else {
          h += `<div class="launcher-item" onclick="closeLauncher();window.open('${item.frameSrc}','_blank')">
            <div class="launcher-item-icon">${iconHtml}</div>
            <div class="launcher-item-name">${esc(item.name)}</div>
          </div>`;
        }
      }
    });
  });
  if(!totalHits){
    h = `<div class="launcher-empty">「${esc(q)}」に一致するOSなし</div>`;
  }
  el.innerHTML = h;
}

function updateWaitingCount(){
  const w = getWaiting();
  // 期限切れを自動解除してカウント
  let count = 0;
  Object.keys(w).forEach(id=>{
    if(w[id].restoreAt && w[id].restoreAt <= TODAY){ delete w[id]; }
    else count++;
  });
  saveWaiting(w);
  const el = document.getElementById('waiting-count');
  if(el) el.textContent = count > 0 ? count : '';
}

function openWaitingList(){
  renderWaitingList();
  document.getElementById('waitingModal').classList.remove('hid');
}

function renderWaitingList(){
  const w = getWaiting();
  const tasks = allTasks();
  const list = document.getElementById('waitingList');
  const ids = Object.keys(w).filter(id => !(w[id].restoreAt && w[id].restoreAt <= TODAY));

  if(!ids.length){
    list.innerHTML = '<div class="empty-waiting">待ちタスクはありません</div>';
    return;
  }

  list.innerHTML = ids.map(id => {
    const info = w[id];
    const t = tasks.find(x=>x.id===id);
    const title = t ? t.title : (info.title||id);
    return `<div class="waiting-row">
      <div class="ni-dot" style="background:#9B7FD9;flex-shrink:0;width:7px;height:7px;border-radius:50%;"></div>
      <div class="waiting-row-title" title="${esc(title)}">${esc(title)}</div>
      <div class="waiting-row-meta">→ ${info.restoreAt||'?'}</div>
      <button class="btn-wait" onclick="unhideTask('${id}')">解除</button>
    </div>`;
  }).join('');
}

const now = () => new Date().toISOString();
const refresh = () => { if(curView==='home') renderHome(); else if(curView==='today') renderToday(); };

// 別タブ/別ウィンドウのOS変更（ショットOS等）を自動反映する。
// storageイベントは「変更した側ではない」同一オリジンの開いている文書で発火するため、
// 別窓のショットOSで追加・編集すると、こちらのHOME/今日ビューが自動で最新化される。
let _refreshTimer = null;
function _scheduleRefresh(){ clearTimeout(_refreshTimer); _refreshTimer = setTimeout(refresh, 120); }
window.addEventListener('storage', function(e){ if(e && e.key) _scheduleRefresh(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) _scheduleRefresh(); });
window.addEventListener('focus', function(){ _scheduleRefresh(); });

      <div class="top-card-title">${esc(top.title)}</div>

function homeUrgent(ov, td) {
  let h = '';
// ─ 今やる（期限超過 + 今日）
  const urgentAll = [...new Map([...ov,...td].map(t=>[t.id,t])).values()];
  if(urgentAll.length){
    h += secLabel('🔥 今やる', urgentAll.length);
    urgentAll.slice(0,8).forEach(t => h += trowHtml(t));
    h += '</div>';
  }
  return h;
}

function home100List() {
  let h = '';
// 100リスト（期限切れ・当月、折りたたみ）
  const allList = get100ListItems().filter(function(i){ return !i.completed; });
  const yrL = new Date().getFullYear();
  const moL = new Date().getMonth() + 1;
  const listOv = allList.filter(function(i){
    if(!i.year) return false;
    if(i.year < yrL) return true;
    if(i.year === yrL && i.month && i.month < moL) return true;
    return false;
  });
  const listThisMonth = allList.filter(function(i){ return i.year === yrL && i.month === moL; });
  const listItems = Array.from(new Map([...listOv, ...listThisMonth].map(function(i){ return [i.id,i]; })).values());
  if(listItems.length){
    const lOpen = !!home100ListOpen;
    let rowsHtml = '';
    listItems.slice(0,10).forEach(function(i){
      const isOvItem = i.year < yrL || (i.year === yrL && i.month && i.month < moL);
      const dateStr = (i.year||'') + (i.month ? '/' + String(i.month).padStart(2,'0') : '');
      const dateColor = isOvItem ? 'var(--r)' : 'var(--text3)';
      rowsHtml += '<div class="trow">';
      rowsHtml += '<div class="trow-title">' + esc(i.title) + '</div>';
      rowsHtml += '<div class="trow-meta"><span style="font-size:11px;color:' + dateColor + ';">' + dateStr + '</span></div>';
      rowsHtml += '<button class="btn-open" data-nav="100list" onclick="nav(this.dataset.nav)">開く</button>';
      rowsHtml += '</div>';
    });
    const moreRow = listItems.length > 10 ? '<div style="font-size:13px;color:var(--text3);padding:6px 6px 2px;">他 ' + (listItems.length-10) + '件</div>' : '';
    const body = lOpen ? '<div class="week-body">' + rowsHtml + moreRow + '</div>' : '';
    const arrowCls = 'week-hd-arrow' + (lOpen ? ' open' : '');
    h += '<div class="week-wrap">';
    h += '<div class="week-hd" onclick="toggle100List()">';
    h += '<span class="week-hd-label">≡ 100リスト — 期限切れ・当月</span>';
    h += '<span class="week-hd-count">' + listItems.length + '</span>';
    h += '<span class="' + arrowCls + '" id="list100-arrow">▶</span>';
    h += '</div>' + body + '</div>';
  }
  return h;
}

function homeProjects(activePj) {
  let h = '';
// ─ Project 進行（直近30日イベント、折りたたみ）
  if(activePj.length){
    const d30 = new Date(); d30.setDate(d30.getDate()-30);
    const from30 = d30.toLocaleDateString('sv');

    const pjOpen = !!homePjOpen;
    const pjArrowCls = 'week-hd-arrow' + (pjOpen ? ' open' : '');
    h += '<div class="week-wrap"><div class="week-hd" onclick="togglePj()">'
      +'<span class="week-hd-label">◈ Project — 直近30日</span>'
      +'<span class="week-hd-count">'+activePj.length+'</span>'
      +'<span class="'+pjArrowCls+'">▶</span>'
      +'</div>';
    if(pjOpen){
      h += '<div class="week-body">';
      activePj.forEach(p => {
        const evts = (p.events||[])
          .filter(e => e.date && e.date >= from30)
          .sort((a,b) => (a.date||'').localeCompare(b.date||''))
          .slice(0,3);
        let evtRows = '';
        if(evts.length){
          evtRows = evts.map(e => {
            const d = e.date ? e.date.replace(/^\d{4}-/,'').replace('-','/') : '';
            const isOver = e.date && e.date < TODAY;
            const overStyle = isOver ? 'background:rgba(220,50,50,0.08);border-left:3px solid var(--r);' : '';
            const dateColor = isOver ? 'var(--r)' : 'var(--text3)';
            return '<div class="trow" style="'+overStyle+'">'
              +'<div class="trow-title">'+esc(e.title||'')+'</div>'
              +'<div class="trow-date" style="color:'+dateColor+';">'+d+'</div>'
              +'<button class="btn-open" data-nav="project" onclick="nav(this.dataset.nav)">開く</button>'
              +'</div>';
          }).join('');
        } else {
          evtRows = '<div style="font-size:12px;color:var(--text3);padding:4px 8px;">直近イベントなし</div>';
        }
        h += '<div style="margin-bottom:6px;">'
          +'<div style="display:flex;align-items:center;gap:8px;padding:6px 14px;font-weight:600;font-size:15px;border-bottom:1px solid var(--border);color:var(--text1);">'
          +esc(p.name||p.title||'')
          +'<button class="btn-open" style="margin-left:auto;" data-nav="project" onclick="nav(this.dataset.nav)">開く</button>'
          +'</div>'
          +evtRows
          +'</div>';
      });
      h += '</div>';
    }
    h += '</div>';
  }
  return h;
}

// ── TODAY ──
function renderToday(){
  const dow=['日','月','火','水','木','金','土'][new Date().getDay()];
  document.getElementById('today-date').textContent=`${TODAY}(${dow})`;

  const tasks=allTasks();
  const map=new Map();
  tasks.filter(t=>isOv(t.due)||isTd(t.due)).forEach(t=>map.set(t.id,t));
  getRt().filter(t=>t.status!=='停止'&&t.status!=='完了'&&t.nextDate&&t.nextDate<=TODAY).forEach(t=>{
    const id='r_'+t.id;
    if(!map.has(id)) map.set(id,{ id, rawId:t.id, src:'routine',
      title:t.title||t.name, due:t.nextDate, status:'',
      url:t.url||'', memo:t.memo||'', note:t.note||'', notify:t.notify||'',
    });
  });
  const all=[...map.values()];
  const ov=all.filter(t=>isOv(t.due));
  const td=all.filter(t=>isTd(t.due)&&!isOv(t.due));
  const nd=all.filter(t=>!t.due);
  const total=all.length;
  const doneC=Object.values(done).filter(Boolean).length;
  const pct=total?Math.round(doneC/total*100):0;

  document.getElementById('today-hd-bar').innerHTML=`
    <div class="today-hd-title">今日のタスク <span style="font-size:14px;font-weight:400;color:var(--text3);">${total}件</span></div>
    <div class="prog-bg"><div class="prog-bar" id="prog" style="width:${pct}%"></div></div>
    <div class="today-count" id="prog-label">完了 ${doneC} / ${total} &nbsp;${pct}%</div>`;

  let h='';
  if(!total){ h='<div class="empty">🎉 今日のタスクはありません</div>'; }
  else {
    if(ov.length){ h+=`<div class="today-sec">⚠ 期限超過 (${ov.length})</div><div class="today-list">${ov.map(t=>todayRow(t)).join('')}</div>`; }
    if(td.length){ h+=`<div class="today-sec">☀ 今日期限 (${td.length})</div><div class="today-list">${td.map(t=>todayRow(t)).join('')}</div>`; }
    if(nd.length){ h+=`<div class="today-sec">期限未設定 (${nd.length})</div><div class="today-list">${nd.map(t=>todayRow(t)).join('')}</div>`; }
  }
  document.getElementById('today-content').innerHTML=h;
}

function todayRow(t){
  const ov=isOv(t.due), td=isTd(t.due);
  const isDone=done[t.id];
  const links=renderLinks(t);
  let acts='';
  const tid2  = esc(t.id);
  const ttl2  = esc(t.title);
  const tWaitBtn = `<span class="wait-anchor"><button class="btn-wait" data-taskid="${tid2}" data-tasktitle="${ttl2}" onclick="event.stopPropagation();showWaitPop(this)" title="待ち期間を選択">⏳</button></span>`;
  if(t.src==='shot') acts=`<button class="btn-done" onclick="completeSh('${t.rawId}');markDone('${t.id}')">✓</button>${tWaitBtn}`;
  else if(t.src==='routine') acts=`<button class="btn-done" onclick="completeRt('${t.rawId}');markDone('${t.id}')">✓</button>${tWaitBtn}`;
  else acts=`<button class="btn-done" onclick="completePj('${t.pId}','${t.kind}','${t.rawId}');markDone('${t.id}')">✓</button>${tWaitBtn}`;

  return `<div class="t-row" id="tr-${esc(t.id)}" style="${isDone?'opacity:.4;':''}">
    <input type="checkbox" class="t-chk" ${isDone?'checked':''} onchange="chkToggle('${t.id}',this.checked)" onclick="event.stopPropagation()">
    <div class="t-title ${isDone?'done':''}">${esc(t.title)}</div>
    ${links}
    ${osTag(t.src)}
    ${t.due?`<div class="t-date ${ov?'ov':td?'td':''}">${fmtDate(t.due)}</div>`:''}
    <div class="t-actions">${acts}</div>
  </div>`;
}

function markDone(id){ done[id]=true; chkToggle(id,true); }
function chkToggle(id, checked){
  done[id]=checked;
  const row=document.getElementById('tr-'+id);
  if(row){
    row.style.opacity=checked?'0.4':'1';
    const t=row.querySelector('.t-title');
    if(t) t.className='t-title'+(checked?' done':'');
    const c=row.querySelector('.t-chk'); if(c) c.checked=checked;
  }
  // update progress
  const all=document.querySelectorAll('[id^="tr-"]').length;
  const dc=Object.values(done).filter(Boolean).length;
  const pct=all?Math.round(dc/all*100):0;
  const prog=document.getElementById('prog'); if(prog) prog.style.width=pct+'%';
  const lbl=document.getElementById('prog-label'); if(lbl) lbl.textContent=`完了 ${dc} / ${all}  ${pct}%`;
}

// ── SEARCH ──
function setF(f,btn){
  sFilter=f;
  document.querySelectorAll('.filter-bar .fc').forEach(b=>b.classList.remove('act'));
  btn.classList.add('act'); doSearch();
}
function doSearch(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase().trim();
  const res=document.getElementById('search-results');
  if(!q){ res.innerHTML='<div class="empty" style="padding:30px;">キーワードを入力</div>'; return; }
  const tasks=allTasks();
  const hits=tasks.filter(t=>{
    if(sFilter==='link') return extractLinks(t).length>0;
    if(sFilter!=='all'&&t.src!==sFilter) return false;
    const lText=extractLinks(t).map(l=>l.url+' '+l.label).join(' ');
    return [t.title,t.pName||'',lText].join(' ').toLowerCase().includes(q);
  });
  if(!hits.length){ res.innerHTML=`<div class="empty">「${esc(q)}」に一致なし</div>`; return; }
  res.innerHTML=`<div style="font-size:13px;color:var(--text3);margin-bottom:10px;">${hits.length}件</div>`
    +hits.map(t=>trowHtml(t)).join('');
}

// ── UTILS ──
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const J   = s => JSON.stringify(String(s||''));
function osTag(src){
  if(src==='routine') return '<span class="os-tag tag-r">R</span>';
  if(src==='shot')    return '<span class="os-tag tag-s">S</span>';
  if(src==='project') return '<span class="os-tag tag-p">P</span>';
  return '';
}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}
function updateClock(){
  const n=new Date(), hh=String(n.getHours()).padStart(2,'0'), mm=String(n.getMinutes()).padStart(2,'0');
  const el=document.getElementById('home-clock'); if(el) el.textContent=`${hh}:${mm}`;
  const sb=document.getElementById('sbDate');
  if(sb){ const dow=['日','月','火','水','木','金','土'][n.getDay()]; sb.textContent=`${TODAY}(${dow})`; }
}

document.addEventListener('DOMContentLoaded', ()=>{
  updateWaitingCount();
  updateClock();
  setInterval(updateClock, 30000);
  renderHome();
  setInterval(()=>{ if(curView==='home') renderHome(); }, 60000);
  ['pjModal','linkModal','waitingModal'].forEach(id=>{
    document.getElementById(id).addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(id); });
  });
});

  font-size:16px;overflow:hidden;background:var(--bg);
}
.launcher-item-name{font-size:15px;font-weight:500;flex:1;}
.launcher-empty{padding:16px;text-align:center;font-size:14px;color:var(--text3);}

  padding:5px 13px;border-radius:6px;border:none;

.shot-memo{line-height:1.6;}
</style>

<script>
(function(){
  var SHOT_KEY = 'shot-task-os-v1';
  var CAT_KEY  = 'shot-task-os-categories-v1';
  var DEFAULT_CATS = ['今日のタスク','JSS関連','チーム竹嶋づくり','3AC2030VISION',
    '増資プロジェクト','海外事業撤退','セキュリティ事業','前田COO作戦',
    'その他','学習・インプット','自己探求','ネットワーキング'];

  function getShotCats(){
    try{ var r=JSON.parse(localStorage.getItem(CAT_KEY)); return(Array.isArray(r)&&r.length)?r:DEFAULT_CATS; }catch(e){return DEFAULT_CATS;}
  }
  function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  window.openShotAdd = function(){
    var cats = getShotCats();
    var sel  = document.getElementById('shotCat');
    sel.innerHTML = cats.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');
    document.getElementById('shotTitle').value = '';
    document.getElementById('shotMemo').value  = '';
    document.getElementById('shotModal').classList.remove('hid');
    setTimeout(function(){document.getElementById('shotTitle').focus();}, 60);
  };

  window.closeShotAdd = function(){
    document.getElementById('shotModal').classList.add('hid');
  };

  window.commitShotAdd = function(){
    var title = document.getElementById('shotTitle').value.trim();
    if(!title){ document.getElementById('shotTitle').focus(); return; }
    var memo  = document.getElementById('shotMemo').value.trim();
    var cat   = document.getElementById('shotCat').value || '今日のタスク';
    var now   = new Date().toISOString();
    var tasks = [];
    try{ tasks = JSON.parse(localStorage.getItem(SHOT_KEY))||[]; }catch(e){}
    tasks.push({ id:genId(), title:title, category:cat, priority:'normal',
      status:'todo', dueDate:null, memo:memo, createdAt:now, completedAt:null, updatedAt:now });
    localStorage.setItem(SHOT_KEY, JSON.stringify(tasks));
    closeShotAdd();
    toast('Shot に追加: '+title);
    var frame = document.getElementById('frame-shot');
    if(frame && !document.getElementById('view-shot').classList.contains('hid')){
      frame.contentWindow.location.reload();
    }
  };

  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeShotAdd();
    if(e.key==='Enter' && !e.shiftKey && document.activeElement===document.getElementById('shotTitle')){
      e.preventDefault(); commitShotAdd();
    }
  });

  document.addEventListener('DOMContentLoaded', function(){
    document.getElementById('shotModal').addEventListener('click', function(e){
      if(e.target===e.currentTarget) closeShotAdd();
    });
  });
})();
</script>

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js');

<script>
// ===== GDrive連携（A: スナップショット送出 / C: aix-tasks自動取り込み）=====
// 方針：一方向。スナップショットは「書き出すだけ」、GDriveからlocalStorageへ全消し復元はしない（先祖返り防止）。
const GD_CLIENT_ID = '450582924828-c89h2mia7e396dbilpthguhtb77p6fmr.apps.googleusercontent.com';
const GD_SCOPE = 'https://www.googleapis.com/auth/drive';
const GD_REDIRECT = location.origin + (location.pathname.endsWith('/index.html') ? location.pathname : location.pathname.replace(/\/$/, '') + '/index.html');
const GD_TOKEN_KEY = 'gdrive_token_taskos';
const GD_FOLDER_ID = '1dEA4ZZJi5E97Dk_MRNwG6EbBlINlMO3U'; // aix-drafts（3Aアカウント）
const GD_AIX_FILE = 'aix-tasks.json';
const GD_SNAPSHOT_FILE = 'myapps-all-backup.json';
let gdToken = null;

function gdHandleRedirect(){
  const h = new URLSearchParams(location.hash.slice(1));
  const t = h.get('access_token');
  if(t){ gdToken = t; localStorage.setItem(GD_TOKEN_KEY, t); history.replaceState(null, '', location.pathname); }
  else { const s = localStorage.getItem(GD_TOKEN_KEY); if(s) gdToken = s; }
}
function gdConnect(){
  const p = new URLSearchParams({
    client_id: GD_CLIENT_ID, redirect_uri: GD_REDIRECT, response_type:'token',
    scope: GD_SCOPE, prompt:'select_account', include_granted_scopes:'true'
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + p.toString();
}
function gdClear(){ gdToken = null; localStorage.removeItem(GD_TOKEN_KEY); gdUpdateBtn(); }
function gdToggle(){ if(gdToken) gdAutoSync(true); else gdConnect(); }
function gdUpdateBtn(){ const b=document.getElementById('gdriveBtn'); if(b) b.textContent = gdToken ? '☁️ GDrive同期' : '☁️ GDrive接続'; }
function gdSetStatus(s){
  const b=document.getElementById('gdriveBtn'); if(!b) return;
  const m={ syncing:'☁️ 同期中…', ok:'☁️ GDrive同期', err:'☁️ 同期エラー(再試行)' };
  b.textContent = m[s] || (gdToken ? '☁️ GDrive同期' : '☁️ GDrive接続');
}

async function gdFetch(url, opts){
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization':'Bearer '+gdToken }, opts.headers||{});
  const r = await fetch(url, opts);
  if(r.status===401){ const e=new Error('unauth'); e.code=401; throw e; }
  if(!r.ok){ const e=new Error('http '+r.status); e.code=r.status; throw e; }
  return r;
}
async function gdFindInFolder(name){
  const q = encodeURIComponent(`'${GD_FOLDER_ID}' in parents and name='${name}' and trashed=false`);
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&orderBy=modifiedTime desc&pageSize=5`);
  const d = await r.json();
  return (d.files && d.files[0]) || null;
}
async function gdDownload(id){
  const r = await gdFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  return await r.text();
}
async function gdUpload(name, contentStr){
  // 既存があればその上に上書き、無ければaix-draftsフォルダ内に新規作成（2ステップ：作成→media PATCH）
  let existing = await gdFindInFolder(name);
  let id;
  if(existing){ id = existing.id; }
  else {
    const r = await gdFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: name, parents:[GD_FOLDER_ID] })
    });
    id = (await r.json()).id;
  }
  await gdFetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: contentStr
  });
}

async function gdAutoSync(manual){
  if(!gdToken){ if(manual) gdConnect(); return; }
  gdSetStatus('syncing');
  try {
    // C: aix-tasks.json を自動取り込み（冪等）
    let importMsg = '';
    try {
      const f = await gdFindInFolder(GD_AIX_FILE);
      if(f){
        const parsed = JSON.parse(await gdDownload(f.id));
        const res = applyAixTasks(parsed);
        if(res && (res.added || res.draftCount || res.briefLoaded)){
          if(typeof renderHome==='function') renderHome();
          importMsg = `AIタスク${res.added}件・ドラフト${res.draftCount}件取込`;
        }
      }
    } catch(e){ if(e.code===401) throw e; console.warn('aix自動取込スキップ', e); }

    // A: スナップショットを一方向で書き出し（読み戻しはしない）
    const snap = await collectAllOSDataWithReflect();
    await gdUpload(GD_SNAPSHOT_FILE, JSON.stringify(snap, null, 2));

    gdSetStatus('ok');
    if(importMsg && typeof toast==='function') toast('☁️ '+importMsg);
    else if(manual && typeof toast==='function') toast('☁️ GDrive同期完了');
  } catch(e){
    if(e.code===401){
      gdClear(); gdSetStatus('ok');
      if(manual){ alert('GDriveの認証が切れました。再接続してください。'); gdConnect(); }
      return;
    }
    gdSetStatus('err');
    if(manual && typeof toast==='function') toast('⚠️ GDrive同期に失敗しました');
    console.warn('gdAutoSync error', e);
  }
}

// 起動：トークン復元 → ボタン更新 → 自動同期（描画後・防御的）
gdHandleRedirect();
document.addEventListener('DOMContentLoaded', ()=>{
  gdUpdateBtn();
  if(gdToken){ setTimeout(()=>{ try{ gdAutoSync(false); }catch(e){ console.warn(e); } }, 1200); }
});
</script>
