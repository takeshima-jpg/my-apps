<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shot Task OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #f4f4f2;
  --surface3: #ebebea;
  --border: #e2e2de;
  --border2: #d4d4cf;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #aaa;
  --accent: #9a7440;
  --accent2: #3b6fd4;
  --red: #c0392b;
  --red-bg: rgba(192,57,43,0.06);
  --red-border: rgba(192,57,43,0.25);
  --yellow: #946f00;
  --yellow-bg: rgba(180,140,0,0.07);
  --yellow-border: rgba(180,140,0,0.3);
  --blue: #2c6fad;
  --blue-bg: rgba(44,111,173,0.07);
  --blue-border: rgba(44,111,173,0.25);
  --green: #2e7d4f;
  --green-bg: rgba(46,125,79,0.07);
  --purple: #6b4fa0;
  --purple-bg: rgba(107,79,160,0.07);
  --purple-border: rgba(107,79,160,0.25);
  --gray: #888;
  --gray-bg: rgba(120,120,120,0.07);
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'Noto Sans JP', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 13px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  overflow: hidden;
  flex-shrink: 0;
}
.header-icon img { width: 100%; height: 100%; object-fit: cover; }
.logo {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--accent);
}
.header-nav {
  display: flex;
  gap: 4px;
  margin-left: 16px;
}
.nav-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text3);
  padding: 4px 12px;
  font-size: 12px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); background: var(--surface2); }
.nav-btn.active { color: var(--accent); border-color: var(--accent); background: var(--surface2); border-bottom: 2px solid var(--accent); font-weight: 600; }
.header-date {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text3);
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 180px 1fr 240px;
  flex: 1;
}

/* PANELS */
.left-panel, .right-panel {
  background: var(--surface);
  position: sticky;
  top: 48px;
  height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 16px 14px;
}
.left-panel { border-right: 1px solid var(--border); }
.right-panel { border-left: 1px solid var(--border); }

.panel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* FORM */
.form-group { margin-bottom: 10px; }
.form-label {
  display: block;
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}
input[type=text], input[type=date], textarea, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 7px 9px;
  font-size: 13px;
  font-family: var(--font-body);
  border-radius: 4px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 54px; }
select option { background: var(--surface); }

.priority-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.pri-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 7px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 13px;
  text-align: center;
  transition: all 0.15s;
  font-family: var(--font-body);
}
.pri-btn:hover { border-color: var(--border2); }
.pri-btn.active-high { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 700; }
.pri-btn.active-normal { border-color: var(--accent); background: rgba(154,116,64,0.06); color: var(--accent); }

.btn-add {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 9px;
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  cursor: pointer;
  border-radius: 4px;
  transition: opacity 0.15s;
  margin-top: 6px;
}
.btn-add:hover { opacity: 0.85; }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* CAT FILTER */
.cat-list { display: flex; flex-direction: column; gap: 1px; }
.cat-item {
  padding: 6px 8px;
  cursor: pointer;
  border-radius: 4px;
  color: var(--text2);
  font-size: 12px;
  transition: all 0.1s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.cat-item:hover { background: var(--surface2); color: var(--text); }
.cat-item.active { background: rgba(154,116,64,0.1); color: var(--accent); font-weight: 500; }
.cat-count { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }

/* CENTER */
.center { padding: 16px 20px; min-height: calc(100vh - 48px); }

.view-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.view-title { font-family: var(--font-mono); font-size: 11px; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; }
.task-count-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 10px;
}

/* SECTION */
.task-section { margin-bottom: 20px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
}
.section-label-text {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
}
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-count {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
}
.section-toggle-icon { font-size: 10px; color: var(--text3); }

/* TASK CARD */
.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  padding: 11px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.task-card:hover { border-color: var(--border2); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

.task-card.s-overdue { border-left: 3px solid var(--red); background: var(--red-bg); }
.task-card.s-today { border-left: 3px solid var(--yellow); background: var(--yellow-bg); }
.task-card.s-thisweek { border-left: 3px solid var(--purple); background: var(--purple-bg); }
.task-card.s-doing { border-left: 3px solid var(--blue); background: var(--blue-bg); }
.task-card.s-done { opacity: 0.45; }
.task-card.s-pending { opacity: 0.7; }

.task-sym {
  font-size: 15px;
  line-height: 1.5;
  flex-shrink: 0;
  width: 18px;
  text-align: center;
}
.sym-high { color: var(--red); font-weight: 700; }
.sym-normal { color: var(--text3); }

.task-body { flex: 1; min-width: 0; }
.task-title {
  font-size: 15px;
  color: var(--text);
  line-height: 1.5;
  word-break: break-word;
}
.task-title.p-high { font-weight: 700; }
.task-title.done-strike { text-decoration: line-through; color: var(--text3); }

.task-meta {
  display: flex;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.mtag {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text3);
}
.mtag-cat { color: var(--accent2); border-color: rgba(59,111,212,0.25); }
.mtag-overdue { color: var(--red); border-color: var(--red-border); }
.mtag-today { color: var(--yellow); border-color: var(--yellow-border); }
.mtag-thisweek { color: var(--purple); border-color: var(--purple-border); }
.mtag-future { color: var(--text3); }
.mtag-doing { color: var(--blue); border-color: var(--blue-border); }
.mtag-pending { color: var(--gray); }
.mtag-done { color: var(--green); border-color: rgba(46,125,79,0.3); }

.task-memo {
  font-size: 12px;
  color: var(--text3);
  margin-top: 5px;
  line-height: 1.6;
  border-left: 2px solid var(--border2);
  padding-left: 8px;
  white-space: pre-line;
}

/* ACTIONS */
.task-actions {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
  align-items: flex-start;
  padding-top: 2px;
  flex-wrap: wrap;
  max-width: 160px;
  justify-content: flex-end;
}
.act-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text3);
  padding: 4px 8px;
  font-size: 12px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
  white-space: nowrap;
}
.act-btn:hover { border-color: var(--border2); color: var(--text); }
.act-btn.ab-start:hover { border-color: var(--blue); color: var(--blue); }
.act-btn.ab-done:hover { border-color: var(--green); color: var(--green); }
.act-btn.ab-pend:hover { border-color: var(--gray); color: var(--gray); }
.act-btn.ab-back:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.ab-edit:hover { border-color: var(--accent2); color: var(--accent2); }
.act-btn.ab-del:hover { border-color: var(--red); color: var(--red); }
.act-btn.ab-tmr:hover { border-color: var(--purple); color: var(--purple); }
.act-btn.ab-week:hover { border-color: var(--purple); color: var(--purple); }

/* RIGHT PANEL */
.summary-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.summary-item:last-child { border-bottom: none; }
.s-label { color: var(--text2); }
.s-val { font-family: var(--font-mono); font-weight: 600; font-size: 14px; }
.sv-red { color: var(--red); }
.sv-yellow { color: var(--yellow); }
.sv-blue { color: var(--blue); }
.sv-purple { color: var(--purple); }
.sv-gray { color: var(--gray); }
.sv-normal { color: var(--text2); }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 12px;
  color: var(--text2);
}
.toggle-sw {
  width: 36px; height: 20px;
  background: var(--border2);
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  border: none;
  flex-shrink: 0;
}
.toggle-sw.on { background: var(--accent); }
.toggle-sw::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: left 0.2s;
}
.toggle-sw.on::after { left: 19px; }

.btn-panel {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 9px 12px;
  font-size: 12px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 7px;
  transition: all 0.15s;
  text-align: left;
}
.btn-panel:hover { border-color: var(--accent); color: var(--accent); }

/* ALL TASKS TABLE VIEW */
#allView { display: none; padding: 16px 20px; }
#allView.active { display: block; }

.tbl-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.tbl-sort-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 5px 12px;
  font-size: 11px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
}
.tbl-sort-btn:hover, .tbl-sort-btn.active { border-color: var(--accent); color: var(--accent); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--text3);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border2);
  background: var(--surface);
  position: sticky;
  top: 48px;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:hover td { background: var(--surface2); }
.td-status, .td-priority { white-space: nowrap; }
.td-title { font-size: 14px; font-weight: 500; max-width: 320px; }
.td-cat { font-size: 11px; color: var(--text2); }
.td-due { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
.td-upd { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 24px;
  width: 440px;
  max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.modal-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 18px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
  justify-content: flex-end;
}
.btn-save {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 20px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 4px;
}
.btn-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  cursor: pointer;
  border-radius: 4px;
}

/* REVIEW */
.rev-section { margin-bottom: 18px; }
.rev-sec-title {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.rev-criteria {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: 12px;
  color: var(--text2);
  line-height: 1.8;
}
.rev-item {
  padding: 7px 10px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.rev-item-title { flex: 1; min-width: 0; }
.rev-item-meta { font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; color: var(--text3); }
.rev-overdue { background: var(--red-bg); border: 1px solid var(--red-border); }
.rev-pending { background: var(--gray-bg); border: 1px solid var(--border); }
.rev-nodue { background: var(--surface2); border: 1px solid var(--border); }
.rev-stale { background: var(--yellow-bg); border: 1px solid var(--yellow-border); }
.rev-empty { font-size: 11px; color: var(--text3); font-family: var(--font-mono); padding: 4px 0; }

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text3);
  font-size: 12px;
  font-family: var(--font-mono);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* VISION2026 */
.vision-area {
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.vision-card {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 9px 16px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  max-width: 900px;
}
.vision-type {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.15em;
  white-space: nowrap;
  min-width: 44px;
  text-transform: uppercase;
}
.vision-body {
  font-size: 12px;
  color: var(--text2);
  line-height: 1.7;
}
.vision-keyword {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  margin-right: 10px;
}

/* 全タスク一覧：チェックボックス列 */
.col-chk { width: 32px; text-align: center; }
input[type=checkbox] {
  width: 15px; height: 15px; cursor: pointer;
  accent-color: var(--red);
}
.btn-bulk-del {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 5px 14px;
  font-size: 12px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  display: none;
}
.btn-bulk-del:hover { background: var(--red); color: #fff; }
.btn-bulk-del.visible { display: inline-block; }
.chk-all-label {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text3);
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
}
.chk-all-label.visible { display: flex; }

/* 実行判断ビュー：インライン優先度トグル */
.inline-pri {
  display: inline-flex;
  gap: 3px;
  margin-left: 6px;
  vertical-align: middle;
}
.ipr-btn {
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text3);
  padding: 2px 7px;
  font-size: 11px;
  font-family: var(--font-mono);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.12s;
  line-height: 1.4;
}
.ipr-btn:hover { border-color: var(--border2); }
.ipr-btn.ipr-high { color: var(--red); border-color: var(--red-border); background: var(--red-bg); font-weight: 700; }
.ipr-btn.ipr-normal { color: var(--accent); border-color: rgba(154,116,64,0.35); background: rgba(154,116,64,0.06); }

.tbl-sep { width: 1px; background: var(--border2); height: 20px; margin: 0 4px; }
.tbl-filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 5px 12px;
  font-size: 11px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
}
.tbl-filter-btn:hover { border-color: var(--green); color: var(--green); }
.tbl-filter-btn.active { border-color: var(--green); color: var(--green); background: var(--green-bg); }

/* カテゴリ管理 */
.cat-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.cat-edit-toggle {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-size: 10px;
  font-family: var(--font-mono);
  padding: 2px 7px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.1s;
}
.cat-edit-toggle:hover { border-color: var(--accent); color: var(--accent); }
.cat-edit-toggle.active { border-color: var(--accent); color: var(--accent); background: rgba(154,116,64,0.08); }

/* 編集モード：カテゴリ行 */
.cat-item-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 2px;
}
.cat-drag-handle {
  color: var(--text3);
  font-size: 12px;
  cursor: grab;
  padding: 4px 2px;
  flex-shrink: 0;
  user-select: none;
}
.cat-drag-handle:active { cursor: grabbing; }
.cat-item-wrap .cat-item {
  flex: 1;
  margin-bottom: 0;
}
.cat-item-wrap.dragging { opacity: 0.4; }
.cat-item-wrap.drag-over { border-top: 2px solid var(--accent); }

.cat-del-btn {
  background: none;
  border: none;
  color: var(--text3);
  font-size: 13px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
  flex-shrink: 0;
  transition: color 0.1s;
}
.cat-del-btn:hover { color: var(--red); }

/* カテゴリ追加フォーム */
.cat-add-row {
  display: none;
  gap: 4px;
  margin-top: 8px;
}
.cat-add-row.visible { display: flex; }
.cat-add-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 5px 8px;
  font-size: 12px;
  font-family: var(--font-body);
  border-radius: 4px;
  outline: none;
}
.cat-add-input:focus { border-color: var(--accent); }
.cat-add-submit {
  background: var(--accent);
  border: none;
  color: #fff;
  padding: 5px 10px;
  font-size: 12px;
  font-family: var(--font-mono);
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
}

/* ── MOBILE RESPONSIVE ── */
.mob-panel-btns{display:none;gap:4px;margin-left:auto;}
.mob-panel-btn{background:none;border:1px solid var(--border);color:var(--text2);font-size:11px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:var(--font-mono);}
.mob-panel-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
@media(max-width:800px){
  .mob-panel-btns{display:flex;}
  .layout{grid-template-columns:1fr;}
  .left-panel{display:none;border-right:none;border-bottom:1px solid var(--border);}
  .left-panel.mob-show{display:block;}
  .center{display:none;}
  .center.mob-show{display:block;}
  .right-panel{display:none;position:static;height:auto;}
  .right-panel.mob-show{display:block;}
  .header-nav{margin-left:0;}
}
</style>
</head>

<script>
// ── CONSTANTS ──
const STORAGE_KEY = 'shot-task-os-v1';

];

const CAT_STORAGE_KEY = 'shot-task-os-categories-v1';

  try {
    const raw = localStorage.getItem(CAT_STORAGE_KEY);

}

// ── STATE ──
let tasks = [];
let selectedCat = null;
let catEditMode = false;
let dragSrcIndex = null;
let addPriority = 'high';
let showDone = false;
let currentView = 'main';
let tableSort = 'due';
let tableFilterDone = false;
let editingId = null;

// ── DATE UTILS ──
function toDateKey(v) {
  if (!v) return '';
  if (typeof v === 'string') return v.slice(0, 10);
  const d = new Date(v);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getWeekEndKey() {
  const d = new Date();
  d.setDate(d.getDate() + 7);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function getDateState(due) {
  const dk = toDateKey(due), today = getTodayKey(), weekEnd = getWeekEndKey();
  if (!dk) return 'none';
  if (dk < today) return 'overdue';
  if (dk === today) return 'today';
  if (dk <= weekEnd) return 'thisweek';
  return 'future';
}
function fmtDate(v) {
  const k = toDateKey(v);
  return k ? k.replace(/-/g, '/') : '';
}
function fmtDateShort(v) {
  const k = toDateKey(v);
  if (!k) return '—';
  return k.slice(5).replace('-', '/');
}
function addDays(base, n) {
  const d = base ? new Date(base + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = pad(d.getMonth() + 1);
  const day = pad(d.getDate());
  return `${y}-${m}-${day}`;
}
function daysSinceUpdate(t) {
  if (!t.updatedAt) return 999;
  return Math.floor((Date.now() - new Date(t.updatedAt)) / 86400000);
}

// ── STORAGE ──
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
function load() {
  try { tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { tasks = []; }
  // dueDate の空文字を null に正規化（Task OS 側でのフィルタ精度向上）
  tasks.forEach(t => { if (t.dueDate === '') t.dueDate = null; });
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

// ── SEED DATA ──
const SEED_DATA = [
  { title:"グロースウェルさん連絡", category:"今日のタスク", priority:"normal", status:"todo" },
  { title:"クロノ千葉さん連絡", category:"今日のタスク", priority:"normal", status:"todo" },
  { title:"システム思考まとめ", category:"今日のタスク", priority:"normal", status:"todo" },
  { title:"危機管理研究フォーラム申し込み", category:"今日のタスク", priority:"normal", status:"todo" },

  { title:"LDMA受講", category:"学習・インプット", priority:"high", status:"todo", memo:"https://lectica.org/assessment/information?token=11446090587IVPTakHir2026114" },
  { title:"構造と意思決定のフレームワーク書き出し", category:"学習・インプット", priority:"normal", status:"todo" },
  { title:"notebookLMさわる", category:"学習・インプット", priority:"normal", status:"todo" },

  { title:"ヒトメモとソーシャルユニバースを繋げる", category:"学習・インプット", priority:"normal", status:"todo" },

  { title:"VISION振り返り", category:"学習・インプット", priority:"normal", status:"todo" },
  { title:"渡部さんコーチングまとめ", category:"学習・インプット", priority:"high", status:"todo" },
  { title:"大山さんコーチングまとめ", category:"学習・インプット", priority:"high", status:"todo" },

  { title:"自分の中のニュータイプ探し=自分がニュータイプ", category:"自己探求", priority:"normal", status:"todo", memo:"自分の中の人格にソルジャー、ハタオさん、コーチがいる" },
  { title:"自分の嫌な状態の時を深ぼって、理由にたどり着く", category:"自己探求", priority:"normal", status:"todo", memo:"苦手だと思っている人の言語化、反面教師にする\nもしくは、自分の文人を作ってかわいがる" },
  { title:"三好さん会食誘う", category:"ネットワーキング", priority:"normal", status:"todo" },
  { title:"佐原さん会食誘う", category:"ネットワーキング", priority:"normal", status:"todo" },
  { title:"三谷さん会食誘う", category:"ネットワーキング", priority:"normal", status:"todo" },
  { title:"みきさんバンドーさん、マゴさんの動画見て麻布台で日程調整", category:"ネットワーキング", priority:"normal", status:"todo" },
  { title:"経済界への登録→申し込み", category:"ネットワーキング", priority:"normal", status:"todo" }
];

function fixOrphanCategories() {
  // カテゴリが存在しないタスクは「今日のタスク」へ
  let changed = false;
  tasks.forEach(t => {
    if (!t.category || !CATEGORIES.includes(t.category)) {
      t.category = '今日のタスク';
      changed = true;
    }
  });
  if (changed) save();
}

function seedIfEmpty() {
  if (tasks.length > 0) return;
  const now = new Date().toISOString();
  SEED_DATA.forEach(s => {
    tasks.push({ id:genId(), title:s.title, category:s.category, priority:s.priority||'normal',
      status:s.status||'todo', dueDate:'', memo:s.memo||'', createdAt:now, completedAt:null, updatedAt:now });
  });
  save();
}


// ── ADD MODAL ──
function openAddModal() {
  populateSelect('addCategory', CATEGORIES[0]);
  // 優先度リセット
  document.querySelectorAll('#addModal .pri-btn').forEach(b => b.className = 'pri-btn');
  const highBtn = document.querySelector('#addModal .pri-btn[data-p="high"]');
  if (highBtn) highBtn.classList.add('active-high');
  addPriority = 'high';
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('addTitle').focus(), 50);
}
function closeAddModal() {
  document.getElementById('addModal').classList.remove('open');
}

// ── ADD ──
function addTask() {
  const title = document.getElementById('addTitle').value.trim();
  if (!title) { document.getElementById('addTitle').focus(); return; }
  const now = new Date().toISOString();
  const rawCat = document.getElementById('addCategory').value;
  const resolvedCat = (rawCat && CATEGORIES.includes(rawCat)) ? rawCat : '今日のタスク';
  tasks.push({
    id: genId(),
    title,
    category: resolvedCat,
    priority: addPriority,
    status: 'todo',
    dueDate: document.getElementById('addDue').value || null,
    memo: document.getElementById('addMemo').value.trim(),
    createdAt: now, completedAt: null, updatedAt: now
  });
  save();
  document.getElementById('addTitle').value = '';
  document.getElementById('addDue').value = '';
  document.getElementById('addMemo').value = '';
  closeAddModal();
  render();
}

// ── STATUS ──
function changeStatus(id, status) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  t.status = status;
  t.updatedAt = new Date().toISOString();
  if (status === 'done') t.completedAt = new Date().toISOString();
  else t.completedAt = null;
  save(); render();
}

// ── POSTPONE ──
function postpone(id, days) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  const base = t.dueDate || getTodayKey();
  t.dueDate = addDays(base, days);
  t.updatedAt = new Date().toISOString();
  save(); render();
}

// ── DELETE ──
function deleteTask(id, title) {
  if (!confirm(`「${title}」を削除しますか？`)) return;
  tasks = tasks.filter(x => x.id !== id);
  save(); render();
}

// ── EDIT ──
function openEdit(id) {
  editingId = id;
  const t = tasks.find(x => x.id === id); if (!t) return;
  populateSelect('editCategory', t.category);
  document.getElementById('editTitle').value = t.title;
  document.getElementById('editDue').value = t.dueDate || '';
  document.getElementById('editMemo').value = t.memo || '';
  const p = t.priority;
  document.querySelectorAll('#editModal .pri-btn').forEach(b => {
    b.className = 'pri-btn';
    if (b.dataset.p === p) b.classList.add(p === 'high' ? 'active-high' : 'active-normal');
  });
  document.getElementById('editModal').classList.add('open');
}
function closeEdit() { document.getElementById('editModal').classList.remove('open'); editingId = null; }
function saveEdit() {
  if (!editingId) return;
  const t = tasks.find(x => x.id === editingId); if (!t) return;
  const pb = document.querySelector('#editModal .pri-btn.active-high, #editModal .pri-btn.active-normal');
  t.title = document.getElementById('editTitle').value.trim();
  t.category = document.getElementById('editCategory').value;
  t.dueDate = document.getElementById('editDue').value || null;
  t.memo = document.getElementById('editMemo').value.trim();
  t.priority = pb ? pb.dataset.p : 'normal';
  t.updatedAt = new Date().toISOString();
  save(); closeEdit(); render();
}

// ── UI HELPERS ──
function selectPriority(el) {
  document.querySelectorAll('#addModal .pri-btn').forEach(b => b.className = 'pri-btn');
  addPriority = el.dataset.p;
  el.classList.add(addPriority === 'high' ? 'active-high' : 'active-normal');
}
function selectEditPriority(el) {
  document.querySelectorAll('#editModal .pri-btn').forEach(b => b.className = 'pri-btn');
  el.classList.add(el.dataset.p === 'high' ? 'active-high' : 'active-normal');
}
function populateSelect(id, selected) {
  const el = document.getElementById(id);
  el.innerHTML = CATEGORIES.map(c => `<option value="${c}"${c===selected?' selected':''}>${c}</option>`).join('');
}
function toggleDone() {
  showDone = !showDone;
  const sw = document.getElementById('doneToggle');
  sw.classList.toggle('on', showDone);
  render();
}
function switchView(v) {
  currentView = v;
  document.getElementById('mainView').style.display = v === 'main' ? '' : 'none';
  document.getElementById('allView').classList.toggle('active', v === 'all');
  document.getElementById('navMain').classList.toggle('active', v === 'main');
  document.getElementById('navAll').classList.toggle('active', v === 'all');
  if (v === 'all') renderAllTable();
}
function setSort(s) {
  tableSort = s;
  document.querySelectorAll('.tbl-sort-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sort' + s.charAt(0).toUpperCase() + s.slice(1)).classList.add('active');
  renderAllTable();
}
function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// memo内のURLをクリック可能なリンクに変換する
function renderMemo(memo) {
  if (!memo) return '';
  const urlRe = /https?:\/\/[^\s<>"'）】\]）]+/g;
  // まずHTMLエスケープしてから、URLだけリンクに戻す
  const escaped = escH(memo);
  return escaped.replace(/https?:\/\/[^\s&<>"'）】\]）]+(&amp;[^\s<>"'）】\]）]*)*/g, url => {
    // &amp; を & に戻してhref用に使う
    const href = url.replace(/&amp;/g, '&');
    return `<a href="${href}" target="_blank" rel="noopener" style="color:var(--blue,#3A7FD9);text-decoration:underline;word-break:break-all;">${url}</a>`;
  });
}

// ── SORT KEY ──
function getSortKey(t) {
  if (t.status === 'done') return 50;
  if (t.status === 'pending') return 40;
  const ds = getDateState(t.dueDate);
  if (ds === 'overdue') return 0;
  if (ds === 'today') return 10;
  if (ds === 'thisweek') return 20;
  if (t.status === 'doing') return 30;
  return 35; // todo / future
}

// ── RENDER MAIN ──
function render() {
  updateSummary();
  renderCatList();
  populateSelect('addCategory', CATEGORIES[0]);

  const filtered = (selectedCat ? tasks.filter(t => t.category === selectedCat) : tasks)
    .filter(t => showDone || t.status !== 'done');

  document.getElementById('viewTitle').textContent = selectedCat || '実行判断ビュー';
  document.getElementById('taskCountBadge').textContent = filtered.length + '件';

  // Sort
  const sorted = [...filtered].sort((a, b) => {
    const ka = getSortKey(a), kb = getSortKey(b);
    if (ka !== kb) return ka - kb;
    // 未着手セクション内：優先高を先頭に
    const pa = a.priority === 'high' ? 0 : 1;
    const pb = b.priority === 'high' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    // tertiary: dueDate asc, then updatedAt desc
    const da = toDateKey(a.dueDate) || '9999', db = toDateKey(b.dueDate) || '9999';
    if (da !== db) return da < db ? -1 : 1;
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });

  // Group into sections
  const secs = [
    { key:'overdue', label:'期限切れ', tasks:[] },
    { key:'today',   label:'今日',     tasks:[] },
    { key:'thisweek',label:'今週',     tasks:[] },
    { key:'doing',   label:'進行中',   tasks:[] },
    { key:'other',   label:'未着手',   tasks:[] },
    { key:'pending', label:'保留',     tasks:[] },
    { key:'done',    label:'完了',     tasks:[] },
  ];

  sorted.forEach(t => {
    if (t.status === 'done') { secs[6].tasks.push(t); return; }
    if (t.status === 'pending') { secs[5].tasks.push(t); return; }
    const ds = getDateState(t.dueDate);
    if (ds === 'overdue') secs[0].tasks.push(t);
    else if (ds === 'today') secs[1].tasks.push(t);
    else if (ds === 'thisweek') secs[2].tasks.push(t);
    else if (t.status === 'doing') secs[3].tasks.push(t);
    else secs[4].tasks.push(t);
  });

  const container = document.getElementById('taskList');
  container.innerHTML = '';
  let hasAny = false;

  secs.forEach(sec => {
    if (!sec.tasks.length) return;
    hasAny = true;
    const wrap = document.createElement('div');
    wrap.className = 'task-section';
    const isCollapsible = sec.key === 'done';
    wrap.innerHTML = `
      <div class="section-header" onclick="${isCollapsible ? 'toggleSection(this)' : ''}">
        <span class="section-label-text">${sec.label}</span>
        <span class="section-line"></span>
        <span class="section-count">${sec.tasks.length}</span>
        ${isCollapsible ? '<span class="section-toggle-icon">▾</span>' : ''}
      </div>
      <div class="section-body">
        ${sec.tasks.map(t => buildCardHTML(t)).join('')}
      </div>`;
    container.appendChild(wrap);
  });

  if (!hasAny) container.innerHTML = '<div class="empty-state">タスクなし</div>';
}

function toggleSection(hdr) {
  const body = hdr.nextElementSibling;
  const icon = hdr.querySelector('.section-toggle-icon');
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  if (icon) icon.textContent = collapsed ? '▾' : '▸';
}

function buildCardHTML(t) {
  const ds = getDateState(t.dueDate);
  let cardCls = 'task-card';
  if (t.status === 'done') cardCls += ' s-done';
  else if (t.status === 'pending') cardCls += ' s-pending';
  else if (ds === 'overdue') cardCls += ' s-overdue';
  else if (ds === 'today') cardCls += ' s-today';
  else if (ds === 'thisweek') cardCls += ' s-thisweek';
  else if (t.status === 'doing') cardCls += ' s-doing';

  const symCls = t.priority === 'high' ? 'task-sym sym-high' : 'task-sym sym-normal';
  const sym = t.priority === 'high' ? '●' : '・';
  const titleCls = `task-title${t.priority==='high'?' p-high':''}${t.status==='done'?' done-strike':''}`;
  // インライン優先度トグル
  const priToggle = `<span class="inline-pri">
    <button class="ipr-btn${t.priority==='high'?' ipr-high':''}" onclick="changePriority('${t.id}','high')" title="優先高">●</button>
    <button class="ipr-btn${t.priority==='normal'?' ipr-normal':''}" onclick="changePriority('${t.id}','normal')" title="通常">・</button>
  </span>`;

  // meta tags
  let meta = `<span class="mtag mtag-cat">${escH(t.category)}</span>`;
  if (t.dueDate) {
    const cls = `mtag-${ds === 'none' ? 'future' : ds}`;
    const prefix = ds==='overdue'?'期限切れ ':ds==='today'?'今日 ':ds==='thisweek'?'今週 ':'';
    meta += `<span class="mtag ${cls}">${prefix}${fmtDate(t.dueDate)}</span>`;
  }
  if (t.status==='doing') meta += '<span class="mtag mtag-doing">進行中</span>';
  if (t.status==='pending') meta += '<span class="mtag mtag-pending">保留</span>';
  if (t.status==='done') meta += '<span class="mtag mtag-done">完了</span>';

  const memo = t.memo ? `<div class="task-memo">${renderMemo(t.memo)}</div>` : '';

  // action buttons
  const id = t.id, titleEsc = escH(t.title).replace(/'/g,"&#39;");
  let acts = '';
  if (t.status === 'todo' || t.status === 'pending') {
    acts += `<button class="act-btn ab-start" onclick="changeStatus('${id}','doing')">開始</button>`;
    acts += `<button class="act-btn ab-done" onclick="changeStatus('${id}','done')">完了</button>`;
    if (t.status !== 'pending') acts += `<button class="act-btn ab-pend" onclick="changeStatus('${id}','pending')">保留</button>`;
    else acts += `<button class="act-btn ab-back" onclick="changeStatus('${id}','todo')">戻す</button>`;
  } else if (t.status === 'doing') {
    acts += `<button class="act-btn ab-done" onclick="changeStatus('${id}','done')">完了</button>`;
    acts += `<button class="act-btn ab-pend" onclick="changeStatus('${id}','pending')">保留</button>`;
    acts += `<button class="act-btn ab-back" onclick="changeStatus('${id}','todo')">戻す</button>`;
  } else if (t.status === 'done') {
    acts += `<button class="act-btn ab-back" onclick="changeStatus('${id}','todo')">戻す</button>`;
  }
  // postpone
  if (t.status !== 'done') {
    acts += `<button class="act-btn ab-tmr" onclick="postpone('${id}',1)">明日</button>`;
    acts += `<button class="act-btn ab-week" onclick="postpone('${id}',7)">来週</button>`;
  }
  acts += `<button class="act-btn ab-edit" onclick="openEdit('${id}')">編集</button>`;
  acts += `<button class="act-btn ab-del" onclick="deleteTask('${id}','${titleEsc}')">削除</button>`;

  return `<div class="${cardCls}">
    <div class="${symCls}">${sym}</div>
    <div class="task-body">
      <div class="${titleCls}">${escH(t.title)}${t.status!=='done'?priToggle:''}</div>
      <div class="task-meta">${meta}</div>
      ${memo}
    </div>
    <div class="task-actions">${acts}</div>
  </div>`;
}


// ── 優先度変更（インライン） ──
function changePriority(id, priority) {
  const t = tasks.find(x => x.id === id); if (!t) return;
  t.priority = priority;
  t.updatedAt = new Date().toISOString();
  save(); render();
}

// ── 一括削除（全タスク一覧） ──
function getCheckedIds() {
  return [...document.querySelectorAll('.row-chk:checked')].map(el => el.value);
}
function updateBulkUI() {
  const ids = getCheckedIds();
  const btn = document.getElementById('bulkDelBtn');
  btn.classList.toggle('visible', ids.length > 0);
  btn.textContent = ids.length > 0 ? `選択削除（${ids.length}件）` : '選択削除';
  // 全選択チェックボックスの状態同期
  const all = document.querySelectorAll('.row-chk');
  const chkAll = document.getElementById('chkAll');
  if (chkAll) chkAll.indeterminate = ids.length > 0 && ids.length < all.length;
  if (chkAll) chkAll.checked = all.length > 0 && ids.length === all.length;
}
function toggleSelectAll(chkEl) {
  document.querySelectorAll('.row-chk').forEach(el => el.checked = chkEl.checked);
  updateBulkUI();
}
function bulkDelete() {
  const ids = getCheckedIds();
  if (!ids.length) return;
  if (!confirm(`選択した ${ids.length} 件を削除しますか？`)) return;
  tasks = tasks.filter(t => !ids.includes(t.id));
  save();
  renderAllTable();
  render();
}

// ── SUMMARY ──
function updateSummary() {
  const a = tasks.filter(t => t.status !== 'done');
  document.getElementById('s-overdue').textContent = a.filter(t => getDateState(t.dueDate)==='overdue').length;
  document.getElementById('s-today').textContent   = a.filter(t => getDateState(t.dueDate)==='today').length;
  document.getElementById('s-week').textContent    = a.filter(t => getDateState(t.dueDate)==='thisweek').length;
  document.getElementById('s-doing').textContent   = tasks.filter(t => t.status==='doing').length;
  document.getElementById('s-pending').textContent = tasks.filter(t => t.status==='pending').length;

// ── CAT LIST ──
function renderCatList() {
  const el = document.getElementById('catList');
  if (!catEditMode) {
    // 通常モード
    const allBtn = `<div class="cat-item${!selectedCat?' active':''}" onclick="filterCat(null)">
      <span>すべて</span><span class="cat-count">${tasks.length}</span></div>`;
    const cats = CATEGORIES.map(cat => {
      const n = tasks.filter(t => t.category===cat).length;
      return `<div class="cat-item${selectedCat===cat?' active':''}" onclick="filterCat('${escH(cat)}')">
        <span>${escH(cat)}</span><span class="cat-count">${n}</span></div>`;
    });
    el.innerHTML = allBtn + cats.join('');
  } else {
    // 編集モード：ドラッグ&ドロップ＋削除
    const items = CATEGORIES.map((cat, i) => {
      const n = tasks.filter(t => t.category===cat).length;
      return `<div class="cat-item-wrap" draggable="true"
          ondragstart="onDragStart(event,${i})"
          ondragover="onDragOver(event,${i})"
          ondrop="onDrop(event,${i})"
          ondragend="onDragEnd(event)"
          id="cat-wrap-${i}">
        <span class="cat-drag-handle">⠿</span>
        <div class="cat-item" style="cursor:default">
          <span>${escH(cat)}</span><span class="cat-count">${n}</span>
        </div>
        <button class="cat-del-btn" onclick="deleteCategory(${i})" title="削除">×</button>
      </div>`;
    });
    el.innerHTML = items.join('');
  }
}
function filterCat(cat) { selectedCat = cat || null; render(); }

// ── カテゴリ編集モード ──
function toggleCatEdit() {
  catEditMode = !catEditMode;
  const btn = document.getElementById('catEditToggle');
  const addRow = document.getElementById('catAddRow');
  btn.classList.toggle('active', catEditMode);
  btn.textContent = catEditMode ? '完了' : '編集';
  addRow.classList.toggle('visible', catEditMode);
  renderCatList();
}

function addCategory() {
  const input = document.getElementById('catAddInput');
  const name = input.value.trim();
  if (!name) return;
  if (CATEGORIES.includes(name)) { alert('同名のカテゴリが既に存在します'); return; }
  CATEGORIES.push(name);
  saveCategories();
  input.value = '';
  renderCatList();
  // addModalのselectも更新
  populateSelect('addCategory', name);
}

function deleteCategory(idx) {
  const name = CATEGORIES[idx];
  const count = tasks.filter(t => t.category === name).length;
  const msg = count > 0
    ? `「${name}」を削除しますか？\nこのカテゴリの ${count} 件は「今日のタスク」に移動されます。`
    : `「${name}」を削除しますか？`;
  if (!confirm(msg)) return;
  // タスクを今日のタスクへ移動
  tasks.forEach(t => { if (t.category === name) t.category = '今日のタスク'; });
  CATEGORIES.splice(idx, 1);
  saveCategories();
  save();
  if (selectedCat === name) selectedCat = null;
  render();
}

// ── ドラッグ&ドロップ（並び替え） ──
function onDragStart(e, idx) {
  dragSrcIndex = idx;
  setTimeout(() => {
    const el = document.getElementById('cat-wrap-' + idx);
    if (el) el.classList.add('dragging');
  }, 0);
  e.dataTransfer.effectAllowed = 'move';
}
function onDragOver(e, idx) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.cat-item-wrap').forEach(el => el.classList.remove('drag-over'));
  const el = document.getElementById('cat-wrap-' + idx);
  if (el && idx !== dragSrcIndex) el.classList.add('drag-over');
}
function onDrop(e, idx) {
  e.preventDefault();
  if (dragSrcIndex === null || dragSrcIndex === idx) return;
  const moved = CATEGORIES.splice(dragSrcIndex, 1)[0];
  CATEGORIES.splice(idx, 0, moved);
  saveCategories();
  dragSrcIndex = null;
  renderCatList();
}
function onDragEnd(e) {
  dragSrcIndex = null;
  document.querySelectorAll('.cat-item-wrap').forEach(el => {
    el.classList.remove('dragging', 'drag-over');
  });
}


// ── テーブルフィルター ──
function toggleFilterDone() {
  tableFilterDone = !tableFilterDone;
  const btn = document.getElementById('filterDoneBtn');
  btn.classList.toggle('active', tableFilterDone);
  btn.textContent = tableFilterDone ? '✓ 完了のみ表示' : '完了のみ表示';
  renderAllTable();
}
// ── ALL TABLE ──
function renderAllTable() {
  const rows = [...tasks].filter(t => !tableFilterDone || t.status === 'done');
  if (tableSort === 'due') rows.sort((a,b) => {
    const da = toDateKey(a.dueDate)||'9999', db = toDateKey(b.dueDate)||'9999';
    return da < db ? -1 : da > db ? 1 : 0;
  });
  else if (tableSort === 'upd') rows.sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  else if (tableSort === 'cat') rows.sort((a,b) => a.category.localeCompare(b.category,'ja'));

  document.getElementById('allCountBadge').textContent = rows.length + '件';
  const statusLabel = { todo:'未着手', doing:'進行中', pending:'保留', done:'完了' };
  const tbody = document.getElementById('allTableBody');
  tbody.innerHTML = rows.map(t => {
    const ds = getDateState(t.dueDate);
    const dueCls = ds==='overdue'?'color:var(--red)':ds==='today'?'color:var(--yellow)':ds==='thisweek'?'color:var(--purple)':'';
    const sym = t.priority==='high' ? '<span style="color:var(--red);font-weight:700">●</span>' : '<span style="color:var(--text3)">・</span>';
    const stColor = {todo:'',doing:'var(--blue)',pending:'var(--gray)',done:'var(--green)'}[t.status]||'';
    return `<tr data-id="${t.id}">
      <td class="col-chk"><input type="checkbox" class="row-chk" value="${t.id}" onchange="updateBulkUI()"></td>
      <td class="td-status" style="color:${stColor}">${statusLabel[t.status]||t.status}</td>
      <td class="td-priority">${sym}</td>
      <td class="td-title">${escH(t.title)}</td>
      <td class="td-cat">${escH(t.category)}</td>
      <td class="td-due" style="${dueCls}">${fmtDate(t.dueDate)||'—'}</td>
      <td class="td-upd">${fmtDate(t.updatedAt)}</td>
    </tr>`;
  }).join('');
  // 表示のたびに全選択ラベル・ボタンを表示
  document.getElementById('chkAllLabel').classList.add('visible');
  updateBulkUI();
}

// ── REVIEW ──
function openReview() {
  const today = getTodayKey();
  const threshold = 30;
  const active = tasks.filter(t => t.status !== 'done');
  const overdue = active.filter(t => getDateState(t.dueDate)==='overdue');
  const pending = tasks.filter(t => t.status==='pending');
  const nodue = active.filter(t => !t.dueDate);
  const stale = active.filter(t => daysSinceUpdate(t) >= threshold);

  function items(arr, cls, extra='') {
    if (!arr.length) return '<div class="rev-empty">なし</div>';
    return arr.map(t => `<div class="rev-item ${cls}">
      <span class="rev-item-title">${escH(t.title)}</span>
      <span class="rev-item-meta">${extra ? (extra==='due'?fmtDate(t.dueDate):daysSinceUpdate(t)+'日前') : escH(t.category)}</span>
    </div>`).join('');
  }

  document.getElementById('reviewContent').innerHTML = `
    <div class="rev-section">
      <div class="rev-sec-title">期限切れ（${overdue.length}件）</div>
      ${items(overdue,'rev-overdue','due')}
    </div>
    <div class="rev-section">
      <div class="rev-sec-title">保留中（${pending.length}件）</div>
      ${items(pending,'rev-pending')}
    </div>
    <div class="rev-section">
      <div class="rev-sec-title">期限なし（${nodue.length}件）</div>
      ${items(nodue,'rev-nodue')}
    </div>
    <div class="rev-section">
      <div class="rev-sec-title">30日以上更新なし（${stale.length}件）</div>
      ${items(stale,'rev-stale','days')}
    </div>`;
  document.getElementById('reviewModal').classList.add('open');
}
function closeReview() { document.getElementById('reviewModal').classList.remove('open'); }
function exportAndClose() { exportJSON(); closeReview(); }

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      // 配列直接 or { tasks: [...] } 形式に対応
      const imported = Array.isArray(data) ? data : (data.tasks || []);
      if (!Array.isArray(imported) || imported.length === 0) {
        alert('有効なデータが見つかりませんでした。');
        return;
      }
      const existing = tasks.length;
      if (existing > 0) {
        const choice = confirm(
          `現在 ${existing} 件のタスクがあります。\n\n` +
          `【OK】既存データに追加インポート（重複はスキップ）\n` +
          `【キャンセル】既存データを上書き（全置換）`
        );
        if (choice) {
          // 追加：既存IDと重複しないものだけ追加
          const existingIds = new Set(tasks.map(t => t.id));
          const newTasks = imported.filter(t => !existingIds.has(t.id));
          tasks.push(...newTasks);
          alert(`${newTasks.length} 件を追加しました（重複 ${imported.length - newTasks.length} 件スキップ）。`);
        } else {
          // 上書き
          tasks = imported;
          alert(`${imported.length} 件のタスクで上書きしました。`);
        }
      } else {
        tasks = imported;
        alert(`${imported.length} 件のタスクをインポートしました。`);
      }
      save();
      render();
      // ファイル選択をリセット
      event.target.value = '';
    } catch(err) {
      alert('JSONの読み込みに失敗しました。\n' + err.message);
    }
  };
  reader.readAsText(file);
}
