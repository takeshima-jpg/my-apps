<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shot Task OS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #f4f4f2;
  --surface3: #ebebea;
  --border: #e2e2de;
  --border2: #d4d4cf;
  --text: #1a1a1a;
  --text2: #666;
  --text3: #aaa;
  --accent: #9a7440;
  --accent2: #3b6fd4;
  --red: #c0392b;
  --red-bg: rgba(192,57,43,0.06);
  --red-border: rgba(192,57,43,0.25);
  --yellow: #946f00;
  --yellow-bg: rgba(180,140,0,0.07);
  --yellow-border: rgba(180,140,0,0.3);
  --blue: #2c6fad;
  --blue-bg: rgba(44,111,173,0.07);
  --blue-border: rgba(44,111,173,0.25);
  --green: #2e7d4f;
  --green-bg: rgba(46,125,79,0.07);
  --purple: #6b4fa0;
  --purple-bg: rgba(107,79,160,0.07);
  --purple-border: rgba(107,79,160,0.25);
  --gray: #888;
  --gray-bg: rgba(120,120,120,0.07);
  --font-mono: 'IBM Plex Mono', monospace;
  --font-body: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 15px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* HEADER */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-icon {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  overflow: hidden;
  flex-shrink: 0;
}
.header-icon img { width: 100%; height: 100%; object-fit: cover; }
.logo {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.1em;
  color: var(--accent);
}
.header-nav {
  display: flex;
  gap: 4px;
  margin-left: 16px;
}
.nav-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--text3);
  padding: 4px 12px;
  font-size: 14px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--text); background: var(--surface2); }
.nav-btn.active { color: var(--accent); border-color: var(--accent); background: var(--surface2); border-bottom: 2px solid var(--accent); font-weight: 600; }
.header-date {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text3);
}

/* LAYOUT */
.layout {
  display: grid;
  grid-template-columns: 200px 1fr;
  flex: 1;
}

/* PANELS */
.left-panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  position: sticky;
  top: 48px;
  height: calc(100vh - 48px);
  overflow-y: auto;
  padding: 16px 14px;
}

.panel-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 12px;
}

/* FORM */
.form-group { margin-bottom: 10px; }
.form-label {
  display: block;
  font-size: 10px;
  color: var(--text3);
  margin-bottom: 4px;
  font-family: var(--font-mono);
}
input[type=text], input[type=date], textarea, select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 7px 9px;
  font-size: 15px;
  font-family: var(--font-body);
  border-radius: 4px;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 54px; }
select option { background: var(--surface); }

.priority-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.pri-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 7px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 15px;
  text-align: center;
  transition: all 0.15s;
  font-family: var(--font-body);
}
.pri-btn:hover { border-color: var(--border2); }
.pri-btn.active-high { border-color: var(--red); background: var(--red-bg); color: var(--red); font-weight: 700; }
.pri-btn.active-normal { border-color: var(--accent); background: rgba(154,116,64,0.06); color: var(--accent); }

.btn-add {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 9px;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-mono);
  letter-spacing: 0.08em;
  cursor: pointer;
  border-radius: 4px;
  transition: opacity 0.15s;
  margin-top: 6px;
}
.btn-add:hover { opacity: 0.85; }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

/* CAT FILTER */






/* CENTER */
.center { padding: 16px 20px; min-height: calc(100vh - 48px); }

.view-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.view-title { font-family: var(--font-mono); font-size: 13px; color: var(--text3); letter-spacing: 0.15em; text-transform: uppercase; }
.task-count-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text3);
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 10px;
}

/* SECTION */
.task-section { margin-bottom: 20px; }
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  user-select: none;
}
.section-label-text {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
}
.section-line { flex: 1; height: 1px; background: var(--border); }
.section-count {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
}
.section-toggle-icon { font-size: 10px; color: var(--text3); }

/* TASK CARD */
.task-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  padding: 11px 14px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.task-card:hover { border-color: var(--border2); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }

.task-card.s-overdue { border-left: 3px solid var(--red); background: var(--red-bg); }
.task-card.s-today { border-left: 3px solid var(--yellow); background: var(--yellow-bg); }
.task-card.s-thisweek { border-left: 3px solid var(--purple); background: var(--purple-bg); }
.task-card.s-doing { border-left: 3px solid var(--blue); background: var(--blue-bg); }
.task-card.s-done { opacity: 0.45; }
.task-card.s-pending { opacity: 0.7; }

.task-sym {
  font-size: 17px;
  line-height: 1.5;
  flex-shrink: 0;
  width: 18px;
  text-align: center;
}
.sym-high { color: var(--red); font-weight: 700; }
.sym-normal { color: var(--text3); }

.task-body { flex: 1; min-width: 0; }
.task-title {
  font-size: 17px;
  color: var(--text);
  line-height: 1.5;
  word-break: break-word;
}
.task-title.p-high { font-weight: 700; }
.task-title.done-strike { text-decoration: line-through; color: var(--text3); }

.task-meta {
  display: flex;
  gap: 6px;
  margin-top: 5px;
  flex-wrap: wrap;
  align-items: center;
}
.mtag {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px solid var(--border);
  color: var(--text3);
}
.mtag-cat { color: var(--accent2); border-color: rgba(59,111,212,0.25); }
.mtag-overdue { color: var(--red); border-color: var(--red-border); }
.mtag-today { color: var(--yellow); border-color: var(--yellow-border); }
.mtag-thisweek { color: var(--purple); border-color: var(--purple-border); }
.mtag-future { color: var(--text3); }
.mtag-doing { color: var(--blue); border-color: var(--blue-border); }
.mtag-pending { color: var(--gray); }
.mtag-done { color: var(--green); border-color: rgba(46,125,79,0.3); }

.task-memo {
  font-size: 14px;
  color: var(--text3);
  margin-top: 5px;
  line-height: 1.6;
  border-left: 2px solid var(--border2);
  padding-left: 8px;
  white-space: pre-line;
}

/* ACTIONS */
.task-actions {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
  align-items: flex-start;
  padding-top: 2px;
  flex-wrap: wrap;
  max-width: 160px;
  justify-content: flex-end;
}
.act-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text3);
  padding: 4px 8px;
  font-size: 14px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
  white-space: nowrap;
}
.act-btn:hover { border-color: var(--border2); color: var(--text); }
.act-btn.ab-start:hover { border-color: var(--blue); color: var(--blue); }
.act-btn.ab-done:hover { border-color: var(--green); color: var(--green); }
.act-btn.ab-pend:hover { border-color: var(--gray); color: var(--gray); }
.act-btn.ab-back:hover { border-color: var(--accent); color: var(--accent); }
.act-btn.ab-edit:hover { border-color: var(--accent2); color: var(--accent2); }
.act-btn.ab-del:hover { border-color: var(--red); color: var(--red); }
.act-btn.ab-tmr:hover { border-color: var(--purple); color: var(--purple); }
.act-btn.ab-week:hover { border-color: var(--purple); color: var(--purple); }

/* RIGHT PANEL */
.summary-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.summary-item:last-child { border-bottom: none; }
.s-label { color: var(--text2); }
.s-val { font-family: var(--font-mono); font-weight: 600; font-size: 16px; }
.sv-red { color: var(--red); }
.sv-yellow { color: var(--yellow); }
.sv-blue { color: var(--blue); }
.sv-purple { color: var(--purple); }
.sv-gray { color: var(--gray); }
.sv-normal { color: var(--text2); }

.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 14px;
  color: var(--text2);
}
.toggle-sw {
  width: 36px; height: 20px;
  background: var(--border2);
  border-radius: 10px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s;
  border: none;
  flex-shrink: 0;
}
.toggle-sw.on { background: var(--accent); }
.toggle-sw::after {
  content: '';
  position: absolute;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  top: 3px; left: 3px;
  transition: left 0.2s;
}
.toggle-sw.on::after { left: 19px; }

.btn-panel {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 9px 12px;
  font-size: 14px;
  font-family: var(--font-mono);
  letter-spacing: 0.06em;
  cursor: pointer;
  border-radius: 4px;
  margin-bottom: 7px;
  transition: all 0.15s;
  text-align: left;
}
.btn-panel:hover { border-color: var(--accent); color: var(--accent); }

/* ALL TASKS TABLE VIEW */
#allView { display: none; padding: 16px 20px; }
#allView.active { display: block; }

.tbl-controls {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  align-items: center;
}
.tbl-sort-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 5px 12px;
  font-size: 13px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
}
.tbl-sort-btn:hover, .tbl-sort-btn.active { border-color: var(--accent); color: var(--accent); }

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
}
th {
  text-align: left;
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  color: var(--text3);
  text-transform: uppercase;
  border-bottom: 1px solid var(--border2);
  background: var(--surface);
  position: sticky;
  top: 48px;
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
tr:hover td { background: var(--surface2); }
.td-status, .td-priority { white-space: nowrap; }
.td-title { font-size: 16px; font-weight: 500; max-width: 320px; }
.td-cat { font-size: 13px; color: var(--text2); }
.td-due { font-family: var(--font-mono); font-size: 13px; color: var(--text3); }
.td-upd { font-family: var(--font-mono); font-size: 10px; color: var(--text3); }

/* MODAL */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 24px;
  width: 440px;
  max-width: 92vw;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.modal-title {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.15em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 18px;
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 18px;
  justify-content: flex-end;
}
.btn-save {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 20px;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  border-radius: 4px;
}
.btn-cancel {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 8px 16px;
  font-family: var(--font-mono);
  font-size: 14px;
  cursor: pointer;
  border-radius: 4px;
}

/* REVIEW */
.rev-section { margin-bottom: 18px; }
.rev-sec-title {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.rev-criteria {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 10px 12px;
  margin-bottom: 12px;
  font-size: 14px;
  color: var(--text2);
  line-height: 1.8;
}
.rev-item {
  padding: 7px 10px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-size: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.rev-item-title { flex: 1; min-width: 0; }
.rev-item-meta { font-family: var(--font-mono); font-size: 10px; flex-shrink: 0; color: var(--text3); }
.rev-overdue { background: var(--red-bg); border: 1px solid var(--red-border); }
.rev-pending { background: var(--gray-bg); border: 1px solid var(--border); }
.rev-nodue { background: var(--surface2); border: 1px solid var(--border); }
.rev-stale { background: var(--yellow-bg); border: 1px solid var(--yellow-border); }
.rev-empty { font-size: 13px; color: var(--text3); font-family: var(--font-mono); padding: 4px 0; }

.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--text3);
  font-size: 14px;
  font-family: var(--font-mono);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* VISION2026 */
.vision-area {
  padding: 8px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.vision-card {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 9px 16px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  max-width: 900px;
}
.vision-type {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 0.15em;
  white-space: nowrap;
  min-width: 44px;
  text-transform: uppercase;
}
.vision-body {
  font-size: 14px;
  color: var(--text2);
  line-height: 1.7;
}
.vision-keyword {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--accent);
  margin-right: 10px;
}

/* 全タスク一覧：チェックボックス列 */
.col-chk { width: 32px; text-align: center; }
input[type=checkbox] {
  width: 15px; height: 15px; cursor: pointer;
  accent-color: var(--red);
}
.btn-bulk-del {
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  padding: 5px 14px;
  font-size: 14px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.15s;
  display: none;
}
.btn-bulk-del:hover { background: var(--red); color: #fff; }
.btn-bulk-del.visible { display: inline-block; }
.chk-all-label {
  font-size: 13px;
  font-family: var(--font-mono);
  color: var(--text3);
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 5px;
}
.chk-all-label.visible { display: flex; }

/* 実行判断ビュー：インライン優先度トグル */
.inline-pri {
  display: inline-flex;
  gap: 3px;
  margin-left: 6px;
  vertical-align: middle;
}
.ipr-btn {
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text3);
  padding: 2px 7px;
  font-size: 13px;
  font-family: var(--font-mono);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.12s;
  line-height: 1.4;
}
.ipr-btn:hover { border-color: var(--border2); }
.ipr-btn.ipr-high { color: var(--red); border-color: var(--red-border); background: var(--red-bg); font-weight: 700; }
.ipr-btn.ipr-normal { color: var(--accent); border-color: rgba(154,116,64,0.35); background: rgba(154,116,64,0.06); }

.tbl-sep { width: 1px; background: var(--border2); height: 20px; margin: 0 4px; }
.tbl-filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border2);
  color: var(--text2);
  padding: 5px 12px;
  font-size: 13px;
  font-family: var(--font-mono);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.1s;
}
.tbl-filter-btn:hover { border-color: var(--green); color: var(--green); }
.tbl-filter-btn.active { border-color: var(--green); color: var(--green); background: var(--green-bg); }


/* ── MOBILE RESPONSIVE ── */
.mob-panel-btns{display:none;gap:4px;margin-left:auto;}
.mob-panel-btn{background:none;border:1px solid var(--border);color:var(--text2);font-size:13px;padding:4px 10px;border-radius:4px;cursor:pointer;font-family:var(--font-mono);}
.mob-panel-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
@media(max-width:600px){
  .mob-panel-btns{display:flex;}
  .layout{grid-template-columns:1fr;}
  .left-panel{display:none;border-right:none;border-bottom:1px solid var(--border);}
  .left-panel.mob-show{display:block;}
  .center{display:none;}
  .center.mob-show{display:block;}
  .header-nav{margin-left:0;}
}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<header>
  <div class="header-icon"><img src="icons/icon-64.png" alt="icon"></div>
  <div class="logo">Shot Task OS</div>

// ── GOOGLE DRIVE SYNC (SHOT TASK OS) ──
const GDRIVE_CLIENT_ID = '450582924828-c89h2mia7e396dbilpthguhtb77p6fmr.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GDRIVE_FILE_NAME = 'shot-task-os-backup.json';
const GDRIVE_REDIRECT_URI = (location.origin + (location.pathname.endsWith('/index.html') ? location.pathname : location.pathname.replace(/\/$/, '') + '/index.html'));

let gdriveToken = null;
let gdriveFolderId = null;

// リダイレクト方式（スマホ対応）
function gdriveConnect() {
  // OAuthコード取得後のリダイレクト処理
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: GDRIVE_REDIRECT_URI,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
    prompt: 'select_account',
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

// リダイレクト後にURLフラグメントからトークンを取得
function gdriveHandleRedirect() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('access_token');
  if (token) {
    gdriveToken = token;
    localStorage.setItem('gdrive_token', token);
    // トークンをURLから消す
    history.replaceState(null, '', location.pathname);
    gdriveUpdateUI(true);
    gdriveAutoLoad();
  } else {
    // 保存済みトークンを確認
    const saved = localStorage.getItem('gdrive_token');
    if (saved) {
      gdriveToken = saved;
      gdriveUpdateUI(true);
    }
  }
}

function gdriveUpdateUI(connected) {
  // デスクトップサイドバー
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  const connectBtn = document.getElementById('gdriveConnectBtn');
  const saveBtn = document.getElementById('gdriveSaveBtn');

  const dotMob = document.getElementById('gdriveDotMob');

  const connectMob = document.getElementById('gdriveConnectMob');

  const loadMob = document.getElementById('gdriveLoadMob');

  if (connected) {
    if (dot) dot.style.background = '#34a853';

    if (connectBtn) connectBtn.style.display = 'none';

    if (saveMob) saveMob.style.display = 'none';
    if (loadMob) loadMob.style.display = 'none';
  }
}

async function gdriveFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + gdriveToken, ...(options.headers||{}) }
  });
  if (res.status === 401) {
    gdriveToken = null;
    localStorage.removeItem('gdrive_token');
    gdriveUpdateUI(false);
    if (confirm('Googleの認証が切れました。再ログインしますか？')) {
      gdriveConnect();
    }
    throw new Error('認証切れ');
  }
  return res;
}

async function gdriveFindFile() {
  const res = await gdriveFetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22${GDRIVE_FILE_NAME}%22&fields=files(id,name)`
  );
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

function toast(msg) {
  let el = document.querySelector('.toast-msg');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

async function gdriveSave() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  const btn = document.getElementById('gdriveSaveBtn');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '保存中...'; btn.disabled = true; }
  dot.className = 'gdrive-dot saving';
  status.textContent = '保存中...';
  try {
    const payload = JSON.stringify({ exportedAt: new Date().toISOString(), tasks }, null, 2);
    const fileId = await gdriveFindFile();
    const metadata = { name: GDRIVE_FILE_NAME, parents: fileId ? undefined : ['appDataFolder'] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', new Blob([payload], {type:'application/json'}));
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    await gdriveFetch(url, { method: fileId ? 'PATCH' : 'POST', body: form });
    dot.className = 'gdrive-dot connected';
    status.textContent = 'Googleドライブに保存済み (' + new Date().toLocaleTimeString('ja-JP') + ')';
    toast('Googleドライブに保存しました');
  } catch(e) {
    dot.className = 'gdrive-dot connected';
    status.textContent = '保存エラー: ' + e.message;
  } finally {
    if (btn) { btn.textContent = origText; btn.disabled = false; }
  }
}

async function gdriveLoad() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const btn = document.getElementById('gdriveLoadBtn');
  const origText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '読込中...'; btn.disabled = true; }
  try {
    const fileId = await gdriveFindFile();
    if (!fileId) { alert('Googleドライブにバックアップが見つかりません'); return; }
    const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.tasks) {
      if (!confirm(`Googleドライブから読み込みます。現在のデータは上書きされます。よろしいですか？`)) return;
      tasks = data.tasks || [];
      save();
      render();
      toast('Googleドライブから読み込みました');
    }
  } catch(e) {
    alert('読込エラー: ' + e.message);
  } finally {
    if (btn) { btn.textContent = origText; btn.disabled = false; }
  }
}

function toDateKey(v) {
  if (!v) return '';
  if (typeof v === 'string') return v.slice(0, 10);
  const d = new Date(v);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function getWeekEndKey() {
  const d = new Date();
  d.setDate(d.getDate() + 7);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function pad(n) { return String(n).padStart(2,'0'); }
function getDateState(due) {
  const dk = toDateKey(due), today = getTodayKey(), weekEnd = getWeekEndKey();
  if (!dk) return 'none';
  if (dk < today) return 'overdue';
  if (dk === today) return 'today';
  if (dk <= weekEnd) return 'thisweek';
  return 'future';
}
function fmtDate(v) {
  const k = toDateKey(v);
  return k ? k.replace(/-/g, '/') : '';
}
function fmtDateShort(v) {
  const k = toDateKey(v);
  if (!k) return '—';
  return k.slice(5).replace('-', '/');
}
function addDays(base, n) {
  const d = base ? new Date(base + 'T00:00:00') : new Date();
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = pad(d.getMonth() + 1);
  const day = pad(d.getDate());
  return `${y}-${m}-${day}`;
}
function daysSinceUpdate(t) {
  if (!t.updatedAt) return 999;
  return Math.floor((Date.now() - new Date(t.updatedAt)) / 86400000);
}

  });

}

}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// memo内のURLをクリック可能なリンクに変換する
function renderMemo(memo) {
  if (!memo) return '';
  const urlRe = /https?:\/\/[^\s<>"'）】\]）]+/g;
  // まずHTMLエスケープしてから、URLだけリンクに戻す
  const escaped = escH(memo);
  return escaped.replace(/https?:\/\/[^\s&<>"'）】\]）]+(&amp;[^\s<>"'）】\]）]*)*/g, url => {
    // &amp; を & に戻してhref用に使う
    const href = url.replace(/&amp;/g, '&');
    return `<a href="${href}" target="_blank" rel="noopener" style="color:var(--blue,#3A7FD9);text-decoration:underline;word-break:break-all;">${url}</a>`;
  });
}

// ── SORT KEY ──
function getSortKey(t) {
  if (t.status === 'done') return 50;
  if (t.status === 'pending') return 40;
  const ds = getDateState(t.dueDate);
  if (ds === 'overdue') return 0;
  if (ds === 'today') return 10;
  if (ds === 'thisweek') return 20;
  if (t.status === 'doing') return 30;
  return 35; // todo / future
}

// ── RENDER MAIN ──
function render() {
  updateSummary();
  populateSelect('addCategory', CATEGORIES[0]);

  const filtered = tasks.filter(t => showDone || t.status !== 'done');

  document.getElementById('viewTitle').textContent = '実行判断ビュー';
  document.getElementById('taskCountBadge').textContent = filtered.filter(t=>t.status!=='done').length + '件';

  // Sort
  const sorted = [...filtered].sort((a, b) => {
    const ka = getSortKey(a), kb = getSortKey(b);
    if (ka !== kb) return ka - kb;
    // 未着手セクション内：優先高を先頭に
    const pa = a.priority === 'high' ? 0 : 1;
    const pb = b.priority === 'high' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    // tertiary: dueDate asc, then updatedAt desc
    const da = toDateKey(a.dueDate) || '9999', db = toDateKey(b.dueDate) || '9999';
    if (da !== db) return da < db ? -1 : 1;
    return new Date(b.updatedAt) - new Date(a.updatedAt);
  });

  // Group into sections
  const secs = [
    { key:'overdue', label:'期限切れ', tasks:[] },
    { key:'today',   label:'今日',     tasks:[] },
    { key:'thisweek',label:'今週',     tasks:[] },
    { key:'doing',   label:'進行中',   tasks:[] },
    { key:'other',   label:'未着手',   tasks:[] },
    { key:'pending', label:'保留',     tasks:[] },
    { key:'done',    label:'完了',     tasks:[] },
  ];

  sorted.forEach(t => {
    if (t.status === 'done') { secs[6].tasks.push(t); return; }
    if (t.status === 'pending') { secs[5].tasks.push(t); return; }
    const ds = getDateState(t.dueDate);
    if (ds === 'overdue') secs[0].tasks.push(t);
    else if (ds === 'today') secs[1].tasks.push(t);
    else if (ds === 'thisweek') secs[2].tasks.push(t);
    else if (t.status === 'doing') secs[3].tasks.push(t);
    else secs[4].tasks.push(t);
  });

  const container = document.getElementById('taskList');
  container.innerHTML = '';
  let hasAny = false;

  secs.forEach(sec => {
    if (!sec.tasks.length) return;
    hasAny = true;
    const wrap = document.createElement('div');
    wrap.className = 'task-section';
    const isCollapsible = sec.key === 'done';
    wrap.innerHTML = `
      <div class="section-header" onclick="${isCollapsible ? 'toggleSection(this)' : ''}">
        <span class="section-label-text">${sec.label}</span>
        <span class="section-line"></span>
        <span class="section-count">${sec.tasks.length}</span>
        ${isCollapsible ? '<span class="section-toggle-icon">▾</span>' : ''}
      </div>
      <div class="section-body">
        ${sec.tasks.map(t => buildCardHTML(t)).join('')}
      </div>`;
    container.appendChild(wrap);
  });

  if (!hasAny) container.innerHTML = '<div class="empty-state">タスクなし</div>';
}

function toggleSection(hdr) {
  const body = hdr.nextElementSibling;
  const icon = hdr.querySelector('.section-toggle-icon');
  const collapsed = body.style.display === 'none';
  body.style.display = collapsed ? '' : 'none';
  if (icon) icon.textContent = collapsed ? '▾' : '▸';
}

function buildCardHTML(t) {
  const ds = getDateState(t.dueDate);
  let cardCls = 'task-card';
  if (t.status === 'done') cardCls += ' s-done';
  else if (t.status === 'pending') cardCls += ' s-pending';
  else if (ds === 'overdue') cardCls += ' s-overdue';
  else if (ds === 'today') cardCls += ' s-today';
  else if (ds === 'thisweek') cardCls += ' s-thisweek';
  else if (t.status === 'doing') cardCls += ' s-doing';

  const symCls = t.priority === 'high' ? 'task-sym sym-high' : 'task-sym sym-normal';
  const sym = t.priority === 'high' ? '●' : '・';
  const titleCls = `task-title${t.priority==='high'?' p-high':''}${t.status==='done'?' done-strike':''}`;
  // インライン優先度トグル
  const priToggle = `<span class="inline-pri">
    <button class="ipr-btn${t.priority==='high'?' ipr-high':''}" onclick="changePriority('${t.id}','high')" title="優先高">●</button>
    <button class="ipr-btn${t.priority==='normal'?' ipr-normal':''}" onclick="changePriority('${t.id}','normal')" title="通常">・</button>
  </span>`;

  // meta tags
  let meta = `<span class="mtag mtag-cat">${escH(t.category)}</span>`;
  if (t.dueDate) {
    const cls = `mtag-${ds === 'none' ? 'future' : ds}`;
    const prefix = ds==='overdue'?'期限切れ ':ds==='today'?'今日 ':ds==='thisweek'?'今週 ':'';
    meta += `<span class="mtag ${cls}">${prefix}${fmtDate(t.dueDate)}</span>`;
  }
  if (t.status==='doing') meta += '<span class="mtag mtag-doing">進行中</span>';
  if (t.status==='pending') meta += '<span class="mtag mtag-pending">保留</span>';
  if (t.status==='done') meta += '<span class="mtag mtag-done">完了</span>';

  const memo = t.memo ? `<div class="task-memo">${renderMemo(t.memo)}</div>` : '';

  // action buttons
  const id = t.id, titleEsc = escH(t.title).replace(/'/g,"&#39;");
  let acts = '';
  if (t.status !== 'done') {
    acts += `<button class="act-btn ab-tmr" onclick="setToday('${id}')">今日</button>`;
    acts += `<button class="act-btn ab-done" onclick="changeStatus('${id}','done')">完了</button>`;
    acts += `<button class="act-btn ab-pend" onclick="changeStatus('${id}','pending')">保留</button>`;
  } else {
    acts += `<button class="act-btn ab-back" onclick="changeStatus('${id}','todo')">戻す</button>`;
  }
  acts += `<button class="act-btn ab-edit" onclick="openEdit('${id}')">編集</button>`;
  acts += `<button class="act-btn ab-del" onclick="deleteTask('${id}','${titleEsc}')">削除</button>`;

  return `<div class="${cardCls}">
    <div class="${symCls}">${sym}</div>
    <div class="task-body">
      <div class="${titleCls}">${escH(t.title)}${t.status!=='done'?priToggle:''}</div>
      <div class="task-meta">${meta}</div>
      ${memo}
    </div>
    <div class="task-actions">${acts}</div>
  </div>`;
}

// タイトル正規化（全角/半角・前後スペース・の削除）
function normalizeTitle(t) {
  return (t||'').replace(/[\u3000\s]/g,'').replace(/の/g,'').toLowerCase();
}

// ステータス優先度（小さいほど優先）
function statusPri(s){ return s==='done'?0:s==='todo'?1:s==='pending'?2:9; }

// タスクマージ
function mergeTasks(existing, incoming) {
  const es = existing.status, is_ = incoming.status;
  const status = statusPri(es) <= statusPri(is_) ? es : is_;
  const memoA = (existing.memo||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const memoB = (incoming.memo||'').split('\n').map(s=>s.trim()).filter(Boolean);
  const memoSet = new Set([...memoA, ...memoB]);
  const memo = [...memoSet].join('\n');
  const dueDate = existing.dueDate || incoming.dueDate || null;
  const createdAt = (existing.createdAt && incoming.createdAt)
    ? (existing.createdAt < incoming.createdAt ? existing.createdAt : incoming.createdAt)
    : (existing.createdAt || incoming.createdAt || null);
  const updatedAt = (existing.updatedAt && incoming.updatedAt)
    ? (existing.updatedAt > incoming.updatedAt ? existing.updatedAt : incoming.updatedAt)
    : (existing.updatedAt || incoming.updatedAt || null);
  const completedAt = status==='done'
    ? ((existing.completedAt && incoming.completedAt)
        ? (existing.completedAt > incoming.completedAt ? existing.completedAt : incoming.completedAt)
        : (existing.completedAt || incoming.completedAt || null))
    : null;
  return {...existing, status, memo, dueDate, createdAt, updatedAt, completedAt};
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      const imported = Array.isArray(data) ? data : (data.tasks || []);
      if (!Array.isArray(imported) || imported.length === 0) {
        alert('有効なデータが見つかりませんでした。');
        return;
      }

      // バックアップ保存
      try {
        localStorage.setItem('shot_backup_' + Date.now(), JSON.stringify(tasks));
      } catch(be) {}

      // タイトル正規化マップを構築
      const normMap = new Map();
      tasks.forEach((t, i) => { normMap.set(normalizeTitle(t.title), i); });

      let addedCount = 0, mergedCount = 0, skippedCount = 0;
      const dupList = [];

      imported.forEach(inc => {
        const normInc = normalizeTitle(inc.title);
        if (normMap.has(normInc)) {
          const idx = normMap.get(normInc);
          const orig = tasks[idx];
          // 完全一致ならスキップ、表記ゆれならマージ
          if (orig.title.trim() === (inc.title||'').trim()) {
            skippedCount++;
          } else {
            tasks[idx] = mergeTasks(orig, inc);
            mergedCount++;
            dupList.push(`「${orig.title}」←「${inc.title}」`);
          }
        } else {
          tasks.push(inc);
          normMap.set(normInc, tasks.length - 1);
          addedCount++;
        }
      });

      save();
      render();
      event.target.value = '';

      let msg = `インポート完了\n\n`;
      msg += `✅ 追加：${addedCount} 件\n`;
      msg += `🔀 マージ：${mergedCount} 件\n`;
      msg += `⏭ スキップ：${skippedCount} 件\n`;
      if (dupList.length > 0) {
        msg += `\n─ 表記ゆれマージ一覧 ─\n` + dupList.join('\n');
      }
      alert(msg);
    } catch(err) {
      alert('JSONの読み込みに失敗しました。\n' + err.message);
    }
  };
  reader.readAsText(file);
}

function renderVision() {
  const area = document.getElementById('visionArea');
  if (!area) return;
  const seed = parseInt(new Date().toLocaleDateString('sv').replace(/-/g,'')) % 100;
  const types = ['vision', 'principle', 'direction'];
  const type = types[seed % 3];
  let html = '';
  if (type === 'vision') {
    const item = VISION_DATA.vision[seed % VISION_DATA.vision.length];
    html = `<div class="vision-card"><span class="vision-type">VISION</span><span class="vision-body">${item}</span></div>`;
  } else if (type === 'principle') {
    const item = VISION_DATA.principles[seed % VISION_DATA.principles.length];
    html = `<div class="vision-card"><span class="vision-type">原則</span><span class="vision-body"><span class="vision-keyword">${item.title}</span>${item.text}</span></div>`;
  } else {
    const item = VISION_DATA.directions[seed % VISION_DATA.directions.length];
    html = `<div class="vision-card"><span class="vision-type">指針</span><span class="vision-body"><span class="vision-keyword">${item.title}</span>${item.text}</span></div>`;
  }
  area.innerHTML = html;
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'Escape') {
    closeAddModal(); closeEdit(); closeReview();
  }
  if (e.key === 'n' || e.key === 'N') {

});

function showPanel(name){
  const panels = {left:'.left-panel',center:'.center'};
  Object.values(panels).forEach(sel=>{
    const el = document.querySelector(sel);
    if(el) el.classList.remove('mob-show');
  });
  const target = panels[name];
  if(target){ const el = document.querySelector(target); if(el) el.classList.add('mob-show'); }
  // ボタンのactive更新
  document.querySelectorAll('.mob-panel-btn').forEach((btn,i)=>{
    const names=['left','center'];
    btn.classList.toggle('active', names[i]===name);
  });
}
// 初期表示: center
if(window.innerWidth<=600) showPanel('center');
window.addEventListener('resize',()=>{
  if(window.innerWidth>600){
    // デスクトップ幅に戻ったらmob-showを外してグリッド表示に戻す
    ['.left-panel','.center'].forEach(sel=>{
      const el = document.querySelector(sel);
      if(el) el.classList.remove('mob-show');
    });
    document.querySelectorAll('.mob-panel-btn').forEach(btn=>btn.classList.remove('active'));
  } else {
    // モバイル幅に縮んだとき、何も表示されていなければcenterを表示
    const anyVisible = document.querySelector('.left-panel.mob-show, .center.mob-show');
    if(!anyVisible) showPanel('center');
  }
});
