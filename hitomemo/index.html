<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヒトメモ</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap');

    :root {
      --bg: #F7F6F3;
      --surface: #FFFFFF;
      --surface2: #F0EEE9;
      --border: #E5E2DB;
      --text1: #1A1814;
      --text2: #5C5852;
      --text3: #9C988F;
      --accent: #2D5A3D;
      --accent-light: #EAF2EC;
      --accent2: #8B6914;
      --accent2-light: #FBF4E3;
      --star: #E8A020;
      --danger: #C0392B;
      --danger-light: #FDECEA;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--text1);
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── LAYOUT ── */
    .app { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

    /* ── TOPBAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-logo {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--accent);
      letter-spacing: 0.02em;
    }
    .topbar-actions { display: flex; gap: 8px; align-items: center; }

    /* ── BUTTONS ── */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #234830; }
    .btn-ghost { background: none; border: 1px solid var(--border); color: var(--text2); }
    .btn-ghost:hover { background: var(--surface2); }
    .btn-danger { background: var(--danger-light); color: var(--danger); border: 1px solid #f5c6c0; }
    .btn-danger:hover { background: #fbd5d0; }
    .btn-sm { padding: 5px 12px; font-size: 14px; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin: 20px 0 16px; }
    .search-input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      background: var(--surface);
      transition: border-color 0.2s;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 17px; }

    /* ── FILTER ROW ── */
    .filter-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .filter-label { font-size: 14px; color: var(--text3); }
    .filter-chip {
      padding: 4px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .filter-chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sort-select {
      padding: 4px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: var(--surface);
      color: var(--text2);
      margin-left: auto;
    }
    .sort-select:focus { outline: none; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin: 24px 0 12px;
    }

    /* ── STAR GRID ── */
    .star-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }
    .star-card {
      background: var(--accent2-light);
      border: 1.5px solid #e8d9a0;
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .star-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .star-badge { position: absolute; top: 12px; right: 12px; font-size: 16px; }

    /* ── PERSON GRID ── */
    .person-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }
    .person-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }
    .person-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(45,90,61,0.08); }
    .person-card.is-star { border-color: #d4b86a; }
    .person-card.dragging { opacity: 0.4; cursor: grabbing; }
    .person-card.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); transform: scale(1.02); }
    .person-card[draggable="true"] { cursor: grab; }
    .star-card.dragging { opacity: 0.4; cursor: grabbing; }
    .star-card.drag-over { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); transform: scale(1.02); }
    .star-card[draggable="true"] { cursor: grab; }

    .card-name { font-weight: 700; font-size: 18px; margin-bottom: 3px; }
    .card-position { font-size: 14px; color: var(--text3); margin-bottom: 8px; }
    .card-core {
      font-size: 15px;
      color: var(--text2);
      font-style: italic;
      border-left: 2px solid var(--accent);
      padding-left: 8px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text3);
      border-top: 1px solid var(--border);
      padding-top: 8px;
      margin-top: 4px;
    }
    .card-delete {
      position: absolute;
      top: 8px; right: 8px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text3);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: all 0.15s;
    }
    .person-card:hover .card-delete,
    .star-card:hover .card-delete { opacity: 1; background: var(--danger-light); color: var(--danger); }

    /* ── SUMMARY ── */
    .summary-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-top: 28px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .summary-item { text-align: center; }
    .summary-num { font-size: 24px; font-weight: 700; color: var(--accent); line-height: 1; }
    .summary-lbl { font-size: 13px; color: var(--text3); margin-top: 2px; }
    .summary-divider { width: 1px; height: 36px; background: var(--border); }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-title { font-size: 18px; color: var(--text2); margin-bottom: 6px; }

    /* ── BACKUP LINKS ── */
    .backup-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      padding-top: 8px;
    }
    .backup-link {
      background: none; border: none;
      color: var(--text3); font-size: 13px;
      cursor: pointer; font-family: inherit;
      text-decoration: underline;
      padding: 0;
    }
    .backup-link:hover { color: var(--text2); }

    /* ── PAGE CONTAINER ── */
    .page { max-width: 720px; margin: 0 auto; padding: 24px 20px 60px; }

    /* ── INTERVIEW ── */
    .interview-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
    .q-count { font-size: 14px; color: var(--text3); margin-bottom: 12px; }
    .q-text { font-size: 20px; font-weight: 700; margin-bottom: 20px; color: var(--text1); }
    .q-textarea {
      width: 100%; min-height: 120px;
      padding: 12px; font-size: 16px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: inherit; resize: vertical;
      transition: border-color 0.2s;
    }
    .q-textarea:focus { outline: none; border-color: var(--accent); }
    .nav-row { display: flex; gap: 10px; justify-content: space-between; margin-top: 20px; }

    /* ── IMPORT ── */
    .import-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    .import-textarea {
      width: 100%; min-height: 360px;
      padding: 14px; font-size: 15px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: 'Courier New', monospace;
      resize: vertical; margin-bottom: 16px;
    }
    .import-textarea:focus { outline: none; border-color: var(--accent); }

    /* ── DETAIL ── */
    .detail-hero {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 20px;
    }
    .hero-name { font-family: 'DM Serif Display', serif; font-size: 28px; margin-bottom: 4px; }
    .hero-position { font-size: 15px; color: var(--text3); margin-bottom: 12px; }
    .hero-core {
      font-size: 17px; color: var(--text2);
      font-style: italic;
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .hero-meta { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .star-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 15px; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
      font-weight: 500;
    }
    .star-toggle.active { background: var(--accent2-light); border-color: #d4b86a; color: var(--accent2); }

    .detail-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 14px;
    }
    .detail-section-title {
      font-size: 14px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text3); margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .field-group { margin-bottom: 14px; }
    .field-label { display: block; font-size: 14px; color: var(--text3); font-weight: 500; margin-bottom: 5px; }
    .field-input, .field-textarea {
      width: 100%; padding: 9px 12px;
      font-size: 16px; font-family: inherit;
      border: 1.5px solid var(--border); border-radius: 7px;
      transition: border-color 0.2s;
      background: var(--surface);
    }
    .field-textarea { min-height: 80px; resize: vertical; }
    .field-input:focus, .field-textarea:focus { outline: none; border-color: var(--accent); }

    /* ── MEETINGS ── */
    .meeting-item {
      background: var(--surface2);
      border-left: 3px solid #27ae60;
      border-radius: 0 7px 7px 0;
      padding: 12px 14px;
      margin-bottom: 10px;
      position: relative;
    }
    .meeting-date { font-weight: 600; font-size: 15px; margin-bottom: 5px; }
    .meeting-content { font-size: 15px; color: var(--text2); line-height: 1.6; }
    .meeting-delete {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none;
      font-size: 13px; color: var(--text3);
      cursor: pointer; padding: 2px 6px;
      border-radius: 4px;
    }
    .meeting-delete:hover { background: var(--danger-light); color: var(--danger); }

    /* ── AI SUMMARY ── */
    .ai-summary-box {
      background: var(--accent-light);
      border: 1.5px solid #b8d9c2;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }
    .ai-summary-label { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; }
    .ai-summary-field { margin-bottom: 8px; font-size: 15px; }
    .ai-field-key { color: var(--text3); font-weight: 500; }
    .ai-field-val { color: var(--text1); margin-left: 4px; }
    .ai-summary-textarea {
      width: 100%; min-height: 110px;
      padding: 10px 12px; font-size: 15px;
      border: 1.5px solid #b8d9c2; border-radius: 7px;
      font-family: inherit; resize: vertical;
      background: rgba(255,255,255,0.7);
    }
    .ai-summary-textarea:focus { outline: none; border-color: var(--accent); }

    /* ── ACTION ROW ── */
    .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* ── PAGE HEADER ── */
    .page-header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .page-back {
      background: none; border: 1px solid var(--border);
      color: var(--text2); padding: 6px 14px;
      border-radius: 6px; font-family: inherit;
      font-size: 15px; cursor: pointer;
    }
    .page-back:hover { background: var(--surface2); }
    .page-title { font-size: 22px; font-weight: 700; }
  </style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo" style="display:flex;align-items:center;gap:8px;"><img src="icons/icon-32.png" style="width:28px;height:28px;border-radius:7px;flex-shrink:0;"><span>ヒトメモ</span></div>
  <div class="topbar-actions" id="topbar-actions"></div>
</div>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = 'hitomemo_profiles_v1';

const loadProfiles = () => {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch { return []; }
};
const saveProfiles = (list) => {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
};

// JSON バックアップ
const backupJSON = (list) => {
  const blob = new Blob([JSON.stringify({ profiles: list, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'hitomemo-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};

const restoreJSON = (onDone) => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        const list = data.profiles || data;
        if (!Array.isArray(list)) throw new Error('無効なフォーマット');
        if (!confirm(list.length + '件を復元します。現在のデータは上書きされます。続けますか？')) return;
        saveProfiles(list); onDone(list);
        alert('復元しました（' + list.length + '件）');
      } catch(err) { alert('復元に失敗しました: ' + err.message); }
    };
    reader.readAsText(file, 'utf-8');
  };
  input.click();
};

// 人脈サマリー分類
const classifyProfile = (p) => {
  const pos = ((p.position && p.position.value) || '').toLowerCase();
  const biz = ((p.business && p.business.value) || '').toLowerCase();
  const text = pos + ' ' + biz;
  if (/代表|社長|ceo|coo|cto|創業|オーナー|経営/.test(text)) return '経営者';
  if (/投資|vc|ファンド|エンジェル/.test(text)) return '投資家';
  if (/弁護士|税理士|会計士|社労士|司法書士|士業/.test(text)) return '士業';
  if (/m&a|merger|acquisition|買収|合併/.test(text)) return 'M&A';
  if (/採用|recruit|hr|人事/.test(text)) return '採用候補';
  return 'その他';
};

const formatDate = (s) => {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
};

// メモ形式インポート
const importFromMemo = (text) => {
  const extract = (label) => {
    const r = new RegExp(label + '[：:](.*?)(?=\\n[■氏誕所事経家出目価信行苦よ特印話欲そ核補作]|$)', 's');
    const m = text.match(r);
    return m ? m[1].trim() : '';
  };
  return {
    id: Date.now().toString(),
    createdAt: new Date().toISOString(),
    updatedAt: new Date().toISOString(),
    relationFlag: 'normal',
    meetings: [],
    meetingSummary: '',
    name:       { value: extract('氏名\\(ふりがな\\)') },
    birthday:   { value: extract('誕生日') },
    position:   { value: extract('所属・役職') },
    business:   { value: extract('事業') },
    history:    { value: extract('経歴') },
    family:     { value: extract('家族構成') },
    location:   { value: extract('出身・現所在地') },
    goals:      { value: extract('目標・夢') },
    values:     { value: extract('価値観') },
    beliefs:    { value: extract('信条') },
    behavior:   { value: extract('行動傾向') },
    dislikes:   { value: extract('苦手なこと') },
    topics:     { value: extract('よく話すテーマ') },
    skills:     { value: extract('特技・スキル') },
    memorable:  { value: extract('印象的な言葉') },
    impression: { value: extract('話してみての印象') },
    drive:      { value: extract('欲求\\(ドライブ\\)') },
    other:      { value: extract('その他') },
    coreMessage:{ value: extract('核となる一言') },
    insights:   { value: extract('補足・洞察') },
  };
};

// メモエクスポート
const exportAsMemo = (p) => {
  const v = (f) => (p[f] && p[f].value) ? p[f].value : '';
  const text = `【人物プロファイル】${v('name')}\n\n■基本情報\n氏名(ふりがな)：${v('name')}\n誕生日：${v('birthday')}\n所属・役職：${v('position')}\n事業：${v('business')}\n経歴：${v('history')}\n家族構成：${v('family')}\n出身・現所在地：${v('location')}\n\n■価値観・信条\n目標・夢：${v('goals')}\n価値観：${v('values')}\n信条：${v('beliefs')}\n\n■個性・傾向\n行動傾向：${v('behavior')}\n苦手なこと：${v('dislikes')}\nよく話すテーマ：${v('topics')}\n特技・スキル：${v('skills')}\n\n■洞察\n印象的な言葉：${v('memorable')}\n話してみての印象：${v('impression')}\n欲求(ドライブ)：${v('drive')}\nその他：${v('other')}\n核となる一言：${v('coreMessage')}\n\n■補足・洞察\n${v('insights')}\n\n作成日時：${new Date(p.createdAt).toLocaleString('ja-JP')}`;
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (v('name') || '人物プロファイル') + '_' + new Date().toISOString().slice(0,10) + '.txt';
  a.click(); URL.revokeObjectURL(url);
};

// ── INTERVIEW QUESTIONS ──
const QUESTIONS = [
  "お名前（ふりがな）",
  "誕生日",
  "所属・役職",
  "事業内容",
  "これまでの経歴",
  "ご家族構成",
  "出身地・現在の所在地",
  "今、最も実現したい目標や夢",
  "人生で大切にしている価値観",
  "信条・信念",
  "行動傾向・パターン",
  "苦手なこと・避けたいこと",
  "よく話すテーマ・関心事",
  "特技・スキル",
  "最近印象に残った言葉や出来事",
  "話してみての第一印象",
  "行動の原動力（欲求・ドライブ）",
  "その他、記録しておきたいこと",
  "この方を一言で表すと"
];
const FIELDS = ['name','birthday','position','business','history','family','location','goals','values','beliefs','behavior','dislikes','topics','skills','memorable','impression','drive','other','coreMessage'];

// ── APP ──
const App = () => {
  const [view, setView] = useState('list');
  const [profiles, setProfiles] = useState([]);
  const [query, setQuery] = useState('');
  const [filterStar, setFilterStar] = useState(false);
  const [current, setCurrent] = useState(null);
  const currentRef = useRef(null); // onBlur用：最新のcurrentを常に保持
  const profilesRef = useRef([]); // onBlur用：最新のprofilesを常に保持
  const [answers, setAnswers] = useState(Array(19).fill(''));
  const [qIdx, setQIdx] = useState(0);
  const [importText, setImportText] = useState('');
  const [showMeetingForm, setShowMeetingForm] = useState(false);
  const [meetDate, setMeetDate] = useState('');
  const [meetContent, setMeetContent] = useState('');
  const [dragSrcId, setDragSrcId] = useState(null);
  const [dragSection, setDragSection] = useState(null); // 'star' | 'all'
  const [manualOrder, setManualOrder] = useState(null);   // 全員の手動順
  const [starOrder, setStarOrder] = useState(null);       // ★の手動順

  useEffect(() => { setProfiles(loadProfiles()); }, []);
  // refを常に最新stateに同期
  currentRef.current = current;
  profilesRef.current = profiles;

  const updateList = (list) => { setProfiles(list); saveProfiles(list); };

  // 手動順でソート（初回はcreatedAt降順）
  const applyOrder = (list, order) => {
    if (!order) return [...list].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    const orderMap = {};
    order.forEach((id, i) => { orderMap[id] = i; });
    return [...list].sort((a, b) => {
      const ai = orderMap[a.id] !== undefined ? orderMap[a.id] : 9999;
      const bi = orderMap[b.id] !== undefined ? orderMap[b.id] : 9999;
      return ai - bi;
    });
  };

  const sorted = applyOrder(profiles, manualOrder);

  const filtered = sorted.filter(p => {
    if (filterStar && p.relationFlag !== 'star') return false;
    if (!query) return true;
    const q = query.toLowerCase();
    const fields = ['name','position','values','coreMessage','insights'];
    if (fields.some(f => (p[f] && p[f].value || '').toLowerCase().includes(q))) return true;
    if ((p.meetingSummary || '').toLowerCase().includes(q)) return true;
    if ((p.meetings || []).some(m => m.content.toLowerCase().includes(q))) return true;
    return false;
  });

  const starProfilesAll = profiles.filter(p => p.relationFlag === 'star');
  const starProfiles = applyOrder(starProfilesAll, starOrder);

  // サマリー集計
  const summary = (() => {
    const cats = {};
    profiles.forEach(p => {
      const c = classifyProfile(p);
      cats[c] = (cats[c] || 0) + 1;
    });
    return cats;
  })();

  // ── LIST VIEW ──
  if (view === 'list') {
    return (
      <div className="app">
        {/* 検索 */}
        <div className="search-wrap">
          <span className="search-icon">🔍</span>
          <input className="search-input" placeholder="氏名・所属・価値観・会食の学びで検索..."
            value={query} onChange={e => setQuery(e.target.value)} />
        </div>

        {/* フィルタ行 */}
        <div className="filter-row">
          <span className="filter-label">表示:</span>
          <button className={`filter-chip ${!filterStar ? 'active' : ''}`} onClick={() => setFilterStar(false)}>すべて</button>
          <button className={`filter-chip ${filterStar ? 'active' : ''}`} onClick={() => setFilterStar(true)}>★ 深めたい</button>
          <span style={{ marginLeft: 'auto', fontSize: 11, color: 'var(--text3)' }}>✥ ドラッグで並び替え</span>
        </div>

        {/* アクションボタン */}
        <div style={{ display: 'flex', gap: '8px', marginBottom: '6px', flexWrap: 'wrap' }}>
          <button className="btn btn-primary" onClick={() => { setAnswers(Array(19).fill('')); setQIdx(0); setView('interview'); }}>
            ＋ 新しい人物を記録
          </button>
          <button className="btn btn-ghost" onClick={() => { setImportText(''); setView('import'); }}>
            メモからインポート
          </button>
        </div>
        <div className="backup-row">
          <button className="backup-link" onClick={() => backupJSON(profiles)}>⬇ バックアップ</button>
          <span style={{ color: '#ccc', fontSize: 11 }}>|</span>
          <button className="backup-link" onClick={() => restoreJSON((list) => { setProfiles(list); })}>📥 JSONから復元</button>
        </div>

        {/* ★ 深めたい人 */}
        {!filterStar && starProfiles.length > 0 && (
          <>
            <div className="section-title">★ 深めたい人</div>
            <div className="star-grid">
              {starProfiles.map(p => (
                <div key={p.id}
                  className={`star-card ${dragSrcId === p.id && dragSection === 'star' ? 'dragging' : ''}`}
                  draggable={true}
                  onClick={() => { if (dragSrcId) return; setCurrent(p); setView('detail'); }}
                  onDragStart={e => { setDragSrcId(p.id); setDragSection('star'); e.dataTransfer.effectAllowed = 'move'; }}
                  onDragEnd={() => { setDragSrcId(null); setDragSection(null); }}
                  onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                  onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                  onDrop={e => {
                    e.preventDefault(); e.currentTarget.classList.remove('drag-over');
                    if (!dragSrcId || dragSrcId === p.id || dragSection !== 'star') return;
                    const base = starOrder || starProfiles.map(x => x.id);
                    const srcIdx = base.indexOf(dragSrcId);
                    const dstIdx = base.indexOf(p.id);
                    if (srcIdx === -1 || dstIdx === -1) return;
                    const next = [...base];
                    next.splice(srcIdx, 1); next.splice(dstIdx, 0, dragSrcId);
                    setStarOrder(next); setDragSrcId(null); setDragSection(null);
                  }}
                >
                  <span className="star-badge">★</span>
                  <button className="card-delete" onClick={e => { e.stopPropagation(); if(confirm('削除しますか？')) updateList(profiles.filter(x => x.id !== p.id)); }}>×</button>
                  <div className="card-name">{p.name.value || '名前未設定'}</div>
                  <div className="card-position">{p.position.value}</div>
                  {p.coreMessage.value && <div className="card-core">{p.coreMessage.value}</div>}
                  <div style={{ fontSize: 11, color: 'var(--text3)' }}>更新 {formatDate(p.updatedAt || p.createdAt)}</div>
                </div>
              ))}
            </div>
          </>
        )}

        {/* 人物一覧 */}
        <div className="section-title">
          {filterStar ? '★ 深めたい人' : '人物一覧'} — {filtered.length}人
        </div>

        {filtered.length === 0 ? (
          <div className="empty">
            <div className="empty-icon">👤</div>
            <div className="empty-title">{query ? '検索結果がありません' : 'まだ人物が登録されていません'}</div>
            <div style={{ fontSize: 13 }}>「＋ 新しい人物を記録」から始めましょう</div>
          </div>
        ) : (
          <div className="person-grid">
            {filtered.map(p => (
              <div key={p.id}
                className={`person-card ${p.relationFlag === 'star' ? 'is-star' : ''} ${dragSrcId === p.id && dragSection === 'all' ? 'dragging' : ''}`}
                draggable={!query}
                onClick={() => { if (dragSrcId) return; setCurrent(p); setView('detail'); }}
                onDragStart={e => { setDragSrcId(p.id); setDragSection('all'); e.dataTransfer.effectAllowed = 'move'; }}
                onDragEnd={() => { setDragSrcId(null); setDragSection(null); }}
                onDragOver={e => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }}
                onDragLeave={e => e.currentTarget.classList.remove('drag-over')}
                onDrop={e => {
                  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
                  if (!dragSrcId || dragSrcId === p.id || dragSection !== 'all') return;
                  const base = manualOrder || sorted.map(x => x.id);
                  const srcIdx = base.indexOf(dragSrcId);
                  const dstIdx = base.indexOf(p.id);
                  if (srcIdx === -1 || dstIdx === -1) return;
                  const next = [...base];
                  next.splice(srcIdx, 1); next.splice(dstIdx, 0, dragSrcId);
                  setManualOrder(next); setDragSrcId(null); setDragSection(null);
                }}
              >
                  <button className="card-delete" onClick={e => { e.stopPropagation(); if(confirm('削除しますか？')) updateList(profiles.filter(x => x.id !== p.id)); }}>×</button>
                  <div className="card-name">
                    {p.relationFlag === 'star' && <span style={{ color: 'var(--star)', marginRight: 4 }}>★</span>}
                    {p.name.value || '名前未設定'}
                  </div>
                  <div className="card-position">{p.position.value}</div>
                  {p.coreMessage.value && <div className="card-core">{p.coreMessage.value}</div>}
                  <div className="card-meta">
                    <span>更新 {formatDate(p.updatedAt || p.createdAt)}</span>
                    {(p.meetings || []).length > 0 && <span>会食 {p.meetings.length}回</span>}
                  </div>
                </div>
              ))}
            </div>
        )}

        {/* 人脈サマリー */}
        {profiles.length > 0 && (
          <div className="summary-box">
            <div className="summary-item">
              <div className="summary-num">{profiles.length}</div>
              <div className="summary-lbl">登録人数</div>
            </div>
            {Object.entries(summary).filter(([k]) => k !== 'その他').map(([k, v], i) => (
              <React.Fragment key={k}>
                <div className="summary-divider" />
                <div className="summary-item">
                  <div className="summary-num">{v}</div>
                  <div className="summary-lbl">{k}</div>
                </div>
              </React.Fragment>
            ))}
            {summary['その他'] > 0 && (
              <>
                <div className="summary-divider" />
                <div className="summary-item">
                  <div className="summary-num">{summary['その他']}</div>
                  <div className="summary-lbl">その他</div>
                </div>
              </>
            )}
          </div>
        )}
      </div>
    );
  }

  // ── INTERVIEW ──
  if (view === 'interview') {
    const pct = ((qIdx + 1) / QUESTIONS.length) * 100;
    const isLast = qIdx === QUESTIONS.length - 1;
    const finish = () => {
      const p = {
        id: Date.now().toString(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        relationFlag: 'normal',
        meetings: [],
        meetingSummary: '',
      };
      FIELDS.forEach((f, i) => { p[f] = { value: answers[i] || '' }; });
      const next = [...profiles, p];
      updateList(next);
      setCurrent(p); setView('detail');
    };
    return (
      <div className="page">
        <div className="page-header">
          <button className="page-back" onClick={() => setView('list')}>← 一覧</button>
          <div className="page-title">新しい人物を記録</div>
        </div>
        <div className="interview-box">
          <div className="progress-bar"><div className="progress-fill" style={{ width: pct + '%' }} /></div>
          <div className="q-count">{qIdx + 1} / {QUESTIONS.length}</div>
          <div className="q-text">{QUESTIONS[qIdx]}</div>
          <textarea className="q-textarea" value={answers[qIdx]}
            onChange={e => { const a = [...answers]; a[qIdx] = e.target.value; setAnswers(a); }}
            placeholder="（スキップ可）" />
          <div className="nav-row">
            <button className="btn btn-ghost" onClick={() => qIdx > 0 && setQIdx(qIdx - 1)} disabled={qIdx === 0}>前へ</button>
            <button className="btn btn-ghost btn-sm" onClick={() => isLast ? finish() : setQIdx(qIdx + 1)}>スキップ</button>
            <button className="btn btn-primary" onClick={() => isLast ? finish() : setQIdx(qIdx + 1)}>
              {isLast ? '完了' : '次へ'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── IMPORT ──
  if (view === 'import') {
    const doImport = () => {
      try {
        const p = importFromMemo(importText);
        const next = [...profiles, p];
        updateList(next);
        setCurrent(p); setView('detail');
      } catch { alert('インポートに失敗しました。形式を確認してください。'); }
    };
    return (
      <div className="page">
        <div className="page-header">
          <button className="page-back" onClick={() => setView('list')}>← 一覧</button>
          <div className="page-title">メモからインポート</div>
        </div>
        <div className="import-box">
          <p style={{ color: 'var(--text2)', marginBottom: 16, fontSize: 13 }}>エクスポートしたメモを貼り付けてください。</p>
          <textarea className="import-textarea" value={importText}
            onChange={e => setImportText(e.target.value)}
            placeholder="エクスポートしたメモをここに貼り付け..." />
          <div style={{ display: 'flex', gap: 10 }}>
            <label style={{ cursor: 'pointer' }}>
              <input type="file" accept=".txt" style={{ display: 'none' }}
                onChange={e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ev => setImportText(ev.target.result); r.readAsText(f); }} />
              <span className="btn btn-ghost">ファイルから読み込み</span>
            </label>
            <button className="btn btn-primary" onClick={doImport} disabled={!importText}>インポート</button>
            <button className="btn btn-ghost" onClick={() => setView('list')}>キャンセル</button>
          </div>
        </div>
      </div>
    );
  }

  // ── DETAIL ──
  if (view === 'detail' && current) {
    const upd = (field, val) => {
      const updated = { ...current, [field]: { value: val }, updatedAt: new Date().toISOString() };
      setCurrent(updated);
    };
    const updDirect = (field, val) => {
      const updated = { ...current, [field]: val, updatedAt: new Date().toISOString() };
      setCurrent(updated);
    };
    // フォーカスを外したときだけ保存（1文字ごとの再レンダリング防止）
    const saveCurrentBlur = () => {
      const latest = currentRef.current;
      if (!latest) return;
      updateList(profilesRef.current.map(p => p.id === latest.id ? latest : p));
    };
    const toggleStar = () => {
      const flag = current.relationFlag === 'star' ? 'normal' : 'star';
      updDirect('relationFlag', flag);
    };
    const addMeeting = () => {
      if (!meetDate || !meetContent) { alert('日付と内容を入力してください'); return; }
      const m = { id: Date.now().toString(), date: meetDate, content: meetContent, createdAt: new Date().toISOString() };
      const updated = { ...current, meetings: [...(current.meetings || []), m], updatedAt: new Date().toISOString() };
      setCurrent(updated);
      updateList(profiles.map(p => p.id === updated.id ? updated : p));
      setMeetDate(''); setMeetContent(''); setShowMeetingForm(false);
    };
    const delMeeting = (id) => {
      if (!confirm('この記録を削除しますか？')) return;
      const updated = { ...current, meetings: (current.meetings || []).filter(m => m.id !== id), updatedAt: new Date().toISOString() };
      setCurrent(updated); updateList(profiles.map(p => p.id === updated.id ? updated : p));
    };
    const delProfile = () => {
      if (!confirm('このプロフィールを削除しますか？')) return;
      updateList(profiles.filter(p => p.id !== current.id));
      setCurrent(null); setView('list');
    };
    const fv = (f) => (current[f] && current[f].value) || '';

    // AI要約テキストをパース
    const parseSummary = (text) => {
      if (!text) return null;
      const lines = text.split('\n').filter(Boolean);
      return lines.map((line, i) => {
        const m = line.match(/^(.+?)：(.+)$/);
        if (m) return <div key={i} className="ai-summary-field"><span className="ai-field-key">{m[1]}：</span><span className="ai-field-val">{m[2]}</span></div>;
        return <div key={i} className="ai-summary-field"><span className="ai-field-val">{line}</span></div>;
      });
    };

    const Field = ({ label, field, multi }) => (
      <div className="field-group">
        <label className="field-label">{label}</label>
        {multi
          ? <textarea className="field-textarea" value={fv(field)} onChange={e => upd(field, e.target.value)} onBlur={saveCurrentBlur} />
          : <input type="text" className="field-input" value={fv(field)} onChange={e => upd(field, e.target.value)} onBlur={saveCurrentBlur} />
        }
      </div>
    );

    return (
      <div className="page">
        <div className="page-header">
          <button className="page-back" onClick={() => setView('list')}>← 一覧</button>
        </div>

        {/* HERO */}
        <div className="detail-hero">
          <div className="hero-name">{fv('name') || '名前未設定'}</div>
          <div className="hero-position">{fv('position')}</div>
          {fv('coreMessage') && <div className="hero-core">{fv('coreMessage')}</div>}
          <div className="hero-meta">
            <button className={`star-toggle ${current.relationFlag === 'star' ? 'active' : ''}`} onClick={toggleStar}>
              {current.relationFlag === 'star' ? '★ 深めたい' : '☆ 通常'}
            </button>
            <span style={{ fontSize: 12, color: 'var(--text3)' }}>更新 {formatDate(current.updatedAt || current.createdAt)}</span>
          </div>
        </div>

        {/* 会食からの学び（優先表示） */}
        <div className="detail-section">
          <div className="detail-section-title">会食からの学び</div>
          {current.meetingSummary ? parseSummary(current.meetingSummary) : (
            <p style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 10 }}>
              会食履歴をもとにAIで要約した内容を保存できます。<br/>
              形式例：この人が大切にしていること： 〇〇
            </p>
          )}
          <textarea className="ai-summary-textarea"
            value={current.meetingSummary || ''}
            onChange={e => updDirect('meetingSummary', e.target.value)}
            onBlur={saveCurrentBlur}
            placeholder={'この人が大切にしていること： \nこの人が嫌うこと： \n最近の関心： \n接し方： '} />
        </div>

        {/* 会食履歴 */}
        <div className="detail-section">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <div className="detail-section-title" style={{ margin: 0 }}>会食・打合せ履歴</div>
            <button className="btn btn-ghost btn-sm" onClick={() => setShowMeetingForm(!showMeetingForm)}>
              {showMeetingForm ? '閉じる' : '＋ 追加'}
            </button>
          </div>
          {showMeetingForm && (
            <div style={{ background: 'var(--surface2)', borderRadius: 8, padding: 14, marginBottom: 14 }}>
              <input type="date" style={{ width: '100%', padding: '8px 10px', border: '1.5px solid var(--border)', borderRadius: 6, fontFamily: 'inherit', fontSize: 14, marginBottom: 8 }}
                value={meetDate} onChange={e => setMeetDate(e.target.value)} />
              <textarea style={{ width: '100%', minHeight: 80, padding: '8px 10px', border: '1.5px solid var(--border)', borderRadius: 6, fontFamily: 'inherit', fontSize: 13, resize: 'vertical', marginBottom: 8 }}
                value={meetContent} onChange={e => setMeetContent(e.target.value)} placeholder="内容・気づき" />
              <div style={{ display: 'flex', gap: 8 }}>
                <button className="btn btn-primary btn-sm" onClick={addMeeting}>追加</button>
                <button className="btn btn-ghost btn-sm" onClick={() => { setShowMeetingForm(false); setMeetDate(''); setMeetContent(''); }}>キャンセル</button>
              </div>
            </div>
          )}
          {(current.meetings || []).length === 0 ? (
            <p style={{ fontSize: 12, color: 'var(--text3)', textAlign: 'center', padding: '20px 0' }}>まだ記録がありません</p>
          ) : (
            [...(current.meetings || [])].reverse().map(m => (
              <div key={m.id} className="meeting-item">
                <button className="meeting-delete" onClick={() => delMeeting(m.id)}>削除</button>
                <div className="meeting-date">{m.date}</div>
                <div className="meeting-content">{m.content}</div>
              </div>
            ))
          )}
        </div>

        {/* 基本情報 */}
        <div className="detail-section">
          <div className="detail-section-title">基本情報</div>
          <Field label="氏名（ふりがな）" field="name" />
          <Field label="誕生日" field="birthday" />
          <Field label="所属・役職" field="position" />
          <Field label="事業" field="business" multi />
          <Field label="経歴" field="history" multi />
          <Field label="家族構成" field="family" multi />
          <Field label="出身・現所在地" field="location" />
        </div>

        {/* 価値観 */}
        <div className="detail-section">
          <div className="detail-section-title">価値観・信条</div>
          <Field label="目標・夢" field="goals" multi />
          <Field label="価値観" field="values" multi />
          <Field label="信条" field="beliefs" multi />
        </div>

        {/* 個性 */}
        <div className="detail-section">
          <div className="detail-section-title">個性・傾向</div>
          <Field label="行動傾向" field="behavior" multi />
          <Field label="苦手なこと" field="dislikes" multi />
          <Field label="よく話すテーマ" field="topics" multi />
          <Field label="特技・スキル" field="skills" multi />
        </div>

        {/* 洞察 */}
        <div className="detail-section">
          <div className="detail-section-title">洞察</div>
          <Field label="印象的な言葉" field="memorable" multi />
          <Field label="話してみての印象" field="impression" multi />
          <Field label="欲求（ドライブ）" field="drive" multi />
          <Field label="その他" field="other" multi />
          <Field label="核となる一言" field="coreMessage" multi />
          <Field label="補足・洞察" field="insights" multi />
        </div>

        {/* アクション */}
        <div className="action-row">
          <button className="btn btn-ghost" onClick={() => exportAsMemo(current)}>メモとしてエクスポート</button>
          <button className="btn btn-ghost" onClick={() => { setCurrent(null); setView('list'); }}>一覧に戻る</button>
          <button className="btn btn-danger" onClick={delProfile}>削除</button>
        </div>
      </div>
    );
  }

  return null;
};

ReactDOM.render(<App />, document.getElementById('root'));
</script>

<script>
// ── GOOGLE DRIVE SYNC (HITOMEMO) ──
const GDRIVE_CLIENT_ID = '450582924828-c89h2mia7e396dbilpthguhtb77p6fmr.apps.googleusercontent.com';
const GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const GDRIVE_FILE_NAME = 'hitomemo-backup.json';
const GDRIVE_REDIRECT_URI = (location.origin + location.pathname).replace(/\/$/, '') + '/index.html';

let gdriveToken = null;
let gdriveFolderId = null;
let gdriveFileId = null;

// リダイレクト方式（スマホ対応）
function gdriveConnect() {
  // OAuthコード取得後のリダイレクト処理
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: GDRIVE_REDIRECT_URI,
    response_type: 'token',
    scope: GDRIVE_SCOPE,
    prompt: 'select_account',
  });
  location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

// リダイレクト後にURLフラグメントからトークンを取得
function gdriveHandleRedirect() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const token = hash.get('access_token');
  if (token) {
    gdriveToken = token;
    localStorage.setItem('gdrive_token', token);
    // トークンをURLから消す
    history.replaceState(null, '', location.pathname);
    gdriveUpdateUI(true);
    gdriveAutoLoad();
  } else {
    // 保存済みトークンを確認
    const saved = localStorage.getItem('gdrive_token');
    if (saved) {
      gdriveToken = saved;
      gdriveUpdateUI(true);
    }
  }
}

function gdriveUpdateUI(connected) {
  // デスクトップサイドバー
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  const connectBtn = document.getElementById('gdriveConnectBtn');
  const saveBtn = document.getElementById('gdriveSaveBtn');
  const loadBtn = document.getElementById('gdriveLoadBtn');
  // モバイルドロワー
  const dotMob = document.getElementById('gdriveDotMob');
  const statusMob = document.getElementById('gdriveStatusMob');
  const connectMob = document.getElementById('gdriveConnectMob');
  const saveMob = document.getElementById('gdriveSaveMob');
  const loadMob = document.getElementById('gdriveLoadMob');

  if (connected) {
    if (dot) dot.style.background = '#34a853';
    if (status) status.textContent = 'Googleドライブ接続済み';
    if (connectBtn) connectBtn.style.display = 'none';
    if (saveBtn) saveBtn.style.display = '';
    if (loadBtn) loadBtn.style.display = '';
    if (dotMob) dotMob.style.background = '#34a853';
    if (statusMob) statusMob.textContent = '接続済み';
    if (connectMob) connectMob.style.display = 'none';
    if (saveMob) saveMob.style.display = '';
    if (loadMob) loadMob.style.display = '';
  } else {
    if (dot) dot.style.background = 'var(--border2)';
    if (status) status.textContent = 'Googleドライブ未接続';
    if (connectBtn) connectBtn.style.display = '';
    if (saveBtn) saveBtn.style.display = 'none';
    if (loadBtn) loadBtn.style.display = 'none';
    if (dotMob) dotMob.style.background = 'var(--border2)';
    if (statusMob) statusMob.textContent = '未接続';
    if (connectMob) connectMob.style.display = '';
    if (saveMob) saveMob.style.display = 'none';
    if (loadMob) loadMob.style.display = 'none';
  }
}

async function gdriveFetch(url, options={}) {
  const res = await fetch(url, {
    ...options,
    headers: { 'Authorization': 'Bearer ' + gdriveToken, ...(options.headers||{}) }
  });
  if (res.status === 401) {
    gdriveToken = null;
    localStorage.removeItem('gdrive_token');
    gdriveUpdateUI(false);
    if (confirm('Googleの認証が切れました。再ログインしますか？')) {
      gdriveConnect();
    }
    throw new Error('認証切れ');
  }
  return res;
}

async function gdriveFindFile() {
  const res = await gdriveFetch(
    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%22${GDRIVE_FILE_NAME}%22&fields=files(id,name)`
  );
  const data = await res.json();
  return data.files && data.files.length > 0 ? data.files[0].id : null;
}

async function gdriveSave() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  const dot = document.getElementById('gdriveDot');
  const status = document.getElementById('gdriveStatusText');
  dot.className = 'gdrive-dot saving';
  status.textContent = '保存中...';
  try {
    const list = JSON.parse(localStorage.getItem('hitomemo_profiles_v1') || '[]');
    const payload = JSON.stringify({ profiles: list, savedAt: new Date().toISOString() }, null, 2);
    const fileId = await gdriveFindFile();
    const metadata = { name: GDRIVE_FILE_NAME, parents: fileId ? undefined : ['appDataFolder'] };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(metadata)], {type:'application/json'}));
    form.append('file', new Blob([payload], {type:'application/json'}));
    const url = fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
    await gdriveFetch(url, { method: fileId ? 'PATCH' : 'POST', body: form });
    dot.className = 'gdrive-dot connected';
    status.textContent = 'Googleドライブに保存済み (' + new Date().toLocaleTimeString('ja-JP') + ')';
    toast('Googleドライブに保存しました');
  } catch(e) {
    dot.className = 'gdrive-dot connected';
    status.textContent = '保存エラー: ' + e.message;
  }
}

async function gdriveLoad() {
  if (!gdriveToken) { alert('先にGoogleでログインしてください'); return; }
  try {
    const fileId = await gdriveFindFile();
    if (!fileId) { alert('Googleドライブにバックアップが見つかりません'); return; }
    const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    const data = await res.json();
    if (data.logs) {
      if (!confirm(`Googleドライブから読み込みます。現在のデータは上書きされます。よろしいですか？`)) return;
      state.logs = data.logs || [];
      state.reviews = data.reviews || [];
      saveData();
      saveReviews();
      render();
      toast('Googleドライブから読み込みました');
    }
  } catch(e) {
    alert('読込エラー: ' + e.message);
  }
}

async function gdriveAutoLoad() {
  // 接続直後に自動でファイルの存在確認
  try {
    const fileId = await gdriveFindFile();
    if (fileId) {
      document.getElementById('gdriveStatusText').textContent = 'Googleドライブ接続済み（バックアップあり）';
    }
  } catch(e) {}
}

// 起動時に自動保存（ログインしている場合）
function gdriveAutoSave() {
  if (gdriveToken) gdriveSave();
}

// ページ読み込み時にリダイレクト後トークンを処理（DOM準備後に実行）
document.addEventListener('DOMContentLoaded', function() {
  gdriveHandleRedirect();
  // topbar-actionsにGDrive UIを追加
  const actions = document.getElementById('topbar-actions');
  if (actions) {
    actions.innerHTML = `
      <span id="gdriveDot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#ddd;margin-right:4px;vertical-align:middle;"></span>
      <button id="gdriveConnectBtn" onclick="gdriveConnect()" style="padding:4px 10px;background:var(--surface,#f5f5f5);border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;margin-right:4px;">GDrive接続</button>
      <button id="gdriveSaveBtn" onclick="gdriveSave()" style="display:none;padding:4px 10px;background:var(--surface,#f5f5f5);border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;margin-right:4px;">⬆ 保存</button>
      <button id="gdriveLoadBtn" onclick="gdriveLoad()" style="display:none;padding:4px 10px;background:var(--surface,#f5f5f5);border:1px solid #ddd;border-radius:4px;font-size:12px;cursor:pointer;">⬇ 読込</button>
    `;
  }
});

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(r => r.unregister());
    });
  }
</script>
</body>
