<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reflect OS</title>
<style>
/* UI基準：指で狙えるタップ領域（フィッツの法則） */
button, [role="button"], .btn, .nav a, .nav button, .tab, .tab-btn {
  min-height: 44px; min-width: 44px; box-sizing: border-box;
}
/* 密度が必要な一覧行内の小操作は明示的に例外化（クラス付与で opt-out） */
.dense button, .dense .btn, .tk-meta button { min-height: 32px; min-width: 32px; }
/* flexナビ内では明示min-widthが「内容幅未満への縮小」を許してしまうため、従来のmin-width:auto相当（内容幅で停止）に戻す */
.dense > button, .dense > .btn { flex-shrink: 0; }

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;
  --sf:#fff;
  --bd:#e8e4dc;
  --tx:#1a1814;
  --mu:#7a7670;
  --di:#b0aca4;
  --go:#2a5a3a;
  --go-lt:#f0f5f1;
  --go-bd:#a8c8b4;
  --bl:#3a4a6a;
  --bl-lt:#f0f3f8;
  --mono:'JetBrains Mono','Courier New',monospace;
  --serif: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --max:900px;
}
body{font-family:var(--serif);background:var(--bg);color:var(--tx);min-height:100vh;font-size:17px;line-height:1.8}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
input,textarea,select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:3px;font-family:var(--serif);font-size:16px;outline:none;transition:border-color .15s;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--go)}
textarea{resize:vertical;line-height:1.8}
button{cursor:pointer;font-family:var(--serif);border:none;border-radius:3px;transition:all .15s}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:200px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .25s;}
/* モバイル */
@media(max-width:640px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:500;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.15);}
  .mob-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;}
  .mob-topbar img{width:24px;height:24px;border-radius:6px;}
  .mob-topbar span{font-size:15px;font-weight:700;color:var(--go);}
  .hamburger{background:none;border:none;cursor:pointer;font-size:22px;color:var(--mu);padding:2px 6px;margin-left:auto;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:499;}
  .overlay.open{display:block;}

  /* メインコンテンツ余白 */
  #main{padding:0;}
  .main-pad{padding:14px 12px;}

  /* テーマグリッド → 1列 */
  .theme-grid{grid-template-columns:1fr!important;}

  /* テーマカード */
  .tcard-main{padding:12px 14px;}
  .tcard-name{font-size:15px;}
  .tcard-meta{flex-wrap:wrap;gap:4px;}

  /* ログ一覧 */
  .log-row{flex-wrap:wrap;gap:4px;}
  .log-date{flex-shrink:0;}
  .log-title{width:100%;white-space:normal!important;}

  /* 問い・実験の追加エリア */
  .add-row{flex-wrap:wrap;gap:6px;}
  .add-row input,.add-row select{width:100%!important;min-width:0!important;box-sizing:border-box;}
  .add-row button{white-space:nowrap;}

  /* 問い・実験カード */
  .q-row,.exp-row{flex-wrap:wrap;gap:4px;}
  .q-row .btn-row,.exp-row .btn-row{flex-wrap:wrap;gap:4px;}

  /* VISION設定 */
  .vision-edit-area{padding:12px;}

  /* チップ（テーマ選択）*/
  .chip-wrap{flex-wrap:wrap;gap:4px;}

  /* 検索 */
  .search-bar{width:100%;box-sizing:border-box;}

  /* タイプフィルター */
  .type-chips{flex-wrap:wrap;gap:4px;}

  /* AIインポート */
  .ai-import-area{padding:12px;}
  .ai-import-area textarea{font-size:14px;}

  /* 問い・実験リスト */
  .cl-row{align-items:flex-start;}
  .cl-label{min-width:0;width:100%;flex-basis:100%;}
  .cl-from{white-space:normal!important;font-size:10px;width:100%;flex-basis:100%;}
  .cl-row > div:last-child{margin-left:0!important;flex-wrap:wrap;}
}
@media(min-width:641px){
  .mob-topbar{display:none;}
  .overlay{display:none;}
}
.sb-hd{padding:14px 16px;border-bottom:1px solid var(--bd);}
.sb-logo{display:flex;align-items:center;gap:8px;}
.sb-logo img{width:28px;height:28px;border-radius:7px;flex-shrink:0;}
.sb-logo span{font-size:15px;font-weight:700;color:var(--tx);}
.sb-nav{padding:6px 0;flex:0 0 auto;}
nav{display:flex;flex-direction:column;gap:0;}
.nb{padding:10px 16px;font-size:15px;letter-spacing:.02em;background:transparent;color:var(--mu);border:none;border-left:3px solid transparent;border-radius:0;cursor:pointer;font-family:var(--serif);display:flex;align-items:center;gap:8px;text-align:left;width:100%;transition:background .1s;}
.nb:hover{background:var(--bg);}
.nb .nav-icon{font-size:14px;width:16px;text-align:center;}
.nb.on{color:var(--go);background:var(--go-lt);border-left-color:var(--go);font-weight:600;}
.sb-rec{padding:10px 16px;border-top:1px solid var(--bd);flex:0 0 auto;}
.sb-rec-lbl{font-size:9px;color:var(--di);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;}
.sb-rec-btn{display:block;width:100%;padding:7px 10px;margin-bottom:4px;font-size:13px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--mu);cursor:pointer;font-family:var(--serif);transition:all .1s;}
.sb-rec-btn:hover{border-color:var(--go);color:var(--go);background:var(--go-lt);}
.sb-ft{padding:10px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;flex:0 0 auto;}
.sb-badge{font-size:10px;background:var(--go);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;font-family:var(--mono);}
.sb-badge:empty{display:none;}
.unlinked-notice{background:#fff8e8;border:1px solid #f0d060;border-radius:4px;padding:10px 14px;font-size:13px;color:#7a6000;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.unlinked-notice a{color:var(--go);cursor:pointer;text-decoration:underline;}
.sb-ft button,.sb-ft label{display:block;width:100%;padding:6px 8px;font-size:12px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--di);cursor:pointer;font-family:var(--serif);}
.sb-ft button:hover,.sb-ft label:hover{border-color:var(--mu);color:var(--mu);}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#v26{padding:8px 20px;border-bottom:1px solid var(--bd);background:var(--bg);flex-shrink:0;}
.v26c{display:flex;align-items:baseline;gap:14px;}
.v26t{font-family:var(--mono);font-size:9px;color:var(--di);letter-spacing:.14em;min-width:38px;}
.v26b{font-size:13px;color:var(--mu);line-height:1.7;}
.v26k{font-family:var(--mono);font-size:9px;color:var(--di);margin-right:8px;}
#body{flex:1;padding:28px 36px 80px;}

/* ── AI Import ── */
.ai-import-wrap{max-width:var(--max);padding:32px 28px 80px;}
.checklist{display:flex;flex-direction:column;gap:0;margin-bottom:8px;}
.cl-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;}
.cl-row:last-child{border-bottom:none;}
.cl-cb{flex-shrink:0;width:16px;height:16px;accent-color:var(--go);cursor:pointer;margin-top:2px;}
.cl-label{flex:1;font-size:14px;color:var(--tx);line-height:1.6;min-width:0;}
.cl-row input[type=checkbox]:checked~.cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-from{color:var(--di);}
.cl-doing{background:#f0f8f0;}
.cl-doing .cl-label{color:var(--go);font-weight:500;}
.cl-skip .cl-label{text-decoration:line-through;color:var(--di);opacity:.6;}
.exp-state-btn{font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);cursor:pointer;color:var(--mu);margin-left:4px;flex-shrink:0;}
.exp-state-btn:hover{border-color:var(--mu);}
.exp-state-btn.doing{color:var(--go);border-color:var(--go-bd);background:var(--go-lt);}
.exp-state-btn.skip{color:var(--di);}
.cl-from{font-size:11px;color:var(--di);white-space:nowrap;flex-shrink:0;}
.ai-prompt-box{border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;background:var(--sf);}
.ai-prompt-box summary{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--mu);}
.ai-prompt-inner{padding:0 14px 14px;}
.ai-prompt-note{font-size:12px;color:var(--mu);margin-bottom:8px;}
.ai-prompt-pre{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:12px;white-space:pre-wrap;word-break:break-all;margin-bottom:8px;line-height:1.7;color:var(--tx);}
.ai-import-title{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.ai-import-sub{font-size:13px;color:var(--mu);margin-bottom:24px;}
.ai-format-box{font-size:13px;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:14px 16px;line-height:2;margin-bottom:16px;}
.ai-format-box strong{color:var(--tx);}
.ai-format-box code{font-family:var(--mono);font-size:12px;background:#f0ede8;padding:0 3px;border-radius:2px;}
.ai-textarea{width:100%;min-height:220px;padding:14px 16px;font-size:15px;line-height:1.8;border:1px solid var(--bd);border-radius:5px;font-family:var(--serif);background:var(--sf);color:var(--tx);resize:vertical;outline:none;display:block;}
.ai-textarea:focus{border-color:var(--go);}
.ai-btn-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.ai-status{font-size:13px;color:var(--mu);}
.ai-status.ok{color:var(--go);}
.ai-status.err{color:#b05050;}

/* ── Buttons ── */
.btn-p{background:var(--go);color:#fff;padding:9px 20px;font-size:15px}
.btn-p:hover{background:#1e4a2a}
.btn-s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:8px 16px;font-size:14px}
.btn-s:hover{border-color:var(--mu)}
.btn-g{background:transparent;color:var(--di);border:1px solid var(--bd);padding:4px 10px;font-size:13px}
.btn-g:hover{border-color:var(--mu);color:var(--mu)}
.btn-d{background:transparent;color:#b05050;border:1px solid #e0c0c0;padding:3px 8px;font-size:10px}

/* ── Section ── */
.sec{margin-bottom:40px}
.sec-lbl{font-size:10px;color:var(--di);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
.dvd{border-top:1px solid var(--bd);margin:28px 0}

/* ── VISION ── */
.vision-block{margin-bottom:32px}
.vision-text{font-size:17px;color:var(--go);line-height:2;white-space:pre-wrap;padding:16px 0}
.vision-expand{cursor:pointer;font-size:13px;color:var(--di);display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
.vision-expand:hover{color:var(--mu)}
.vision-detail{display:none;padding:16px 0 8px;border-top:1px solid var(--bd);margin-top:8px}
.vision-detail.open{display:block}
.vision-principle{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
.vision-principle:last-child{border-bottom:none}
.vp-kw{color:var(--go);min-width:36px;font-size:14px}
.vp-num{color:var(--di);font-family:var(--mono);font-size:10px;min-width:14px;padding-top:2px}
.vp-text{color:var(--mu);line-height:1.7}

/* ── Theme cards ── */
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
@media(max-width:640px){.theme-grid{grid-template-columns:1fr}}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:5px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.tcard:hover{border-color:var(--go-bd)}
.tcard-main{padding:16px 18px}
.tcard-name{font-size:17px;color:var(--tx);margin-bottom:6px;line-height:1.4;font-weight:500}
.tcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tcard-status{font-size:10px;padding:1px 8px;border-radius:10px;border:1px solid}
.st-active{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.st-plan{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.st-hold{color:var(--di);border-color:var(--bd);background:var(--bg)}
.st-done{color:var(--bl);border-color:#b0c0e0;background:var(--bl-lt)}
.st-exit{color:#b05050;border-color:#e0b0b0;background:#fdf0f0}
.tcard-summary{font-size:14px;color:var(--mu);line-height:1.6}
.tcard-detail{display:none;border-top:1px solid var(--bd);padding:14px 16px;font-size:14px;color:var(--mu);line-height:1.7}
.tcard-detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcard-detail.open{display:block}
.tcard-active{border-color:var(--go)!important;box-shadow:0 0 0 2px var(--go)33;}
.tcard-dl{font-size:9px;color:var(--di);letter-spacing:.1em;text-transform:uppercase;margin:10px 0 4px}
.tcard-dl:first-child{margin-top:0}
.ms-pill{display:inline-flex;padding:2px 8px;font-size:10px;border-radius:10px;border:1px solid;margin:2px;gap:4px}
.ms-done{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.ms-doing{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.ms-todo{color:var(--di);border-color:var(--bd);background:var(--bg)}
.kpi-row{font-size:13px;color:var(--mu);padding:3px 0;display:flex;gap:8px}
.kpi-name{color:var(--di)}
.tcard-acts{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}

/* ── Log items ── */
.log-item{padding:16px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.log-item:first-child{border-top:1px solid var(--bd)}
.log-item:hover .log-title{color:var(--go)}
.log-date{font-size:10px;color:var(--di);font-family:var(--mono);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.log-title{font-size:17px;color:var(--tx);margin-bottom:5px;transition:color .15s}
.log-trace{margin:6px 0 2px}
.trace-toggle{font-size:12px;color:var(--mu);background:none;border:1px solid var(--bd);border-radius:12px;padding:2px 10px;cursor:pointer}
.trace-toggle:hover{color:var(--tx);border-color:var(--mu)}
.trace-toggle.open{color:var(--go);border-color:var(--go)}
.trace-body{margin:8px 0 4px;padding:10px 12px;background:#f7f7fb;border-left:3px solid #cfcfe6;border-radius:6px;font-size:13px;line-height:1.7}
.trace-origin{color:var(--tx);font-weight:600;margin-bottom:6px}
.trace-step{margin:3px 0;color:var(--tx)}
.trace-point{color:var(--mu)}
.trace-arrow{color:#9a9ac0;margin:0 6px;font-weight:700}
.trace-shift{color:var(--tx)}
.trace-landing{margin-top:7px;padding-top:6px;border-top:1px dashed #d7d7e6;color:var(--go);font-weight:600}
.log-lesson{font-size:15px;color:var(--mu);line-height:1.7;border-left:2px solid var(--go-bd);padding-left:12px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.log-q{font-size:14px;color:var(--bl);margin-top:6px;white-space:pre-wrap;word-break:break-word}
.log-exp{font-size:14px;color:var(--go);margin-top:6px;white-space:pre-wrap;word-break:break-word}
.log-acts{display:flex;gap:6px;margin-top:10px}
.log-caret{margin-left:auto;color:var(--di);font-size:11px}
.log-item:not(.log-open) .log-lesson{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.log-item:not(.log-open) .log-q,.log-item:not(.log-open) .log-exp{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.log-item.log-open{background:#fbfbfd;border-radius:10px;padding-left:14px;padding-right:14px}
.log-item.log-open .log-title{color:var(--tx)}
.log-item.log-open .log-lesson{font-size:16px;color:var(--tx)}
.log-item.log-open .log-q,.log-item.log-open .log-exp{font-size:15px}
.tbadge{font-size:9px;padding:1px 7px;border-radius:10px}

/* ── Question items ── */

/* ── Form ── */
.form-wrap{max-width:640px;margin:0 auto}
.form-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:10px;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.lbl-opt{font-size:9px;color:var(--di);margin-left:6px;font-style:italic;text-transform:none;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.hint{background:var(--go-lt);border-left:2px solid var(--go-bd);padding:10px 14px;font-size:14px;color:var(--go);margin-bottom:18px;line-height:1.7}
.expand-tog{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--di);font-size:13px;padding:6px 0;background:transparent;border:none;font-family:var(--serif);width:100%}
.expand-tog:hover{color:var(--mu)}
.expand-arr{font-size:9px;transition:transform .2s;display:inline-block}
.expand-tog.open .expand-arr{transform:rotate(90deg)}
.expand-body{display:none;padding:8px 0 4px}
.expand-body.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{padding:3px 10px;font-size:13px;background:var(--bg);color:var(--di);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-family:var(--serif)}
/* 紐づけ（links）：薄いチップ1行。押しても遷移しない */
.lk-row{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;min-width:0}
.lk-chip{font-size:11px;color:var(--di);border:1px solid var(--bd);border-radius:10px;padding:1px 8px;line-height:1.5;max-width:100%;overflow-wrap:anywhere}
.chip:hover{border-color:var(--mu)}
.chip.on{background:var(--go-lt);color:var(--go);border-color:var(--go-bd)}
.sldr-row{display:flex;align-items:center;gap:8px}
.sldr-row input[type=range]{accent-color:var(--go);padding:0;border:none;background:transparent;box-shadow:none}
.sldr-v{font-size:14px;color:var(--go);min-width:16px;text-align:right}
.ms-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.ms-row input{flex:1}
.kpi-row-edit{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.kpi-row-edit input{flex:1}
.url-wrap{display:flex;gap:7px}
.url-wrap input{flex:1}

/* ── Lesson/exp strip ── */
.learn-exp{color:var(--go)}

/* ── Record buttons ── */
.rec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:0}
.rec-btn{padding:13px 8px;text-align:center;border:1px solid var(--bd);border-radius:5px;cursor:pointer;font-family:var(--serif);background:var(--sf);transition:all .15s;font-size:15px}
.rec-btn:hover{border-color:var(--go-bd);background:var(--go-lt)}
.rec-btn-lbl{color:var(--go);display:block;margin-bottom:2px}
.rec-btn-desc{font-size:10px;color:var(--di)}

/* ── Dash ── */

/* ── Exp board ── */
.exp-cnt{font-size:10px;color:var(--di);font-family:var(--mono)}

/* ── Search ── */
.srch-wrap{position:relative;margin-bottom:16px}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--di);font-size:15px;pointer-events:none}
.srch-wrap input{padding-left:32px;font-size:16px}

/* ── Theme form extras ── */

<script>
// 他のタブで保存された場合に再読み込み
window.addEventListener('storage', function(e) {
  if (e.key === 'reflectOS_v1') { location.reload(); return; }
});

function toast(msg) {
  let el = document.querySelector('.toast-msg');
  if (!el) {
    el = document.createElement('div');
    el.className = 'toast-msg';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

/* ── DB ── */
/* ── 永続化：localStorage（旧IndexedDB ReflectOS7 から自動移行）── */
const LS_KEY='reflectOS_v1';
/* 探求ボード（questions/experiments/principles）も同じ reflectOS_v1 内の配列として保存する。
   依頼書はIndexedDB新ストアを想定していたが、実コードの永続化はlocalStorage一本のため
   「実際のコードを確認して正とする」原則に従いここへ追加（Task OS統合バックアップにも自動で乗る） */
const _RS=['logs','themes','settings','checks','questions','experiments','principles'];
let _migrated=false,_migP=null;
function _lsRead(){
  try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(o&&typeof o==='object'){_RS.forEach(s=>{if(!Array.isArray(o[s]))o[s]=[];});return o;}}catch(e){}
  return {logs:[],themes:[],settings:[],checks:[]};
}
function _lsWrite(o){ try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){console.warn('reflectOS save失敗',e);} }
/* 旧IndexedDB(ReflectOS7)が残っていれば一回だけlocalStorageへ移行。失敗時は書かず次回再試行 */
function _migrateFromIDB(){
  return new Promise(res=>{
    if(localStorage.getItem(LS_KEY)!==null){res();return;}
    if(!('indexedDB' in window)){_lsWrite({logs:[],themes:[],settings:[],checks:[]});res();return;}
    let done=false;const ok=o=>{if(done)return;done=true;_lsWrite(o);res();};
    try{
      const req=indexedDB.open('ReflectOS7',1);
      req.onupgradeneeded=e=>{const db=e.target.result;_RS.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
      req.onerror=()=>{ if(!done){done=true;res();} };  /* 開けない時はLS未設定のまま→次回再試行 */
      req.onsuccess=e=>{
        const db=e.target.result;const out={logs:[],themes:[],settings:[],checks:[]};
        const have=_RS.filter(s=>db.objectStoreNames.contains(s));
        if(!have.length){try{db.close();}catch(_){}ok(out);return;}
        let left=have.length;const tx=db.transaction(have,'readonly');
        have.forEach(s=>{const g=tx.objectStore(s).getAll();
          g.onsuccess=()=>{out[s]=g.result||[];if(--left===0){try{db.close();}catch(_){}ok(out);}};
          g.onerror=()=>{if(--left===0){try{db.close();}catch(_){}ok(out);}};});
      };
    }catch(e){ if(!done){done=true;res();} }
  });
}
async function _ensure(){ if(!_migrated){ if(!_migP)_migP=_migrateFromIDB(); await _migP; _migrated=true; } return _lsRead(); }
async function dbput(s,v){ const o=await _ensure(); const a=o[s]||(o[s]=[]); const i=a.findIndex(x=>x&&x.id===v.id); if(i>=0)a[i]=v; else a.push(v); _lsWrite(o); }
async function dbget(s,k){ const o=await _ensure(); return (o[s]||[]).find(x=>x&&x.id===k); }
async function dball(s){ const o=await _ensure(); return (o[s]||[]).slice(); }
async function dbclear(s){ const o=await _ensure(); o[s]=[]; _lsWrite(o); }
async function dbdel(s,k){ const o=await _ensure(); o[s]=(o[s]||[]).filter(x=>x&&x.id!==k); _lsWrite(o); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const tod=()=>new Date().toISOString().split('T')[0];
const dAgo=d=>Math.floor((Date.now()-new Date(d))/(864e5));
function h(tag,a,...kids){const e=document.createElement(tag);Object.entries(a||{}).forEach(([k,v])=>{if(k==='cls')e.className=v;else if(k==='css')e.style.cssText=v;else if(k[0]==='o'&&k[1]==='n')e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);});kids.flat(9).forEach(c=>{if(c==null)return;if(typeof c==='string'||typeof c==='number')e.appendChild(document.createTextNode(String(c)));else e.appendChild(c);});return e;}
const D=(a,...c)=>h('div',a,...c);
const Sp=(a,...c)=>h('span',a,...c);
const Bt=(a,...c)=>h('button',a,...c);
const In=(a)=>h('input',a);
const Ta=(a)=>h('textarea',a);
const Sel=(a,...c)=>h('select',a,...c);
const Opt=(v,t,sel)=>h('option',{value:v,...(sel?{selected:''}:{})},t);

/* ── State ── */
let S={vision:{vision:'',yearGoal:''},themes:[],logs:[],checks:{},questions:[],experiments:[],principles:[],tab:'home',forming:null,editing:null,fd:{},_activeTheme:null,_unlinkedNotice:0,unthemedOnly:false,_tkTab:'focus',_tkOpen:{}};

/* ── Constants ── */
const TM={note:{label:'振り返り',bg:'#f0f5f1',ac:'#2a6a3a'},moya:{label:'モヤモヤ',bg:'#f0f0f8',ac:'#4a4a8a'},vision:{label:'VISION点検',bg:'#faf0e8',ac:'#7a5020'},strategy:{label:'戦略テーマ',bg:'#f0f5f0',ac:'#1a6050'},philosophy:{label:'思想変化',bg:'#f4f1fa',ac:'#5a4a8a'}};
const EMOTIONS=['希望','興奮','感謝','誇り','安心','楽しさ','不安','恐怖','怒り','悲しみ','失望','孤独','混乱','モヤモヤ','葛藤'];
const BIASES=['返報依存','承認欲求','透明性の錯覚','期待投影','対立回避','確証バイアス','サンクコスト','楽観バイアス'];
const THEME_CATS=['戦略','プロジェクト','VISION','新規事業','人間関係','学習','財務','組織'];
const THEME_STATUS=['構想中','実行中','保留','完了','撤退'];
/* 選択肢に出すテーマ（外したテーマ・完了を除く） */
const rfPickThemes=()=>S.themes.filter(t=>!t.detached&&t.status!=='完了');
const THEME_PRI=['S','A','B','C'];

/* ── Form primitives ── */
function fld(lb,child,opt=false,note=''){const w=D({cls:'field'});if(lb){const l=h('label',{cls:'lbl'},lb);if(opt)l.appendChild(Sp({cls:'lbl-opt'},'任意'));w.appendChild(l);}w.appendChild(child);if(note)w.appendChild(D({css:'font-size:13px;color:var(--di);margin-top:3px'},note));return w;}
function tI(lb,key,ph='',tp='text',opt=false,fd2){const fd=fd2||S.fd;const e=In({type:tp,placeholder:ph});e.value=fd[key]||(tp==='date'?'':'');e.addEventListener('input',()=>fd[key]=e.value);return fld(lb,e,opt);}
function taF(lb,key,ph='',mh=70,opt=false,fd2){const fd=fd2||S.fd;const e=Ta({placeholder:ph,css:`min-height:${mh}px;width:100%`});e.value=fd[key]||'';e.addEventListener('input',()=>fd[key]=e.value);return fld(lb,e,opt);}
function thChipsF(key){const selIds=S.fd[key]||[];const w=D({cls:'chips'});const active=rfPickThemes();if(!active.length){w.appendChild(Sp({css:'font-size:14px;color:var(--di)'},'（テーマ未登録）'));return fld('探求テーマ',w,true);}active.forEach(t=>{const a=selIds.includes(t.id);const c=Bt({cls:'chip'+(a?' on':'')},t.title);c.addEventListener('click',()=>{const cur=S.fd[key]||[];S.fd[key]=cur.includes(t.id)?cur.filter(x=>x!==t.id):[...cur,t.id];ra();});w.appendChild(c);});return fld('探求テーマ',w,true);}

/* ── Theme form ── */
/* テーマ＝在り方の軸。テーマが探る問いは「重点の問い」で表すので、問い欄（currentState）は持たない（2026-11-03）。
   関連PJ・マイルストーン・指標の欄も外した（中身は起動時の整理でテーマの記録へ移した） */
function buildThemeForm(tfd){
  return [
    tI('テーマ名','title','探求しているテーマ（例：資本政策は関係性の設計か？）','text',false,tfd),
    taF('現在の仮説','summary','今どう考えているか・何を信じているか',80,false,tfd),
  ];
}

function openThemeForm(existing){
  const tfd=existing?JSON.parse(JSON.stringify(existing)):{id:uid(),title:'',createdAt:tod()};
  const main=document.getElementById('body');main.innerHTML='';
  const wrap=D({cls:'form-wrap fu'});
  const bk=Bt({cls:'btn-s',css:'margin-bottom:20px',onclick:()=>ra()},'← 戻る');
  wrap.appendChild(bk);
  const card=D({css:'background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:24px 28px'});
  buildThemeForm(tfd).forEach(x=>x&&card.appendChild(x));
  wrap.appendChild(card);
  const acts=D({css:'display:flex;gap:8px;margin-top:20px;margin-bottom:40px'});
  const sv=Bt({cls:'btn-p'},existing?'更新':'追加');
  sv.addEventListener('click',async()=>{if(!tfd.title?.trim()){alert('テーマ名を入力してください');return;}tfd.updatedAt=tod();if(!tfd.createdAt)tfd.createdAt=tod();await dbput('themes',tfd);const i=S.themes.findIndex(x=>x.id===tfd.id);if(i>=0)S.themes[i]=tfd;else S.themes.push(tfd);tkMirrorFocus();ra();});
  acts.appendChild(sv);
  if(existing){const dl=Bt({cls:'btn-d',css:'margin-left:auto',onclick:async()=>{if(!confirm('削除しますか？'))return;await dbdel('themes',tfd.id);S.themes=S.themes.filter(x=>x.id!==tfd.id);tkMirrorFocus();ra();}},  '削除');acts.appendChild(dl);}
  const cn=Bt({cls:'btn-s',onclick:()=>ra()},'キャンセル');acts.appendChild(cn);
  wrap.appendChild(acts);
  main.appendChild(wrap);
}

/* ── Log form ── */
function buildLogForm(type){
  // 全タイプ共通：5フィールドに統一（＋きっかけ＝trace.origin）
  if(S.fd._origin===undefined) S.fd._origin=(S.fd.trace&&S.fd.trace.origin)||'';
  return [
    D({cls:'g2'},tI('タイトル','title','ひと言で'),tI('日付','date','','date')),
    tI('きっかけ','_origin','何が引き金でこの振り返りに至ったか（任意）'),
    taF('気づき・学び','lesson','腹落ちした学び。箇条書き可。',80),
    tI('問い','question','まだ答えが出ていない問い','text',true),
    taF('次の実験','nextExp','「〜してみる」で書く',55,true),
    thChipsF('themes'),
  ].filter(Boolean);
}

function renderLogForm(type){
  const meta=TM[type]||{label:'',ac:'var(--go)'};
  const wrap=D({cls:'form-wrap fu'});
  const hdr=D({cls:'form-hdr'});
  const bk=Bt({cls:'btn-s',onclick:()=>{S.forming=null;S.editing=null;S.fd={};ra();}},'← 戻る');
  hdr.appendChild(bk);
  hdr.appendChild(D({},D({css:'font-size:13px;color:var(--di);margin-bottom:2px'},meta.label),D({css:`font-size:16px;color:${meta.ac}`},'深く考えた後に記録する')));
  wrap.appendChild(hdr);
  const card=D({css:'background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:24px 28px'});
  buildLogForm(type).forEach(x=>x&&card.appendChild(x));
  wrap.appendChild(card);
  const acts=D({css:'display:flex;gap:8px;margin-top:16px;margin-bottom:40px'});
  const sv=Bt({cls:'btn-p',onclick:()=>saveLog('published')},'保存');
  const dr=Bt({cls:'btn-g',onclick:()=>saveLog('draft')},'下書き');
  acts.appendChild(sv);acts.appendChild(dr);wrap.appendChild(acts);
  return wrap;
}

async function saveLog(status){
  const r={...S.fd,status,id:S.fd.id||uid(),date:S.fd.date||tod(),type:S.forming||S.editing?.type};
  // きっかけ（trace.origin）を標準項目として保存。空なら除去し、trace全体が空になれば消す
  const origin=(S.fd._origin||'').trim(); delete r._origin;
  if(origin){ r.trace={...(r.trace||{}),origin}; }
  else if(r.trace){ const t={...r.trace}; delete t.origin; r.trace=((t.steps&&t.steps.length)||t.landing)?t:undefined; if(!r.trace)delete r.trace; }
  await dbput('logs',r);
  const i=S.logs.findIndex(x=>x.id===r.id);if(i>=0)S.logs[i]=r;else S.logs.unshift(r);
  S.logs.sort((a,b)=>b.date.localeCompare(a.date));
  /* 新規動線：ログのquestion/nextExpを探求ボードへ即時反映（sourceCk単位の増分＝同一保存内でも重複しない） */
  try{ await tkMigrate(); }catch(e){}
  S.forming=null;S.editing=null;S.fd={};ra();
}

/* ── Log card ── */
function logCard(r){
  const meta=TM[r.type]||{};
  const item=D({cls:'log-item'});
  // 日付行：日付・タイプバッジ・下書き
  const dr=D({cls:'log-date'});
  dr.appendChild(document.createTextNode(r.date));
  dr.appendChild(Sp({cls:'tbadge',css:`background:${meta.bg||'#f5f5f5'};color:${meta.ac||'#888'}`},meta.label||r.type));
  if(r.status==='draft')dr.appendChild(Sp({cls:'draft-badge'},'下書き'));
  dr.appendChild(Sp({cls:'log-caret'},'▽'));
  item.appendChild(dr);
  // タイトル
  item.appendChild(D({cls:'log-title'},r.title||'（無題）'));
  // テーマバッジ
  const thNames=(r.themes||[]).map(id=>S.themes.find(t=>t.id===id)?.title).filter(Boolean);
  if(thNames.length){
    const thRow=D({css:'display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px'});
    thNames.forEach(n=>thRow.appendChild(Sp({css:'font-size:11px;background:var(--go-lt);color:var(--go);border-radius:10px;padding:1px 8px;'},n)));
    item.appendChild(thRow);
  } else {
    const uwrap=D({css:'margin:4px 0 2px'});
    uwrap.appendChild(Sp({css:'font-size:11px;color:#b09040;background:#fdf8e8;border:1px solid #e8d880;border-radius:10px;padding:1px 8px;display:inline-block'},'テーマ未紐づけ'));
    const linkable=rfPickThemes();
    if(linkable.length){
      const pk=D({css:'display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px'});
      pk.appendChild(Sp({css:'font-size:11px;color:var(--di)'},'テーマに紐づける：'));
      linkable.forEach(t=>{
        const c=Bt({cls:'chip',css:'font-size:11px'},t.title);
        c.addEventListener('click',async e=>{
          e.stopPropagation();
          r.themes=[...(r.themes||[]),t.id];
          await dbput('logs',r);
          const i=S.logs.findIndex(x=>x.id===r.id);if(i>=0)S.logs[i]=r;
          updateNav();ra();
        });
        pk.appendChild(c);
      });
      uwrap.appendChild(pk);
    }
    item.appendChild(uwrap);
  }
  { const lk=rfLinkChips(r.links); if(lk) item.appendChild(lk); }   /* 紐づけ（あるときだけ） */
  // 気づき・学び：全文（閉じている間はCSSで2行にクランプ、カードクリックで全文）
  if(r.lesson){const d=D({cls:'log-lesson'});d.textContent=r.lesson.trim();item.appendChild(d);}
  // 経緯（trace）：デフォルト折りたたみ。本体はクリーンなまま、掘りたいときだけ軌跡を出す
  if(r.trace && (r.trace.origin || (r.trace.steps&&r.trace.steps.length) || r.trace.landing)){
    const tw=D({cls:'log-trace'});
    const nStep=(r.trace.steps||[]).length;
    const tg=Bt({cls:'trace-toggle'}, '⤵ 経緯'+(nStep?'（'+nStep+'手）':''));
    const body=D({cls:'trace-body',css:'display:none'});
    if(r.trace.origin) body.appendChild(D({cls:'trace-origin'}, '出発点：'+r.trace.origin));
    (r.trace.steps||[]).forEach(s=>{
      const row=D({cls:'trace-step'});
      row.appendChild(Sp({cls:'trace-point'}, s.point||''));
      if(s.shift){ row.appendChild(Sp({cls:'trace-arrow'},'→')); row.appendChild(Sp({cls:'trace-shift'}, s.shift)); }
      body.appendChild(row);
    });
    if(r.trace.landing) body.appendChild(D({cls:'trace-landing'}, '着地：'+r.trace.landing));

    if(opening){ const tb=item.querySelector('.trace-body'); if(tb){tb.style.display='block'; item.querySelector('.trace-toggle')?.classList.add('open');} }
  });

  // 問い・実験セクション（テーマフィルター対応）
  function buildClSection(logs){
    const sec=D({id:'cl-section'});
    const at=S._activeTheme;
    const theme=at?S.themes.find(t=>t.id===at):null;

    // フィルター対象ログを決定
    let filtered=logs;
    if(theme){
      // 選択テーマに紐づくログ（themesフィールドにテーマIDが含まれる）
      filtered=logs.filter(r=>(r.themes||[]).includes(theme.id));
    }

    // フィルター表示ラベル
    if(theme){
      const lbl=D({css:'display:flex;align-items:center;gap:8px;margin-bottom:16px;margin-top:32px'});

      clr.addEventListener('click',()=>{S._activeTheme=null;document.querySelectorAll('.tcard-active').forEach(el=>el.classList.remove('tcard-active'));document.querySelectorAll('.tcard-detail.open').forEach(el=>el.classList.remove('open'));const s=document.getElementById('cl-section');const fp=S.logs.filter(r=>r.status!=='draft');if(s)s.replaceWith(buildClSection(fp));});
      lbl.appendChild(clr);
      sec.appendChild(lbl);
    }

    // HOME: 重要マークした問いのみ表示
    const importantQs=[];
    filtered.filter(r=>r.question?.trim()).forEach(r=>{
      r.question.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
        const ckId='q_'+r.id+'_'+i;
        if((S.checks[ckId]||'todo')==='important') importantQs.push({line,ckId,r});
      });
    });
    if(importantQs.length){
      sec.appendChild(D({cls:'sec-lbl',css:'margin-top:0'},'重要な問い'));
      const qList=D({cls:'checklist'});
      importantQs.forEach(({line,ckId,r})=>qList.appendChild(buildQRow(line,ckId,r)));
      sec.appendChild(qList);
    }

    // HOME: 実験中のみ表示
    const doingExps=[];
    filtered.filter(r=>r.nextExp?.trim()).forEach(r=>{
      r.nextExp.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
        const ckId='e_'+r.id+'_'+i;
        if((S.checks[ckId]||'todo')==='doing') doingExps.push({line,ckId,r});
      });
    });
    if(doingExps.length){
      sec.appendChild(D({cls:'sec-lbl',css:'margin-top:32px'},'実験中'));
      const eList=D({cls:'checklist'});
      doingExps.forEach(({line,ckId,r})=>eList.appendChild(buildExpRow(line,ckId,r)));
      sec.appendChild(eList);
    }

    /* 旧: 未定義の qs/exps を参照しReferenceErrorになっていた（依頼書「既存バグの確認」）。実際に計算した配列で判定 */
    if(theme && !importantQs.length && !doingExps.length){
      sec.appendChild(D({cls:'empty',css:'margin-top:16px'},'このテーマに紐づく振り返りはまだありません'));
    }
    return sec;
  }
  /* Phase 3：旧checksベースの「重要な問い／実験中」セクションは撤去（現在の重点・探求ボードへ移行済み。
     buildClSection関数はテーマクリックハンドラが参照するためレガシー残置＝cl-section不在時は何もしない）。
     代わりに「最近の振り返り」を表示 */
  const recent=pub.slice(0,5);
  if(recent.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-top:32px;margin-bottom:14px'},'最近の振り返り'));
    recent.forEach(r=>f.appendChild(logCard(r)));
  }

  return f;
}

const TYPE_MAP = {
  '振り返り':'note','振り返':'note','note':'note',
  'モヤモヤ':'moya','もやもや':'moya','moya':'moya',
  'VISION点検':'vision','vision点検':'vision','vision':'vision','ビジョン':'vision',
  '戦略テーマ':'strategy','戦略':'strategy','strategy':'strategy',
  '思想変化':'philosophy','philosophy':'philosophy',
};

function extractField(block, keys, multiline=false){
  for(const key of keys){
    // 次のラベル行（「キー：」）か【ブロック】が来るまで取得
    const re = new RegExp(key + '[：:：][ \\t]*([\\s\\S]+?)(?=\\n[ \\t]*[ァ-ヺぁ-ゔA-Za-z一-龥々・]+[：:：]|\\n【[^】]+】|$)', 'i');
    const m = block.match(re);
    if(m && m[1].trim()){
      const raw = m[1].trim();
      if(multiline) return raw;
      return raw.split('\n')[0].trim();
    }
  }
  return '';
}

// 番号付きリスト・箇条書きを含む複数行フィールド用
function extractMultiField(block, keys){
  return extractField(block, keys, true);
}

/* 【経緯ログ】ブロック → trace{origin,steps[{point,shift}],landing} に変換。
   本体（振り返り）とは混ぜず、直前の振り返りレコードにtraceとしてぶら下げる（同一取り込みテキスト内で紐づく）。 */
function parseTraceBlock(block){
  const origin  = extractField(block, ['出発点','起点','最初のモヤモヤ']);
  const landing = extractField(block, ['着地','着地点','結論']);
  const pathRaw = extractMultiField(block, ['掘り下げの道筋','道筋','掘り下げ']);
  const steps = [];
  String(pathRaw||'').split('\n').forEach(line=>{
    const l = line.replace(/^[\s・\-–—*●•\u30fb]+/,'').trim();
    if(!l || /^[（(]/.test(l)) return;                 // 空行・プレースホルダ例は除外
    const parts = l.split(/\s*(?:→|->|⇒|=>)\s*/);
    if(parts.length>=2) steps.push({point:parts[0].trim(), shift:parts.slice(1).join(' → ').trim()});
    else steps.push({point:l, shift:''});
  });
  if(!origin && !landing && !steps.length) return null;
  return {origin, steps, landing};
}

function parseAiReflect(text){
  const entries = [];
  let lastEntry = null;
  const blocks = text.split(/(?=【[^】]+】)/);
  blocks.forEach(block => {
    const hm = block.match(/^【([^】]+)】/);
    if(!hm) return;
    const rawType = hm[1].trim();
    // 【経緯ログ】は本体に混ぜず、直前の振り返りレコードのtraceとして格納
    if(/経緯ログ|経緯/.test(rawType)){
      const tr = parseTraceBlock(block);
      if(tr && lastEntry) lastEntry.trace = tr;
      return;
    }
    const typKey = TYPE_MAP[rawType] || TYPE_MAP[rawType.toLowerCase()] || null;
    if(!typKey) return;

    const title      = extractField(block, ['タイトル','title']);
    const rawDate    = extractField(block, ['日付','date']);
    const date       = (rawDate.match(/\d{4}-\d{2}-\d{2}/) || [tod()])[0];
    const learned    = extractMultiField(block, ['気づき・学び','気づき','学び','learned']);
    const question   = extractMultiField(block, ['問い','question']);
    const nextExp    = extractMultiField(block, ['次の実験','次のアクション','nextExp','next']);

    if(!title && !learned) return;
    const entry = {
      id:uid(), type:typKey, date, status:'published',
      title: title || learned.slice(0,40),
      lesson: learned,
      nextExp,
      question
    };
    if(typKey==='moya')        entry.moya_what    = extractField(block, ['何にモヤモヤ','モヤモヤ詳細']);
    if(typKey==='vision')      entry.vision_change= extractField(block, ['VISIONの変化','変化']);
    if(typKey==='strategy')    entry.progress     = extractField(block, ['進捗','progress']);
    if(typKey==='philosophy'){
      entry.old_belief   = extractField(block, ['当時の思想','以前の考え']);
      entry.what_changed = extractField(block, ['何が変わったか','変化']);
      entry.new_belief   = extractField(block, ['今の理解','新しい考え']);
      entry.pivot        = extractField(block, ['転換点']);
    }
    entries.push(entry);
    lastEntry = entry;
  });
  return entries;
}

/* 取り込みの本体（textarea・status 要素に依存しない）。画面の「登録する」と受信箱（inboxApply）の両方が使う。
   返り値：{ok, kind, message, summary, parts, logIds, questionIds, experimentIds, lecticaLogIds}
   kind：'empty'（空）／'parse'（解析エラー）／'none'（タイプ行も REFLECT-IMPORT も無い）／'fail'（何も登録できず）／'ok'
   opts.silent：Lectica の失敗を alert でなく message に返す */
async function reflectImportText(text, opts){
  opts=opts||{};
  text=String(text||'').trim();
  const sp=rfSplitUpdate(text);
  if(sp.update===null) return reflectImportLegacy(text, opts);   /* REFLECT-UPDATE が無ければ従来どおり */
  const res={ok:false,kind:'',message:'',summary:'',parts:[],logIds:[],questionIds:[],experimentIds:[],themeIds:[],lecticaLogIds:[]};
  /* 従来ブロック（【振り返り】・---REFLECT-IMPORT--- 等）が混ざっていれば先に従来どおり処理（「直前の更新を元に戻す」は UPDATE だけを戻す） */
  let lg=null;
  if(/【|---REFLECT-IMPORT---/.test(sp.rest)) lg=await reflectImportLegacy(sp.rest, opts);
  if(lg){ ['logIds','questionIds','experimentIds','lecticaLogIds'].forEach(k=>res[k].push(...(lg[k]||[]))); res.parts.push(...(lg.parts||[])); }
  const up=await rfApplyUpdate(sp.update);
  up.questionIds.forEach(id=>{ if(!res.questionIds.includes(id)) res.questionIds.push(id); });
  up.experimentIds.forEach(id=>{ if(!res.experimentIds.includes(id)) res.experimentIds.push(id); });
  up.themeIds.forEach(id=>{ if(!res.themeIds.includes(id)) res.themeIds.push(id); });
  if(up.changed) res.parts.push('探求ボードの更新'+up.changed+'件');
  const lgSum=lg?(lg.ok?lg.summary:(lg.kind==='none'?'':lg.message)):'';
  res.summary=[lgSum, up.summary].filter(Boolean).join('／');
  res.message=res.summary;
  if(up.limits.length){ res.kind='limit'; return res; }   /* summary に入れ替えが必要な理由も含まれる */   /* 入れ替えは本人が決める＝保留 */
  if(lg&&!lg.ok&&lg.kind!=='none'){ res.kind='fail'; return res; }   /* 従来ブロックの失敗は保留（UPDATE は冪等なので再試行してよい） */
  if(!up.readable&&!(lg&&lg.ok)){ res.kind='none'; res.message=['【REFLECT-UPDATE】の中に読めるブロックがありません'].concat(up.errors).join('\n'); return res; }
  res.ok=true; res.kind=res.parts.length?'ok':'nochange';
  if(!res.summary) res.summary='変更なし';
  return res;
}

/* ══ REFLECT-UPDATE（探求ボードの「直し」を ID 付きで取り込む。KOSO-IMPORT と同じ方式）══
   書式：先頭行【REFLECT-UPDATE】、ブロックは行頭「■ 」
     ■ 問い {実ID}　　題名／ステータス（候補・重点・解消・破棄・保管）／仮説／テーマ（実ID・題名の完全一致・なし＝置き換え）／記録
     ■ 実験 {実ID または R001}　題名／問い（実ID・（外す））／ステータス（候補・実験中・振り返り待ち・完了・変更・保留・やらない・原則化・保管）／テーマ／場面／観察／期限／結果／学び／記録
     ■ 統合：問い {A}, {B} → 新規「題名」　　理由／テーマ（省略＝統合元の和・外したテーマは除く）／ステータス（候補・重点。省略＝統合元に重点があれば重点）
     ■ 統合：実験 {A}, {B} → 新規「題名」　　理由／テーマ／ステータス（候補・実験中。省略＝統合元に実験中があれば実験中）
       統合済みの同じブロックを テーマ・ステータス 付きで再送すると、統合先に当てる
     ■ 問い 新規　　題名（必須）／ステータス（候補・重点。省略＝候補）／仮説／テーマ（実ID・題名の完全一致・なし）／記録
     ■ 実験 新規　　題名（必須）／問い（既存の実ID）／ステータス（候補・実験中。省略＝候補）／場面／観察／期限／結果／学び／記録
     ■ テーマ {実ID}　題名／状態（構想中・実行中・保留・完了・撤退・外した・戻す）／仮説／記録（問い欄はなくなった＝重点の問いで表す）
     ■ テーマ 新規　題名（必須）／状態（省略＝構想中）／仮説／記録
     ■ 原則 新規　　題名（必須）／分類（対話・判断・組織・自分・その他。省略＝その他）／説明／元の実験（実ID・R番号）／元の問い（実ID）
   実験を完了にするには学びが要る（ブロックの「学び：」か既存の学び。「学び：なし」＝（学びなし）で完了）
   値が空・（変更なし）＝触らない／（空にする）＝空文字（題名は不可）／記録：種類｜本文 ＝ notes[] に追記（全件に同じ種類＋本文があれば入れない）
   新規は「■ 問い 新規」「■ 実験 新規」（同じ題名が既にあれば作らず記録だけ足す）。上限（重点3・実験中は重点の問い1本につき5）を超える昇格・作成は入れ替えず、そのブロックだけ保留。
   実験中にできるのは重点の問いにつながる実験だけ（つながらなければそのブロックだけ保留）。保管から重点・実験中へ直接はできない（いったん候補） */
const RF_UPDATE_BK='reflect_backup_lastupdate';
/* 本文から【REFLECT-UPDATE】の区間を切り出す。区間は次の【…】行か ---REFLECT-IMPORT--- か【/REFLECT-UPDATE】まで。残りは従来の取り込みへ */
function rfSplitUpdate(text){
  const lines=String(text||'').split(/\r?\n/);
  if(!lines.some(l=>l.trim().startsWith('【REFLECT-UPDATE】'))) return {update:null, rest:text};
  const up=[], rest=[]; let inUp=false;
  lines.forEach(l=>{
    const t=l.trim();
    if(t.startsWith('【REFLECT-UPDATE】')){ inUp=true; return; }
    if(inUp&&t.startsWith('【/REFLECT-UPDATE】')){ inUp=false; return; }

    (inUp?up:rest).push(l);

}
const RF_UQ_KEYS={'題名':'title','タイトル':'title','ステータス':'status','状態':'status','仮説':'hypothesis','記録':'note'};
const RF_UT_KEYS={'題名':'title','タイトル':'title','状態':'status','ステータス':'status','仮説':'summary','記録':'note'};
const RF_UE_KEYS={'題名':'title','タイトル':'title','問い':'questionId','ステータス':'status','状態':'status','場面':'scene','観察':'observation','期限':'deadline','結果':'result','学び':'learning','記録':'note'};
const RF_UKIND={'問い':'q','実験':'e','テーマ':'t','原則':'p'};
/* 区間 → ブロック配列（解析のみ・データは触らない） */
function rfParseUpdate(body){
  const blocks=[]; let cur=null;
  String(body||'').split(/\r?\n/).forEach(raw=>{
    const l=raw.replace(/　/g,' ').trim();
    if(/^■/.test(l)){ cur={head:l, fields:[]}; blocks.push(cur); return; }
    if(!cur||!l) return;
    const m=l.match(/^([^：:]+?)\s*[：:]\s*(.*)$/);
    if(m) cur.fields.push({key:m[1].trim(), value:m[2].trim()});
  });
  blocks.forEach(b=>{
    let m;
    if((m=b.head.match(/^■\s*統合\s*[：:]\s*(問い|実験)\s+(.+?)\s*(?:→|->|⇒)\s*新規\s*[「『"“](.+?)[」』"”]\s*$/))){
      b.op='merge'; b.kind=m[1]==='問い'?'q':'e'; b.ids=m[2].split(/[,、，\s]+/).map(s=>s.trim()).filter(Boolean); b.title=m[3].trim();
    }else if((m=b.head.match(/^■\s*(問い|実験|テーマ|原則)\s*新規\s*$/))){
      b.op='create'; b.kind=RF_UKIND[m[1]];
    }else if((m=b.head.match(/^■\s*(問い|実験|テーマ)\s+(\S+)\s*$/))){
      b.op='update'; b.kind=RF_UKIND[m[1]]; b.id=m[2];
    }else b.op='unknown';
  });
  return blocks;
}
const rfNoChg=v=>v===''||/^[（(]変更なし[)）]$/.test(v);
const rfClear=v=>/^[（(]空にする[)）]$/.test(v);
/* 日本語の表示名（TK_QST／TK_EST）または英字キー → キー。統合済み（merged）は直接は付けない */
function rfStatusKey(v, dict){
  const s=String(v||'').trim();
  if(dict[s]&&s!=='merged') return s;
  const k=Object.keys(dict).find(k=>dict[k]===s);
  return (k&&k!=='merged')?k:null;
}
/* 「テーマ：」の値 → {skip} ／ {themeIds,noTheme} ／ {err,first}。実ID か題名の完全一致・なし。外したテーマ・無いテーマは読めない */
function rfThemeOf(value){
  if(rfNoChg(value)||rfClear(value)) return {skip:true};
  if(value==='なし') return {themeIds:[],noTheme:true};
  const hit=S.themes.find(t=>t&&t.id===value)||S.themes.find(t=>t&&!t.detached&&t.title===value)||S.themes.find(t=>t&&t.title===value);
  if(!hit) return {err:'テーマが見つかりません：'+value};
  if(hit.detached) return {err:'外したテーマです',first:true};
  return {themeIds:[hit.id],noTheme:false};
}
/* テーマを置き換える。変わったら「テーマ（A→B）」を返す（同じなら ''＝冪等）。before は実際に変える直前（退避） */
function rfSetTheme(o,th,before){
  if((o.themeIds||[]).join(',')===th.themeIds.join(',')&&!!o.noTheme===!!th.noTheme) return '';
  const nm=ids=>tkThemeNames(ids).join('・')||'なし';
  const s='テーマ（'+nm(o.themeIds)+'→'+nm(th.themeIds)+'）';
  if(before) before();
  o.themeIds=th.themeIds.slice(); if(th.noTheme) o.noTheme=true; else delete o.noTheme;
  return s;
}
/* 統合で重点・実験中にできるか。できなければ理由（統合元が merged になって空く分を差し引いて判定）。
   実験は新しい実験のつなぎ先 qid が重点の問いで、その問いの実験中が上限未満のときだけ */
function rfMergeBlock(isQ,st,freed,qid){
  if(isQ) return (st==='focus'&&tkFocusQs().length-freed.filter(o=>o.status==='focus').length>=TK_MAX_FOCUS_Q)?'重点の問いが'+TK_MAX_FOCUS_Q+'件のため入れ替えが必要です（どれを候補へ戻すか本人が決める）':'';
  return st==='active'?tkActiveWhy({id:''},qid,freed):'';
}
function rfFindE(id){ const s=String(id||''); return S.experiments.find(x=>x&&(x.id===s||(x.rid&&x.rid.toUpperCase()===s.toUpperCase())))||null; }
/* notes に追記（全件に同じ種類＋本文（前後空白除去）があれば入れない）。追記したら true */
function rfPushNote(o, value, before){
  const m=String(value||'').match(/^([^｜|]+?)\s*[｜|]\s*(.+)$/);
  const kind=m?m[1].trim():'記録', text=(m?m[2]:value).trim();
  if(!text) return false;
  if(!Array.isArray(o.notes)) o.notes=[];
  if(o.notes.some(n=>n&&String(n.kind||'').trim()===kind&&String(n.text||'').trim()===text)) return false;
  if(before) before();   /* 実際に追記する直前（退避） */
  o.notes.push({date:tod(), kind, text, src:'取り込み'});
  return true;
}
/* 区間を適用。返り値 {summary, changed, readable, errors[], limits[], questionIds[], experimentIds[], themeIds[]} */

        if(ch.length){ await tkSave('questions',q); out.changed++; out.questionIds.push(q.id); }

          const k=RF_UE_KEYS[key]; if(!k||err) return;

          if(k==='questionId'){
            if(/^[（(]外す[)）]$/.test(value)||rfClear(value)){ p.questionId=null; return; }
            if(!S.questions.some(q=>q&&q.id===value&&q.status!=='merged')){ err='つなぎ先の問いの実IDが見つかりません：'+value; return; }
            p.questionId=value; return;
          }

          }

/* 「■ 問い 新規」「■ 実験 新規」：画面の「問いを追加」・フリー追加と同じ形で作る。題名は必須、ステータス省略は候補。

    if(isQ&&p.themeIds&&!(dup.themeIds||[]).length&&!dup.noTheme&&(p.themeIds.length||p.noTheme)){ backup(); dup.themeIds=p.themeIds; if(p.noTheme) dup.noTheme=true; ch.push('テーマ'); }
    let nN=0; notes.forEach(v=>{ if(rfPushNote(dup,v,backup)) nN++; }); if(nN) ch.push('記録'+nN+'件');
    if(ch.length){ await tkSave(isQ?'questions':'experiments',dup); out.changed++; (isQ?out.questionIds:out.experimentIds).push(dup.id); }
    sums.push(label+' 新規『'+rfShort(p.title)+'』既にあります（'+dup.id+'）'+(ch.length?'・'+ch.join('・'):''));
    return;
  }
  if(isQ&&st==='focus'&&tkFocusQs().length>=TK_MAX_FOCUS_Q){
    const s='重点の問いが'+TK_MAX_FOCUS_Q+'件のため入れ替えが必要です（どれを候補へ戻すか本人が決める）：問い 新規『'+rfShort(p.title)+'』'; out.limits.push(s); sums.push(s); return;
  }

    const why=tkActiveWhy({id:''},p.questionId||null);
    if(why){ const s=why+'：実験 新規『'+rfShort(p.title)+'』'; out.limits.push(s); sums.push(s); return; }
  }
  backup();
  const now=new Date().toISOString();
  const o=isQ
    ?{id:uid(),title:p.title,themeIds:p.themeIds||[],...(p.noTheme?{noTheme:true}:{}),status:st,hypothesis:p.hypothesis||'',sourceLogIds:[],mergedIntoId:null,createdAt:now,updatedAt:now,completedAt:null,notes:[]}
    :{id:uid(),questionId:p.questionId||null,title:p.title,themeIds:[],status:st,scene:p.scene||'',observation:p.observation||'',deadline:p.deadline||'',result:p.result||'',learning:p.learning||'',sourceLogIds:[],createdAt:now,updatedAt:now,completedAt:null,notes:[]};
  notes.forEach(v=>rfPushNote(o,v));
  await tkSave(isQ?'questions':'experiments',o);
  out.changed++; (isQ?out.questionIds:out.experimentIds).push(o.id);
  sums.push(label+' 新規『'+rfShort(p.title)+'』（'+(isQ?TK_QST:TK_EST)[st]+(!isQ&&o.rid?'・'+o.rid+' を付けました':'')+(!isQ&&o.questionId?'・問い '+o.questionId:'')+(isQ&&o.themeIds.length?'・テーマ '+o.themeIds[0]:'')+'）');
}
/* テーマの項目を読む。新規（create）では 外した／戻す は使えず、（空にする）は書かないのと同じ */
function rfReadThemeFields(b,create){
  const p={}; const notes=[]; let err='', first=false;
  b.fields.forEach(({key,value})=>{
    if((key==='問い'||key==='現在の状態')&&!err){ err='テーマの問い欄はなくなりました（重点の問いで表します）'; first=true; return; }
    const k=RF_UT_KEYS[key]; if(!k||err) return;
    if(k==='note'){ if(!rfNoChg(value)) notes.push(value); return; }
    if(rfNoChg(value)) return;
    if(k==='title'){ if(!rfClear(value)) p.title=value; return; }
    if(k==='status'){
      if(!create&&value==='外した'){ p.detached=true; return; }
      if(!create&&value==='戻す'){ p.detached=false; return; }
      if(!THEME_STATUS.includes(value)) err='状態名が読めません：'+value; else p.status=value;
      return;
    }
    if(rfClear(value)){ if(!create) p[k]=''; return; }
    p[k]=value;
  });
  return {p,notes,err,first};
}
/* 「■ テーマ {実ID}」：更新のみ。完了にしたら completedAt、完了以外へ戻したら外す */
async function rfApplyThemeUpdate(b,{out,sums,backup,bad}){
  const t=S.themes.find(x=>x&&x.id===b.id);
  if(!t){ bad(b,'テーマの実IDが見つかりません'); return; }
  const {p,notes,err,first}=rfReadThemeFields(b,false);
  if(err){ bad(b,err,first); return; }
  out.readable++;
  const ch=[];
  if(p.title!==undefined&&p.title!==t.title){ backup(); t.title=p.title; ch.push('題名'); }
  if(p.status!==undefined&&p.status!==t.status){
    backup(); ch.push('状態（'+(t.status||'なし')+'→'+p.status+'）'); t.status=p.status;
    if(p.status==='完了') t.completedAt=tod(); else delete t.completedAt;
  }
  [['summary','仮説']].forEach(([k,lb])=>{ if(p[k]!==undefined&&p[k]!==(t[k]||'')){ backup(); t[k]=p[k]; ch.push(lb); } });
  let nN=0; notes.forEach(v=>{ if(rfPushNote(t,v,backup)) nN++; }); if(nN) ch.push('記録'+nN+'件');
  if(p.detached===true&&!t.detached){ backup(); t.detached=true; t.detachedAt=tod(); ch.push('外した'); }
  if(p.detached===false&&t.detached){ backup(); t.detached=false; ch.push('戻した'); }
  if(ch.length){ t.updatedAt=tod(); await dbput('themes',t); out.changed++; out.themeIds.push(t.id); }
  sums.push('テーマ '+b.id+' '+(ch.length?ch.join('・'):'変更なし'));
}
/* 「■ テーマ 新規」：同じ題名（外したテーマも含む）が既にあれば作らず、記録を足し空の項目だけ埋める */
async function rfApplyThemeCreate(b,{out,sums,backup,bad}){
  const {p,notes,err,first}=rfReadThemeFields(b,true);
  if(err||!p.title){ bad(b,err||'題名がありません',first); return; }
  out.readable++;
  const key=rfTitleKey(p.title);
  const dup=S.themes.find(t=>t&&rfTitleKey(t.title)===key);
  if(dup){
    const ch=[];
    [['summary','仮説']].forEach(([k,lb])=>{ if(p[k]&&!dup[k]){ backup(); dup[k]=p[k]; ch.push(lb); } });
    let nN=0; notes.forEach(v=>{ if(rfPushNote(dup,v,backup)) nN++; }); if(nN) ch.push('記録'+nN+'件');
    if(ch.length){ dup.updatedAt=tod(); await dbput('themes',dup); out.changed++; out.themeIds.push(dup.id); }
    sums.push('テーマ 新規『'+rfShort(p.title)+'』既にあります（'+dup.id+(dup.detached?'・外したテーマ':'')+'）'+(ch.length?'・'+ch.join('・'):''));
    return;
  }
  backup();
  const st=p.status||'構想中';
  const t={id:uid(),title:p.title,status:st,summary:p.summary||'',notes:[],createdAt:tod(),updatedAt:tod()};
  if(st==='完了') t.completedAt=tod();
  notes.forEach(v=>rfPushNote(t,v));
  await dbput('themes',t); S.themes.push(t);
  out.changed++; out.themeIds.push(t.id);
  sums.push('テーマ 新規『'+rfShort(p.title)+'』');
}
/* 「■ 原則 新規」：画面の「原則をつくる」と同じ tkAddPrinciple で作る。元の実験を原則化にはしない（■ 実験 の ステータス：原則化 で別に） */
async function rfApplyPrincipleCreate(b,{out,sums,backup,bad}){
  let title='',cat='other',desc='',err='';
  const srcE=[],srcQ=[];
  const ids=v=>v.split(/[,、，\s]+/).map(s=>s.trim()).filter(Boolean);
  b.fields.forEach(({key,value})=>{
    if(err||rfNoChg(value)||rfClear(value)) return;
    if(key==='題名'||key==='タイトル') title=value;
    else if(key==='説明') desc=value;
    else if(key==='分類'||key==='カテゴリ'){
      const c=Object.keys(TK_PCAT).find(k=>k===value||TK_PCAT[k]===value);
      if(!c) err='分類が読めません：'+value; else cat=c;
    }
    else if(key==='元の実験') ids(value).forEach(id=>{ const x=rfFindE(id); if(!x) err=err||'元の実験の実IDが見つかりません：'+id; else if(!srcE.includes(x.id)) srcE.push(x.id); });
    else if(key==='元の問い') ids(value).forEach(id=>{ if(!S.questions.some(q=>q&&q.id===id)) err=err||'元の問いの実IDが見つかりません：'+id; else if(!srcQ.includes(id)) srcQ.push(id); });
  });
  if(!err&&!title) err='題名がありません';
  if(err){ bad(b,err); return; }
  out.readable++;
  const key=rfTitleKey(title);
  const dup=S.principles.find(p=>p&&p.status!=='archived'&&rfTitleKey(p.title)===key);
  if(dup){ sums.push('原則 新規『'+rfShort(title)+'』既にあります（'+dup.id+'）'); return; }
  backup();
  await tkAddPrinciple({title,category:cat,description:desc,sourceExperimentIds:srcE,sourceQuestionIds:srcQ});
  out.changed++;
  sums.push('原則 新規『'+rfShort(title)+'』（'+TK_PCAT[cat]+(srcE.length?'・元の実験'+srcE.length:'')+(srcQ.length?'・元の問い'+srcQ.length:'')+'）');
}

/* 従来の取り込み（【振り返り】・---REFLECT-IMPORT---）。reflectImportText から呼ばれる。【意思決定ログ】→決定検証は 2026-11-03 に外した */
async function reflectImportLegacy(text, opts){
  opts=opts||{};
  text=String(text||'').trim();
  const res={ok:false,kind:'',message:'',summary:'',parts:[],logIds:[],questionIds:[],experimentIds:[],lecticaLogIds:[]};
  if(!text){ res.kind='empty'; res.message='入力が空です'; return res; }
  // 自動判別：---REFLECT-IMPORT--- → Lectica実績 ／ 【振り返り】等 → 汎用登録 ／ 両方 → 両方処理
  const hasLectica = /---REFLECT-IMPORT---/.test(text);
  // Lecticaブロック内の「気づき：」等の行を汎用パーサが誤認識しないよう、除いた残りで判定する
  const genericText = text.replace(/---REFLECT-IMPORT---[\s\S]*?(?:---END---|$)/g,'').trim();

  let entries = [];
  if(genericText){
    try { entries = parseAiReflect(genericText); }
    catch(err){
      if(!hasLectica){ res.kind='parse'; res.message='解析エラー: '+err.message; return res; }
    }
  }
  if(!entries.length && !hasLectica){
    res.kind='none'; res.message='【振り返り】などのタイプ行も ---REFLECT-IMPORT--- ブロックも見つかりません'; return res;
  }

  // 汎用ブロックの登録（従来ロジックのまま）
  for(const r of entries){
    if(opts.importSource) r.importSource=opts.importSource;   /* 受信箱の source（tkMigrate が下書きにするかを見る） */
    await dbput('logs', r);
    const i = S.logs.findIndex(x=>x.id===r.id);
    if(i>=0) S.logs[i]=r; else S.logs.unshift(r);
    res.logIds.push(r.id);
  }
  if(entries.length){
    S.logs.sort((a,b)=>b.date.localeCompare(a.date));
    // 未紐づきチェック
    const unlinked=entries.filter(e=>!(e.themes&&e.themes.length));
    if(unlinked.length) S._unlinkedNotice=unlinked.length;
    /* 新規動線：取り込んだ問い・次の実験を探求ボードの候補へ即時反映（冪等・旧checks方式にだけ残らない） */
    try{
      const mg=await tkMigrate();
      /* 今回のログから生まれたものだけを拾う（起動時の取りこぼし分は混ぜない） */
      const mine=x=>x&&(x.sourceLogIds||[]).some(id=>res.logIds.includes(id));
      (mg&&mg.questionIds||[]).forEach(id=>{ if(mine(S.questions.find(q=>q.id===id))) res.questionIds.push(id); });
      (mg&&mg.experimentIds||[]).forEach(id=>{ if(mine(S.experiments.find(x=>x.id===id))) res.experimentIds.push(id); });
    }catch(e){}
  }

  // Lectica実績の登録（Lecticaタブの lxParseImport / lxImportSave を共有。複製しない）
  let lecticaOk=false; const lx={};
  if(hasLectica){
    S.lxImport={text:text};
    lecticaOk = lxImportSave(undefined,{silent:!!opts.silent,out:lx})===true;   // 実験ID検証・重複確認・ステータス更新は既存挙動のまま（画面では失敗はalert）
    if(!lecticaOk) S.lxImport=null;      // 失敗時にLecticaタブへ取り込みパネルが残らないよう後始末
    if(lecticaOk&&lx.logId) res.lecticaLogIds.push(lx.logId);
  }

  if(entries.length) res.parts.push('振り返り'+entries.length+'件');
  if(lecticaOk) res.parts.push('Lectica実績1件');
  /* 受信箱向けの要約：振り返り1件・問い1件・実験1件／Lectica L042 1件 */
  const sum=[];
  if(entries.length) sum.push('振り返り'+entries.length+'件');
  const nDraft=(ids,arr)=>ids.filter(id=>(arr.find(o=>o.id===id)||{}).status==='draft').length;
  const dQ=nDraft(res.questionIds,S.questions), dE=nDraft(res.experimentIds,S.experiments);
  if(res.questionIds.length-dQ) sum.push('問い'+(res.questionIds.length-dQ)+'件');
  if(res.experimentIds.length-dE) sum.push('実験'+(res.experimentIds.length-dE)+'件');
  if(dQ) sum.push('問いの下書き'+dQ+'件');
  if(dE) sum.push('実験の下書き'+dE+'件');
  let lxSum='';
  if(lecticaOk) lxSum='Lectica '+(lx.experimentId||'')+' 1件';
  else if(lx.dup) lxSum='Lectica '+(lx.experimentId||'')+' 重複のため追加なし';
  else if(hasLectica&&opts.silent&&lx.error&&(sum.length)) lxSum='Lectica 取り込めず（'+lx.error+'）';
  res.summary=[sum.join('・'),lxSum].filter(Boolean).join('／');
  if(!res.parts.length){
    if(lx.dup&&!entries.length){ res.ok=true; res.kind='ok'; return res; }   /* 受信箱：同じ実践ログは足さないが、取り込み済みとして閉じる */
    res.kind = 'fail';
    res.message = lx.error||'登録できませんでした（内容を確認してください）';
    return res;
  }
  res.ok=true; res.kind='ok';
  return res;
}

async function registerAiInput(){
  const text = document.getElementById('ai-input').value.trim();
  let statusEl = document.getElementById('ai-parse-status');
  if(!text){ statusEl.textContent='入力が空です'; statusEl.className='ai-status err'; return; }
  const r = await reflectImportText(text);
  if(r.kind==='parse'||r.kind==='none'){ statusEl.textContent=r.message; statusEl.className='ai-status err'; return; }
  /* 本文に「紐づけ：」行があれば、受信箱と同じように links を付ける（行は本文に残る） */
  if(r.parts.length){ try{ const lk=inboxParseLinks(text); if(Object.keys(lk).length) await inboxAttachLinks(r, lk); }catch(e){ console.warn('紐づけの保存に失敗',e); } }
  /* REFLECT-UPDATE：上限で入れ替えが必要（他のブロックは適用済み）／同じ内容で変更なし */
  if(r.kind==='limit'||r.kind==='fail'&&r.summary){ ra(); statusEl=document.getElementById('ai-parse-status'); if(statusEl){ statusEl.textContent=r.message; statusEl.className='ai-status err'; } return; }
  if(r.kind==='nochange'){ statusEl=document.getElementById('ai-parse-status'); if(statusEl){ statusEl.textContent='変更はありませんでした（'+r.summary+'）'; statusEl.className='ai-status ok'; } return; }

  // 結果表示（lxImportSave成功時はra()でDOMが再構築されるため要素を取り直す）
  statusEl = document.getElementById('ai-parse-status');
  const input = document.getElementById('ai-input');
  if(!r.parts.length){
    if(statusEl){ statusEl.textContent = '登録できませんでした（内容を確認してください）'; statusEl.className = 'ai-status err'; }
    return;
  }
  if(statusEl){ statusEl.textContent = r.parts.join('＋')+'を登録しました ✓'+(r.parts.some(p=>/^探求ボードの更新/.test(p))?'（'+r.summary+'）':''); statusEl.className='ai-status ok'; }
  if(input) input.value='';
  setTimeout(()=>{S.tab='home';ra();updateNav();},800);
}

  if(qRows.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-top:0;margin-bottom:8px;color:var(--mu)'},'問い'));
    const qDone=qRows.filter(x=>x.st==='done');
    const qSkip=qRows.filter(x=>x.st==='skip');
    if(qDone.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'完了（'+qDone.length+'件）'));
      const dl=D({cls:'checklist',css:'margin-bottom:16px'});
      qDone.forEach(({line,ckId,r})=>dl.appendChild(buildQRow(line,ckId,r)));f.appendChild(dl);
    }
    if(qSkip.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'捨てた（'+qSkip.length+'件）'));
      const sl=D({cls:'checklist',css:'margin-bottom:24px'});
      qSkip.forEach(({line,ckId,r})=>sl.appendChild(buildQRow(line,ckId,r)));f.appendChild(sl);
    }
  }

  // ── 実験 ──
  const ePub=S.logs.filter(r=>r.status!=='draft'&&r.nextExp?.trim());
  const eRows=[];
  ePub.forEach(r=>{r.nextExp.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{const ckId='e_'+r.id+'_'+i;const st=S.checks[ckId]||'todo';if(st==='done'||st==='skip')eRows.push({line,ckId,r,st});});});
  if(eRows.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-bottom:8px;color:var(--mu)'},'実験'));
    const eDone=eRows.filter(x=>x.st==='done');
    const eSkip=eRows.filter(x=>x.st==='skip');
    if(eDone.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'完了（'+eDone.length+'件）'));
      const dl=D({cls:'checklist',css:'margin-bottom:16px'});
      eDone.forEach(({line,ckId,r})=>dl.appendChild(buildExpRow(line,ckId,r)));f.appendChild(dl);
    }
    if(eSkip.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'やらない（'+eSkip.length+'件）'));
      const sl=D({cls:'checklist'});
      eSkip.forEach(({line,ckId,r})=>sl.appendChild(buildExpRow(line,ckId,r)));f.appendChild(sl);
    }
  }

  if(!qRows.length&&!eRows.length){f.appendChild(D({cls:'empty'},'完了・捨てた問いと実験がここに蓄積されます'));}
  return frag;
}

const LECTICA_SEED=[{"id": "L001", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "発信前に「3分・3点」に絞ってみる", "description": "会議、朝礼、方針共有の前に、伝えたい内容を3分で話せる量に絞る。\n相手に理解してほしいことは3点までにする。\n細かい説明を増やすのではなく、相手が動くために必要なことだけを残す。", "completionCondition": "実際の発信で、3分・3点で話した。", "priority30Days": true, "status": "not_started"}, {"id": "L002", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "結論・理由・行動の順番で話してみる", "description": "発信するときに、最初に結論を伝える。\n次に、その理由を伝える。\n最後に、相手に期待する行動を伝える。\n複雑な背景を先に話しすぎず、聞き手が理解しやすい順番にする。", "completionCondition": "1回の会議または発信で、結論・理由・行動の順で話した。", "priority30Days": false, "status": "not_started"}, {"id": "L003", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "伝える前に根拠を1つ添えてみる", "description": "直感や考えだけで話さず、根拠・データ・事例・過去の経験のいずれかを1つ添えて話す。\n「なぜそう考えるのか」が相手に伝わる形にする。", "completionCondition": "発信の中に、根拠を1つ入れた。", "priority30Days": false, "status": "not_started"}, {"id": "L004", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "部門ごとに同じメッセージを言い換えてみる", "description": "同じ方針を、認証サポート、セキュリティ、人事、管理部門など、相手の部門に合わせて言い換える。\n相手の成功基準や関心に合わせて、伝え方を変える。", "completionCondition": "同じ内容を、2つ以上の部門向けに言い換えた。", "priority30Days": false, "status": "not_started"}, {"id": "L005", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "相手の立場に合わせてフレーミングしてみる", "description": "話す前に、相手が何を大事にしているかを確認する。\nその人の関心、責任範囲、現場感に合わせて、話の入り口を変える。", "completionCondition": "1人または1部門に対して、相手の立場に合わせて話した。", "priority30Days": false, "status": "not_started"}, {"id": "L006", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "反発・疑問を先に入れて話してみる", "description": "方針を伝える前に、聞き手が感じそうな疑問や反発を先に整理する。\n発信の中で、「こういう疑問が出るかもしれない」「こういう不安があると思う」と先に触れる。", "completionCondition": "発信の中に、想定される疑問・反発を1つ以上入れた。", "priority30Days": true, "status": "not_started"}, {"id": "L007", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "自分のストーリーの盲点を書いてみる", "description": "自分が語ろうとしている方針やビジョンに、抜けている視点や矛盾がないかを先に書き出す。\n完璧なストーリーにしようとせず、盲点も含めて伝える準備をする。", "completionCondition": "発信前に、盲点を1つ以上書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L008", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "例え話を使って説明してみる", "description": "ロジックだけで説明せず、相手がイメージしやすい例え話を使う。\n野球、家づくり、旅、山登りなど、誰でも理解しやすい比喩に置き換える。", "completionCondition": "1回の発信で、例え話を1つ使った。", "priority30Days": false, "status": "not_started"}, {"id": "L009", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "長い考えを1枚メモに圧縮してみる", "description": "複雑な考えを、そのまま話す前に1枚メモにする。\n大事な結論、背景、理由、相手に求める行動だけに絞る。", "completionCondition": "1つのテーマを1枚メモに整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L010", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "発信後に伝わり方のフィードバックをもらってみる", "description": "信頼できる幹部や部下に、発信の内容がどう伝わったかを確認する。\n評価ではなく、伝わったこと・伝わらなかったことを確認する。", "completionCondition": "1人から発信の伝わり方についてフィードバックをもらった。", "priority30Days": false, "status": "not_started"}, {"id": "L011", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "相手の言葉で理解を確認してみる", "description": "説明した後に、自分の言葉ではなく相手の言葉で理解を確認する。\n相手がどう受け取ったかを把握し、必要に応じて補足する。", "completionCondition": "説明後に、相手の理解内容を確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L012", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "方針共有を「削る練習」として扱ってみる", "description": "方針共有の文章やスピーチを作った後、不要な説明を削る。\n伝えたいことを増やすのではなく、伝わる量まで減らす。", "completionCondition": "発信前に、文章や話す内容を一度削った。", "priority30Days": false, "status": "not_started"}, {"id": "L013", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "会議で先に全員の視点を出してから統合してみる", "description": "幹部会議や重要会議で、最初から結論に向かわない。\nまず関係者の見方を出してもらう。\nその後で、共通点・違い・統合できる方向を整理する。", "completionCondition": "会議で、視点を出す時間と統合する時間を分けた。", "priority30Days": true, "status": "not_started"}, {"id": "L014", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "意見の違いを情報源として扱ってみる", "description": "反対意見 function lxWriteMaster(a){try{localStorage.setItem(LX_MASTER_KEY,JSON.stringify(a));}catch(e){console.warn('lectica master save失敗',e);}}
function lxReadLogs(){try{const r=localStorage.getItem(LX_LOGS_KEY);return r?JSON.parse(r):[];}catch(e){return [];}}
/* ── Lectica実施回数：保存値ではなく lectica_experiment_logs_v1 から毎回数える（全OS共通ロジック・各OSに同じ形で複製）──
   count＝主実験として実施した件数／related＝関連実験として付いた件数／last＝そのどちらかの最新日（YYYY-MM-DD）。
   ID比較は大文字小文字を無視。ログが読めない・配列でないときは0件（行を出さない） */
function lxPracticeStats(expId, logs){
  const id = String(expId == null ? '' : expId).trim().toUpperCase();
  const out = { count: 0, related: 0, total: 0, last: '' };
  if (!id) return out;
  if (logs === undefined) logs = (function(){ try { return JSON.parse(localStorage.getItem('lectica_experiment_logs_v1') || 'null'); } catch (e) { return null; } })();
  if (!Array.isArray(logs)) return out;
  logs.forEach(function(l){
    if (!l || typeof l !== 'object') return;
    const main = String(l.experimentId || '').toUpperCase() === id;
    const rel = String(l.relatedExperimentId || '').toUpperCase() === id;
    if (!main && !rel) return;
    if (main) out.count++; else out.related++;
    const d = String(l.date || '');
    if (/^\d{4}-\d{2}-\d{2}$/.test(d) && d > out.last) out.last = d;
  });
  out.total = out.count + out.related;
  return out;
}
/* "これまで N回（最終 m/d）"。0回は空文字（行ごと出さない） */
function lxPracticeLine(st, prefix){
  if (!st || !st.total) return '';
  const md = st.last ? (Number(st.last.slice(5, 7)) + '/' + Number(st.last.slice(8, 10))) : '';
  return (prefix == null ? 'これまで ' : prefix) + st.total + '回' + (md ? '（最終 ' + md + '）' : '');
}

// 実験中の自動整理：直近14日にログが無い「実験中」を「未着手」に戻す（1日1回）
// 「実験中＝最近実際に回している実験」に意味を保つ。完了・保留は触らない。
function lxAutoRevertStale(){
  const GUARD='lectica_auto_revert_last';
  const today=tod();
  try{ if(localStorage.getItem(GUARD)===today) return 0; }catch(e){}
  const DAYS=14, cutoff=Date.now()-DAYS*86400000;
  const master=lxReadMaster(); if(!Array.isArray(master)||!master.length) return 0;
  const logs=lxReadLogs();
  const lastLog={};
  logs.forEach(l=>{
    if(!l||!l.experimentId||!l.date) return;
    const t=new Date(l.date+'T23:59:59').getTime();
    if(!lastLog[l.experimentId]||t>lastLog[l.experimentId]) lastLog[l.experimentId]=t;
  });
  let n=0;
  master.forEach(e=>{
    if(!e||e.status!=='active') return;
    const touched=Math.max(lastLog[e.id]||0, e.updatedAt?new Date(e.updatedAt).getTime():0);
    if(touched && touched>=cutoff) return;
    e.status='not_started'; e.updatedAt=new Date().toISOString(); n++;
  });
  if(n>0) lxWriteMaster(master);
  try{ localStorage.setItem(GUARD,today); }catch(e){}
  if(n>0&&typeof toast==='function') toast('✦ 14日間ログの無い実験中 '+n+'件を未着手に戻しました');
  return n;
}
function lxWriteLogs(a){try{localStorage.setItem(LX_LOGS_KEY,JSON.stringify(a));}catch(e){console.warn('lectica logs save失敗',e);}}
function lxInit(){
  try{
    const md=_lxB64ToUtf8(LECTICA_MD_B64);
    if(md){try{localStorage.setItem(LX_MD_KEY,md);}catch(e){}}
    let m=lxReadMaster();
    if(!Array.isArray(m)||!m.length){ lxWriteMaster(LECTICA_SEED.map(function(x){return Object.assign({},x);})); return; }
    const have={}; m.forEach(function(x){if(x&&x.id)have[x.id]=x;});
    let changed=false;
    LECTICA_SEED.forEach(function(s){
      const e=have[s.id];
      if(!e){ m.push(Object.assign({},s)); changed=true; return; }
      if(e.title!==s.title||e.description!==s.description||e.completionCondition!==s.completionCondition||e.priority30Days!==s.priority30Days||e.category!==s.category||e.categoryLabel!==s.categoryLabel){
        e.title=s.title;e.description=s.description;e.completionCondition=s.completionCondition;e.priority30Days=s.priority30Days;e.category=s.category;e.categoryLabel=s.categoryLabel;changed=true;
      }
    });
    if(changed) lxWriteMaster(m);
  }catch(e){ console.warn('lxInit失敗',e); }
}

// 振り返りまとめ末尾の ---REFLECT-IMPORT--- ブロックを解析して1ログ分のオブジェクトを返す
function lxParseImport(text){
  if(!text) return null;
  let body=text;
  const m=text.match(/---REFLECT-IMPORT---([\s\S]*?)(?:---END---|$)/);
  if(m) body=m[1];
  const map={};
  body.split(/\r?\n/).forEach(function(line){
    const mm=line.match(/^\s*([^：:]+)[：:]\s*(.*)$/);
    if(mm){ map[mm[1].trim()]=mm[2].trim(); }
  });
  const get=function(keys){ for(let i=0;i<keys.length;i++){ const k=keys[i]; if(map[k]!==undefined&&map[k]!=='') return map[k]; } return ''; };
  const idRaw=get(['実験ID','実験Id','ID','id']);
  const idM=idRaw.match(/[LR]\d{1,3}/i);
  const relRaw=get(['関連実験','関連実験ID','関連ID','related']);
  const relM=relRaw?relRaw.match(/[LR]\d{1,3}/i):null;
  const resMap={continue:'continue',complete:'complete',change:'change',pause:'pause','継続':'continue','完了':'complete','変更':'change','保留':'pause'};
  const resRaw=get(['結果','result']);
  const result=resMap[resRaw]||resMap[(resRaw||'').toLowerCase()]||'continue';
  const dateRaw=get(['実行日','日付','date']);
  const dateM=dateRaw.match(/\d{4}-\d{2}-\d{2}/);
  return {
    experimentId: idM?idM[0].toUpperCase():'',
    relatedExperimentId: (relM&&idM&&relM[0].toUpperCase()!==idM[0].toUpperCase())?relM[0].toUpperCase():(relM&&!idM?relM[0].toUpperCase():''),
    ...((relM&&relRaw&&/再演/.test(relRaw))?{relatedNote:'再演'}:{}),   /* 追補K：再演の印（集計用・表示不使用） */
    date: dateM?dateM[0]:tod(),
    usedScene: get(['使った場面','使用場面','場面']),
    people: get(['関係者','関わった人','people']),
    actualAction: get(['実際にやったこと','実際に行ったこと','やったこと','actualAction']),
    insight: get(['気づき','学び','今回の学び','insight']),
    nextChange: get(['次回変えること','次に変えること','nextChange']),
    result: result
  };
}

/* R系ID（rid）に一致する探求ボード実験と親の問いの updatedAt を進める。回数は lxPracticeStats がログから数えるので保存しない。
   保存値 practiceCount／lastPracticedAt は 2026-11-03 の整理で実験の記録へ移して外した */
function lxTouchRidExps(ids){
  try{
    const rids=(ids||[]).filter(function(id){return id&&/^R/i.test(id);});
    if(!rids.length)return;
    (async function(){
      let touched=false;
      for(const rid of rids){
        const x=S.experiments.find(function(b){return b&&(b.rid||'').toUpperCase()===String(rid).toUpperCase();});
        if(!x)continue;
        await tkSave('experiments',x);touched=true;
        if(x.questionId){const qq=S.questions.find(function(b){return b&&b.id===x.questionId;});if(qq)await tkSave('questions',qq);}
      }
      if(touched){ra();updateNav();}
    })();
  }catch(_e){}
}
function lxImportSave(master,opts){
  // 戻り値：取り込み成功=true／失敗・キャンセル=false（取り込むタブの自動判別が結果表示に使う）
  // opts.silent（受信箱）：alert／confirm を出さず、理由を opts.out.error、重複を opts.out.dup、作ったログIDを opts.out.logId に入れる
  opts=opts||{}; const out=opts.out||{};
  const alert=function(m){ if(opts.silent){ out.error=m; } else window.alert(m); };
  try{
    const parsed=lxParseImport(S.lxImport&&S.lxImport.text);
    if(!parsed){ alert('取り込みブロックが見つかりません。---REFLECT-IMPORT--- 〜 ---END--- を含めて貼り付けてください。'); return false; }
    if(!parsed.experimentId){ alert('実験ID（L0xx / R0xx）が読み取れませんでした。ブロックに「実験ID：L029」や「実験ID：R001」の行を入れてください。'); return false; }
    // R系（Reflect実験・Cowork統合棚卸しの採番）はLecticaマスターに存在しないため、照合をスキップしてログのみ記録する
    const isReflectExp=/^R/i.test(parsed.experimentId);
    const mas=master||lxReadMaster()||[];
    const exp=isReflectExp?null:mas.find(function(e){return e&&e.id===parsed.experimentId;});
    if(!isReflectExp&&!exp){ alert('実験ID '+parsed.experimentId+' がマスターに見つかりません。IDを確認してください。'); return false; }
    if(!(parsed.usedScene||parsed.insight||parsed.nextChange||parsed.actualAction)){ alert('使った場面・気づき・次回変えること・実際にやったこと のいずれかが必要です。'); return false; }
    const logs=lxReadLogs();
    const dup=logs.some(function(l){return l&&l.experimentId===parsed.experimentId&&l.date===parsed.date&&(l.insight||'')===(parsed.insight||'');});
    if(dup&&opts.silent){ out.dup=true; out.experimentId=parsed.experimentId; return false; }   /* 受信箱：重複は足さない（確認ダイアログは出さない） */
    if(dup&&!confirm('同じ実験・同じ日・同じ気づきのログが既にあります。それでも取り込みますか？')) return false;
    const now=new Date().toISOString();
    const newLogId='log_'+(parsed.date||tod()).replace(/-/g,'')+'_'+Math.random().toString(36).slice(2,8);
    out.logId=newLogId; out.experimentId=parsed.experimentId;
    logs.unshift({
      id:newLogId,
      experimentId:parsed.experimentId,relatedExperimentId:parsed.relatedExperimentId||'',date:parsed.date,source:'import',
      ...(parsed.relatedNote?{relatedNote:parsed.relatedNote}:{}),   /* 追補K：再演の印を保存ログへ引き継ぐ */
      usedScene:parsed.usedScene||'',
      people:(parsed.people||'').split(/[,、，]/).map(function(s){return s.trim();}).filter(Boolean),
      actualAction:parsed.actualAction||'',insight:parsed.insight||'',nextChange:parsed.nextChange||'',
      result:parsed.result||'continue',createdAt:now,updatedAt:now
    });
    lxWriteLogs(logs);
    const stMap={continue:'active',complete:'completed',change:'active',pause:'paused'};
    if(!isReflectExp&&stMap[parsed.result])lxSetField(parsed.experimentId,'status',stMap[parsed.result]);
    // R系連動：実践回数・最終実践日はログから数えるので、ここでは探求ボード実験と親の問いの更新日だけ進める
    lxTouchRidExps([parsed.experimentId,parsed.relatedExperimentId]);
    S.lxImport=null; if(!opts.silent)toast('取り込みました：'+parsed.experimentId+'（'+parsed.date+'）'); ra(); updateNav();
    return true;
  }catch(e){ alert('取り込みエラー: '+e.message); return false; }
}

function renderLectica(){
  const f=document.createDocumentFragment();
  try{
    if(S.lxFilter===undefined)S.lxFilter='all';

    btnGrp.appendChild(impBtn);
    const recBtn=Bt({cls:'btn-g',css:'font-size:13px'},'＋ 実績を記録');
    recBtn.addEventListener('click',function(){const base=master.find(function(e){return e.status==='active';})||master[0];S.lxForm={experimentId:base.id,date:tod(),usedScene:'',people:'',actualAction:'',insight:'',nextChange:'',result:'continue',anchor:'top'};ra();});
    btnGrp.appendChild(recBtn);
    sum.appendChild(btnGrp);
    bar.appendChild(sum);

    const fc=D({css:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px'});
    filters.forEach(function(p){const c=Bt({cls:'chip'+(S.lxFilter===p[0]?' on':'')},p[1]);c.addEventListener('click',function(){S.lxFilter=p[0];ra();});fc.appendChild(c);});
    bar.appendChild(fc);
    const cats=['all','Clarity','Perspective coordination','Collaborative capacity','Decision-making process','Contextual thinking','育成','学習感情'];
    const cc=D({css:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px'});
    cats.forEach(function(k){const c=Bt({cls:'chip'+(S.lxCat===k?' on':'')},k==='all'?'全カテゴリ':k);c.addEventListener('click',function(){S.lxCat=k;ra();});cc.appendChild(c);});
    bar.appendChild(cc);
    const sb=In({type:'text',placeholder:'タイトル・説明で検索...'});
    sb.value=S.lxQ;sb.style.cssText='width:100%;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);margin-bottom:0';
    sb.addEventListener('input',function(){S.lxQ=sb.value;});

    if(S.lxSort==='count'){   /* 実施回数順（多い順・同数は最終実施日が新しい順・それも同じならマスター順） */
      const st={};list.forEach(function(e){st[e.id]=lxPracticeStats(e.id,logs);});
      list=list.map(function(e,i){return {e:e,i:i};}).sort(function(a,b){
        const x=st[a.e.id],y=st[b.e.id];
        return (y.total-x.total)||(y.last<x.last?-1:y.last>x.last?1:0)||(a.i-b.i);
      }).map(function(o){return o.e;});
    }
