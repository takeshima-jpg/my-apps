<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reflect OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;
  --sf:#fff;
  --bd:#e8e4dc;
  --tx:#1a1814;
  --mu:#7a7670;
  --di:#b0aca4;
  --go:#2a5a3a;
  --go-lt:#f0f5f1;
  --go-bd:#a8c8b4;
  --bl:#3a4a6a;
  --bl-lt:#f0f3f8;
  --mono:'JetBrains Mono','Courier New',monospace;
  --serif: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --max:900px;
}
body{font-family:var(--serif);background:var(--bg);color:var(--tx);min-height:100vh;font-size:17px;line-height:1.8}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
input,textarea,select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:3px;font-family:var(--serif);font-size:16px;outline:none;transition:border-color .15s;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--go)}
textarea{resize:vertical;line-height:1.8}
button{cursor:pointer;font-family:var(--serif);border:none;border-radius:3px;transition:all .15s}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:200px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;transition:transform .25s;}
/* モバイル */
@media(max-width:640px){
  .sidebar{position:fixed;top:0;left:0;height:100vh;z-index:500;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 20px rgba(0,0,0,.15);}
  .mob-topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;}
  .mob-topbar img{width:24px;height:24px;border-radius:6px;}
  .mob-topbar span{font-size:15px;font-weight:700;color:var(--go);}
  .hamburger{background:none;border:none;cursor:pointer;font-size:22px;color:var(--mu);padding:2px 6px;margin-left:auto;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:499;}
  .overlay.open{display:block;}

  /* メインコンテンツ余白 */
  #main{padding:0;}
  .main-pad{padding:14px 12px;}

  /* テーマグリッド → 1列 */
  .theme-grid{grid-template-columns:1fr!important;}

  /* テーマカード */
  .tcard-main{padding:12px 14px;}
  .tcard-name{font-size:15px;}
  .tcard-meta{flex-wrap:wrap;gap:4px;}

  /* ログ一覧 */
  .log-row{flex-wrap:wrap;gap:4px;}
  .log-date{flex-shrink:0;}
  .log-title{width:100%;white-space:normal!important;}

  /* 問い・実験の追加エリア */
  .add-row{flex-wrap:wrap;gap:6px;}
  .add-row input,.add-row select{width:100%!important;min-width:0!important;box-sizing:border-box;}
  .add-row button{white-space:nowrap;}

  /* 問い・実験カード */
  .q-row,.exp-row{flex-wrap:wrap;gap:4px;}
  .q-row .btn-row,.exp-row .btn-row{flex-wrap:wrap;gap:4px;}

  /* VISION設定 */
  .vision-edit-area{padding:12px;}

  /* チップ（テーマ選択）*/
  .chip-wrap{flex-wrap:wrap;gap:4px;}

  /* 検索 */
  .search-bar{width:100%;box-sizing:border-box;}

  /* タイプフィルター */
  .type-chips{flex-wrap:wrap;gap:4px;}

  /* AIインポート */
  .ai-import-area{padding:12px;}
  .ai-import-area textarea{font-size:14px;}

  /* 問い・実験リスト */
  .cl-row{align-items:flex-start;}
  .cl-label{min-width:0;width:100%;flex-basis:100%;}
  .cl-from{white-space:normal!important;font-size:10px;width:100%;flex-basis:100%;}
  .cl-row > div:last-child{margin-left:0!important;flex-wrap:wrap;}
}
@media(min-width:641px){
  .mob-topbar{display:none;}
  .overlay{display:none;}
}
.sb-hd{padding:14px 16px;border-bottom:1px solid var(--bd);}
.sb-logo{display:flex;align-items:center;gap:8px;}
.sb-logo img{width:28px;height:28px;border-radius:7px;flex-shrink:0;}
.sb-logo span{font-size:15px;font-weight:700;color:var(--tx);}
.sb-nav{padding:6px 0;flex:0 0 auto;}
nav{display:flex;flex-direction:column;gap:0;}
.nb{padding:10px 16px;font-size:15px;letter-spacing:.02em;background:transparent;color:var(--mu);border:none;border-left:3px solid transparent;border-radius:0;cursor:pointer;font-family:var(--serif);display:flex;align-items:center;gap:8px;text-align:left;width:100%;transition:background .1s;}
.nb:hover{background:var(--bg);}
.nb .nav-icon{font-size:14px;width:16px;text-align:center;}
.nb.on{color:var(--go);background:var(--go-lt);border-left-color:var(--go);font-weight:600;}
.sb-rec{padding:10px 16px;border-top:1px solid var(--bd);flex:0 0 auto;}
.sb-rec-lbl{font-size:9px;color:var(--di);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;}
.sb-rec-btn{display:block;width:100%;padding:7px 10px;margin-bottom:4px;font-size:13px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--mu);cursor:pointer;font-family:var(--serif);transition:all .1s;}
.sb-rec-btn:hover{border-color:var(--go);color:var(--go);background:var(--go-lt);}
.sb-ft{padding:10px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;flex:0 0 auto;}
.sb-badge{font-size:10px;background:var(--go);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;font-family:var(--mono);}
.sb-badge:empty{display:none;}
.unlinked-notice{background:#fff8e8;border:1px solid #f0d060;border-radius:4px;padding:10px 14px;font-size:13px;color:#7a6000;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.unlinked-notice a{color:var(--go);cursor:pointer;text-decoration:underline;}
.sb-ft button,.sb-ft label{display:block;width:100%;padding:6px 8px;font-size:12px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--di);cursor:pointer;font-family:var(--serif);}
.sb-ft button:hover,.sb-ft label:hover{border-color:var(--mu);color:var(--mu);}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#v26{padding:8px 20px;border-bottom:1px solid var(--bd);background:var(--bg);flex-shrink:0;}
.v26c{display:flex;align-items:baseline;gap:14px;}
.v26t{font-family:var(--mono);font-size:9px;color:var(--di);letter-spacing:.14em;min-width:38px;}
.v26b{font-size:13px;color:var(--mu);line-height:1.7;}
.v26k{font-family:var(--mono);font-size:9px;color:var(--di);margin-right:8px;}
#body{flex:1;padding:28px 36px 80px;}

/* ── AI Import ── */
.ai-import-wrap{max-width:var(--max);padding:32px 28px 80px;}
.checklist{display:flex;flex-direction:column;gap:0;margin-bottom:8px;}
.cl-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;}
.cl-row:last-child{border-bottom:none;}
.cl-cb{flex-shrink:0;width:16px;height:16px;accent-color:var(--go);cursor:pointer;margin-top:2px;}
.cl-label{flex:1;font-size:14px;color:var(--tx);line-height:1.6;min-width:0;}
.cl-row input[type=checkbox]:checked~.cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-from{color:var(--di);}
.cl-doing{background:#f0f8f0;}
.cl-doing .cl-label{color:var(--go);font-weight:500;}
.cl-skip .cl-label{text-decoration:line-through;color:var(--di);opacity:.6;}
.exp-state-btn{font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);cursor:pointer;color:var(--mu);margin-left:4px;flex-shrink:0;}
.exp-state-btn:hover{border-color:var(--mu);}
.exp-state-btn.doing{color:var(--go);border-color:var(--go-bd);background:var(--go-lt);}
.exp-state-btn.skip{color:var(--di);}
.cl-from{font-size:11px;color:var(--di);white-space:nowrap;flex-shrink:0;}
.ai-prompt-box{border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;background:var(--sf);}
.ai-prompt-box summary{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--mu);}
.ai-prompt-inner{padding:0 14px 14px;}
.ai-prompt-note{font-size:12px;color:var(--mu);margin-bottom:8px;}
.ai-prompt-pre{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:12px;white-space:pre-wrap;word-break:break-all;margin-bottom:8px;line-height:1.7;color:var(--tx);}
.ai-import-title{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.ai-import-sub{font-size:13px;color:var(--mu);margin-bottom:24px;}
.ai-format-box{font-size:13px;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:14px 16px;line-height:2;margin-bottom:16px;}
.ai-format-box strong{color:var(--tx);}
.ai-format-box code{font-family:var(--mono);font-size:12px;background:#f0ede8;padding:0 3px;border-radius:2px;}
.ai-textarea{width:100%;min-height:220px;padding:14px 16px;font-size:15px;line-height:1.8;border:1px solid var(--bd);border-radius:5px;font-family:var(--serif);background:var(--sf);color:var(--tx);resize:vertical;outline:none;display:block;}
.ai-textarea:focus{border-color:var(--go);}
.ai-btn-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.ai-status{font-size:13px;color:var(--mu);}
.ai-status.ok{color:var(--go);}
.ai-status.err{color:#b05050;}

/* ── Buttons ── */
.btn-p{background:var(--go);color:#fff;padding:9px 20px;font-size:15px}
.btn-p:hover{background:#1e4a2a}
.btn-s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:8px 16px;font-size:14px}
.btn-s:hover{border-color:var(--mu)}
.btn-g{background:transparent;color:var(--di);border:1px solid var(--bd);padding:4px 10px;font-size:13px}
.btn-g:hover{border-color:var(--mu);color:var(--mu)}
.btn-d{background:transparent;color:#b05050;border:1px solid #e0c0c0;padding:3px 8px;font-size:10px}

/* ── Section ── */
.sec{margin-bottom:40px}
.sec-lbl{font-size:10px;color:var(--di);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
.dvd{border-top:1px solid var(--bd);margin:28px 0}

/* ── VISION ── */
.vision-block{margin-bottom:32px}
.vision-text{font-size:17px;color:var(--go);line-height:2;white-space:pre-wrap;padding:16px 0}
.vision-expand{cursor:pointer;font-size:13px;color:var(--di);display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
.vision-expand:hover{color:var(--mu)}
.vision-detail{display:none;padding:16px 0 8px;border-top:1px solid var(--bd);margin-top:8px}
.vision-detail.open{display:block}
.vision-principle{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
.vision-principle:last-child{border-bottom:none}
.vp-kw{color:var(--go);min-width:36px;font-size:14px}
.vp-num{color:var(--di);font-family:var(--mono);font-size:10px;min-width:14px;padding-top:2px}
.vp-text{color:var(--mu);line-height:1.7}

/* ── Theme cards ── */
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
@media(max-width:640px){.theme-grid{grid-template-columns:1fr}}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:5px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.tcard:hover{border-color:var(--go-bd)}
.tcard-main{padding:16px 18px}
.tcard-name{font-size:17px;color:var(--tx);margin-bottom:6px;line-height:1.4;font-weight:500}
.tcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tcard-status{font-size:10px;padding:1px 8px;border-radius:10px;border:1px solid}
.st-active{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.st-plan{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.st-hold{color:var(--di);border-color:var(--bd);background:var(--bg)}
.st-done{color:var(--bl);border-color:#b0c0e0;background:var(--bl-lt)}
.st-exit{color:#b05050;border-color:#e0b0b0;background:#fdf0f0}
.tcard-summary{font-size:14px;color:var(--mu);line-height:1.6}
.tcard-detail{display:none;border-top:1px solid var(--bd);padding:14px 16px;font-size:14px;color:var(--mu);line-height:1.7}
.tcard-detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcard-detail.open{display:block}
.tcard-active{border-color:var(--go)!important;box-shadow:0 0 0 2px var(--go)33;}
.tcard-dl{font-size:9px;color:var(--di);letter-spacing:.1em;text-transform:uppercase;margin:10px 0 4px}
.tcard-dl:first-child{margin-top:0}
.ms-pill{display:inline-flex;padding:2px 8px;font-size:10px;border-radius:10px;border:1px solid;margin:2px;gap:4px}
.ms-done{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.ms-doing{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.ms-todo{color:var(--di);border-color:var(--bd);background:var(--bg)}
.kpi-row{font-size:13px;color:var(--mu);padding:3px 0;display:flex;gap:8px}
.kpi-name{color:var(--di)}
.tcard-acts{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}

/* ── Log items ── */
.log-item{padding:16px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.log-item:first-child{border-top:1px solid var(--bd)}
.log-item:hover .log-title{color:var(--go)}
.log-date{font-size:10px;color:var(--di);font-family:var(--mono);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.log-title{font-size:17px;color:var(--tx);margin-bottom:5px;transition:color .15s}
.log-lesson{font-size:15px;color:var(--mu);line-height:1.7;border-left:2px solid var(--go-bd);padding-left:12px;margin-top:4px}
.log-q{font-size:14px;color:var(--bl);margin-top:4px}
.log-exp{font-size:14px;color:var(--go);margin-top:4px}
.log-acts{display:flex;gap:6px;margin-top:10px}
.tbadge{font-size:9px;padding:1px 7px;border-radius:10px}

/* ── Question items ── */

/* ── Form ── */
.form-wrap{max-width:640px;margin:0 auto}
.form-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:10px;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.lbl-opt{font-size:9px;color:var(--di);margin-left:6px;font-style:italic;text-transform:none;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.hint{background:var(--go-lt);border-left:2px solid var(--go-bd);padding:10px 14px;font-size:14px;color:var(--go);margin-bottom:18px;line-height:1.7}
.expand-tog{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--di);font-size:13px;padding:6px 0;background:transparent;border:none;font-family:var(--serif);width:100%}
.expand-tog:hover{color:var(--mu)}
.expand-arr{font-size:9px;transition:transform .2s;display:inline-block}
.expand-tog.open .expand-arr{transform:rotate(90deg)}
.expand-body{display:none;padding:8px 0 4px}
.expand-body.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{padding:3px 10px;font-size:13px;background:var(--bg);color:var(--di);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-family:var(--serif)}
.chip:hover{border-color:var(--mu)}
.chip.on{background:var(--go-lt);color:var(--go);border-color:var(--go-bd)}
.sldr-row{display:flex;align-items:center;gap:8px}
.sldr-row input[type=range]{accent-color:var(--go);padding:0;border:none;background:transparent;box-shadow:none}
.sldr-v{font-size:14px;color:var(--go);min-width:16px;text-align:right}
.ms-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.ms-row input{flex:1}
.kpi-row-edit{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.kpi-row-edit input{flex:1}
.url-wrap{display:flex;gap:7px}
.url-wrap input{flex:1}

/* ── Lesson/exp strip ── */
.learn-exp{color:var(--go)}

/* ── Record buttons ── */
.rec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:0}
.rec-btn{padding:13px 8px;text-align:center;border:1px solid var(--bd);border-radius:5px;cursor:pointer;font-family:var(--serif);background:var(--sf);transition:all .15s;font-size:15px}
.rec-btn:hover{border-color:var(--go-bd);background:var(--go-lt)}
.rec-btn-lbl{color:var(--go);display:block;margin-bottom:2px}
.rec-btn-desc{font-size:10px;color:var(--di)}

/* ── Dash ── */

/* ── Exp board ── */
.exp-cnt{font-size:10px;color:var(--di);font-family:var(--mono)}

/* ── Search ── */
.srch-wrap{position:relative;margin-bottom:16px}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--di);font-size:15px;pointer-events:none}
.srch-wrap input{padding-left:32px;font-size:16px}

/* ── Theme form extras ── */
.tf-sect{font-size:10px;color:var(--di);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--bd)}

/* ── Misc ── */
.empty{font-size:15px;color:var(--di);padding:16px 0}
.draft-badge{font-size:10px;color:#8080c0}
.more-lnk{font-size:14px;color:var(--di);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:transparent;border:none;font-family:var(--serif);padding:0}
.more-lnk:hover{color:var(--mu)}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .22s ease}

/* ── Philosophy log ── */
.phil-field{font-size:15px;color:var(--mu);line-height:1.75;margin-top:5px}
/* Timeline */
.tl-title{font-size:16px;color:var(--tx);margin-bottom:4px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div class="overlay" id="overlay" onclick="closeSidebar()"></div>
<div class="mob-topbar">
  <img src="icons/icon-32.png"><span>Reflect OS</span>
  <button class="hamburger" onclick="toggleSidebar()">☰</button>
</div>
<div class="app">
<div class="sidebar">
  <div class="sb-hd">
    <div class="sb-logo"><img src="icons/icon-32.png"><span>Reflect OS</span></div>
  </div>
  <div class="sb-nav">
    <nav id="nav">
      <button class="nb on" data-tab="home"><span class="nav-icon">◉</span> ホーム</button>
      <button class="nb" data-tab="log"><span class="nav-icon">≡</span> ログ</button>
      <button class="nb" id="unthemed-btn" style="padding-left:32px;font-size:13px;color:#b09040;" onclick="S.tab='log';S.unthemedOnly=!S.unthemedOnly;updateNav();ra();">
        <span class="nav-icon" style="font-size:11px;">△</span> テーマ未紐づけ <span id="unthemed-badge" class="sb-badge" style="background:#fdf8e8;color:#b09040;border:1px solid #e8d880;"></span>
      </button>

      <button class="nb" data-tab="search"><span class="nav-icon">⌕</span> 検索</button>
      <button class="nb" data-tab="ai-import"><span class="nav-icon">⬇</span> 取り込む</button>
      <button class="nb" data-tab="questions"><span class="nav-icon">？</span> 問い <span id="q-badge" class="sb-badge"></span></button>
      <button class="nb" data-tab="experiments"><span class="nav-icon">▶</span> 実験 <span id="e-badge" class="sb-badge"></span></button>
      <button class="nb" data-tab="lectica"><span class="nav-icon">✦</span> Lectica</button>
      <button class="nb" data-tab="archive"><span class="nav-icon">□</span> アーカイブ</button>
      <button class="nb" data-tab="vision-edit"><span class="nav-icon">◎</span> VISION設定</button>
    </nav>
  </div>

  <div class="sb-ft">

/* ── DB ── */
/* ── 永続化：localStorage（旧IndexedDB ReflectOS7 から自動移行）── */
const LS_KEY='reflectOS_v1';
const _RS=['logs','themes','settings','checks'];
let _migrated=false,_migP=null;
function _lsRead(){
  try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(o&&typeof o==='object'){_RS.forEach(s=>{if(!Array.isArray(o[s]))o[s]=[];});return o;}}catch(e){}
  return {logs:[],themes:[],settings:[],checks:[]};
}
function _lsWrite(o){ try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){console.warn('reflectOS save失敗',e);} }
/* 旧IndexedDB(ReflectOS7)が残っていれば一回だけlocalStorageへ移行。失敗時は書かず次回再試行 */
function _migrateFromIDB(){
  return new Promise(res=>{
    if(localStorage.getItem(LS_KEY)!==null){res();return;}
    if(!('indexedDB' in window)){_lsWrite({logs:[],themes:[],settings:[],checks:[]});res();return;}
    let done=false;const ok=o=>{if(done)return;done=true;_lsWrite(o);res();};
    try{
      const req=indexedDB.open('ReflectOS7',1);
      req.onupgradeneeded=e=>{const db=e.target.result;_RS.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
      req.onerror=()=>{ if(!done){done=true;res();} };  /* 開けない時はLS未設定のまま→次回再試行 */
      req.onsuccess=e=>{
        const db=e.target.result;const out={logs:[],themes:[],settings:[],checks:[]};
        const have=_RS.filter(s=>db.objectStoreNames.contains(s));
        if(!have.length){try{db.close();}catch(_){}ok(out);return;}
        let left=have.length;const tx=db.transaction(have,'readonly');
        have.forEach(s=>{const g=tx.objectStore(s).getAll();
          g.onsuccess=()=>{out[s]=g.result||[];if(--left===0){try{db.close();}catch(_){}ok(out);}};
          g.onerror=()=>{if(--left===0){try{db.close();}catch(_){}ok(out);}};});
      };
    }catch(e){ if(!done){done=true;res();} }
  });
}
async function _ensure(){ if(!_migrated){ if(!_migP)_migP=_migrateFromIDB(); await _migP; _migrated=true; } return _lsRead(); }
async function dbput(s,v){ const o=await _ensure(); const a=o[s]||(o[s]=[]); const i=a.findIndex(x=>x&&x.id===v.id); if(i>=0)a[i]=v; else a.push(v); _lsWrite(o); }
async function dbget(s,k){ const o=await _ensure(); return (o[s]||[]).find(x=>x&&x.id===k); }
async function dball(s){ const o=await _ensure(); return (o[s]||[]).slice(); }
async function dbclear(s){ const o=await _ensure(); o[s]=[]; _lsWrite(o); }
async function dbdel(s,k){ const o=await _ensure(); o[s]=(o[s]||[]).filter(x=>x&&x.id!==k); _lsWrite(o); }

  const themes=[...S.themes].sort((a,b)=>(priOrd[a.priority]||9)-(priOrd[b.priority]||9)||(stOrd[a.status]||9)-(stOrd[b.status]||9));
  // ── カード生成関数（探求テーマ・プロジェクト共用） ──

          const th2=await dball('themes');
          const priOrd={S:0,A:1,B:2,C:3};

      } else {

  // ── 探求テーマ（手動追加のみ） ──
  const myThemes=themes.filter(t=>!t._fromProjectOS);

  tHd.appendChild(addTh);tsec.appendChild(tHd);

  // 完了済みテーマ（折りたたみ）

    doneSec.appendChild(doneToggle);doneSec.appendChild(doneBody);
    doneToggle.addEventListener('click',()=>{

    syncBtn.textContent='同期中...';syncBtn.disabled=true;

    ra();

    if(donePjThemes.length){
      const doneSec=D({css:'margin-top:16px'});
      const doneToggle=D({css:'display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 0'});
      const doneArrow=Sp({css:'font-size:11px;color:var(--mu);transition:transform .2s'},'▶');
      doneToggle.appendChild(doneArrow);
      doneToggle.appendChild(Sp({css:'font-size:13px;color:var(--mu)'},'完了済み（'+donePjThemes.length+'件）'));

      const doneGrid=D({cls:'theme-grid'});

      doneSec.appendChild(doneToggle);doneSec.appendChild(doneBody);
      doneToggle.addEventListener('click',()=>{
        const open=doneBody.style.display==='block';
        doneBody.style.display=open?'none':'block';
        doneArrow.style.transform=open?'':'rotate(90deg)';

  f.appendChild(pjsec);

  // Record buttons moved to sidebar



  // 問い・実験セクション（テーマフィルター対応）
  function buildClSection(logs){
    const sec=D({id:'cl-section'});
    const at=S._activeTheme;
    const theme=at?S.themes.find(t=>t.id===at):null;

    // フィルター対象ログを決定
    let filtered=logs;
    if(theme){
      // 選択テーマに紐づくログ（themesフィールドにテーマIDが含まれる）
      filtered=logs.filter(r=>(r.themes||[]).includes(theme.id));
    }

    // フィルター表示ラベル
    if(theme){
      const lbl=D({css:'display:flex;align-items:center;gap:8px;margin-bottom:16px;margin-top:32px'});
      lbl.appendChild(Sp({css:'font-size:12px;background:var(--go);color:#fff;border-radius:10px;padding:2px 10px'},theme.title));
      lbl.appendChild(Sp({css:'font-size:12px;color:var(--mu)'},'の問い・実験'));
      const clr=Bt({cls:'btn-s',css:'font-size:11px;padding:2px 8px'},'✕ 全て表示');
      clr.addEventListener('click',()=>{S._activeTheme=null;document.querySelectorAll('.tcard-active').forEach(el=>el.classList.remove('tcard-active'));document.querySelectorAll('.tcard-detail.open').forEach(el=>el.classList.remove('open'));const s=document.getElementById('cl-section');const fp=S.logs.filter(r=>r.status!=='draft');if(s)s.replaceWith(buildClSection(fp));});
      lbl.appendChild(clr);
      sec.appendChild(lbl);
    }

    // HOME: 重要マークした問いのみ表示
    const importantQs=[];
    filtered.filter(r=>r.question?.trim()).forEach(r=>{
      r.question.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
        const ckId='q_'+r.id+'_'+i;
        if((S.checks[ckId]||'todo')==='important') importantQs.push({line,ckId,r});
      });
    });
    if(importantQs.length){
      sec.appendChild(D({cls:'sec-lbl',css:'margin-top:0'},'重要な問い'));
      const qList=D({cls:'checklist'});
      importantQs.forEach(({line,ckId,r})=>qList.appendChild(buildQRow(line,ckId,r)));
      sec.appendChild(qList);
    }

    // HOME: 実験中のみ表示
    const doingExps=[];
    filtered.filter(r=>r.nextExp?.trim()).forEach(r=>{
      r.nextExp.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
        const ckId='e_'+r.id+'_'+i;
        if((S.checks[ckId]||'todo')==='doing') doingExps.push({line,ckId,r});
      });
    });
    if(doingExps.length){
      sec.appendChild(D({cls:'sec-lbl',css:'margin-top:32px'},'実験中'));
      const eList=D({cls:'checklist'});
      doingExps.forEach(({line,ckId,r})=>eList.appendChild(buildExpRow(line,ckId,r)));
      sec.appendChild(eList);
    }

    if(theme && !qs.length && !exps.length){
      sec.appendChild(D({cls:'empty',css:'margin-top:16px'},'このテーマに紐づく振り返りはまだありません'));
    }
    return sec;
  }
  f.appendChild(buildClSection(pub));

  return f;
}

const TYPE_MAP = {
  '振り返り':'note','振り返':'note','note':'note',
  'モヤモヤ':'moya','もやもや':'moya','moya':'moya',
  'VISION点検':'vision','vision点検':'vision','vision':'vision','ビジョン':'vision',
  '戦略テーマ':'strategy','戦略':'strategy','strategy':'strategy',
  '思想変化':'philosophy','philosophy':'philosophy',
};

function extractField(block, keys, multiline=false){
  for(const key of keys){
    // 次のラベル行（「キー：」）か【ブロック】が来るまで取得
    const re = new RegExp(key + '[：:：][ \\t]*([\\s\\S]+?)(?=\\n[ \\t]*[ァ-ヺぁ-ゔA-Za-z一-龥々・]+[：:：]|\\n【[^】]+】|$)', 'i');
    const m = block.match(re);
    if(m && m[1].trim()){
      const raw = m[1].trim();
      if(multiline) return raw;
      return raw.split('\n')[0].trim();
    }
  }
  return '';
}

// 番号付きリスト・箇条書きを含む複数行フィールド用
function extractMultiField(block, keys){
  return extractField(block, keys, true);
}

function parseAiReflect(text){
  const entries = [];
  const blocks = text.split(/(?=【[^】]+】)/);
  blocks.forEach(block => {
    const hm = block.match(/^【([^】]+)】/);
    if(!hm) return;
    const rawType = hm[1].trim();
    const typKey = TYPE_MAP[rawType] || TYPE_MAP[rawType.toLowerCase()] || null;
    if(!typKey) return;

    const title      = extractField(block, ['タイトル','title']);
    const rawDate    = extractField(block, ['日付','date']);
    const date       = (rawDate.match(/\d{4}-\d{2}-\d{2}/) || [tod()])[0];
    const learned    = extractMultiField(block, ['気づき・学び','気づき','学び','learned']);
    const question   = extractMultiField(block, ['問い','question']);
    const nextExp    = extractMultiField(block, ['次の実験','次のアクション','nextExp','next']);

    if(!title && !learned) return;
    const entry = {
      id:uid(), type:typKey, date, status:'published',
      title: title || learned.slice(0,40),
      lesson: learned,
      nextExp,
      question
    };
    if(typKey==='moya')        entry.moya_what    = extractField(block, ['何にモヤモヤ','モヤモヤ詳細']);
    if(typKey==='vision')      entry.vision_change= extractField(block, ['VISIONの変化','変化']);
    if(typKey==='strategy')    entry.progress     = extractField(block, ['進捗','progress']);
    if(typKey==='philosophy'){
      entry.old_belief   = extractField(block, ['当時の思想','以前の考え']);
      entry.what_changed = extractField(block, ['何が変わったか','変化']);
      entry.new_belief   = extractField(block, ['今の理解','新しい考え']);
      entry.pivot        = extractField(block, ['転換点']);
    }
    entries.push(entry);
  });
  return entries;
}

async function registerAiInput(){
  const text = document.getElementById('ai-input').value.trim();
  let statusEl = document.getElementById('ai-parse-status');
  if(!text){ statusEl.textContent='入力が空です'; statusEl.className='ai-status err'; return; }
  // 自動判別：---REFLECT-IMPORT--- → Lectica実績 ／ 【振り返り】等 → 汎用登録 ／ 両方 → 両方処理
  const hasLectica = /---REFLECT-IMPORT---/.test(text);
  // Lecticaブロック内の「気づき：」等の行を汎用パーサが誤認識しないよう、除いた残りで判定する
  const genericText = text.replace(/---REFLECT-IMPORT---[\s\S]*?(?:---END---|$)/g,'').trim();

  let entries = [];
  if(genericText){
    try { entries = parseAiReflect(genericText); }
    catch(err){
      if(!hasLectica){ statusEl.textContent='解析エラー: '+err.message; statusEl.className='ai-status err'; return; }
    }
  }
  if(!entries.length && !hasLectica){
    statusEl.textContent='【振り返り】などのタイプ行も ---REFLECT-IMPORT--- ブロックも見つかりません'; statusEl.className='ai-status err'; return;
  }

  // 汎用ブロックの登録（従来ロジックのまま）
  for(const r of entries){
    await dbput('logs', r);
    const i = S.logs.findIndex(x=>x.id===r.id);
    if(i>=0) S.logs[i]=r; else S.logs.unshift(r);
  }
  if(entries.length){
    S.logs.sort((a,b)=>b.date.localeCompare(a.date));
    // 未紐づきチェック
    const unlinked=entries.filter(e=>!(e.themes&&e.themes.length));
    if(unlinked.length) S._unlinkedNotice=unlinked.length;
  }

  // Lectica実績の登録（Lecticaタブの lxParseImport / lxImportSave を共有。複製しない）
  let lecticaOk=false;
  if(hasLectica){
    S.lxImport={text:text};
    lecticaOk = lxImportSave()===true;   // 実験ID検証・重複確認・ステータス更新は既存挙動のまま（失敗はalert）
    if(!lecticaOk) S.lxImport=null;      // 失敗時にLecticaタブへ取り込みパネルが残らないよう後始末
  }

  // 結果表示（lxImportSave成功時はra()でDOMが再構築されるため要素を取り直す）
  statusEl = document.getElementById('ai-parse-status');
  const input = document.getElementById('ai-input');
  const parts=[];
  if(entries.length) parts.push('振り返り'+entries.length+'件');
  if(lecticaOk) parts.push('Lectica実績1件');
  if(!parts.length){
    if(statusEl){ statusEl.textContent='登録できませんでした（内容を確認してください）'; statusEl.className='ai-status err'; }
    return;
  }
  if(statusEl){ statusEl.textContent = parts.join('＋')+'を登録しました ✓'; statusEl.className='ai-status ok'; }
  if(input) input.value='';
  setTimeout(()=>{S.tab='home';ra();updateNav();},800);
}

async function addDirectEntry(type, text, themeId){
  if(!text.trim()) return;
  const entry = {
    id: uid(), type: 'note', date: tod(), status: 'published',
    title: text.trim().slice(0,40),
    themes: themeId && themeId!=='none' ? [themeId] : [],

function buildQRow(line, ckId, r){

  async function setSt(newSt){S.checks[ckId]=newSt;await dbput('checks',{id:ckId,state:newSt,done:newSt==='done'});ra();}

  btns.appendChild(impBtn);btns.appendChild(doneBtn);btns.appendChild(skipBtn);

function renderArchive(){
  const f=document.createDocumentFragment();
  f.appendChild(D({cls:'sec-lbl',css:'margin-bottom:20px'},'アーカイブ'));

  // ── 問い ──
  const qPub=S.logs.filter(r=>r.status!=='draft'&&r.question?.trim());
  const qRows=[];
  qPub.forEach(r=>{r.question.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{const ckId='q_'+r.id+'_'+i;const st=S.checks[ckId]||'todo';if(st==='done'||st==='skip')qRows.push({line,ckId,r,st});});});
  if(qRows.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-top:0;margin-bottom:8px;color:var(--mu)'},'問い'));
    const qDone=qRows.filter(x=>x.st==='done');
    const qSkip=qRows.filter(x=>x.st==='skip');
    if(qDone.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'完了（'+qDone.length+'件）'));
      const dl=D({cls:'checklist',css:'margin-bottom:16px'});
      qDone.forEach(({line,ckId,r})=>dl.appendChild(buildQRow(line,ckId,r)));f.appendChild(dl);
    }
    if(qSkip.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'捨てた（'+qSkip.length+'件）'));
      const sl=D({cls:'checklist',css:'margin-bottom:24px'});
      qSkip.forEach(({line,ckId,r})=>sl.appendChild(buildQRow(line,ckId,r)));f.appendChild(sl);
    }
  }

  // ── 実験 ──
  const ePub=S.logs.filter(r=>r.status!=='draft'&&r.nextExp?.trim());
  const eRows=[];
  ePub.forEach(r=>{r.nextExp.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{const ckId='e_'+r.id+'_'+i;const st=S.checks[ckId]||'todo';if(st==='done'||st==='skip')eRows.push({line,ckId,r,st});});});
  if(eRows.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-bottom:8px;color:var(--mu)'},'実験'));
    const eDone=eRows.filter(x=>x.st==='done');
    const eSkip=eRows.filter(x=>x.st==='skip');
    if(eDone.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'完了（'+eDone.length+'件）'));
      const dl=D({cls:'checklist',css:'margin-bottom:16px'});
      eDone.forEach(({line,ckId,r})=>dl.appendChild(buildExpRow(line,ckId,r)));f.appendChild(dl);
    }
    if(eSkip.length){
      f.appendChild(D({css:'font-size:11px;color:var(--di);margin-bottom:6px'},'やらない（'+eSkip.length+'件）'));
      const sl=D({cls:'checklist'});
      eSkip.forEach(({line,ckId,r})=>sl.appendChild(buildExpRow(line,ckId,r)));f.appendChild(sl);
    }
  }

  if(!qRows.length&&!eRows.length){f.appendChild(D({cls:'empty'},'完了・捨てた問いと実験がここに蓄積されます'));}
  return f;
}

const LECTICA_SEED=[{"id": "L001", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "発信前に「3分・3点」に絞ってみる", "description": "会議、朝礼、方針共有の前に、伝えたい内容を3分で話せる量に絞る。\n相手に理解してほしいことは3点までにする。\n細かい説明を増やすのではなく、相手が動くために必要なことだけを残す。", "completionCondition": "実際の発信で、3分・3点で話した。", "priority30Days": true, "status": "not_started"}, {"id": "L002", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "結論・理由・行動の順番で話してみる", "description": "発信するときに、最初に結論を伝える。\n次に、その理由を伝える。\n最後に、相手に期待する行動を伝える。\n複雑な背景を先に話しすぎず、聞き手が理解しやすい順番にする。", "completionCondition": "1回の会議または発信で、結論・理由・行動の順で話した。", "priority30Days": false, "status": "not_started"}, {"id": "L003", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "伝える前に根拠を1つ添えてみる", "description": "直感や考えだけで話さず、根拠・データ・事例・過去の経験のいずれかを1つ添えて話す。\n「なぜそう考えるのか」が相手に伝わる形にする。", "completionCondition": "発信の中に、根拠を1つ入れた。", "priority30Days": false, "status": "not_started"}, {"id": "L004", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "部門ごとに同じメッセージを言い換えてみる", "description": "同じ方針を、認証サポート、セキュリティ、人事、管理部門など、相手の部門に合わせて言い換える。\n相手の成功基準や関心に合わせて、伝え方を変える。", "completionCondition": "同じ内容を、2つ以上の部門向けに言い換えた。", "priority30Days": false, "status": "not_started"}, {"id": "L005", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "相手の立場に合わせてフレーミングしてみる", "description": "話す前に、相手が何を大事にしているかを確認する。\nその人の関心、責任範囲、現場感に合わせて、話の入り口を変える。", "completionCondition": "1人または1部門に対して、相手の立場に合わせて話した。", "priority30Days": false, "status": "not_started"}, {"id": "L006", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "反発・疑問を先に入れて話してみる", "description": "方針を伝える前に、聞き手が感じそうな疑問や反発を先に整理する。\n発信の中で、「こういう疑問が出るかもしれない」「こういう不安があると思う」と先に触れる。", "completionCondition": "発信の中に、想定される疑問・反発を1つ以上入れた。", "priority30Days": true, "status": "not_started"}, {"id": "L007", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "自分のストーリーの盲点を書いてみる", "description": "自分が語ろうとしている方針やビジョンに、抜けている視点や矛盾がないかを先に書き出す。\n完璧なストーリーにしようとせず、盲点も含めて伝える準備をする。", "completionCondition": "発信前に、盲点を1つ以上書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L008", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "例え話を使って説明してみる", "description": "ロジックだけで説明せず、相手がイメージしやすい例え話を使う。\n野球、家づくり、旅、山登りなど、誰でも理解しやすい比喩に置き換える。", "completionCondition": "1回の発信で、例え話を1つ使った。", "priority30Days": false, "status": "not_started"}, {"id": "L009", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "長い考えを1枚メモに圧縮してみる", "description": "複雑な考えを、そのまま話す前に1枚メモにする。\n大事な結論、背景、理由、相手に求める行動だけに絞る。", "completionCondition": "1つのテーマを1枚メモに整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L010", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "発信後に伝わり方のフィードバックをもらってみる", "description": "信頼できる幹部や部下に、発信の内容がどう伝わったかを確認する。\n評価ではなく、伝わったこと・伝わらなかったことを確認する。", "completionCondition": "1人から発信の伝わり方についてフィードバックをもらった。", "priority30Days": false, "status": "not_started"}, {"id": "L011", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "相手の言葉で理解を確認してみる", "description": "説明した後に、自分の言葉ではなく相手の言葉で理解を確認する。\n相手がどう受け取ったかを把握し、必要に応じて補足する。", "completionCondition": "説明後に、相手の理解内容を確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L012", "category": "Clarity", "categoryLabel": "A. Clarityを高める実験", "title": "方針共有を「削る練習」として扱ってみる", "description": "方針共有の文章やスピーチを作った後、不要な説明を削る。\n伝えたいことを増やすのではなく、伝わる量まで減らす。", "completionCondition": "発信前に、文章や話す内容を一度削った。", "priority30Days": false, "status": "not_started"}, {"id": "L013", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "会議で先に全員の視点を出してから統合してみる", "description": "幹部会議や重要会議で、最初から結論に向かわない。\nまず関係者の見方を出してもらう。\nその後で、共通点・違い・統合できる方向を整理する。", "completionCondition": "会議で、視点を出す時間と統合する時間を分けた。", "priority30Days": true, "status": "not_started"}, {"id": "L014", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "意見の違いを情報源として扱ってみる", "description": "反対意見や違和感を、抵抗ではなく情報として扱う。\n違う意見が出たときに、すぐ判断せず、何を見てそう言っているのかを扱う。", "completionCondition": "反対意見を1つ、情報源として扱った。", "priority30Days": false, "status": "not_started"}, {"id": "L015", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "関係者の立場を並べてみる", "description": "意思決定の前に、関係者ごとの立場を書き出す。\n社長、幹部、現場、顧客、管理部門、株主など、それぞれが何を重視しているかを分けて見る。", "completionCondition": "1つの意思決定について、関係者の立場を3つ以上書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L016", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "利害関係者の立場の変化を見てみる", "description": "今の意見だけでなく、時間が経つと立場がどう変わるかを見る。\n今日の反発、1か月後の納得、半年後の影響を分けて考える。", "completionCondition": "1つの問題について、現在・1か月後・半年後の見え方を書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L017", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "執行役員の意見を残してから社長判断してみる", "description": "自分が決める前に、執行役員の意見を残す。\n最終判断は社長がしても、判断前にどの視点を聞いたかを明確にする。", "completionCondition": "1つの意思決定で、判断前に幹部の意見を記録した。", "priority30Days": false, "status": "not_started"}, {"id": "L018", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "複数の意見を一つの方針にまとめてみる", "description": "会議で出た複数の意見を、勝ち負けで処理しない。\n各意見の価値を残しながら、一つの方針にまとめる。", "completionCondition": "複数の意見を統合した方針を1つ作った。", "priority30Days": false, "status": "not_started"}, {"id": "L019", "category": "Perspective coordination", "categoryLabel": "B. Perspective coordinationを高める実験", "title": "自分が拾えていない視点を追加してみる", "description": "意思決定の前に、自分が見落としていそうな視点を追加する。\n特に、現場、顧客、若手、管理側、長期視点を意識して加える。", "completionCondition": "意思決定前に、見落としそうな視点を1つ加えた。", "priority30Days": false, "status": "not_started"}, {"id": "L020", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "耳の痛い情報を歓迎する場を作ってみる", "description": "幹部や部下が言いにくいことを言える場を作る。\n反論や違和感を聞いたときに、すぐ説明や反論をしない。\nまず受け取る。", "completionCondition": "耳の痛い情報を1つ受け取った。", "priority30Days": false, "status": "not_started"}, {"id": "L021", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "説得のための質問をやめてみる", "description": "相手を自分の結論に誘導する質問をやめる。\n自分の結論に合う答えを引き出すのではなく、相手が本当に見ているものを引き出す。", "completionCondition": "1on1または会議で、誘導ではない質問をした。", "priority30Days": false, "status": "not_started"}, {"id": "L022", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "相手のゴールを先に確認してみる", "description": "自分のゴールに合うかどうかを見る前に、相手が何を実現したいのかを確認する。\n相手のゴールを理解してから、自分の考えを伝える。", "completionCondition": "相手のゴールを先に確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L023", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "1on1を業務処理と分けてみる", "description": "1on1を、進捗確認や業務処理だけで終わらせない。\n本人が大事にしていること、今の違和感、成長したい方向を扱う時間にする。", "completionCondition": "1on1で、業務以外のテーマを1つ扱った。", "priority30Days": false, "status": "not_started"}, {"id": "L024", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "対立を相互理解の機会として扱ってみる", "description": "対立や意見の違いが起きたとき、早く収めることだけを目的にしない。\nその違いから、互いの前提や価値観を理解する。", "completionCondition": "対立や違和感を、相互理解の材料として扱った。", "priority30Days": false, "status": "not_started"}, {"id": "L025", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "重要な対話の前に、相手が守りたいものを書いてみる", "description": "重要な対話の前に、相手が守りたいものを想定する。\n立場、責任、評価、安心、将来、関係性などを分けて考える。", "completionCondition": "対話前に、相手が守りたいものを1つ以上書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L026", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "相手の話を要約しすぎずに受け取ってみる", "description": "相手の話をすぐに整理・要約・結論化しない。\n相手が何を大事にしているかを、そのまま受け取る時間を作る。", "completionCondition": "対話で、相手の話をすぐに結論化しなかった。", "priority30Days": false, "status": "not_started"}, {"id": "L027", "category": "Collaborative capacity", "categoryLabel": "C. Collaborative capacityを高める実験", "title": "共通の利益や価値観を使って接点を作ってみる", "description": "意見が違う相手と話すとき、まず共通して大事にしていることを確認する。\nその共通点を、議論の土台にする。", "completionCondition": "対話の中で、共通の利益や価値観を1つ確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L028", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "重要決定に意思決定メモを残してみる", "description": "重要な意思決定をするとき、決定内容だけでなく、決めたプロセスを残す。\n何を見て、誰の意見を聞き、どの基準で決めたかを残す。", "completionCondition": "1つの意思決定メモを残した。", "priority30Days": true, "status": "not_started"}, {"id": "L029", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "決定後に振り返る時期を先に決めてみる", "description": "意思決定した時点で、振り返る時期を決める。\n決めっぱなしにせず、いつ・何を見て判断を見直すかを明確にする。", "completionCondition": "意思決定時に、振り返り時期を決めた。", "priority30Days": false, "status": "not_started"}, {"id": "L030", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "意思決定の協力レベルを決めてみる", "description": "意思決定の前に、どのレベルの協力が必要かを決める。\n社長単独、幹部相談、チーム合意、現場参加など、状況に合わせて決める。", "completionCondition": "1つの案件で、協力レベルを事前に決めた。", "priority30Days": false, "status": "not_started"}, {"id": "L031", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "コラボレーションの連続体を使ってみる", "description": "すべてを合意形成にしようとせず、すべてをトップダウンにも寄せない。\n案件ごとに、どの程度の協働が適切かを判断する。", "completionCondition": "1つの意思決定を、協働レベルに沿って整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L032", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "直感で決めた理由を言語化してみる", "description": "直感で決めたことについて、後から理由を言語化する。\n自分の中の判断基準を、他者にも説明できる形にする。", "completionCondition": "直感判断の理由を文章にした。", "priority30Days": false, "status": "not_started"}, {"id": "L033", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "ルール変更前にプロセスを確認してみる", "description": "交通費や制度変更のような、現場に影響するルール変更では、発信前にプロセスを確認する。\n誰に相談し、誰が影響を受け、どの順番で伝えるかを決める。", "completionCondition": "制度変更前に、相談・影響・発信順を整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L034", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "あらゆる結論を暫定的に扱ってみる", "description": "一度決めた結論を絶対視しない。\n新しい情報が入ったら、必要に応じて見直せるものとして扱う。", "completionCondition": "1つの結論について、見直し条件を設定した。", "priority30Days": false, "status": "not_started"}, {"id": "L035", "category": "Decision-making process", "categoryLabel": "D. Decision-making processを高める実験", "title": "意思決定後に、決め方の成否を振り返ってみる", "description": "結果だけでなく、決め方が適切だったかを振り返る。\n誰を巻き込むべきだったか、どの情報が足りなかったかを見る。", "completionCondition": "意思決定後に、決定プロセスを振り返った。", "priority30Days": false, "status": "not_started"}, {"id": "L036", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "問題発生時に構造要因を書き出してみる", "description": "問題を人のせいだけにしない。\n制度、仕組み、役割、評価、情報の流れ、文化など、構造要因を書き出す。", "completionCondition": "1つの問題について、構造要因を3つ以上書いた。", "priority30Days": false, "status": "not_started"}, {"id": "L037", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "社内・顧客・市場・社会の4視点で見てみる", "description": "1つのテーマを、社内だけでなく、顧客、市場、社会の視点でも見る。\n自社都合だけで判断しない。", "completionCondition": "1つの意思決定を4視点で整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L038", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "業界外の変化を自社に接続してみる", "description": "他業界、技術、社会変化の中から、自社に影響しそうなものを1つ選ぶ。\nそれが既存事業や組織にどう影響するかを見る。", "completionCondition": "業界外の変化を1つ、自社への影響に接続した。", "priority30Days": false, "status": "not_started"}, {"id": "L039", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "時間軸を半年・3年・10年に広げてみる", "description": "目の前の判断を、短期だけで見ない。\n半年後、3年後、10年後にどう見えるかを分けて考える。", "completionCondition": "1つの判断を、半年・3年・10年で整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L040", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "問題を個人・チーム・組織・社会で見てみる", "description": "問題を個人の問題だけにしない。\n個人、チーム、組織、社会のどの階層で起きているかを見る。", "completionCondition": "1つの問題を4階層で整理した。", "priority30Days": false, "status": "not_started"}, {"id": "L041", "category": "Contextual thinking", "categoryLabel": "E. Contextual thinkingを高める実験", "title": "新しい技術や社会変化を意思決定に入れてみる", "description": "AI、規制、人口動態、防衛、セキュリティ、労働市場などの変化を、意思決定の文脈に入れる。\n事業判断の背景として扱う。", "completionCondition": "1つの意思決定に、外部環境の変化を入れた。", "priority30Days": false, "status": "not_started"}, {"id": "L042", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "育成対象を1人決めて観察してみる", "description": "まず1人、育成対象を決める。\n業務成果だけでなく、意思決定、視点、発言、質問、説明の変化を見る。", "completionCondition": "1人を決め、観察ポイントを記録した。", "priority30Days": true, "status": "not_started"}, {"id": "L043", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "指導ではなく経験を設計してみる", "description": "答えを教えるのではなく、本人が経験から学べる場を設計する。\n小さな意思決定、小さな責任、小さな振り返りを渡す。", "completionCondition": "育成対象に、学習につながる経験を1つ渡した。", "priority30Days": false, "status": "not_started"}, {"id": "L044", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "小さな意思決定を任せてみる", "description": "大きな権限移譲ではなく、小さな意思決定を任せる。\n任せた後に、結果だけでなく決め方を一緒に振り返る。", "completionCondition": "育成対象に、小さな意思決定を1つ任せた。", "priority30Days": true, "status": "not_started"}, {"id": "L045", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "本人の望む未来に近づいているかを見る", "description": "評価面談や1on1で、成果だけでなく、本人が望む未来に近づいているかを見る。\n育成を、会社都合だけでなく本人の成長とも接続する。", "completionCondition": "本人の望む未来と、現在の仕事の接点を確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L046", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "部下に方針を自分の言葉で説明してもらう", "description": "方針を伝えた後、部下にその内容を自分の言葉で説明してもらう。\n理解の確認だけでなく、部下のClarityを育てる機会にする。", "completionCondition": "部下が方針を自分の言葉で説明した。", "priority30Days": false, "status": "not_started"}, {"id": "L047", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "部下に複数視点で考える練習を渡してみる", "description": "部下に、顧客、現場、会社、長期視点など、複数の視点で考える課題を渡す。\n単一視点ではなく、視点調整の練習にする。", "completionCondition": "部下が複数視点で整理した内容を確認した。", "priority30Days": false, "status": "not_started"}, {"id": "L048", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "気づき・発言変化まで待ってみる", "description": "育成を急がない。\nすぐに答えを出させず、本人の気づき、意識、発言が変わるまで待つ。", "completionCondition": "すぐに処理せず、本人の変化を観察した。", "priority30Days": false, "status": "not_started"}, {"id": "L049", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "後継者候補に統合の経験を渡してみる", "description": "後継者候補や幹部候補に、複数部門の意見をまとめる役割を渡す。\n単なる実務遂行ではなく、視点調整と統合の経験にする。", "completionCondition": "候補者に、複数視点を統合する役割を渡した。", "priority30Days": false, "status": "not_started"}, {"id": "L050", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "若手に育成機会として仕事を任せてみる", "description": "若手に仕事を任せるとき、単なる作業ではなく育成機会として設計する。\n何を学んでほしいかを自分の中で明確にしてから任せる。", "completionCondition": "若手に、学習目的を持った仕事を1つ任せた。", "priority30Days": false, "status": "not_started"}, {"id": "L051", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "人を育てる時間を経営タスクとして確保してみる", "description": "人材育成を余裕がある時にやるものにしない。\n経営者の仕事として、育成に使う時間を確保する。", "completionCondition": "週内に育成のための時間を1枠確保した。", "priority30Days": false, "status": "not_started"}, {"id": "L052", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "部下の質問力を育てる場を作ってみる", "description": "部下が上司に答えを求めるだけでなく、自分で良い問いを立てる練習をする。\n質問の質を、育成テーマとして扱う。", "completionCondition": "部下と質問の質について扱った。", "priority30Days": false, "status": "not_started"}, {"id": "L053", "category": "育成", "categoryLabel": "F. 育成に取り組む実験", "title": "成果確認と育成確認を分けてみる", "description": "面談や1on1で、成果の確認と育成の確認を分ける。\n成果は成果として見る。育成は、本人の思考・視点・発言の変化を見る。", "completionCondition": "成果確認と育成確認を分けて話した。", "priority30Days": false, "status": "not_started"}, {"id": "L054", "category": "学習感情", "categoryLabel": "G. 学習感情を扱う実験", "title": "理解できない時の感情を書き出してみる", "description": "何かが理解できないとき、自分がどう感じたかを書き出す。\n焦り、不安、苛立ち、好奇心、悔しさなどを観察する。", "completionCondition": "理解できない時の感情を1つ記録した。", "priority30Days": false, "status": "not_started"}, {"id": "L055" const LX_PROMPT_START="# Lectica実験 振り返り支援プロンプト\n\nあなたは竹嶋寛人のLectica実験の振り返り支援者です。\n\n目的は、竹嶋が日々の会議・発信・意思決定・1on1・育成の中で行ったLectica実験について、本人の言葉で振り返り、Reflect OSに記録できる形に整えることです。\n\n---\n\n# 最重要ルール\n\nすぐに答えを出さない。\n最初からまとめない。\nこちらの推測や補足を入れない。\n竹嶋の言葉を集めてから、最後に整理する。\n\n質問は必ず一つずつ行う。\n複数の質問を同時にしない。\n\n質問の無限ループにしない。\n必要事項が集まったら、「ここまでで振り返りをまとめます」と言って、まとめに入る。\n\n竹嶋が「まとめて」「ここまででいい」「振り返りを終えたい」と言ったら、追加質問せずにまとめる。\n\n---\n\n# 振り返り対象\n\n竹嶋が最初に以下を伝える。\n\n* 今日のLectica実験テーマ\n* 実際に使った場面\n* 起きた出来事\n* 判断・対話・発信・育成などの内容\n\n例：\n\n今日のLectica実験：意思決定後に、決め方の成否を振り返ってみる\n対象：古江さんと佐藤さんの業務委託契約書から競業避止義務の記載をなくした判断\n\nただし、上記はあくまで例である。\n実際の出力では、必ず今回の竹嶋の発言内容を使い、例の人物名・出来事・日付・実験IDを流用しない。\n\n---\n\n# 基本姿勢\n\n竹嶋の発言を、勝手に美化しない。\n竹嶋の発言を、勝手に厳しく解釈しない。\n竹嶋の発言にないことを、事実のように書かない。\n必要な場合でも、「推測ですが」と補足するのではなく、まず質問して確認する。\n\n竹嶋の言葉をできる限り残す。\n言い換える場合も、意味を変えない。\n経営用語や一般論で上書きしない。\n\n---\n\n# 質問の進め方\n\nまず、実験テーマに応じて必要事項を確認する。\n\n質問は一つずつ行う。\n\n1つ回答をもらったら、短く整理してから、次の質問を1つだけ行う。\n\n例：\n\n「整理すると、今回の判断軸はこの4つですね。次の質問です。」\n\nただし、整理は短くする。\n長い解説や補足は入れない。\n\n---\n\n# 共通で確認すること\n\nどのLectica実験でも、基本的には以下を確認する。\n\n1. 今回、何をしたか\n2. どの場面で使ったか\n3. 何を大事にしたか\n4. 良かった点は何か\n5. 改善したい点は何か\n6. 次回変えることは何か\n\nただし、毎回すべてを聞く必要はない。\n竹嶋の回答の中にすでに含まれていれば、重複して聞かない。\n\n---\n\n# 実験テーマ別の質問方針\n\n## A. Clarity系の場合\n\n確認すること：\n\n* 何を伝えようとしたか\n* 誰に伝えたか\n* 何を一番伝えたかったか\n* 3分・3点に絞れたか\n* 相手にどう伝わったと思うか\n* 次回、何を削るか\n* 次回、どの順番で話すか\n\n質問例：\n\n「今回、一番伝えたかったことは何でしたか？」\n\n「相手に理解してほしかった3点は何でしたか？」\n\n「今振り返ると、削ってよかった説明はありましたか？」\n\n---\n\n## B. Perspective coordination系の場合\n\n確認すること：\n\n* 誰の視点を扱ったか\n* どんな意見の違いがあったか\n* どの視点を拾えたか\n* 拾えていなかった視点は何か\n* 最終的にどう統合したか\n* 次回、誰の視点を先に聞くか\n\n質問例：\n\n「今回、どの関係者の視点を扱いましたか？」\n\n「意見の違いは、どこにありましたか？」\n\n「今振り返ると、拾えていなかった視点はありましたか？」\n\n---\n\n## C. Collaborative capacity系の場合\n\n確認すること：\n\n* 誰との対話だったか\n* 相手は何を大事にしていたか\n* 自分はどこまで受け取れたか\n* 説得しようとしていなかったか\n* 相手のゴールを確認できたか\n* 次回、どう聞き方を変えるか\n\n質問例：\n\n「相手は何を一番大事にしていたと思いますか？」\n\n「今回、自分は相手の話をどこまで受け取れましたか？」\n\n「説得のための質問になっていた部分はありましたか？」\n\n---\n\n## D. Decision-making process系の場合\n\n確認すること：\n\n* 何を決めたか\n* 判断軸は何だったか\n* 会社として守るべきものは何だったか\n* 誰に確認したか\n* 後から説明するとしたらどう説明するか\n* 良かった決め方は何か\n* 次回改善したい決め方は何か\n\n質問例：\n\n「今回の意思決定で、一番大事にした判断軸は何でしたか？」\n\n「会社として本当に守るべきものは何だと考えましたか？」\n\n「後から誰かに説明を求められた場合、どう説明したいですか？」\n\n---\n\n## E. Contextual thinking系の場合\n\n確認すること：\n\n* 何の問題・判断だったか\n* 個人の問題として見ていないか\n* 構造要因は何か\n* 社内・顧客・市場・社会の視点ではどう見えるか\n* 半年後・3年後・10年後ではどう見えるか\n* 次回、どの視点を加えるか\n\n質問例：\n\n「今回の問題は、個人ではなく構造で見ると何が要因でしたか？」\n\n「社内・顧客・市場・社会の視点で見ると、それぞれどう見えますか？」\n\n「半年後・3年後・10年後で見ると、判断は変わりますか？」\n\n---\n\n## F. 育成系の場合\n\n確認すること：\n\n* 誰に関する育成だったか\n* 何を教えようとしたか\n* どんな経験を渡したか\n* 本人の変化をどこで見たか\n* 急いで処理しすぎていなかったか\n* 次回、どんな経験を渡すか\n\n質問例：\n\n「今回、誰に対する育成の実験でしたか？」\n\n「その人に、どんな経験を渡そうとしましたか？」\n\n「本人の気づきや発言の変化はありましたか？」\n\n---\n\n## G. 学習感情系の場合\n\n確認すること：\n\n* 何が理解できなかったか\n* その時どんな感情が出たか\n* 学習意欲は上がったか下がったか\n* どう対処したか\n* 次回、どう扱うか\n\n質問例：\n\n「理解できなかった時、最初に出た感情は何でしたか？」\n\n「その感情は、学習意欲を上げましたか、下げましたか？」\n\n「次回同じ感情が出たら、どう扱いたいですか？」\n\n---\n\n# 質問数の上限\n\n原則として、質問は最大5問までにする。\n\nただし、竹嶋が続けたい場合だけ追加で聞く。\n\n5問聞いたら、以下のように確認する。\n\n「ここまでで振り返りの材料は揃っています。まとめます。」\n\nその後、追加質問せずにまとめる。\n\n---\n\n# まとめる時のルール\n\nまとめる時は、補足を入れない。\n竹嶋が話した内容だけでまとめる。\n\n「今回の学び」も、竹嶋の発言から自然に出る範囲にする。\nAI側の一般論や助言は入れない。\n\n---\n\n# Reflect OS用の出力形式\n\n以下の形式でまとめる。\n\n# Lectica実験ログ\n\n## 今日のLectica実験\n\n【実験テーマ】\n\n## 対象となる出来事\n\n【何について振り返ったか】\n\n## 実際に行ったこと\n\n【竹嶋が実際に行ったこと】\n\n## 判断軸・大事にしたこと\n\n【竹嶋が大事にした判断軸・価値観】\n\n## 良かった点\n\n【竹嶋が良かったと感じた点】\n\n## 改善したい点\n\n【竹嶋が改善したいと感じた点】\n\n## 次回変えること\n\n【次回の実験・行動に活かすこと】\n\n## 今回の学び\n\n【竹嶋の言葉から整理した学び】\n\n---\n\n# 禁止事項\n\n* 最初から長文でまとめない\n* 質問を一度に複数しない\n* 竹嶋が言っていないことを補足しない\n* 法務・人事・経営の一般論を勝手に足さない\n* 「つまり」「本質的には」などで意味を広げすぎない\n* 無限に質問し続けない\n* まとめてほしいと言われた後に追加質問しない\n* 補足はいらないと言われたら、補足を一切入れない\n\n---\n\n# 開始時の最初の返答\n\n竹嶋がLectica実験テーマと出来事を伝えたら、最初は以下のように返す。\n\n「はい。今回は【実験テーマ】の振り返りとして進めます。すぐにまとめず、あなたの言葉を集めてからReflect OS用に整えます。まず1つ目の質問です。」\n\nその後、実験テーマに合わせて最初の質問を1つだけ行う。\n";
const LX_PROMPT_SUMMARY="# Lectica実験 まとめ（取り込みブロック生成）プロンプト\n\n直前までのLectica振り返り対話の内容をもとに、Reflect OS に取り込むためのテキストを生成してください。\nまだ「# Lectica実験ログ」を出力していなければ先に出力し、続けて下記の取り込み用ブロックを1つ出力します。\n竹嶋の発言内容だけを使い、AIの一般論・補足は入れないでください。\n\n---\n\n# Reflect OS 取り込みブロック（まとめの最後に必ず付ける）\n\n人間が読む「# Lectica実験ログ」を出力した後、続けて下記の取り込み用ブロックをそのままの形式で1つ出力する。\nこれは Reflect OS が機械的に読むため、ラベル名・区切り線を変えないこと。\n\nラベルは固定する。\n固定ラベルは以下の8つ。\n\n* 実験ID\n* 実行日\n* 使った場面\n* 関係者\n* 実際にやったこと\n* 気づき\n* 次回変えること\n* 結果\n\n各項目は1行で書く。\n値の中で改行しない。\n長ければ要点を1行に圧縮する。\n\n実験IDは、対象のLectica実験のIDを入れる。\n竹嶋が最初に伝えた実験テーマから特定する。\nIDが不明な場合は、推測でIDを作らず、竹嶋に1問だけ確認してからブロックを出す。\n\n実行日は、対象日を YYYY-MM-DD 形式で書く。\n日付が不明な場合は、振り返り対象日を竹嶋に1問だけ確認する。\nただし「今日」と言われた場合は、その日の実行日を入れる。\n\n関係者は、竹嶋の発言に出てきた人物名だけをカンマ区切りで書く。\n関係者がいなければ空にする。\nプロンプト内の例や過去ログの人物名を流用しない。\n\n結果は、次の4つから1つだけ選ぶ。\n\n* continue\n* complete\n* change\n* pause\n\n結果の意味は以下とする。\n\n* continue：継続\n* complete：完了\n* change：変更\n* pause：保留\n\n竹嶋の発言から自然に判断できる場合のみ設定する。\n判断材料がなければ continue とする。\n\n値は竹嶋の言葉を使う。\nAIの一般論・補足を入れない。\n既存の禁止事項を踏襲する。\n\n出力形式は必ず以下の通りにする。\nただし、下記はテンプレートであり、値は必ず今回の振り返り内容で上書きすること。\nテンプレート内の {} は出力時に残さないこと。\n\n---REFLECT-IMPORT---\n実験ID：{対象のLectica実験ID}\n実行日：{YYYY-MM-DD}\n使った場面：{1行}\n関係者：{竹嶋の発言に出てきた関係者名をカンマ区切り。いなければ空}\n実際にやったこと：{1行}\n気づき：{1行}\n次回変えること：{1行}\n結果：{continue / complete / change / pause のいずれか1つ}\n---END---\n\n該当する内容が無い項目は、ラベルだけ残して値を空にする。\n行は消さない。\n\nただし、以下4項目のうち最低1つは必ず埋める。\n\n* 使った場面\n* 実際にやったこと\n* 気づき\n* 次回変えること\n\nこれは Reflect OS 側の保存条件である。\n\n---\n\n# Reflect OSへの取り込み運用\n\nこのプロンプトでAIと振り返りを行う。\n最後に、以下の2つが出力される。\n\n1. # Lectica実験ログ\n2. ---REFLECT-IMPORT--- ブロック\n\nその出力全文をコピーする。\n\nReflect OSの Lecticaタブで、以下の操作を行う。\n\n1. 「📋 貼り付けて取り込む」を押す\n2. 出力全文を貼り付ける\n3. 「取り込む」を押す\n\nReflect OSは、末尾の ---REFLECT-IMPORT--- ブロックだけを解析し、Lecticaログを1件作成する。\n\n結果に応じて、実験ステータスも更新する。\n\n* continue：実験中\n* change：実験中\n* complete：完了\n* pause：保留\n\n同じ実験・同じ日・同じ気づきのログが既にある場合は、二重取り込み防止のため確認を出す。\n\n---\n\n# Reflect OS側の対応ラベル\n\n取り込みパーサは、次の別名も許容してよい。\nただし、AIの出力は必ず上記の固定ラベルを使う。\n\n* 実験ID ＝ ID\n* 実行日 ＝ 日付 / date\n* 実際にやったこと ＝ 実際に行ったこと\n* 気づき ＝ 今回の学び\n* 結果 ＝ 継続 / 完了 / 変更 / 保留\n\nAIは、別名ではなく固定ラベルで出力すること。\n";
const RF_PROMPT_SPARRING="# Reflect壁打ちプロンプト（内省 → 記録 → 行動）\n\nあなたは竹嶋寛人の内省の壁打ち相手です。\n\n目的は、プロジェクトの進捗やモヤモヤを竹嶋自身の言葉で掘り下げ、腹落ちが見えたところで、\n①Reflect OSに取り込める記録、②次の行動（Shotタスク候補）、③プロジェクトへの反映（シート行）\nまでを一度に整えることです。\n\n---\n\n# 最重要ルール\n\nすぐに答えを出さない。最初からまとめない。\nこちらの推測・一般論・経営用語での言い換えを入れない。\n竹嶋の言葉を集めてから、最後に整理する。\n\n質問は必ず一つずつ。複数同時にしない。\n1つ回答をもらったら短く整理してから、次の質問を1つだけ。\n\n質問は原則5問まで。5問で「ここまでで整理します」と言ってまとめに入る。\n竹嶋が「まとめて」「ここまででいい」と言ったら、追加質問せずにまとめる。\n\n---\n\n# 壁打ちの進め方\n\n竹嶋が最初にモヤモヤ・出来事・プロジェクトの状況を話す。\n\n確認する観点（回答に含まれていれば聞かない）：\n1. 何が起きたか／何にモヤモヤしているか\n2. 本当は何を大事にしたかったか\n3. 「〜だと思っていたが、実は…」に当たる気づきはあるか（腹落ちの核）\n4. まだ答えが出ていない問いは何か\n5. 次に試したいことは何か\n6. これはどのプロジェクト・誰に関係するか（行動につなぐため）\n\n## 腹落ちの判断基準（まとめの質を決める）\n\n良い例：\n・仲間探しをやめる\n・資本政策ではなく人生応援だった\n・事業ではなく挑戦の環境を作りたい\n\n悪い例（綺麗な一般論）：\n・仲間とは何か\n・資本政策とは何か\n\n「○○とは何か」ではなく「○○だと思っていたが、実は△△だった」を優先する。\n\n---\n\n# まとめの出力（3ブロック構成）\n\n腹落ちが見えたら、以下の3ブロックを**この順で一度に**出力する。\n②③は該当がある場合のみ（無ければブロックごと省略）。竹嶋が言っていないことを足さない。\n\n## ブロック①：Reflect OS取り込み（必須・フォーマット厳守）\n\n【振り返り】\nタイトル：（腹落ちした教訓を一言で）\n日付：YYYY-MM-DD\n気づき・学び：\n・（最大5項目・1行1項目・本人の言葉で）\n問い：\n・（未解決の問いを最大3項目・必ず「〜か？」で終える）\n次の実験：\n・（具体的行動・必ず「〜してみる」で終える）\n\n※ タイプは【振り返り】【モヤモヤ】【VISION点検】【戦略テーマ】【思想変化】から選ぶ。基本は【振り返り】。\n思想そのものが変化した場合のみ【思想変化】。\n※ このブロックの後に説明文を挟まない（そのまま貼れる状態にする）。\n\n## ブロック②：行動（Shotタスク候補）※該当時のみ\n\n▼ Shotタスク候補\n・（タスク名）｜期日：（対話で出た期限。無ければ「期日未定」）\n（対話の中で「やる」と決まったものだけ。実験は①の「次の実験」に入れ、ここと重複させない）\n\n## ブロック③：プロジェクト反映 ※プロジェクトに関係する場合のみ\n\n▼ プロジェクトシート追記行（{プロジェクト名}・タブ区切り）\n（ID空欄\tテーマ番号\t種別\t期日\t状態\tイベント\t担当\t対象\t施策\tゴール\t結果 の11列TSV。\n種別は空欄=イベント/分岐/制約を内容で判断。決定・方針転換は「分岐」。状態は「未着手」か「完了」）\n\n▼ 反映手順\n1. ①をReflect OSの「⬇ 取り込む」に貼り付けて登録\n2. ②をShot Task OSに追加\n3. ③をシートに貼り付け → Project OSで取り込み\n\n---\n\n# 禁止事項\n\n・質問を一度に複数しない／6問以上しない（竹嶋が続けたい場合を除く）\n・竹嶋が言っていないことを補足しない\n・「つまり」「本質的には」で意味を広げすぎない\n・②③を無理に埋めない（行動が決まっていない内省は①だけでよい。内省を無理にタスク化しない）\n・法務・人事・経営の一般論を足さない\n\n---\n\n# 開始時の最初の返答\n\n竹嶋がモヤモヤや状況を話したら、最初はこう返す。\n\n「はい。すぐにまとめず、あなたの言葉で掘り下げてから、Reflect OSへの記録と次の行動まで整えます。まず1つ目の質問です。」\n\nその後、観点1〜6のうち最も足りないものを1つだけ聞く。\n";
const LX_PROMPT_SPARRING="# Lectica実験 壁打ちプロンプト\n\nあなたは竹嶋寛人のLectica実験の壁打ち相手です。\n\n目的は、毎朝提示されるLectica実験を「今日、いつ、誰に、何をするか」まで具体化し、実行後のフィードバックまで伴走して、Reflect OSに記録できる形に整えることです。\n\n振り返り支援プロンプト（別チャット）が「終わった後の振り返り」担当なのに対し、あなたは「やる前の設計」と「やった直後のフィードバック」の担当です。\n\n---\n\n# 全体の流れ\n\n1. 竹嶋が今日の実験（実験ID・実験名・使う場面）を貼る\n2. あなたが1問ずつ質問して実験を具体化する（壁打ち）\n3. 実験が具体化できたら「実験設計書」を出力する\n4. 竹嶋が実行後、同じチャットに結果を書き込む\n5. あなたがフィードバックを返す\n6. 最後に Reflect OS 取り込みブロックを出力する\n\n---\n\n# 最重要ルール\n\nすぐに設計書を出さない。\n最初から答えを出さない。\n竹嶋の言葉で実験が具体化されるまで、1問ずつ聞く。\n\n質問は必ず一つずつ行う。\n複数の質問を同時にしない。\n\n竹嶋の発言にないことを、事実のように書かない。\n経営用語や一般論で上書きしない。\n\n竹嶋が「もう設計書でいい」「まとめて」と言ったら、追加質問せずに設計書を出す。\n\n---\n\n# 壁打ち（設計フェーズ）\n\n## 確認すること\n\n実験が次の状態になるまで質問する（すでに答えに含まれていれば聞かない）：\n\n* いつ・どの場面でやるか（時刻・会議名まで）\n* 誰に対してやるか（相手の名前）\n* 最初の一言・最初の動きは何か（口に出す言葉レベルまで）\n* 何を観察するか（相手の反応・自分の内面のどこを見るか）\n* どうなったら完了か（完了条件を竹嶋の言葉で）\n* 想定されるつまずきと、そのときどうするか（1つだけ）\n\n## 質問の進め方\n\n1つ回答をもらったら、短く整理してから次の質問を1つだけ行う。\n整理は短くする。長い解説や補足は入れない。\n\n質問は原則3問まで。3問で具体化しきれなければ、\n「ここまでで設計書にまとめます。足りない部分は実行しながら埋めてください」と言って設計書に進む。\n\n## 具体化の基準\n\n「明日の朝、他人がこの設計書を読んでも同じ実験ができる」レベルを目安にする。\n抽象的な回答（例：「意識してみる」）には、「具体的には最初に何と言いますか？」のように行動に落とす質問を返す。\n\n---\n\n# 実験設計書の出力形式\n\n# Lectica実験設計書\n\n## 実験\n【実験ID・実験名】\n\n## 場面\n【いつ・どこで・誰に】\n\n## 最初の一手\n【最初に言うこと・すること】\n\n## 観察ポイント\n【相手・自分の何を見るか】\n\n## 完了条件\n【どうなったら完了か（竹嶋の言葉で）】\n\n## つまずいたら\n【想定されるつまずきと対処（1つ）】\n\n設計書の後に、こう添える：\n「実行後、このチャットに結果（やったこと・相手の反応・気づき）をそのまま書き込んでください。フィードバックを返します。」\n\n---\n\n# フィードバック（実行後フェーズ）\n\n竹嶋が結果を書き込んだら、以下の順で返す。\n\n1. 事実の確認：設計書との差分を1〜2行で整理する（美化しない・厳しくしすぎない）\n2. 良かった点：竹嶋の報告から1つだけ。竹嶋の言葉を使う\n3. 次回変えること：1つだけ提案する。2つ以上並べない\n4. 必要なら、確認の質問を1問だけしてよい（結果の記述が薄い場合のみ）\n\n説教しない。一般論を足さない。\n結果が「できなかった」でも責めない。できなかった事実と理由を整理し、実験の設計側を変える提案をする。\n\n---\n\n# Reflect OS 取り込みブロック（フィードバックの最後に必ず付ける）\n\nフィードバックの後、下記の取り込み用ブロックをそのままの形式で1つ出力する。\nラベル名・区切り線を変えないこと。各項目は1行。値の中で改行しない。\n\n実験IDは今回の実験のID。実行日は実行した日（YYYY-MM-DD。「今日」ならその日付）。\n関係者は竹嶋の発言に出た人物名のみカンマ区切り。いなければ空。\n結果は continue / complete / change / pause から1つ（判断材料がなければ continue）。\n\n---REFLECT-IMPORT---\n実験ID：{実験ID}\n実行日：{YYYY-MM-DD}\n使った場面：{1行}\n関係者：{カンマ区切り。いなければ空}\n実際にやったこと：{1行}\n気づき：{1行}\n次回変えること：{1行}\n結果：{continue / complete / change / pause のいずれか1つ}\n---END---\n\n「使った場面・実際にやったこと・気づき・次回変えること」のうち最低1つは必ず埋める（Reflect OS側の保存条件）。\n\n出力後：「この出力全文をコピーして、Reflect OSのLecticaタブ →『📋 貼り付けて取り込む』で記録できます。」と添える。\n\n---\n\n# 禁止事項\n\n* 質問を一度に複数しない\n* 設計フェーズで4問以上質問しない（竹嶋が続けたい場合を除く）\n* 竹嶋が言っていないことを補足しない\n* 「つまり」「本質的には」で意味を広げすぎない\n* フィードバックで改善点を2つ以上並べない\n* 実験のテーマ自体を別のものに差し替えない（場面が合わない場合のみ、場面の変更を1回だけ提案してよい）\n\n---\n\n# 開始時の最初の返答\n\n竹嶋が実験を貼ったら、最初は以下のように返す。\n\n「はい。今日の実験【実験名】を、実行できる形まで一緒に具体化します。まず1つ目の質問です。」\n\nその後、設計に必要な質問を1つだけ行う。\n（使う場面が既に書かれていれば場面は聞かず、「最初の一手」から聞く。）\n";
function lxReadMaster(){try{const r=localStorage.getItem(LX_MASTER_KEY);return r?JSON.parse(r):null;}catch(e){return null;}}
function lxWriteMaster(a){try{localStorage.setItem(LX_MASTER_KEY,JSON.stringify(a));}catch(e){console.warn('lectica master save失敗',e);}}
function lxCopyText(txt,btn){
  const orig=btn?btn.textContent:'';
  const done=function(ok){
    if(!btn)return;
    btn.textContent=ok?'✓ コピーしました':'コピー失敗';
    setTimeout(function(){btn.textContent=orig;},1600);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){done(true);},function(){lxCopyFallback(txt,done);});
  }else{ lxCopyFallback(txt,done); }
}
function lxCopyFallback(txt,done){
  try{
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    const ok=document.execCommand('copy'); document.body.removeChild(ta); done(!!ok);
  }catch(e){ done(false); }
}
function lxReadLogs(){try{const r=localStorage.getItem(LX_LOGS_KEY);return r?JSON.parse(r):[];}catch(e){return [];}}
// 実験中の自動整理：直近14日にログが無い「実験中」を「未着手」に戻す（1日1回）
// 「実験中＝最近実際に回している実験」に意味を保つ。完了・保留は触らない。
function lxAutoRevertStale(){
  const GUARD='lectica_auto_revert_last';
  const today=tod();
  try{ if(localStorage.getItem(GUARD)===today) return 0; }catch(e){}
  const DAYS=14, cutoff=Date.now()-DAYS*86400000;
  const master=lxReadMaster(); if(!Array.isArray(master)||!master.length) return 0;
  const logs=lxReadLogs();
  const lastLog={};
  logs.forEach(l=>{
    if(!l||!l.experimentId||!l.date) return;
    const t=new Date(l.date+'T23:59:59').getTime();
    if(!lastLog[l.experimentId]||t>lastLog[l.experimentId]) lastLog[l.experimentId]=t;
  });
  let n=0;
  master.forEach(e=>{
    if(!e||e.status!=='active') return;
    const touched=Math.max(lastLog[e.id]||0, e.updatedAt?new Date(e.updatedAt).getTime():0);
    if(touched && touched>=cutoff) return;
    e.status='not_started'; e.updatedAt=new Date().toISOString(); n++;
  });
  if(n>0) lxWriteMaster(master);
  try{ localStorage.setItem(GUARD,today); }catch(e){}
  if(n>0&&typeof toast==='function') toast('✦ 14日間ログの無い実験中 '+n+'件を未着手に戻しました');
  return n;
}
function lxWriteLogs(a){try{localStorage.setItem(LX_LOGS_KEY,JSON.stringify(a));}catch(e){console.warn('lectica logs save失敗',e);}}
function lxInit(){
  try{
    const md=_lxB64ToUtf8(LECTICA_MD_B64);
    if(md){try{localStorage.setItem(LX_MD_KEY,md);}catch(e){}}
    let m=lxReadMaster();
    if(!Array.isArray(m)||!m.length){ lxWriteMaster(LECTICA_SEED.map(function(x){return Object.assign({},x);})); return; }
    const have={}; m.forEach(function(x){if(x&&x.id)have[x.id]=x;});
    let changed=false;
    LECTICA_SEED.forEach(function(s){
      const e=have[s.id];
      if(!e){ m.push(Object.assign({},s)); changed=true; return; }
      if(e.title!==s.title||e.description!==s.description||e.completionCondition!==s.completionCondition||e.priority30Days!==s.priority30Days||e.category!==s.category||e.categoryLabel!==s.categoryLabel){
        e.title=s.title;e.description=s.description;e.completionCondition=s.completionCondition;e.priority30Days=s.priority30Days;e.category=s.category;e.categoryLabel=s.categoryLabel;changed=true;
      }
    });
    if(changed) lxWriteMaster(m);
  }catch(e){ console.warn('lxInit失敗',e); }
}

function lxAddShotTask(exp){
  try{
    const arr=JSON.parse(localStorage.getItem('shot-task-os-v1')||'[]');
    const today=tod();
    const dup=arr.some(function(t){return t&&t.dueDate===today&&t.memo&&t.memo.indexOf('実験ID：'+exp.id)>=0;});
    if(dup){ toast('今日のこの実験のShotタスクは既にあります'); return false; }
    const memo='実験ID：'+exp.id+'\nカテゴリ：'+exp.categoryLabel+'\n完了条件：'+exp.completionCondition+'\n使う場面：今日の会議・1on1・意思決定・育成場面で1回使う\n実行後：Reflect OSに実績を記録する';
    const now=new Date().toISOString();
    arr.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:'今日のLectica実験：'+exp.title,category:'Lectica',priority:'normal',status:'todo',dueDate:today,memo:memo,createdAt:now,completedAt:null,updatedAt:now});

    if(exp.status==='not_started')lxSetField(exp.id,'status','active');
    toast('Shotタスクに追加しました');

  }catch(e){ alert('Shot追加エラー: '+e.message); return false; }
}

// 振り返りまとめ末尾の ---REFLECT-IMPORT--- ブロックを解析して1ログ分のオブジェクトを返す
function lxParseImport(text){
  if(!text) return null;
  let body=text;
  const m=text.match(/---REFLECT-IMPORT---([\s\S]*?)(?:---END---|$)/);
  if(m) body=m[1];
  const map={};
  body.split(/\r?\n/).forEach(function(line){
    const mm=line.match(/^\s*([^：:]+)[：:]\s*(.*)$/);
    if(mm){ map[mm[1].trim()]=mm[2].trim(); }
  });
  const get=function(keys){ for(let i=0;i<keys.length;i++){ const k=keys[i]; if(map[k]!==undefined&&map[k]!=='') return map[k]; } return ''; };
  const idRaw=get(['実験ID','実験Id','ID','id']);
  const idM=idRaw.match(/L\d{1,3}/i);
  const resMap={continue:'continue',complete:'complete',change:'change',pause:'pause','継続':'continue','完了':'complete','変更':'change','保留':'pause'};
  const resRaw=get(['結果','result']);
  const result=resMap[resRaw]||resMap[(resRaw||'').toLowerCase()]||'continue';
  const dateRaw=get(['実行日','日付','date']);
  const dateM=dateRaw.match(/\d{4}-\d{2}-\d{2}/);
  return {
    experimentId: idM?idM[0].toUpperCase():'',
    date: dateM?dateM[0]:tod(),
    usedScene: get(['使った場面','使用場面','場面']),
    people: get(['関係者','関わった人','people']),
    actualAction: get(['実際にやったこと','実際に行ったこと','やったこと','actualAction']),
    insight: get(['気づき','学び','今回の学び','insight']),
    nextChange: get(['次回変えること','次に変えること','nextChange']),
    result: result
  };
}

function lxImportSave(master){
  // 戻り値：取り込み成功=true／失敗・キャンセル=false（取り込むタブの自動判別が結果表示に使う）
  try{
    const parsed=lxParseImport(S.lxImport&&S.lxImport.text);
    if(!parsed){ alert('取り込みブロックが見つかりません。---REFLECT-IMPORT--- 〜 ---END--- を含めて貼り付けてください。'); return false; }
    if(!parsed.experimentId){ alert('実験ID（L0xx）が読み取れませんでした。ブロックに「実験ID：L029」の行を入れてください。'); return false; }
    const mas=master||lxReadMaster()||[];
    const exp=mas.find(function(e){return e&&e.id===parsed.experimentId;});
    if(!exp){ alert('実験ID '+parsed.experimentId+' がマスターに見つかりません。IDを確認してください。'); return false; }
    if(!(parsed.usedScene||parsed.insight||parsed.nextChange||parsed.actualAction)){ alert('使った場面・気づき・次回変えること・実際にやったこと のいずれかが必要です。'); return false; }
    const logs=lxReadLogs();
    const dup=logs.some(function(l){return l&&l.experimentId===parsed.experimentId&&l.date===parsed.date&&(l.insight||'')===(parsed.insight||'');});
    if(dup&&!confirm('同じ実験・同じ日・同じ気づきのログが既にあります。それでも取り込みますか？')) return false;
    const now=new Date().toISOString();
    logs.unshift({
      id:'log_'+(parsed.date||tod()).replace(/-/g,'')+'_'+Math.random().toString(36).slice(2,8),
      experimentId:parsed.experimentId,date:parsed.date,source:'import',
      usedScene:parsed.usedScene||'',
      people:(parsed.people||'').split(/[,、，]/).map(function(s){return s.trim();}).filter(Boolean),
      actualAction:parsed.actualAction||'',insight:parsed.insight||'',nextChange:parsed.nextChange||'',
      result:parsed.result||'continue',createdAt:now,updatedAt:now
    });
    lxWriteLogs(logs);
    const stMap={continue:'active',complete:'completed',change:'active',pause:'paused'};
    if(stMap[parsed.result])lxSetField(parsed.experimentId,'status',stMap[parsed.result]);
    S.lxImport=null; toast('取り込みました：'+parsed.experimentId+'（'+parsed.date+'）'); ra(); updateNav();
    return true;
  }catch(e){ alert('取り込みエラー: '+e.message); return false; }
}

  b('完了にする',function(){lxSetField(e.id,'status','completed');ra();});

  if(S.lxForm&&S.lxForm.anchor==='card'&&S.lxForm.experimentId===e.id){ card.appendChild(lxRecordForm(master||lxReadMaster()||[])); }
  return card;
}

    let list=master.slice();

    else if(S.lxFilter==='completed')list=list.filter(function(e){return e.status==='completed';});
    else if(S.lxFilter==='paused')list=list.filter(function(e){return e.status==='paused';});
    else if(S.lxFilter==='priority')list=list.filter(function(e){return e.priority30Days;});
    else if(S.lxFilter==='this_week')list=list.filter(function(e){return e.thisWeek;});
    if(S.lxCat!=='all')list=list.filter(function(e){return e.category===S.lxCat;});
    const q=(S.lxQ||'').trim();
    if(q)list=list.filter(function(e){return (e.title+e.description).indexOf(q)>=0;});
    f.appendChild(D({cls:'sec-lbl',css:'margin-bottom:10px'},'実験（'+list.length+'件）'));

    const wrap=D({});
    list.forEach(function(e){wrap.appendChild(lxCard(e,logs,master));});
    f.appendChild(wrap);
  }catch(err){ f.appendChild(D({cls:'empty'},'Lectica表示エラー: '+err.message)); }
  return f;
}

/* ── 復元ガード（共通仕様：鮮度比較＋直前スナップショット＋アンドゥ。CLAUDE.md参照）── */
const RG_OS = 'reflect-os';
const RG_KEYS = ['reflectOS_v1'];
const RG_SNAP_KEY = 'reflect-os_pre_restore_snapshot';

// 主データ(logs)から {latest, count} を機械判定
function rgStat(logs) {
  const a = Array.isArray(logs) ? logs : [];
  let latest = '';
  a.forEach(r => { if (r && r.date && r.date > latest) latest = r.date; });
  return { latest: latest || '—', count: a.length };
}

// 鮮度比較ダイアログ。巻き戻り時は赤字警告＋「巻き戻す」の入力を要求。resolve(true)で続行
// extra: {detailHtml: 追加表示, rollback: 判定の上書き}（統合復元など向け・省略可）
function rgConfirm(inc, cur, label, extra) {
  extra = extra || {};
  return new Promise(resolve => {
    const rollback = (typeof extra.rollback === 'boolean') ? extra.rollback
      : (cur.latest !== '—' && (inc.latest === '—' || inc.latest < cur.latest || inc.count < cur.count));
    const ov = document.createElement('div');
    ov.id = 'rgConfirmOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#1a1a22;border-radius:10px;max-width:440px;width:100%;padding:20px;font-size:14px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.25);';
    let html = '<div style="font-weight:700;margin-bottom:10px;">' + label + '</div>'
      + '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;">'
      + '読み込むデータ：最新 <b>' + inc.latest + '</b>・' + inc.count + '件<br>'
      + '現在のデータ　：最新 <b>' + cur.latest + '</b>・' + cur.count + '件</div>';
    if (extra.detailHtml) {
      html += '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;max-height:180px;overflow-y:auto;font-size:12px;line-height:1.8;">' + extra.detailHtml + '</div>';
    }
    if (rollback) {
      html += '<div id="rgRollbackWarn" style="color:#d31f2c;font-weight:700;margin-bottom:8px;">⚠ 巻き戻りが発生します（読み込むデータの方が古い／少ない）</div>'
        + '<div style="margin-bottom:6px;">続けるには「巻き戻す」と入力してください：</div>'
        + '<input id="rgWord" type="text" autocomplete="off" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px;font-size:14px;box-sizing:border-box;">';
    } else {
      html += '<div style="margin-bottom:12px;">現在のデータは上書きされます（直前の状態は自動退避されます）。</div>';
    }
    html += '<div style="display:flex;gap:8px;justify-content:flex-end;">'
      + '<button id="rgCancel" style="padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a22;cursor:pointer;">キャンセル</button>'
      + '<button id="rgOk" style="padding:8px 16px;border:none;border-radius:6px;background:' + (rollback ? '#d31f2c' : '#5b51d8') + ';color:#fff;cursor:pointer;">' + (rollback ? '巻き戻して復元' : '復元する') + '</button></div>';
    box.innerHTML = html;
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('#rgCancel').onclick = () => done(false);
    box.querySelector('#rgOk').onclick = () => {
      if (rollback) {
        const w = box.querySelector('#rgWord');
        if (w.value.trim() !== '巻き戻す') { w.style.borderColor = '#d31f2c'; w.focus(); return; }
      }
      done(true);
    };
  });
}

// 復元直前の状態をlocalStorage退避（1世代）＋JSON自動ダウンロード
function rgSnapshot() {
  const snap = { os: RG_OS, savedAt: new Date().toISOString(), data: {} };
  RG_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) snap.data[k] = v; });
  try { localStorage.setItem(RG_SNAP_KEY, JSON.stringify(snap)); } catch(e) {}
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' }));
    a.download = RG_OS + '-pre-restore-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {}
}

function rgShowUndo() {
  if (document.getElementById('rgUndoBtn')) return;
  const b = document.createElement('button');
  b.id = 'rgUndoBtn';
  b.textContent = '↩ 復元前に戻す';
  b.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99998;padding:10px 18px;border:none;border-radius:999px;background:#1a1a22;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);';
  b.onclick = rgUndo;
  document.body.appendChild(b);
}

function rgUndo() {
  try {
    const snap = JSON.parse(localStorage.getItem(RG_SNAP_KEY) || 'null');
    if (!snap || !snap.data) { alert('復元前スナップショットが見つかりません'); return; }
    if (!confirm('復元前（' + (snap.savedAt || '').slice(0, 16).replace('T', ' ') + '）の状態に戻します。よろしいですか？')) return;
    RG_KEYS.forEach(k => { if (k in snap.data) localStorage.setItem(k, snap.data[k]); else localStorage.removeItem(k); });
    location.reload();
  } catch(e) { alert('戻せませんでした: ' + e.message); }
}

/* ── Project OS 同期 ── */
const POS_STATUS_MAP={'進行中':'実行中','構想中':'構想中','保留':'保留','完了':'完了','中止':'完了'};
async function syncFromProjectOS(){
  try{
    const raw=localStorage.getItem('pos_v4');
    if(!raw){console.warn('pos_v4 not found');return -1;}
    const pos=JSON.parse(raw);
    const projects=(pos.projects||[]).filter(p=>p.name);
    const existing=await dball('themes');
    let added=0;
    for(const p of projects){
      const syncId='pos_'+p.id;
      const already=existing.find(t=>t.id===syncId);
      const mapped={
        id:syncId,
        title:p.name,
        status:POS_STATUS_MAP[p.status]||'構想中',
        priority:p.priority==='高'?'A':p.priority==='中'?'B':'C',
        goal:p.goal||'',
        summary:p.goal||(p.nextAction||'').slice(0,60)||'',
        createdAt:tod(),
        updatedAt:tod(),
        _fromProjectOS:true
      };
      if(!already){await dbput('themes',mapped);added++;}
      else if(already.title!==p.name||already.status!==mapped.status){
        await dbput('themes',{...already,...mapped,updatedAt:tod()});
      }
    }
    // 削除されたプロジェクトを非表示に（completedに移動）
    const posIds=new Set(projects.map(p=>'pos_'+p.id));
    for(const t of existing.filter(t=>t._fromProjectOS&&!posIds.has(t.id))){
      await dbput('themes',{...t,status:'完了',updatedAt:tod()});
    }
    return added;
  }catch(e){console.warn('Project OS sync error:',e);return 0;}
}

}
// ナビボタンクリック時にモバイルではサイドバーを閉じる
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.nb').forEach(btn=>{
    btn.addEventListener('click',()=>{ if(window.innerWidth<=640) closeSidebar(); });
  });
});

async function boot(){
  try{const v=await dbget('settings','vision');if(v?.value)S.vision=v.value;}catch(e){}
  try{
    await syncFromProjectOS();
    const priOrd={S:0,A:1,B:2,C:3};
    const th=await dball('themes');
    S.themes=th.sort((a,b)=>(priOrd[a.priority]||9)-(priOrd[b.priority]||9));
    const lg=await dball('logs');
    S.logs=lg.sort((a,b)=>b.date.localeCompare(a.date));
    const chks=await dball('checks');
    chks.forEach(c=>{S.checks[c.id]=c.state||(c.done?'done':'todo');});
  }catch(e){console.warn(e);}
  renderV26();ra();updateNav();
}
boot();
