    [['','既定の順'],['count','実施回数順']].forEach(function(p){so.appendChild(Opt(p[0],p[1],(S.lxSort||'')===p[0]));});
    so.addEventListener('change',function(){S.lxSort=so.value;ra();});
    lh.appendChild(so);
    f.appendChild(lh);
    if(!list.length){f.appendChild(D({cls:'empty'},'該当する実験がありません'));return f;}
    const wrap=D({});
    list.forEach(function(e){wrap.appendChild(lxCard(e,logs,master));});
    f.appendChild(wrap);
  }catch(err){ f.appendChild(D({cls:'empty'},'Lectica表示エラー: '+err.message)); }
  return f;
}


/* ══ 探求ボード（Phase 1）══
   問い(questions)・実験(experiments)を独立IDのデータとして管理する。
   保存先は reflectOS_v1 内の新配列（既存 logs/themes/checks/settings は無改変）。
   Phase 1 = 移行前スナップショット／冪等移行／重点・候補・完了タブ／3件制限＋入れ替えモーダル。
   編集・統合・実験追加・振り返りは Phase 2、実践原則タブ・ホーム変更・新規動線接続は Phase 3。 */
const TK_QST={candidate:'候補',focus:'重点',resolved:'解消',discarded:'破棄',merged:'統合済み',stored:'保管'};
const TK_EST={candidate:'候補',active:'実験中',review:'振り返り待ち',complete:'完了',changed:'変更',paused:'保留',discarded:'やらない',principled:'原則化',merged:'統合済み',stored:'保管'};
/* 保管（stored）：テーマ・問いにつながっていなくてよい。候補の一覧・本数・上限・reflect_focus_v1・Task OS の要約に入れない。
   探求ボードの末尾の折りたたみ「保管」にだけ出る。戻すときはいったん候補へ */
const TK_FROM_STORED='保管から重点・実験中へは直接できません（いったん候補に戻してください）';
const TK_ST_CSS={focus:'background:var(--go-lt);color:var(--go)',active:'background:var(--go-lt);color:var(--go)',candidate:'background:#f0f0f0;color:#707070',review:'background:#fdf8e8;color:#8a7020',complete:'background:#eef2f8;color:#4a6a9a',resolved:'background:#eef2f8;color:#4a6a9a',changed:'background:#eef2f8;color:#4a6a9a',paused:'background:#f0f0f0;color:#909090',discarded:'background:#faf0f0;color:#b05050',merged:'background:#f0f0f0;color:#909090',stored:'background:#f0f0f0;color:#909090',principled:'background:#f4f1fa;color:#5a4a8a'};
const tkStBadge=(st,dict)=>Sp({cls:'tk-st',css:TK_ST_CSS[st]||'background:#f0f0f0;color:#707070'},dict[st]||st);
/* 検証日/期限が14日以内なら「あと N日」を事実表示（催促トーンにしない） */
function tkDueSoon(x){
  if(!x||!x.deadline)return null;
  const d=Math.round((new Date(x.deadline)-new Date(tod()))/864e5);
  return (d>=0&&d<=14)?{days:d,date:x.deadline}:null;
}
const tkFocusQs=()=>S.questions.filter(q=>q.status==='focus');
/* 追補J：R系ID自動割当＋旧フィールド移行（冪等）。
   ①過去にextIdで保存されたデータをridへ引き継ぐ ②Cowork採番と確定対応のタイトルにridを付与。
   タイトル完全一致・rid未設定・そのridが未使用のときだけ。手動設定（編集フォーム）が常に優先。 */
async function tkAutoAssignRids(){
  for(const x of S.experiments){let ch=false;if(x&&x.extId&&!x.rid){x.rid=String(x.extId).toUpperCase();delete x.extId;ch=true;}if(ch)await tkSave('experiments',x);}
  const map={'R001':'問いを一緒に開き、自分も一手動く','R002':'未来接続型の対話を行う','R003':'問題を構造で捉える'};
  for(const rid in map){
    if(S.experiments.some(x=>x&&(x.rid||'').toUpperCase()===rid))continue;
    const x=S.experiments.find(x=>x&&!x.rid&&(x.title||'').trim()===map[rid]);
    if(x){x.rid=rid;await tkSave('experiments',x);}
  }
}
const tkActiveEs=()=>S.experiments.filter(x=>x.status==='active');
const tkThemeNames=ids=>(ids||[]).map(id=>{const t=S.themes.find(t=>t.id===id);return t&&!t.detached?t.title:'';}).filter(Boolean);   /* 外したテーマは出さない（PJは links のチップに出る） */
const tkSrcLog=o=>{const r=S.logs.find(l=>(o.sourceLogIds||[]).includes(l.id));return r?(r.date+' / '+(r.title||'')):'';};

/* 記録（notes・REFLECT-UPDATE で追記）：新しい順・最大3件を薄く。無ければ出さない */
function tkNotesEl(o){
  const ns=(o&&Array.isArray(o.notes))?o.notes.slice(-3).reverse():[];
  if(!ns.length) return null;
  const w=D({cls:'tk-notes'});
  ns.forEach(n=>w.appendChild(D({},String(n.date||'').slice(5).replace('-','/')+' '+(n.kind?n.kind+'｜':'')+(n.text||''))));
  return w;
}
/* ══ R番号（rid）の自動付与（2026-11-03 本人決定）══
   実験中（active）になった時点で rid が無ければ「次の番号」を付ける。次の番号＝全実験（どの状態も）の rid と
   formerRid の R に続く数字の最大＋1（3桁ゼロ埋め・R999 の次は R1000）。一度付いた番号は消さず、使い回さない。手で付けた番号が優先。
   tkSave を通る保存すべて（画面・振り返り・REFLECT-UPDATE・統合・問いを選んで実験中）で付く。起動時の一括（rfRidOnce）が終わるまでは付けない */
function tkNextRid(){
  let mx=0;
  S.experiments.forEach(x=>[x&&x.rid,x&&x.formerRid].forEach(v=>{const m=/^R(\d+)$/i.exec(String(v||'').trim());if(m)mx=Math.max(mx,+m[1]);}));
  return 'R'+String(mx+1).padStart(3,'0');
}
/* 付けたら番号を返す（付けなければ ''） */
function tkAutoRid(x){
  if(!S._ridReady||!x||x.status!=='active'||x.rid) return '';
  x.rid=tkNextRid();
  return x.rid;
}
async function tkSave(store,rec){const nr=store==='experiments'?tkAutoRid(rec):'';if(nr&&!S._ridQuiet)setTimeout(()=>toast(nr+' を付けました'),0);rec.updatedAt=new Date().toISOString();await dbput(store,rec);const arr=store==='questions'?S.questions:store==='experiments'?S.experiments:S.principles;const i=arr.findIndex(x=>x.id===rec.id);if(i>=0)arr[i]=rec;else arr.push(rec);if(store==='questions'||store==='experiments')tkMirrorFocus();}

/* ── 重点スナップショットをlocalStorageへミラー（Task OS HOME表示用の読み取り専用の写し）──
   Reflect本体はIndexedDBでTask OSから読めないため、重点の問い＋実験中だけを reflect_focus_v1 に書く。
   書き込みタイミング：boot完了時＋tkSave('questions'/'experiments')後。 */
function tkMirrorFocus(){
  try{
    const acts=tkActiveEs();   /* active */
    const fq=tkFocusQs();      /* status==='focus'（上限は TK_MAX_FOCUS_Q） */
    const fqIds=new Set(fq.map(q=>q.id));
    const lite=x=>({id:x.id,title:x.title,scene:x.scene||''});
    localStorage.setItem('reflect_focus_v1',JSON.stringify({
      updatedAt:new Date().toISOString(),
      focusQuestions:fq.map(q=>({id:q.id,title:q.title,experiments:acts.filter(x=>x.questionId===q.id).map(lite)})),
      unlinkedExperiments:acts.filter(x=>!x.questionId||!fqIds.has(x.questionId)).map(lite),
      themes:rfPickThemes().map(t=>({id:t.id,title:t.title,priority:t.priority||''}))   /* Task OS の月の1問が読む */
    }));
  }catch(e){console.warn('reflect_focus_v1 mirror失敗',e);}   /* 失敗してもUIは止めない */
}

const TK_MAX_FOCUS_Q = 3;   /* 重点の問いの上限（変更なし） */
const TK_MAX_ACTIVE_PER_Q = 5;  /* 実験中（探求）の上限＝重点の問い1本につき5本（2026-11-03） */
const tkActiveOf=qid=>tkActiveEs().filter(x=>x.questionId===qid);
/* 実験 x を（つなぎ先 qid で）新しく実験中にできるか。できなければ理由。
   重点でない問い・つながっていない実験は新しく実験中にできない。freed＝統合で空く実験（数から除く） */
function tkActiveWhy(x,qid,freed){
  const q=qid?S.questions.find(z=>z&&z.id===qid):null;
  if(!q||q.status!=='focus') return '重点の問いにつないでから実験中にできます';
  const skip=new Set([(x&&x.id)||''].concat((freed||[]).map(o=>o.id)));
  if(tkActiveOf(q.id).filter(o=>!skip.has(o.id)).length>=TK_MAX_ACTIVE_PER_Q) return '重点の問い『'+rfShort(q.title)+'』の実験中が'+TK_MAX_ACTIVE_PER_Q+'本のため入れ替えが必要です（どれを候補へ戻すか本人が決める）';
  return '';
}

/* 状態変更。focus/active への昇格は上限つき（重点 TK_MAX_FOCUS_Q／実験中は重点の問いごとに TK_MAX_ACTIVE_PER_Q。満杯なら入れ替えモーダル） */
async function tkSetQStatus(q,st){
  if(st==='focus'&&q.status!=='focus'&&tkFocusQs().length>=TK_MAX_FOCUS_Q){
    tkSwapModal('q',async backId=>{const back=S.questions.find(x=>x.id===backId);if(back){back.status='candidate';back.completedAt=null;await tkSave('questions',back);}q.status='focus';q.completedAt=null;await tkSave('questions',q);ra();});
    return;
  }
  q.status=st;q.completedAt=(st==='resolved'||st==='discarded')?tod():null;await tkSave('questions',q);ra();
}
/* 実験を完了にするときの学び（空では完了にしない。既に完了している実験はさかのぼらない） */
const TK_NO_LEARNING='（学びなし）';
const tkHasLearning=x=>!!String((x&&x.learning)||'').trim();
const tkLearningText=x=>(tkHasLearning(x)&&x.learning!==TK_NO_LEARNING)?x.learning:'';   /* 表示や原則の下書きに使う本文（「学びなし」を除く） */
/* 学びを1行もらう。返り値：本文／TK_NO_LEARNING／null（やめる） */
function tkAskLearning(x){
  return new Promise(res=>{
    const m=tkModal('学びを1行',x.title);
    const inp=tkFld(m.box,'この実験から学んだこと',In({type:'text',css:'width:100%;box-sizing:border-box'}));
    const done=v=>{m.close();res(v);};
    const row=D({css:'display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:14px'});
    const cancel=Bt({cls:'btn-s'},'やめる');cancel.addEventListener('click',()=>done(null));
    const none=Bt({cls:'btn-s'},'学びなし');none.addEventListener('click',()=>done(TK_NO_LEARNING));
    const ok=Bt({cls:'btn-g'},'完了にする');ok.addEventListener('click',()=>{const v=inp.value.trim();if(!v){inp.focus();return;}done(v);});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)ok.click();});
    row.appendChild(cancel);row.appendChild(none);row.appendChild(ok);m.box.appendChild(row);
    inp.focus();
  });
}
async function tkSetEStatus(x,st){
  if(st==='complete'&&x.status!=='complete'&&!tkHasLearning(x)){const v=await tkAskLearning(x);if(v===null)return;x.learning=v;}
  /* 実験中にできるのは重点の問いにつながる実験だけ・その問いごとに上限 */
  if(st==='active'&&x.status!=='active'){
    const q=x.questionId?S.questions.find(z=>z&&z.id===x.questionId):null;
    if(!q||q.status!=='focus'){ tkPickFocusModal(x); return; }   /* 重点の問いを選んでから実験中に */
    if(tkActiveWhy(x,q.id)){
      tkSwapModal('e',async backId=>{const back=S.experiments.find(b=>b.id===backId);if(back){back.status='candidate';back.completedAt=null;await tkSave('experiments',back);}x.status='active';x.completedAt=null;await tkSave('experiments',x);ra();},{items:tkActiveOf(q.id),title:'重点の問い『'+rfShort(q.title)+'』の実験中は最大'+TK_MAX_ACTIVE_PER_Q+'件です'});
      return;
    }
  }
  x.status=st;x.completedAt=(st==='complete'||st==='discarded'||st==='changed'||st==='paused')?tod():null;await tkSave('experiments',x);ra();
}
/* 実験中にしたい実験のつなぎ先が重点の問いでないとき：その場で重点の問いを選ぶ（選んだらつないで、もう一度判定） */
function tkPickFocusModal(x){
  const fq=tkFocusQs();
  if(!fq.length){alert('重点の問いにつないでから実験中にできます（重点の問いがまだありません）');return;}
  const m=tkModal('重点の問いを選ぶ','重点の問いにつないでから実験中にできます。この実験をつなぐ重点の問いを選んでください。');
  let sel=null;const rows=D({});
  fq.forEach(q=>{const n=tkActiveOf(q.id).length;const lb=h('label',{css:'display:flex;gap:8px;align-items:flex-start;padding:7px 4px;min-height:44px;box-sizing:border-box;cursor:pointer'});const rd=In({type:'radio',name:'tkpickfq',css:'margin-top:4px;width:auto;flex-shrink:0;padding:0'});rd.addEventListener('change',()=>sel=q.id);lb.appendChild(rd);lb.appendChild(Sp({css:'font-size:14px;flex:1;min-width:0'},q.title+'（実験中 '+n+' / '+TK_MAX_ACTIVE_PER_Q+'）'));rows.appendChild(lb);});
  m.box.appendChild(rows);
  m.btns('つないで実験中にする',async()=>{if(!sel)return;m.close();x.questionId=sel;await tkSave('experiments',x);await tkSetEStatus(x,'active');});
}

/* 上限の入れ替えモーダル（重点 TK_MAX_FOCUS_Q／実験中は重点の問いごと）：現在の枠から候補へ戻す1件を選ばせる。opt.items／opt.title で枠と見出しを渡す */
function tkSwapModal(kind,onSwap,opt){
  const items=(opt&&opt.items)||(kind==='q'?tkFocusQs():tkActiveEs());
  const ov=D({css:'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px'});
  const box=D({css:'background:#fff;color:var(--tx);border-radius:10px;max-width:440px;width:100%;padding:20px;font-size:14px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.25)'});
  box.appendChild(D({css:'font-weight:700;margin-bottom:8px'},kind==='q'?'重点の問いは最大'+TK_MAX_FOCUS_Q+'件です':((opt&&opt.title)||'実験中は重点の問い1本につき最大'+TK_MAX_ACTIVE_PER_Q+'件です')));
  box.appendChild(D({css:'font-size:13px;color:var(--mu);margin-bottom:12px'},kind==='q'?'新しい問いを重点化するには、現在の重点から1件を候補へ戻してください。':'新しい実験を実験中にするには、現在の実験中から1件を候補へ戻してください。'));
  let sel=null;const rows=D({css:'max-height:70vh;overflow-y:auto'});
  /* ラジオは共通CSSの input{width:100%} を打ち消す（題名が1文字ずつ折り返されないように）。行は44pxタップ領域 */
  items.forEach(it=>{const lb=h('label',{css:'display:flex;gap:8px;align-items:flex-start;padding:7px 4px;min-height:44px;box-sizing:border-box;cursor:pointer;border-radius:6px'});const rd=In({type:'radio',name:'tkswap',css:'margin-top:4px;width:auto;flex-shrink:0;padding:0'});rd.addEventListener('change',()=>sel=it.id);lb.appendChild(rd);lb.appendChild(Sp({css:'font-size:14px;flex:1;min-width:0'},it.title));rows.appendChild(lb);});
  box.appendChild(rows);
  const btns=D({css:'display:flex;gap:8px;justify-content:flex-end;margin-top:14px'});
  const cancel=Bt({cls:'btn-s'},'キャンセル');cancel.addEventListener('click',()=>ov.remove());
  const okB=Bt({cls:'btn-g'},'入れ替える');okB.addEventListener('click',()=>{if(!sel)return;ov.remove();onSwap(sel);});
  btns.appendChild(cancel);btns.appendChild(okB);box.appendChild(btns);

}

/* ══ Phase 2：統合（merged履歴）・整理モード・実験の追加/振り返り ══ */
/* 汎用モーダル */
function tkModal(title,desc){
  const ov=D({css:'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px'});
  const box=D({css:'background:#fff;color:var(--tx);border-radius:10px;max-width:520px;width:100%;padding:20px;font-size:14px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:88vh;overflow-y:auto'});
  box.appendChild(D({css:'font-weight:700;margin-bottom:8px'},title));
  if(desc)box.appendChild(D({css:'font-size:13px;color:var(--mu);margin-bottom:12px'},desc));
  ov.appendChild(box);document.body.appendChild(ov);
  return {box,close:()=>ov.remove(),
    btns(okLabel,onOk){const b=D({css:'display:flex;gap:8px;justify-content:flex-end;margin-top:14px'});const c=Bt({cls:'btn-s'},'キャンセル');c.addEventListener('click',()=>ov.remove());const o=Bt({cls:'btn-g'},okLabel);o.addEventListener('click',onOk);b.appendChild(c);b.appendChild(o);box.appendChild(b);}};
}
const tkTa=(ph,mh)=>Ta({placeholder:ph||'',css:'width:100%;min-height:'+(mh||56)+'px;box-sizing:border-box;font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);resize:vertical'});
function tkFld(box,label,el,req){const w=D({css:'margin-bottom:10px'});w.appendChild(D({css:'font-size:12px;color:var(--mu);margin-bottom:3px'},label+(req?'（必須）':'')));w.appendChild(el);box.appendChild(w);return el;}
function tkRadioRow(opts,def,onSel){const rw=D({css:'display:flex;gap:12px;flex-wrap:wrap;margin-top:2px'});const nm='tkr'+uid();opts.forEach(([v,l])=>{const lb=h('label',{css:'display:flex;gap:4px;align-items:center;cursor:pointer;font-size:13px;min-height:44px'});const rd=In({type:'radio',name:nm,css:'width:auto;flex-shrink:0;padding:0'});   /* 共通CSSの input{width:100%} を打ち消す（ラベルが縦に折れないように） */if(v===def)rd.checked=true;rd.addEventListener('change',()=>onSel(v));lb.appendChild(rd);lb.appendChild(Sp({},l));rw.appendChild(lb);});return rw;}

/* 実験の追加（qあり＝その問いに紐づけ／q無し新規＝フリー追加：問い選択・テーマ選択が出る）／編集（existingあり） */
function tkExpForm(q,existing){
  const m=tkModal(existing?'実験を編集':'実験を追加',
    q?('問い：'+q.title):(existing&&existing.questionId?('問い：'+(S.questions.find(x=>x.id===existing.questionId)?.title||'')):''));
  const L={title:'実験内容',ph:'「〜してみる」で書く',scene:'使う場面',obs:'観察すること',dl:'期限'};
  const ti=tkFld(m.box,L.title,tkTa(L.ph,56),true);ti.value=existing?existing.title:'';
  /* フリー追加（問い未指定の新規）のみ：紐づける問い・テーマの選択（どちらも任意） */
  let qSel=null,thSel=null;
  if(!existing&&!q){
    qSel=Sel({css:'width:100%;font-size:13px;padding:7px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)'});
    qSel.appendChild(Opt('','（問い未設定のまま追加）'));
    S.questions.filter(x=>x.status==='focus'||x.status==='candidate')
      .sort((a,b)=>(a.status==='focus'?0:1)-(b.status==='focus'?0:1))
      .forEach(x=>qSel.appendChild(Opt(x.id,(x.status==='focus'?'【重点】':'')+x.title)));
    tkFld(m.box,'紐づける問い（任意）',qSel);
    thSel=Sel({css:'width:100%;font-size:13px;padding:7px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)'});
    thSel.appendChild(Opt('','テーマなし'));
    rfPickThemes().forEach(t=>thSel.appendChild(Opt(t.id,t.title)));
    tkFld(m.box,'探求テーマ（任意）',thSel);
  }
  const sc=tkFld(m.box,L.scene+'（実験中にする場合は必須）',tkTa('',44));sc.value=existing?.scene||'';
  const ob=tkFld(m.box,L.obs+'（実験中にする場合は必須）',tkTa('',44));ob.value=existing?.observation||'';
  const dl=tkFld(m.box,L.dl+'（実験中にする場合は必須）',In({type:'date',css:'padding:7px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font-family:inherit'}));dl.value=existing?.deadline||'';
  const nt=tkFld(m.box,'補足・完了条件',tkTa('任意',40));nt.value=existing?.note||'';
  /* R系ID（Cowork統合棚卸しの採番）。設定するとLecticaタブの取り込み（実験ID/関連実験）と連動して実践回数・更新日が動く */
  const exI=In({type:'text',placeholder:'例：R001（Cowork棚卸しの採番と一致させる）',css:'width:100%;font-size:13px;padding:7px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font-family:inherit'});exI.value=existing?.rid||'';tkFld(m.box,'実験ID（R系・任意）',exI);
  let asActive=false;
  if(!existing)tkFld(m.box,'登録先',tkRadioRow([['candidate','候補として保存'],['active','実験中にする']],'candidate',v=>asActive=(v==='active')));
  m.btns(existing?'更新':'保存',async()=>{
    const title=ti.value.trim();
    if(!title){alert('実験内容を入力してください');return;}
    if(asActive&&(!sc.value.trim()||!ob.value.trim()||!dl.value)){
      alert('実験中にするには「'+L.scene+'」「'+L.obs+'」「'+L.dl+'」の入力が必要です');return;
    }
    let rid='';
    {const v=exI.value.trim().toUpperCase();
      if(v&&!/^R\d{1,3}$/.test(v)){alert('実験IDは R001 のような形式で入力してください（空欄も可）');return;}
      if(v&&S.experiments.some(b=>b&&b.id!==(existing&&existing.id)&&(b.rid||'').toUpperCase()===v)){alert('実験ID '+v+' は他の実験に設定済みです');return;}
      rid=v;}
    if(existing){
      existing.title=title;existing.scene=sc.value.trim();existing.observation=ob.value.trim();existing.deadline=dl.value;existing.note=nt.value.trim();
      if(existing.rid&&existing.rid!==rid&&!existing.formerRid)existing.formerRid=existing.rid;existing.rid=rid;   /* 手で付けた番号が優先。外した番号は使い回さない */
      await tkSave('experiments',existing);m.close();ra();return;
    }
    const linkedQ=(qSel&&qSel.value)?S.questions.find(z=>z.id===qSel.value):q;
    const themeIds=(thSel&&thSel.value)?[thSel.value]:(linkedQ?(linkedQ.themeIds||[]).slice():[]);
    const x={id:uid(),rid,questionId:linkedQ?linkedQ.id:null,title,themeIds,status:'candidate',scene:sc.value.trim(),observation:ob.value.trim(),deadline:dl.value,note:nt.value.trim(),result:'',learning:'',sourceLogIds:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:null};
    await tkSave('experiments',x);m.close();
    if(asActive)await tkSetEStatus(x,'active');else{S._tkTab='candidate';ra();updateNav();}   /* 重点の問いへのつなぎ・上限は tkSetEStatus が担保 */
  });
}

/* 実験の振り返り。内容は既存ログにも1件残す（相互参照：ログidをsourceLogIdsへ追加） */
function tkReviewModal(x){
  const m=tkModal('実験の振り返り','▶ '+x.title);
  const did=tkFld(m.box,'実際にやったこと',tkTa('',50));did.value='';
  const res=tkFld(m.box,'結果',tkTa('',50));res.value='';
  const lrn=tkFld(m.box,'気づき・学び',tkTa('',50));lrn.value='';
  const nxt=tkFld(m.box,'次回変えること',tkTa('「変更」を選ぶと新実験の候補として作成',44));nxt.value='';
  let sel='active';
  tkFld(m.box,'状態',tkRadioRow([['active','継続'],['complete','完了'],['changed','変更'],['paused','保留'],['principled','原則化']],'active',v=>sel=v));
  m.btns('保存',async()=>{
    if(sel==='complete'&&x.status!=='complete'&&!lrn.value.trim()&&!tkHasLearning(x)){
      const v=await tkAskLearning(x);if(v===null)return;
      if(v===TK_NO_LEARNING)x.learning=v;else lrn.value=v;   /* 「学びなし」は振り返りログに書かない */
    }
    if(did.value.trim())x.did=did.value.trim();
    if(res.value.trim())x.result=res.value.trim();
    if(lrn.value.trim())x.learning=lrn.value.trim();
    if(nxt.value.trim())x.nextChange=nxt.value.trim();
    x.status=sel;x.completedAt=(sel==='active')?null:tod();
    /* 振り返りをログにも1件保存（探求サイクルを既存ログ列にも残す） */
    if(did.value.trim()||res.value.trim()||lrn.value.trim()||nxt.value.trim()){
      const parts=[];
      if(did.value.trim())parts.push('やったこと：'+did.value.trim());
      if(res.value.trim())parts.push('結果：'+res.value.trim());
      if(lrn.value.trim())parts.push('学び：'+lrn.value.trim());
      if(nxt.value.trim())parts.push('次回変える：'+nxt.value.trim());
      const entry={id:uid(),type:'note',date:tod(),status:'published',title:('振り返り：'+x.title).slice(0,40),themes:(x.themeIds||[]).slice(),lesson:parts.join('\n')};
      await dbput('logs',entry);S.logs.unshift(entry);S.logs.sort((a,b)=>b.date.localeCompare(a.date));
      x.sourceLogIds=[...new Set([...(x.sourceLogIds||[]),entry.id])];
    }
    await tkSave('experiments',x);
    /* 「変更」＋次回変えること → 変更後の新実験を候補として作成 */
    if(sel==='changed'&&nxt.value.trim()){
      const nx={id:uid(),questionId:x.questionId,title:nxt.value.trim(),themeIds:(x.themeIds||[]).slice(),status:'candidate',scene:x.scene||'',observation:x.observation||'',deadline:'',note:'',result:'',learning:'',sourceLogIds:(x.sourceLogIds||[]).slice(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:null};
      await tkSave('experiments',nx);
      toast('変更後の新実験を候補に作成しました');
    }
    m.close();ra();
    /* 原則化を選んだら実践原則の作成モーダルへ接続（原則名・説明・元実験/問いをプリフィル） */
    if(sel==='principled')tkPrincipleForm(null,{exp:x});
  });
}

/* 実験を問いへ紐づける（単体・一括共用） */
function tkLinkModal(expIds){
  const cand=S.questions.filter(q=>q.status==='focus'||q.status==='candidate')
    .slice().sort((a,b)=>(a.status==='focus'?0:1)-(b.status==='focus'?0:1));
  if(!cand.length){alert('紐づけ先にできる問い（重点・候補）がありません');return;}
  const m=tkModal('問いへ紐づける','紐づけ先の問いを選択（実験 '+expIds.length+'件）');
  let sel=null;const rows=D({});
  cand.forEach(q=>{const lb=h('label',{css:'display:flex;gap:8px;align-items:flex-start;padding:6px 4px;cursor:pointer'});const rd=In({type:'radio',name:'tklink',css:'margin-top:4px'});rd.addEventListener('change',()=>sel=q.id);lb.appendChild(rd);lb.appendChild(Sp({css:'font-size:14px'},(q.status==='focus'?'【重点】':'')+q.title));rows.appendChild(lb);});
  m.box.appendChild(rows);
  m.btns('紐づける',async()=>{if(!sel)return;

    if(acts.length){const tq=S.questions.find(z=>z.id===sel);
      if(!tq||tq.status!=='focus'){alert('実験中の実験は重点の問いにだけつなげます');return;}
      if(tkActiveOf(sel).length+acts.length>TK_MAX_ACTIVE_PER_Q){alert('重点の問い『'+rfShort(tq.title)+'』の実験中が'+TK_MAX_ACTIVE_PER_Q+'本を超えます（先に候補へ戻してください）');return;}}
    for(const id of expIds){const x=S.experiments.find(b=>b.id===id);if(x){x.questionId=sel;await tkSave('experiments',x);}}m.close();tkOrgClear();ra();});
}

/* 問いの統合：新しい問いを作成し、元の問いは status='merged'＋mergedIntoId で履歴に残す。
   元の問いに紐づく実験・ログ・テーマは統合先へ引き継ぐ */
function tkMergeQModal(ids){
  const qs=ids.map(id=>S.questions.find(q=>q.id===id)).filter(Boolean);
  if(qs.length<2){alert('統合する問いを2件以上選択してください');return;}
  const m=tkModal('問いを統合','選択した '+qs.length+'件を1つに束ねます。元の問いは「統合済み」として履歴に残ります。');
  const lst=D({css:'font-size:13px;color:var(--mu);line-height:1.8'});qs.forEach(q=>lst.appendChild(D({},'・'+q.title)));
  tkFld(m.box,'元の問い',lst);
  const ti=tkFld(m.box,'統合後の問い',tkTa('',50),true);ti.value=qs[0].title;
  const hy=tkFld(m.box,'現在の仮説',tkTa('',56));hy.value=qs.map(q=>q.hypothesis).filter(Boolean).join('\n');
  const thSel=tkFld(m.box,'テーマ',tkThemeSelect(tkMergeThemes(qs)));
  let dst=tkMergeStatus(true,qs);   /* 既定は引き継ぎ（統合元に重点があれば重点） */
  tkFld(m.box,'統合後の扱い',tkRadioRow([['candidate','候補にする'],['focus','重点にする']],dst,v=>dst=v));
  m.btns('統合する',async()=>{
    const title=ti.value.trim();if(!title){alert('統合後の問いを入力してください');return;}
    /* 重点は上限 TK_MAX_FOCUS_Q を通す（統合元の重点が空く分は数に入れる）。超えるときは候補で作ってから入れ替え */
    const full=!!rfMergeBlock(true,dst,qs);
    const nq=await tkMergeQuestions(qs,Object.assign({title,hypothesis:hy.value.trim(),status:full?'candidate':dst},tkThemeSelVal(thSel)));
    m.close();tkOrgClear();
    if(full)await tkSetQStatus(nq,'focus');else ra();
  });
}

/* 統合の引き継ぎ：状態は統合元に重点（問い）／実験中（実験。重点の問いにつながり枠があるときだけ）があればそれ、無ければ候補。
   テーマは統合元の themeIds の和から外したテーマを除く */
function tkMergeStatus(isQ,src){
  if(isQ) return src.some(q=>q.status==='focus')?'focus':'candidate';
  /* 実験中の引き継ぎは、新しい実験のつなぎ先が重点の問いで、その問いの実験中が上限未満のときだけ */
  const qid=(src.find(x=>x.questionId)||{}).questionId||null;
  return (src.some(x=>x.status==='active')&&!rfMergeBlock(false,'active',src,qid))?'active':'candidate';
}
const tkMergeThemes=src=>[...new Set(src.flatMap(o=>o.themeIds||[]))].filter(id=>!(S.themes.find(t=>t.id===id)||{}).detached);
/* 統合モーダルのテーマ欄：統合元のテーマ（既定は先頭）→ ほかの生きたテーマ → テーマなし */
function tkThemeSelect(ids){
  const sel=h('select',{css:'width:100%;min-height:44px;box-sizing:border-box;font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx)'});
  const add=(v,l)=>{const op=h('option',{});op.value=v;op.textContent=l;sel.appendChild(op);};
  ids.forEach(id=>{const t=S.themes.find(t=>t.id===id);if(t)add(id,t.title);});
  rfPickThemes().filter(t=>!ids.includes(t.id)).forEach(t=>add(t.id,t.title));
  add('__none','テーマなし');
  sel.value=sel.options[0].value;
  return sel;
}
const tkThemeSelVal=sel=>sel.value==='__none'?{themeIds:[],noTheme:true}:{themeIds:[sel.value],noTheme:false};
/* 問いの統合の保存部分（モーダルと REFLECT-UPDATE の両方から呼ぶ）。元は merged＋mergedIntoId、
   元に紐づく実験は新しい問いへ付け替え。o.hypothesis 省略時は元の仮説を連結。o.status／o.themeIds（＋o.noTheme）省略時は引き継ぎ */
async function tkMergeQuestions(qs,o){
  o=o||{};
  const ids=qs.map(q=>q.id);
  const themeIds=o.themeIds?o.themeIds.slice():tkMergeThemes(qs);
  const hypothesis=o.hypothesis!==undefined?o.hypothesis:qs.map(q=>q.hypothesis).filter(Boolean).join('\n');
  const nq={id:uid(),title:o.title,themeIds,...(o.noTheme?{noTheme:true}:{}),status:o.status||tkMergeStatus(true,qs),hypothesis,sourceLogIds:[...new Set(qs.flatMap(q=>q.sourceLogIds||[]))],mergedIntoId:null,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:null};
  await tkSave('questions',nq);
  for(const q of qs){q.status='merged';q.mergedIntoId=nq.id;q.completedAt=tod();await tkSave('questions',q);}
  for(const x of S.experiments.filter(x=>ids.includes(x.questionId))){x.questionId=nq.id;await tkSave('experiments',x);}
  return nq;
}
/* 実験の統合の保存部分（モーダルと REFLECT-UPDATE の両方から呼ぶ）。questionId は先頭から順に最初に持っているもの（先頭が持っていれば先頭）。
   o.status／o.themeIds（＋o.noTheme）省略時は引き継ぎ */
async function tkMergeExperiments(es,o){
  o=o||{};
  const qid=(es.find(x=>x.questionId)||{}).questionId||null;
  const nx={id:uid(),questionId:qid,title:o.title,themeIds:o.themeIds?o.themeIds.slice():tkMergeThemes(es),...(o.noTheme?{noTheme:true}:{}),status:o.status||tkMergeStatus(false,es),scene:es[0].scene||'',observation:es[0].observation||'',deadline:es[0].deadline||'',note:'',result:'',learning:'',sourceLogIds:[...new Set(es.flatMap(x=>x.sourceLogIds||[]))],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),completedAt:null};
  /* 実験中になるなら、統合元の R番号（実験中のもの優先）の先頭を引き継ぐ。元は formerRid に残す（Lectica の関連実験の数え方を新しい実験へ続ける）。無ければ tkSave が次の番号 */
  let from=null;
  if(nx.status==='active'){from=es.find(x=>x.rid&&x.status==='active')||es.find(x=>x.rid)||null;if(from)nx.rid=from.rid;}
  await tkSave('experiments',nx);
  for(const x of es){if(x===from){x.formerRid=x.rid;delete x.rid;}x.status='merged';x.mergedIntoId=nx.id;x.completedAt=tod();await tkSave('experiments',x);}
  S._ridFrom=from?from.id:null;   /* REFLECT-UPDATE の summary 用（データには残さない） */
  return nx;
}

/* 実験の統合（問いの統合と同型。元は merged で履歴保持） */
function tkMergeEModal(ids){
  const es=ids.map(id=>S.experiments.find(x=>x.id===id)).filter(Boolean);

/* ── 既存ログ→問い/実験の移行（冪等・増分）──
   question/nextExp を行単位で1件化し、checks の状態を引き継ぐ。
   冪等性は sourceCk（既存checksと同じ 'q_<logId>_<行>' キー）単位で担保：
   取り込み済みの行は再生成しない。旧タブで追記された行も次回起動時に拾える。
   既存ログ内の question/nextExp・checks は削除しない（互換維持）。 */
const TK_QMAP={important:'focus',todo:'candidate',done:'resolved',skip:'discarded'};
const TK_EMAP={doing:'active',todo:'candidate',done:'complete',skip:'discarded'};
/* 行頭の箇条書き記号（・ - * • ● ■ ◆ 等）と、番号（「1.」「1)」「1）」「(1)」「（1）」「①」）だけを取る。
   本文の数字（「10月」「1人」「2026/12/20」「1.5倍」）は残す。番号は1〜2桁＋区切り記号のときだけ番号とみなす（「1、」は番号扱いしない） */
const TK_LEAD_RE=/^\s*(?:[・\-‐－–—*＊•●■◆]\s*)*(?:(?:\d{1,2}[.．](?!\d)|\d{1,2}[)）]|[(（]\d{1,2}[)）]|[①-⑳])\s*)?/;
const tkCleanLine=l=>String(l||'').replace(TK_LEAD_RE,'').trim();
/* 旧 tkCleanLine（行頭の数字まで消していた）で作られた問い・実験の題名を、元ログ行から1回だけ直す。
   現在の題名＝旧ロジックの結果（手で直していない）かつ新ロジックと違うときだけ置換。merged・元ログ不明は触らない */
async function tkFixCleanLineTitles(){
  const DONE='reflect_cleanline_fix_done',BK='reflect_backup_cleanline_20261022';
  try{if(localStorage.getItem(DONE))return;}catch(e){return;}
  const old=l=>l.replace(/^[・\-\d\.\)）\s]+/,'').trim();   /* 比較専用 */
  const lineOf=(ck,field)=>{
    const m=/^[qe]_(.+)_(\d+)$/.exec(ck||'');if(!m)return null;
    const r=S.logs.find(x=>x.id===m[1]);if(!r||!r[field])return null;
    return r[field].split(/\n/).filter(l=>l.trim())[+m[2]]??null;   /* tkMigrate と同じ行の数え方 */
  };
  const fixes=[];
  [['questions','question','q_'],['experiments','nextExp','e_']].forEach(([store,field,pre])=>{
    S[store].forEach(it=>{
      if(!it.sourceCk||!it.sourceCk.startsWith(pre)||it.status==='merged')return;
      const line=lineOf(it.sourceCk,field);if(line==null)return;
      const nt=tkCleanLine(line);
      if(nt&&it.title===old(line)&&it.title!==nt)fixes.push([store,it,nt]);
    });
  });
  if(fixes.length){
    try{if(localStorage.getItem(BK)===null){const v=localStorage.getItem('reflectOS_v1');if(v!==null)localStorage.setItem(BK,v);}}catch(e){console.warn('退避失敗のため修復を見送り',e);return;}
    for(const [store,it,nt] of fixes){it.title=nt;await dbput(store,it);}
  }
  try{localStorage.setItem(DONE,new Date().toISOString());}catch(e){}
  if(fixes.length)toast('問い・実験の題名を '+fixes.length+' 件直しました（先頭の数字）');
}
async function tkMigrate(){
  const seenQ=new Set(S.questions.map(q=>q.sourceCk).filter(Boolean));
  const seenE=new Set(S.experiments.map(x=>x.sourceCk).filter(Boolean));
  const pub=S.logs.filter(r=>r.status!=='draft');
  const newQ=[],newE=[];
  /* 振り返りから生まれる問い・実験は下書き（「振り返りから選ぶ」で0〜1本ずつ候補へ）。
     リフレクト見直し担当が置いた分は本人がチャットで選び済みなので候補のまま。旧チェックで状態が付いている行はその状態を保つ */
  const draftOr=(r,st)=>(st==='candidate'&&!/リフレクト見直し/.test(r.importSource||''))?'draft':st;
  pub.forEach(r=>{
    if(r.question?.trim())r.question.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
      const ck='q_'+r.id+'_'+i;if(seenQ.has(ck))return;const title=tkCleanLine(line);if(!title)return;
      const st=draftOr(r,TK_QMAP[S.checks[ck]||'todo']||'candidate');
      newQ.push({id:uid(),title,themeIds:(r.themes||[]).slice(),status:st,hypothesis:'',sourceLogIds:[r.id],sourceCk:ck,mergedIntoId:null,createdAt:r.date||tod(),updatedAt:r.date||tod(),completedAt:(st==='resolved'||st==='discarded')?(r.date||tod()):null});
    });
    if(r.nextExp?.trim())r.nextExp.split(/\n/).filter(l=>l.trim()).forEach((line,i)=>{
      const ck='e_'+r.id+'_'+i;if(seenE.has(ck))return;const title=tkCleanLine(line);if(!title)return;
      const st=draftOr(r,TK_EMAP[S.checks[ck]||'todo']||'candidate');
      newE.push({id:uid(),questionId:null,title,themeIds:(r.themes||[]).slice(),status:st,scene:'',observation:'',deadline:'',result:'',learning:'',sourceLogIds:[r.id],sourceCk:ck,createdAt:r.date||tod(),updatedAt:r.date||tod(),completedAt:(st==='complete'||st==='discarded')?(r.date||tod()):null});
    });
  });
  if(!newQ.length&&!newE.length)return {questionIds:[],experimentIds:[]};
  const first=!(await dbget('settings','tankyuMigrated'));
  if(first)tkSnapshot();   /* 初回のみ、書き込む前に保険を取る */
  for(const q of newQ)await dbput('questions',q);
  for(const x of newE)await dbput('experiments',x);
  S.questions.push(...newQ);S.experiments.push(...newE);
  if(first){
    await dbput('settings',{id:'tankyuMigrated',value:{version:1,at:new Date().toISOString(),questions:newQ.length,experiments:newE.length}});
    toast('探求ボードへ移行：問い'+newQ.length+'件・実験'+newE.length+'件（移行前スナップショットをDLしました）');
  }
  return {questionIds:newQ.map(q=>q.id),experimentIds:newE.map(x=>x.id)};
}

/* ══ 振り返りから選ぶ：下書きの問い・実験をログごとに。問い0〜1・実験0〜1だけ候補へ（残りは draft_dropped。消さない）══ */

/* 週の2択の答え（reflect_stance_v1。Task OS が書く）。答えが無ければ空文字 */
function tkStanceLine(qid){
  let o=null;try{o=JSON.parse(localStorage.getItem('reflect_stance_v1')||'null');}catch(e){}

  ((o&&o.weeks)||[]).forEach(w=>{const a=((w&&w.answers)||[]).find(a=>a&&a.questionId===qid);if(a){all++;if(a.used)used++;}});

function tkQCard(q,expandedDefault){

  const card=D({cls:'tk-qcard'+(q.status==='focus'?' focus':'')});
  const tt=D({cls:'tk-qtitle',css:'display:flex;gap:6px;align-items:flex-start'});

  tt.appendChild(tkStBadge(q.status,TK_QST));
  tt.appendChild(Sp({css:'flex:1'},q.title));
  tt.addEventListener('click',()=>{S._tkOpen[q.id]=!open;ra();});
  card.appendChild(tt);
  if(open){
    const thN=tkThemeNames(q.themeIds);
    if(thN.length)card.appendChild(D({cls:'tk-meta'},'テーマ：'+thN.join('・')));
    if(q.hypothesis)card.appendChild(D({css:'font-size:13px;margin-top:6px;line-height:1.6'},'仮説：'+q.hypothesis));
    { const lk=rfLinkChips(q.links); if(lk) card.appendChild(lk); }   /* 紐づけ（あるときだけ） */
    { const sl=tkStanceLine(q.id); if(sl) card.appendChild(D({cls:'tk-meta'},sl)); }   /* 週の2択の答え（あるときだけ） */
    /* 問いカード内の関連実験 */
    const exps=S.experiments.filter(x=>x.questionId===q.id&&x.status!=='discarded');
    const act=exps.filter(x=>x.status==='active');
    card.appendChild(D({cls:'tk-meta',css:'margin-top:8px'},'実験中 '+act.length+(q.status==='focus'?' / '+TK_MAX_ACTIVE_PER_Q:'件')+(exps.length>act.length?'（他 '+(exps.length-act.length)+'件）':'')));
    exps.forEach(x=>{
      const ec=D({cls:'tk-ecard',css:'display:flex;gap:6px;align-items:flex-start'});
      if(S._tkOrg)ec.appendChild(tkSelBox(S._tkSelE,x.id));
      ec.appendChild(tkStBadge(x.status,TK_EST));
      const eds=tkDueSoon(x);

    if(q.status==='focus')card.appendChild(tkOps(['＋実験を追加',()=>tkExpForm(q)],['編集',()=>tkQEditModal(q)],['候補へ戻す',()=>tkSetQStatus(q,'candidate')],['解消した',()=>tkSetQStatus(q,'resolved')],['保管',()=>tkSetQStatus(q,'stored')],['破棄',()=>tkSetQStatus(q,'discarded'),true]));
    else if(q.status==='candidate')card.appendChild(tkOps(['重点にする',()=>tkSetQStatus(q,'focus')],['＋実験を追加',()=>tkExpForm(q)],['編集',()=>tkQEditModal(q)],['解消した',()=>tkSetQStatus(q,'resolved')],['保管',()=>tkSetQStatus(q,'stored')],['破棄',()=>tkSetQStatus(q,'discarded'),true]));

function tkECard(x){

  if(!x.questionId){const wb=Bt({cls:'tk-warn',css:'cursor:pointer;border:1px solid #d8b0b0;background:#faf0f0'},'⚠ 問い未設定 → 紐づけ');wb.addEventListener('click',e=>{e.stopPropagation();tkLinkModal([x.id]);});tt.appendChild(wb);}

    const ps=lxPracticeStats(x.rid);

  else if(x.status==='active')card.appendChild(tkOps(['振り返る',()=>tkReviewModal(x)],['問いへ紐づける',()=>tkLinkModal([x.id])],['編集',()=>tkExpForm(null,x)],['候補へ戻す',()=>tkSetEStatus(x,'candidate')],['保管',()=>tkSetEStatus(x,'stored')],['やらない',()=>tkSetEStatus(x,'discarded'),true]));

function renderQuestions(){

  addRow.appendChild(addInput);addRow.appendChild(thSel);addRow.appendChild(addBtn);
  f.appendChild(addRow);
  const pub=S.logs.filter(r=>r.status!=='draft'&&r.question?.trim());
  // テーマフィルター
  const qThemes=rfPickThemes();
  let qThFilt='all';

  const qThB={};
  const qAllBtn=Bt({cls:'chip on'},'全テーマ');qThB['all']=qAllBtn;

    const filtered=qThFilt==='all'?pub:pub.filter(r=>(r.themes||[]).includes(qThFilt));
    const activeQCount=filtered.reduce((n,r)=>n+r.question.split(/\n/).filter(l=>l.trim()&&(S.checks['q_'+r.id+'_'+r.question.split(/\n/).filter(l=>l.trim()).indexOf(l)]||'todo')!=='done'&&(S.checks['q_'+r.id+'_'+r.question.split(/\n/).filter(l=>l.trim()).indexOf(l)]||'todo')!=='skip').length,0);
    lbl.textContent='未解決の問い（'+filtered.reduce((n,r)=>n+r.question.split(/\n/).filter((l,i)=>{const st=S.checks['q_'+r.id+'_'+i]||'todo';return l.trim()&&st!=='done'&&st!=='skip';}).length,0)+'件）';
    if(!filtered.length){qWrap.appendChild(D({cls:'empty'},'このテーマの問いはありません'));return;}

/* ── 復元ガード（共通仕様：鮮度比較＋直前スナップショット＋アンドゥ。CLAUDE.md参照）── */
const RG_OS = 'reflect-os';
const RG_KEYS = ['reflectOS_v1'];
const RG_SNAP_KEY = 'reflect-os_pre_restore_snapshot';

// 主データ(logs)から {latest, count} を機械判定
function rgStat(logs) {
  const a = Array.isArray(logs) ? logs : [];
  let latest = '';
  a.forEach(r => { if (r && r.date && r.date > latest) latest = r.date; });
  return { latest: latest || '—', count: a.length };
}

// 鮮度比較ダイアログ。巻き戻り時は赤字警告＋「巻き戻す」の入力を要求。resolve(true)で続行
// extra: {detailHtml: 追加表示, rollback: 判定の上書き}（統合復元など向け・省略可）
function rgConfirm(inc, cur, label, extra) {
  extra = extra || {};
  return new Promise(resolve => {
    const rollback = (typeof extra.rollback === 'boolean') ? extra.rollback
      : (cur.latest !== '—' && (inc.latest === '—' || inc.latest < cur.latest || inc.count < cur.count));
    const ov = document.createElement('div');
    ov.id = 'rgConfirmOverlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;color:#1a1a22;border-radius:10px;max-width:440px;width:100%;padding:20px;font-size:14px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.25);';
    let html = '<div style="font-weight:700;margin-bottom:10px;">' + label + '</div>'
      + '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;">'
      + '読み込むデータ：最新 <b>' + inc.latest + '</b>・' + inc.count + '件<br>'
      + '現在のデータ　：最新 <b>' + cur.latest + '</b>・' + cur.count + '件</div>';
    if (extra.detailHtml) {
      html += '<div style="border:1px solid #ddd;border-radius:8px;padding:10px 12px;margin-bottom:10px;max-height:180px;overflow-y:auto;font-size:12px;line-height:1.8;">' + extra.detailHtml + '</div>';
    }
    if (rollback) {
      html += '<div id="rgRollbackWarn" style="color:#d31f2c;font-weight:700;margin-bottom:8px;">⚠ 巻き戻りが発生します（読み込むデータの方が古い／少ない）</div>'
        + '<div style="margin-bottom:6px;">続けるには「巻き戻す」と入力してください：</div>'
        + '<input id="rgWord" type="text" autocomplete="off" style="width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;margin-bottom:12px;font-size:14px;box-sizing:border-box;">';
    } else {
      html += '<div style="margin-bottom:12px;">現在のデータは上書きされます（直前の状態は自動退避されます）。</div>';
    }
    html += '<div style="display:flex;gap:8px;justify-content:flex-end;">'
      + '<button id="rgCancel" style="padding:8px 16px;border:1px solid #ccc;border-radius:6px;background:#fff;color:#1a1a22;cursor:pointer;">キャンセル</button>'
      + '<button id="rgOk" style="padding:8px 16px;border:none;border-radius:6px;background:' + (rollback ? '#d31f2c' : '#5b51d8') + ';color:#fff;cursor:pointer;">' + (rollback ? '巻き戻して復元' : '復元する') + '</button></div>';
    box.innerHTML = html;
    ov.appendChild(box);
    document.body.appendChild(ov);
    const done = v => { ov.remove(); resolve(v); };
    box.querySelector('#rgCancel').onclick = () => done(false);
    box.querySelector('#rgOk').onclick = () => {
      if (rollback) {
        const w = box.querySelector('#rgWord');
        if (w.value.trim() !== '巻き戻す') { w.style.borderColor = '#d31f2c'; w.focus(); return; }
      }
      done(true);
    };
  });
}

// 復元直前の状態をlocalStorage退避（1世代）＋JSON自動ダウンロード
function rgSnapshot() {
  const snap = { os: RG_OS, savedAt: new Date().toISOString(), data: {} };
  RG_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) snap.data[k] = v; });
  try { localStorage.setItem(RG_SNAP_KEY, JSON.stringify(snap)); } catch(e) {}
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(snap, null, 2)], { type: 'application/json' }));
    a.download = RG_OS + '-pre-restore-' + new Date().toISOString().replace(/[:T]/g, '-').slice(0, 19) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  } catch(e) {}
}

function rgShowUndo() {
  if (document.getElementById('rgUndoBtn')) return;
  const b = document.createElement('button');
  b.id = 'rgUndoBtn';
  b.textContent = '↩ 復元前に戻す';
  b.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:99998;padding:10px 18px;border:none;border-radius:999px;background:#1a1a22;color:#fff;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);';
  b.onclick = rgUndo;
  document.body.appendChild(b);
}

function rgUndo() {
  try {
    const snap = JSON.parse(localStorage.getItem(RG_SNAP_KEY) || 'null');
    if (!snap || !snap.data) { alert('復元前スナップショットが見つかりません'); return; }
    if (!confirm('復元前（' + (snap.savedAt || '').slice(0, 16).replace('T', ' ') + '）の状態に戻します。よろしいですか？')) return;
    RG_KEYS.forEach(k => { if (k in snap.data) localStorage.setItem(k, snap.data[k]); else localStorage.removeItem(k); });
    location.reload();
  } catch(e) { alert('戻せませんでした: ' + e.message); }
}

/* ══ 受信箱 共通部品 v1 ══
   各OSはこのブロックをそのままコピーし、INBOX_OS と（ブロックの外に書く）inboxApply だけ差し替える。
   ・Drive を読むのは Task OS だけ。各OSは localStorage の import_inbox_v1 から自分宛て（targetOS）を取り、
     既存の貼り付けパーサで取り込む（書式は変えない）
   ・inboxApply(block, links, item) は OS ごとに実装し { ok:true, summary } / { ok:false, summary } を返す。
     ok:false は done にしない（保留に残り、次回また試す）
   ・起動時は「自分のデータの読み込みが終わった後」に inboxProcess('load') を呼ぶ（Task OS を経由しなかった日の保険）
   ・Task OS からの合図（postMessage 'myapps-inbox-process'）でも動き、結果を親へ 'myapps-inbox-result' で返す
   ・同じ id は二度と処理しない（import_inbox_done_v1）。未知の行・未知のフィールドは無視 */
const INBOX_OS = 'reflect';                       // このOSの targetOS 名（各OSで差し替える）
const INBOX_KEY='import_inbox_v1', INBOX_DONE='import_inbox_done_v1', INBOX_LOG='import_inbox_log_v1';
const INBOX_DONE_MAX=2000, INBOX_LOG_DAYS=60;
function inboxYmd(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function inboxRead(){ try{ const o=JSON.parse(localStorage.getItem(INBOX_KEY)||'null'); return (o&&Array.isArray(o.items))?o:{items:[]}; }catch(e){ return {items:[]}; } }
function inboxDoneList(){ try{ const a=JSON.parse(localStorage.getItem(INBOX_DONE)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function inboxDoneSet(){ return new Set(inboxDoneList().map(d=>d&&d.id)); }
function inboxLogList(){ try{ const a=JSON.parse(localStorage.getItem(INBOX_LOG)||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
/* 取り込み済みにする：done に追記（新しい順・最大2000）／pending から除く／log に追記（直近60日） */
function inboxMarkDone(item, summary, links){
  const now=new Date();
  const done=inboxDoneList().filter(d=>d&&d.id!==item.id);
  done.unshift({ id:item.id, os:INBOX_OS, doneAt:now.toISOString(), summary:summary||'' });

/* 「紐づけ：」行を読む。書式：紐づけ：S03 ③JSS承継税制／PJ：{id} {名前}／人：{id} {名前}, {id} {名前}／問い：{id}
   ID は英数字（数字を1つ以上含む）。ID が無ければ名前だけ。空のものは入れない。行が無ければ {} */
function inboxParseLinks(block){
  const out={};
  const line=String(block||'').split(/\r?\n/).map(s=>s.trim()).find(s=>/^紐づけ[：:]/.test(s));
  if(!line) return out;
  const isId=s=>/^[A-Za-z0-9_-]*\d[A-Za-z0-9_-]*$/.test(s);
  const idName=s=>{ const t=String(s||'').trim(); if(!t) return null; const m=t.match(/^(\S+)\s+(.+)$/);
    if(m&&isId(m[1])) return {id:m[1], name:m[2].trim()}; return isId(t)&&!/[^\x00-\x7F]/.test(t)&&/^[A-Za-z]/.test(t)&&t.length<=12?{id:t, name:''}:{id:'', name:t}; };
  line.replace(/^紐づけ[：:]\s*/,'').split('／').map(s=>s.trim()).filter(Boolean).forEach(part=>{
    let m;
    if((m=part.match(/^PJ[：:]\s*(.*)$/i))){ const r=idName(m[1]); if(r){ if(r.id) out.projectId=r.id; if(r.name) out.projectName=r.name; } }
    else if((m=part.match(/^人[：:]\s*(.*)$/))){
      const ids=[], names=[];
      m[1].split(/[,、，]/).forEach(p=>{ const r=idName(p); if(!r) return; if(r.id) ids.push(r.id); if(r.name) names.push(r.name); });
      if(ids.length) out.personIds=ids; if(names.length) out.personNames=names;
    }
    else if((m=part.match(/^問い[：:]\s*(\S+)/))){ out.questionId=m[1]; }
    else if((m=part.match(/^(S\d+)\b/))){ out.strategyGoalId=m[1]; }
  });
  return inboxPjName(out);
}
/* PJ の今の名前（Project OS の pos_v4）。引けなければ ''。紐づけの保存・表示はこれを優先（PJ名が変わっても古い名前を残さない） */
function inboxPjNow(id){
  if(!id) return '';
  try{ const o=JSON.parse(localStorage.getItem('pos_v4')||'null'); const p=((o&&o.projects)||[]).find(x=>x&&String(x.id)===String(id)); return (p&&p.name)?String(p.name):''; }catch(e){ return ''; }
}
/* links の projectName を今のPJ名にそろえる（projectId で引けたときだけ。旧名で書かれても今の名前で保存する）。links を返す */

/* 起動時1回：保存している紐づけの旧PJ名を直す（2026-11-03 PJ「3AHD2030構想」→「スリーエーグループ2030構想」・本人決定）。
   keys の localStorage を JSON として読み、どの深さでも「links」キーの値（とその配列）だけを直す＝本文は触らない。
   projectId が s6n9vf1vgdx か projectName が旧名 → projectName を新名に（projectId が無ければ足す）。
   直す前に元の値を {os}_backup_s02rename_20261103 に退避（同名キーがあれば作らない）。済みは {os}_s02rename_20261103_done。
   データを読む前に呼ぶ（関数宣言なので共通部品より前の行からも呼べる）。返り値：直した件数 */
function inboxPjRenameOnce(os, keys){
  const FLAG=os+'_s02rename_20261103_done', BK=os+'_backup_s02rename_20261103';
  const ID='s6n9vf1vgdx', OLD='3AHD2030構想', NEW='スリーエーグループ2030構想';
  try{ if(localStorage.getItem(FLAG)) return 0; }catch(e){ return 0; }
  let n=0;
  const fix=l=>{ if(!l||typeof l!=='object'||Array.isArray(l)) return; if(l.projectId!==ID&&l.projectName!==OLD) return;
    let ch=false; if(l.projectName!==NEW){ l.projectName=NEW; ch=true; } if(!l.projectId){ l.projectId=ID; ch=true; } if(ch) n++; };
  const walk=v=>{ if(Array.isArray(v)){ v.forEach(walk); return; } if(!v||typeof v!=='object') return;
    for(const k in v){ if(k==='links') (Array.isArray(v[k])?v[k]:[v[k]]).forEach(fix); walk(v[k]); } };
  const out={}, raw={};
  (keys||[]).forEach(k=>{ let s=null; try{ s=localStorage.getItem(k); }catch(e){} if(s===null) return; let o; try{ o=JSON.parse(s); }catch(e){ return; }
    const before=n; walk(o); if(n>before){ out[k]=JSON.stringify(o); raw[k]=s; } });
  if(n){
    try{ if(localStorage.getItem(BK)===null) localStorage.setItem(BK, JSON.stringify(raw)); }catch(e){ console.warn('['+os+'] 退避できないため旧PJ名の直しを見送り（次回また試す）',e); return 0; }
    try{ for(const k in out) localStorage.setItem(k,out[k]); }catch(e){ console.warn('['+os+'] 旧PJ名の直しの保存に失敗',e); return 0; }
    console.log('['+os+'] 紐づけの旧PJ名を '+n+'件 直しました');
  }
  try{ localStorage.setItem(FLAG,new Date().toISOString()); }catch(e){}
  return n;
}
/* 自分宛ての未処理を取り込む。重なって呼ばれても順番に1回ずつ（同じ item を二重に取り込まない） */
let _inboxChain=Promise.resolve();
function inboxProcess(trigger){
  const run=async()=>{
    const box=inboxRead(); const done=inboxDoneSet();
    const mine=(box.items||[]).filter(it=>it&&it.id&&it.targetOS===INBOX_OS&&!done.has(it.id));
    const results=[];
    for(const it of mine){
      try{
        if(inboxDoneSet().has(it.id)) continue;
        const links=inboxPjName(Object.assign({}, inboxParseLinks(it.block||''), it.links||{}));   /* item.links 優先。PJ名は今の名前 */
        const r=await inboxApply(it.block||'', links, it);
        if(r&&r.ok){ inboxMarkDone(it, r.summary, links); results.push({id:it.id, ok:true, summary:r.summary||''}); }
        else results.push({id:it.id, ok:false, summary:(r&&r.summary)||'取り込めませんでした'});
      }catch(e){ results.push({id:it.id, ok:false, summary:'エラー: '+((e&&e.message)||e)}); }
    }
    if(window.parent!==window){ try{ window.parent.postMessage({type:'myapps-inbox-result', os:INBOX_OS, trigger, results}, location.origin); }catch(e){} }
    return results;
  };
  const p=_inboxChain.then(run, run);
  _inboxChain=p.catch(()=>{});
  return p;
}
window.addEventListener('message', ev=>{ if(ev.origin!==location.origin) return; if(ev.data&&ev.data.type==='myapps-inbox-process') inboxProcess('message'); });

/* 名前の照合（ヒトメモの lxNormName と同じ：括弧注記・さん・空白を除き NFKC・小文字） */
function rfNormName(s){ return String((s&&s.value)||s||'').replace(/[（(][^）)]*[）)]/g,'').replace(/さん$/,'').replace(/\s+/g,'').normalize('NFKC').toLowerCase(); }
function rfReadPos(){ try{ const o=JSON.parse(localStorage.getItem('pos_v4')||'null'); return (o&&Array.isArray(o.projects))?o.projects:[]; }catch(e){ return []; } }
function rfReadPeople(){ try{ const a=JSON.parse(localStorage.getItem('hitomemo_profiles_v1')||'[]'); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
/* 名前だけのとき、PJ（pos_v4）・人（ヒトメモ）の一致が1つだけなら ID を補う。どちらにも書かない。空の項目は落とす */
function rfResolveLinks(links){
  const l=Object.assign({}, links||{}), out={};
  if(!l.projectId&&l.projectName){
    const key=String(l.projectName).trim().toLowerCase();
    const hit=rfReadPos().filter(p=>p&&p.id&&String(p.name||'').trim().toLowerCase()===key);
    if(hit.length===1) l.projectId=String(hit[0].id);
  }
  if((!l.personIds||!l.personIds.length)&&l.personNames&&l.personNames.length){
    const ppl=rfReadPeople(); const ids=[];
    l.personNames.forEach(n=>{ const k=rfNormName(n); const hit=k?ppl.filter(p=>p&&p.id&&rfNormName(p.name)===k):[]; if(hit.length===1) ids.push(String(hit[0].id)); });
    if(ids.length===l.personNames.length) l.personIds=ids;   /* 全員そろったときだけ（名前との並びを崩さない） */
  }
  ['strategyGoalId','projectId','projectName','questionId'].forEach(k=>{ if(l[k]) out[k]=String(l[k]); });
  ['personIds','personNames'].forEach(k=>{ if(Array.isArray(l[k])&&l[k].length) out[k]=l[k].slice(); });
  return out;
}

async function inboxAttachLinks(r, links){
  const lk=rfResolveLinks(links);

  for(const id of (r.logIds||[])){ const x=S.logs.find(z=>z&&z.id===id); if(x){ x.links=lk; await dbput('logs', x); } }
  for(const id of (r.questionIds||[])){ const x=S.questions.find(z=>z&&z.id===id); if(x&&Object.keys(lkQ).length){ x.links=rfKeepPj(x.links,lkQ); await dbput('questions', x); } }
  for(const id of (r.experimentIds||[])){ const x=S.experiments.find(z=>z&&z.id===id); if(x){ x.links=rfKeepPj(x.links,lk); await dbput('experiments', x); } }
  for(const id of (r.themeIds||[])){ const x=S.themes.find(z=>z&&z.id===id); if(x&&Object.keys(lkQ).length){ x.links=lkQ; await dbput('themes', x); } }
  if((r.lecticaLogIds||[]).length){

    logs.forEach(l=>{ if(l&&r.lecticaLogIds.includes(l.id)){ l.links=lk; ch=true; } });

  }
}

function rfLinkChips(links){

/* 決定検証（expType:'review'）は 2026-11-03 に外した。古いバックアップの復元などで入ってきたら通常の実験として扱い（expType を外す）、
   記録に「（旧 決定検証）」1行。expType:'review' が残っているものだけが対象なので冪等。退避は1回（同名キーがあれば作らない） */
async function rfReviewToNormal(){
  const BK='reflect_backup_review_20261103',FLAG='reflect_review_20261103_done';
  const xs=(await dball('experiments')).filter(x=>x&&x.expType==='review');
  if(xs.length){
    try{if(localStorage.getItem(BK)===null){const v=localStorage.getItem('reflectOS_v1');if(v!==null)localStorage.setItem(BK,v);}}catch(e){console.warn('退避できないため決定検証の整理を見送り（次回また試す）',e);return;}
    for(const x of xs){
      delete x.expType;
      if(!Array.isArray(x.notes))x.notes=[];
      if(!x.notes.some(n=>n&&n.text==='（旧 決定検証）'))x.notes.push({date:tod(),kind:'記録',text:'（旧 決定検証）',src:'整理'});
      await dbput('experiments',x);
    }
    console.log('[reflect-review] 決定検証 '+xs.length+'本を通常の実験にしました');
  }
  try{if(!localStorage.getItem(FLAG))localStorage.setItem(FLAG,new Date().toISOString());}catch(e){}
}

async function boot(){
  try{const v=await dbget('settings','vision');if(v?.value)S.vision=v.value;}catch(e){}
  try{
    await rfDetachPjThemes();   /* PJの写しに「外した」印を付ける（1回だけ・退避キーあり） */
    await rfBoardCleanup();   /* テーマの問い欄・使わない欄を記録へ移して外す（欄が残っているものだけ・退避キーあり） */
    await rfReviewToNormal();   /* 古いデータの決定検証を通常の実験に（残っているものだけ・退避キーあり） */
    const priOrd={S:0,A:1,B:2,C:3};
    const th=await dball('themes');
    S.themes=th.sort((a,b)=>(priOrd[a.priority]||9)-(priOrd[b.priority]||9));
    const lg=await dball('logs');
    S.logs=lg.sort((a,b)=>b.date.localeCompare(a.date));
    const chks=await dball('checks');
    chks.forEach(c=>{S.checks[c.id]=c.state||(c.done?'done':'todo');});
    S.questions=await dball('questions');
    S.experiments=await dball('experiments');
    S.principles=await dball('principles');
    await tkFixCleanLineTitles();   /* 先頭の数字が消えた題名を元ログから1回だけ修復（退避キーあり・手で直した題名は触らない） */
    await tkMigrate();   /* 既存ログ→探求ボードの冪等移行（初回はスナップショットDL） */
    await tkAutoAssignRids();   /* 追補J：旧extId移行＋R001〜R003のrid自動割当（冪等・手動優先） */
    await rfRidOnce();   /* R番号の無い実験中に次の番号（R001〜R003 の題名一致の後。冪等・退避キーあり） */
  }catch(e){console.warn(e);}
  tkMirrorFocus();   /* 初期化完了時に重点スナップショットをlocalStorageへ（空でも書く） */
  renderV26();ra();updateNav();
  _rfBootDone();
  inboxProcess('load');   /* 受信箱：自分宛て（targetOS:'reflect'）の未処理を取り込む。無ければ何もしない */
}
inboxPjRenameOnce('reflect', ['reflectOS_v1','lectica_experiment_logs_v1']);   /* 紐づけの旧PJ名（2026-11-03・1回だけ。データを読む前） */
boot();
