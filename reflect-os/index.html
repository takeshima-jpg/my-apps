<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="./icons/favicon.ico">
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reflect OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f6;
  --sf:#fff;
  --bd:#e8e4dc;
  --tx:#1a1814;
  --mu:#7a7670;
  --di:#b0aca4;
  --go:#2a5a3a;
  --go-lt:#f0f5f1;
  --go-bd:#a8c8b4;
  --bl:#3a4a6a;
  --bl-lt:#f0f3f8;
  --mono:'JetBrains Mono','Courier New',monospace;
  --serif: 'Meiryo', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --max:900px;
}
body{font-family:var(--serif);background:var(--bg);color:var(--tx);min-height:100vh;font-size:17px;line-height:1.8}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
input,textarea,select{background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:3px;font-family:var(--serif);font-size:16px;outline:none;transition:border-color .15s;padding:9px 12px;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--go)}
textarea{resize:vertical;line-height:1.8}
button{cursor:pointer;font-family:var(--serif);border:none;border-radius:3px;transition:all .15s}

/* ── Layout ── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:200px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;}
.sb-hd{padding:14px 16px;border-bottom:1px solid var(--bd);}
.sb-logo{display:flex;align-items:center;gap:8px;}
.sb-logo img{width:28px;height:28px;border-radius:7px;flex-shrink:0;}
.sb-logo span{font-size:15px;font-weight:700;color:var(--tx);}
.sb-nav{padding:6px 0;flex:0 0 auto;}
nav{display:flex;flex-direction:column;gap:0;}
.nb{padding:10px 16px;font-size:15px;letter-spacing:.02em;background:transparent;color:var(--mu);border:none;border-left:3px solid transparent;border-radius:0;cursor:pointer;font-family:var(--serif);display:flex;align-items:center;gap:8px;text-align:left;width:100%;transition:background .1s;}
.nb:hover{background:var(--bg);}
.nb .nav-icon{font-size:14px;width:16px;text-align:center;}
.nb.on{color:var(--go);background:var(--go-lt);border-left-color:var(--go);font-weight:600;}
.sb-rec{padding:10px 16px;border-top:1px solid var(--bd);flex:0 0 auto;}
.sb-rec-lbl{font-size:9px;color:var(--di);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px;}
.sb-rec-btn{display:block;width:100%;padding:7px 10px;margin-bottom:4px;font-size:13px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--mu);cursor:pointer;font-family:var(--serif);transition:all .1s;}
.sb-rec-btn:hover{border-color:var(--go);color:var(--go);background:var(--go-lt);}
.sb-ft{padding:10px 16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:4px;flex:0 0 auto;}
.sb-badge{font-size:10px;background:var(--go);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px;font-family:var(--mono);}
.sb-badge:empty{display:none;}
.unlinked-notice{background:#fff8e8;border:1px solid #f0d060;border-radius:4px;padding:10px 14px;font-size:13px;color:#7a6000;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.unlinked-notice a{color:var(--go);cursor:pointer;text-decoration:underline;}
.sb-ft button,.sb-ft label{display:block;width:100%;padding:6px 8px;font-size:12px;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:3px;color:var(--di);cursor:pointer;font-family:var(--serif);}
.sb-ft button:hover,.sb-ft label:hover{border-color:var(--mu);color:var(--mu);}
#main{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#v26{padding:8px 20px;border-bottom:1px solid var(--bd);background:var(--bg);flex-shrink:0;}
.v26c{display:flex;align-items:baseline;gap:14px;}
.v26t{font-family:var(--mono);font-size:9px;color:var(--di);letter-spacing:.14em;min-width:38px;}
.v26b{font-size:13px;color:var(--mu);line-height:1.7;}
.v26k{font-family:var(--mono);font-size:9px;color:var(--di);margin-right:8px;}
#body{flex:1;padding:28px 36px 80px;}

/* ── AI Import ── */
.ai-import-wrap{max-width:var(--max);padding:32px 28px 80px;}
.checklist{display:flex;flex-direction:column;gap:0;margin-bottom:8px;}
.cl-row{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap;}
.cl-row:last-child{border-bottom:none;}
.cl-cb{flex-shrink:0;width:16px;height:16px;accent-color:var(--go);cursor:pointer;margin-top:2px;}
.cl-label{flex:1;font-size:14px;color:var(--tx);line-height:1.6;min-width:0;}
.cl-row input[type=checkbox]:checked~.cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-label{text-decoration:line-through;color:var(--mu);}
.cl-done .cl-from{color:var(--di);}
.cl-doing{background:#f0f8f0;}
.cl-doing .cl-label{color:var(--go);font-weight:500;}
.cl-skip .cl-label{text-decoration:line-through;color:var(--di);opacity:.6;}
.exp-state-btn{font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:3px;background:var(--bg);cursor:pointer;color:var(--mu);margin-left:4px;flex-shrink:0;}
.exp-state-btn:hover{border-color:var(--mu);}
.exp-state-btn.doing{color:var(--go);border-color:var(--go-bd);background:var(--go-lt);}
.exp-state-btn.skip{color:var(--di);}
.cl-from{font-size:11px;color:var(--di);white-space:nowrap;flex-shrink:0;}
.ai-prompt-box{border:1px solid var(--bd);border-radius:5px;margin-bottom:16px;background:var(--sf);}
.ai-prompt-box summary{padding:10px 14px;font-size:13px;cursor:pointer;color:var(--mu);}
.ai-prompt-inner{padding:0 14px 14px;}
.ai-prompt-note{font-size:12px;color:var(--mu);margin-bottom:8px;}
.ai-prompt-pre{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:12px;white-space:pre-wrap;word-break:break-all;margin-bottom:8px;line-height:1.7;color:var(--tx);}
.ai-import-title{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:4px;}
.ai-import-sub{font-size:13px;color:var(--mu);margin-bottom:24px;}
.ai-format-box{font-size:13px;color:var(--mu);background:var(--bg);border:1px solid var(--bd);border-radius:5px;padding:14px 16px;line-height:2;margin-bottom:16px;}
.ai-format-box strong{color:var(--tx);}
.ai-format-box code{font-family:var(--mono);font-size:12px;background:#f0ede8;padding:0 3px;border-radius:2px;}
.ai-textarea{width:100%;min-height:220px;padding:14px 16px;font-size:15px;line-height:1.8;border:1px solid var(--bd);border-radius:5px;font-family:var(--serif);background:var(--sf);color:var(--tx);resize:vertical;outline:none;display:block;}
.ai-textarea:focus{border-color:var(--go);}
.ai-btn-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
.ai-status{font-size:13px;color:var(--mu);}
.ai-status.ok{color:var(--go);}
.ai-status.err{color:#b05050;}

/* ── Buttons ── */
.btn-p{background:var(--go);color:#fff;padding:9px 20px;font-size:15px}
.btn-p:hover{background:#1e4a2a}
.btn-s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:8px 16px;font-size:14px}
.btn-s:hover{border-color:var(--mu)}
.btn-g{background:transparent;color:var(--di);border:1px solid var(--bd);padding:4px 10px;font-size:13px}
.btn-g:hover{border-color:var(--mu);color:var(--mu)}
.btn-d{background:transparent;color:#b05050;border:1px solid #e0c0c0;padding:3px 8px;font-size:10px}

/* ── Section ── */
.sec{margin-bottom:40px}
.sec-lbl{font-size:10px;color:var(--di);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
.dvd{border-top:1px solid var(--bd);margin:28px 0}

/* ── VISION ── */
.vision-block{margin-bottom:32px}
.vision-text{font-size:17px;color:var(--go);line-height:2;white-space:pre-wrap;padding:16px 0}
.vision-expand{cursor:pointer;font-size:13px;color:var(--di);display:flex;align-items:center;gap:6px;padding:4px 0;user-select:none}
.vision-expand:hover{color:var(--mu)}
.vision-detail{display:none;padding:16px 0 8px;border-top:1px solid var(--bd);margin-top:8px}
.vision-detail.open{display:block}
.vision-principle{display:flex;gap:14px;padding:7px 0;border-bottom:1px solid var(--bd);font-size:15px}
.vision-principle:last-child{border-bottom:none}
.vp-kw{color:var(--go);min-width:36px;font-size:14px}
.vp-num{color:var(--di);font-family:var(--mono);font-size:10px;min-width:14px;padding-top:2px}
.vp-text{color:var(--mu);line-height:1.7}

/* ── Theme cards ── */
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
@media(max-width:640px){.theme-grid{grid-template-columns:1fr}}
.tcard{background:var(--sf);border:1px solid var(--bd);border-radius:5px;overflow:hidden;transition:border-color .15s;cursor:pointer}
.tcard:hover{border-color:var(--go-bd)}
.tcard-main{padding:16px 18px}
.tcard-name{font-size:17px;color:var(--tx);margin-bottom:6px;line-height:1.4;font-weight:500}
.tcard-meta{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tcard-status{font-size:10px;padding:1px 8px;border-radius:10px;border:1px solid}
.st-active{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.st-plan{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.st-hold{color:var(--di);border-color:var(--bd);background:var(--bg)}
.st-done{color:var(--bl);border-color:#b0c0e0;background:var(--bl-lt)}
.st-exit{color:#b05050;border-color:#e0b0b0;background:#fdf0f0}
.tcard-summary{font-size:14px;color:var(--mu);line-height:1.6}
.tcard-detail{display:none;border-top:1px solid var(--bd);padding:14px 16px;font-size:14px;color:var(--mu);line-height:1.7}
.tcard-detail-inner{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tcard-detail.open{display:block}
.tcard-active{border-color:var(--go)!important;box-shadow:0 0 0 2px var(--go)33;}
.tcard-dl{font-size:9px;color:var(--di);letter-spacing:.1em;text-transform:uppercase;margin:10px 0 4px}
.tcard-dl:first-child{margin-top:0}
.ms-pill{display:inline-flex;padding:2px 8px;font-size:10px;border-radius:10px;border:1px solid;margin:2px;gap:4px}
.ms-done{color:var(--go);border-color:var(--go-bd);background:var(--go-lt)}
.ms-doing{color:#7a6030;border-color:#d8c080;background:#fdf8e8}
.ms-todo{color:var(--di);border-color:var(--bd);background:var(--bg)}
.kpi-row{font-size:13px;color:var(--mu);padding:3px 0;display:flex;gap:8px}
.kpi-name{color:var(--di)}
.tcard-acts{display:flex;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}

/* ── Log items ── */
.log-item{padding:16px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.log-item:first-child{border-top:1px solid var(--bd)}
.log-item:hover .log-title{color:var(--go)}
.log-date{font-size:10px;color:var(--di);font-family:var(--mono);margin-bottom:4px;display:flex;gap:8px;align-items:center}
.log-title{font-size:17px;color:var(--tx);margin-bottom:5px;transition:color .15s}
.log-lesson{font-size:15px;color:var(--mu);line-height:1.7;border-left:2px solid var(--go-bd);padding-left:12px;margin-top:4px}
.log-q{font-size:14px;color:var(--bl);margin-top:4px}
.log-exp{font-size:14px;color:var(--go);margin-top:4px}
.log-acts{display:flex;gap:6px;margin-top:10px}
.tbadge{font-size:9px;padding:1px 7px;border-radius:10px}

/* ── Question items ── */

/* ── Form ── */
.form-wrap{max-width:640px;margin:0 auto}
.form-hdr{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.field{margin-bottom:14px}
.lbl{display:block;font-size:10px;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.lbl-opt{font-size:9px;color:var(--di);margin-left:6px;font-style:italic;text-transform:none;letter-spacing:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.hint{background:var(--go-lt);border-left:2px solid var(--go-bd);padding:10px 14px;font-size:14px;color:var(--go);margin-bottom:18px;line-height:1.7}
.expand-tog{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--di);font-size:13px;padding:6px 0;background:transparent;border:none;font-family:var(--serif);width:100%}
.expand-tog:hover{color:var(--mu)}
.expand-arr{font-size:9px;transition:transform .2s;display:inline-block}
.expand-tog.open .expand-arr{transform:rotate(90deg)}
.expand-body{display:none;padding:8px 0 4px}
.expand-body.open{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.chip{padding:3px 10px;font-size:13px;background:var(--bg);color:var(--di);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-family:var(--serif)}
.chip:hover{border-color:var(--mu)}
.chip.on{background:var(--go-lt);color:var(--go);border-color:var(--go-bd)}
.sldr-row{display:flex;align-items:center;gap:8px}
.sldr-row input[type=range]{accent-color:var(--go);padding:0;border:none;background:transparent;box-shadow:none}
.sldr-v{font-size:14px;color:var(--go);min-width:16px;text-align:right}
.ms-row{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.ms-row input{flex:1}
.kpi-row-edit{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.kpi-row-edit input{flex:1}
.url-wrap{display:flex;gap:7px}
.url-wrap input{flex:1}

/* ── Lesson/exp strip ── */
.learn-exp{color:var(--go)}

/* ── Record buttons ── */
.rec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:0}
.rec-btn{padding:13px 8px;text-align:center;border:1px solid var(--bd);border-radius:5px;cursor:pointer;font-family:var(--serif);background:var(--sf);transition:all .15s;font-size:15px}
.rec-btn:hover{border-color:var(--go-bd);background:var(--go-lt)}
.rec-btn-lbl{color:var(--go);display:block;margin-bottom:2px}
.rec-btn-desc{font-size:10px;color:var(--di)}

/* ── Dash ── */

/* ── Exp board ── */
.exp-cnt{font-size:10px;color:var(--di);font-family:var(--mono)}

/* ── Search ── */
.srch-wrap{position:relative;margin-bottom:16px}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--di);font-size:15px;pointer-events:none}
.srch-wrap input{padding-left:32px;font-size:16px}

/* ── Theme form extras ── */
.tf-sect{font-size:10px;color:var(--di);letter-spacing:.16em;text-transform:uppercase;margin:20px 0 10px;padding-top:16px;border-top:1px solid var(--bd)}

/* ── Misc ── */
.empty{font-size:15px;color:var(--di);padding:16px 0}
.draft-badge{font-size:10px;color:#8080c0}
.more-lnk{font-size:14px;color:var(--di);cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:transparent;border:none;font-family:var(--serif);padding:0}
.more-lnk:hover{color:var(--mu)}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .22s ease}

/* ── Philosophy log ── */
.phil-field{font-size:15px;color:var(--mu);line-height:1.75;margin-top:5px}
/* Timeline */
.tl-title{font-size:16px;color:var(--tx);margin-bottom:4px}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <div class="sb-hd">
    <div class="sb-logo"><img src="icons/icon-32.png"><span>Reflect OS</span></div>
  </div>
  <div class="sb-nav">
    <nav id="nav">
      <button class="nb on" data-tab="home"><span class="nav-icon">◉</span> ホーム</button>
      <button class="nb" data-tab="log"><span class="nav-icon">≡</span> ログ</button>

      <button class="nb" data-tab="search"><span class="nav-icon">⌕</span> 検索</button>
      <button class="nb" data-tab="ai-import"><span class="nav-icon">⬇</span> 取り込む</button>
      <button class="nb" data-tab="questions"><span class="nav-icon">？</span> 問い <span id="q-badge" class="sb-badge"></span></button>
      <button class="nb" data-tab="experiments"><span class="nav-icon">▶</span> 実験 <span id="e-badge" class="sb-badge"></span></button>
      <button class="nb" data-tab="archive"><span class="nav-icon">□</span> アーカイブ</button>
    </nav>
  </div>

  <div class="sb-ft">
    <button id="btn-exp">⬇ エクスポート</button>
    <label style="cursor:pointer">⬆ インポート<input type="file" accept=".json" id="imp" style="display:none"></label>
  </div>
</div>
<div id="main">
  <div id="v26"></div>
  <div id="body"><div style="color:var(--di);padding:40px;font-size:14px;letter-spacing:.1em">loading...</div></div>
</div>

<script>
/* ── DB ── */
const DBN='ReflectOS7',DBV=1;
let _db=null;
function odb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,DBV);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      ['logs','themes','settings','checks'].forEach(s=>{
        if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess=e=>{_db=e.target.result;res(_db);};
    r.onerror=e=>{
      // バージョン競合時はDBを削除して再試行
      console.warn('DB open error, retrying...',e.target.error);
      indexedDB.deleteDatabase(DBN);
      const r2=indexedDB.open(DBN,DBV);
      r2.onupgradeneeded=e2=>{const db=e2.target.result;['logs','themes','settings','checks'].forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
      r2.onsuccess=e2=>{_db=e2.target.result;res(_db);};
      r2.onerror=e2=>rej(e2);
    };
    r.onblocked=()=>{console.warn('DB blocked');};
  });
}
async function dbput(s,v){const db=await odb();return new Promise((res,rej)=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).put(v);tx.oncomplete=res;tx.onerror=rej;});}
async function dbget(s,k){const db=await odb();return new Promise((res,rej)=>{const tx=db.transaction(s,'readonly');const r=tx.objectStore(s).get(k);r.onsuccess=()=>res(r.result);r.onerror=rej;});}
async function dball(s){const db=await odb();return new Promise((res,rej)=>{const tx=db.transaction(s,'readonly');const r=tx.objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=rej;});}
async function dbdel(s,k){const db=await odb();return new Promise((res,rej)=>{const tx=db.transaction(s,'readwrite');tx.objectStore(s).delete(k);tx.oncomplete=res;tx.onerror=rej;});}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);
const tod=()=>new Date().toISOString().split('T')[0];
const dAgo=d=>Math.floor((Date.now()-new Date(d))/(864e5));
function h(tag,a,...kids){const e=document.createElement(tag);Object.entries(a||{}).forEach(([k,v])=>{if(k==='cls')e.className=v;else if(k==='css')e.style.cssText=v;else if(k[0]==='o'&&k[1]==='n')e.addEventListener(k.slice(2).toLowerCase(),v);else e.setAttribute(k,v);});kids.flat(9).forEach(c=>{if(c==null)return;if(typeof c==='string'||typeof c==='number')e.appendChild(document.createTextNode(String(c)));else e.appendChild(c);});return e;}
const D=(a,...c)=>h('div',a,...c);
const Sp=(a,...c)=>h('span',a,...c);
const Bt=(a,...c)=>h('button',a,...c);
const In=(a)=>h('input',a);
const Ta=(a)=>h('textarea',a);
const Sel=(a,...c)=>h('select',a,...c);
const Opt=(v,t,sel)=>h('option',{value:v,...(sel?{selected:''}:{})},t);

/* ── State ── */
let S={vision:{vision:'',yearGoal:''},themes:[],logs:[],checks:{},tab:'home',forming:null,editing:null,fd:{},_activeTheme:null,_unlinkedNotice:0};

/* ── Constants ── */

function fld(lb,child,opt=false,note=''){const w=D({cls:'field'});if(lb){const l=h('label',{cls:'lbl'},lb);if(opt)l.appendChild(Sp({cls:'lbl-opt'},'任意'));w.appendChild(l);}w.appendChild(child);if(note)w.appendChild(D({css:'font-size:13px;color:var(--di);margin-top:3px'},note));return w;}
function tI(lb,key,ph='',tp='text',opt=false,fd2){const fd=fd2||S.fd;const e=In({type:tp,placeholder:ph});e.value=fd[key]||(tp==='date'?'':'');e.addEventListener('input',()=>fd[key]=e.value);return fld(lb,e,opt);}
function urlF(key){const w=D({cls:'url-wrap'});const e=In({type:'url',placeholder:'https://docs.google.com/...'});e.style.flex='1';e.value=S.fd[key]||'';e.addEventListener('input',()=>S.fd[key]=e.value);const ob=Bt({cls:'btn-g',onclick:()=>{if(S.fd[key])window.open(S.fd[key],'_blank');}},'開く');w.appendChild(e);w.appendChild(ob);return fld('Google Docs URL',w,true,'深く書いた後にURLを貼る');}
function taF(lb,key,ph='',mh=70,opt=false,fd2){const fd=fd2||S.fd;const e=Ta({placeholder:ph,css:`min-height:${mh}px;width:100%`});e.value=fd[key]||'';e.addEventListener('input',()=>fd[key]=e.value);return fld(lb,e,opt);}
function selF(lb,key,opts,fd2){const fd=fd2||S.fd;const sel=Sel({},opts.map(o=>Opt(o,o,fd[key]===o)));sel.addEventListener('change',()=>fd[key]=sel.value);if(!fd[key]&&opts.length)fd[key]=opts[0];return fld(lb,sel);}
function sldrF(lb,key){const v=S.fd[key]||5;const vs=Sp({cls:'sldr-v'},String(v));const e=In({type:'range',min:'1',max:'10'});e.value=v;const lbEl=h('label',{cls:'lbl'},`${lb} — ${v}`);e.addEventListener('input',()=>{S.fd[key]=+e.value;vs.textContent=e.value;lbEl.textContent=`${lb} — ${e.value}`;});return D({cls:'field'},lbEl,D({cls:'sldr-row'},e,vs));}
function chipsF(lb,key,opts,single=false,opt=false){const sel=S.fd[key]||(single?'':[]);const w=D({cls:'chips'});opts.forEach(o=>{const a=single?sel===o:(Array.isArray(sel)&&sel.includes(o));const c=Bt({cls:'chip'+(a?' on':'')},o);c.addEventListener('click',()=>{if(single)S.fd[key]=S.fd[key]===o?'':o;else{const cur=S.fd[key]||[];S.fd[key]=cur.includes(o)?cur.filter(x=>x!==o):[...cur,o];}ra();});w.appendChild(c);});return fld(lb,w,opt);}
function thChipsF(key){const selIds=S.fd[key]||[];const w=D({cls:'chips'});const active=S.themes.filter(t=>!t._fromProjectOS&&t.status!=='完了');if(!active.length){w.appendChild(Sp({css:'font-size:14px;color:var(--di)'},'（テーマ未登録）'));return fld('探求テーマ',w,true);}active.forEach(t=>{const a=selIds.includes(t.id);const c=Bt({cls:'chip'+(a?' on':'')},t.title);c.addEventListener('click',()=>{const cur=S.fd[key]||[];S.fd[key]=cur.includes(t.id)?cur.filter(x=>x!==t.id):[...cur,t.id];ra();});w.appendChild(c);});return fld('探求テーマ',w,true);}

/* ── Theme form ── */
function buildThemeForm(tfd){
  const msEditor=()=>{
    if(!tfd.milestones)tfd.milestones=[];
    const w=D({});
    const render=()=>{
      w.innerHTML='';
      tfd.milestones.forEach((ms,i)=>{
        const row=D({cls:'ms-row'});
        const ti=In({type:'text',placeholder:'マイルストーン名'});ti.value=ms.title||'';ti.addEventListener('input',()=>tfd.milestones[i].title=ti.value);
        const dl=In({type:'date'});dl.value=ms.deadline||'';dl.addEventListener('input',()=>tfd.milestones[i].deadline=dl.value);
        const st=Sel({css:'width:76px;padding:7px 5px;font-size:14px'});MS_ST.forEach(s=>{const o=h('option',{value:s},s);if(ms.status===s)o.selected=true;st.appendChild(o);});st.addEventListener('change',()=>tfd.milestones[i].status=st.value);
        const rm=Bt({cls:'btn-d',onclick:()=>{tfd.milestones.splice(i,1);render();}},'×');
        row.appendChild(ti);row.appendChild(dl);row.appendChild(st);row.appendChild(rm);w.appendChild(row);
      });
      const add=Bt({cls:'btn-g',css:'font-size:13px;margin-top:2px'},'＋ 追加');
      add.addEventListener('click',()=>{tfd.milestones.push({id:uid(),title:'',deadline:'',status:'未着手'});render();});
      w.appendChild(add);
    };
    render();return fld('マイルストーン',w,true);
  };
  const kpiEditor=()=>{
    if(!tfd.metrics)tfd.metrics=[];
    const w=D({});
    const render=()=>{
      w.innerHTML='';
      tfd.metrics.forEach((k,i)=>{
        const row=D({cls:'kpi-row-edit'});
        const ni=In({type:'text',placeholder:'指標名'});ni.value=k.name||'';ni.addEventListener('input',()=>tfd.metrics[i].name=ni.value);
        const ti=In({type:'text',placeholder:'目標値',css:'max-width:130px'});ti.value=k.target||'';ti.addEventListener('input',()=>tfd.metrics[i].target=ti.value);
        const rm=Bt({cls:'btn-d',onclick:()=>{tfd.metrics.splice(i,1);render();}},'×');
        row.appendChild(ni);row.appendChild(ti);row.appendChild(rm);w.appendChild(row);
      });
      const add=Bt({cls:'btn-g',css:'font-size:13px;margin-top:2px'},'＋ 追加');
      add.addEventListener('click',()=>{tfd.metrics.push({id:uid(),name:'',target:''});render();});
      w.appendChild(add);
    };
    render();return fld('KPI / 数字',w,true);
  };
  // 関連PJ選択（Project OSから同期済みのものを選択肢に）
  function pjSelectF(){
    const pjThemes=S.themes.filter(t=>t._fromProjectOS);
    if(!pjThemes.length)return null;
    const cur=tfd.relatedPj||[];
    const w=D({cls:'chips'});
    pjThemes.forEach(p=>{
      const on=cur.includes(p.id);
      const c=Bt({cls:'chip'+(on?' on':'')},p.title);
      c.addEventListener('click',()=>{
        const idx=(tfd.relatedPj||[]).indexOf(p.id);
        if(idx>=0)tfd.relatedPj.splice(idx,1);
        else tfd.relatedPj=[...(tfd.relatedPj||[]),p.id];
        c.classList.toggle('on');
      });
      w.appendChild(c);
    });
    return fld('関連PJ（この問いを探求しているプロジェクト）',w,true);
  }
  return [
    tI('テーマ名','title','探求しているテーマ（例：資本政策は関係性の設計か？）','text',false,tfd),
    taF('問い','currentState','今、自分が探求している問い',80,false,tfd),
    taF('現在の仮説','summary','今どう考えているか・何を信じているか',80,false,tfd),
    pjSelectF(),
  ].filter(Boolean);
}

function openThemeForm(existing){
  const tfd=existing?JSON.parse(JSON.stringify(existing)):{id:uid(),title:'',milestones:[],metrics:[],createdAt:tod()};
  const main=document.getElementById('body');main.innerHTML='';
  const wrap=D({cls:'form-wrap fu'});
  const bk=Bt({cls:'btn-s',css:'margin-bottom:20px',onclick:()=>ra()},'← 戻る');
  wrap.appendChild(bk);
  const card=D({css:'background:var(--sf);border:1px solid var(--bd);border-radius:5px;padding:24px 28px'});
  buildThemeForm(tfd).forEach(x=>x&&card.appendChild(x));
  wrap.appendChild(card);
  const acts=D({css:'display:flex;gap:8px;margin-top:20px;margin-bottom:40px'});
  const sv=Bt({cls:'btn-p'},existing?'更新':'追加');
  sv.addEventListener('click',async()=>{if(!tfd.title?.trim()){alert('テーマ名を入力してください');return;}tfd.updatedAt=tod();if(!tfd.createdAt)tfd.createdAt=tod();await dbput('themes',tfd);const i=S.themes.findIndex(x=>x.id===tfd.id);if(i>=0)S.themes[i]=tfd;else S.themes.push(tfd);ra();});
  acts.appendChild(sv);
  if(existing){const dl=Bt({cls:'btn-d',css:'margin-left:auto',onclick:async()=>{if(!confirm('削除しますか？'))return;await dbdel('themes',tfd.id);S.themes=S.themes.filter(x=>x.id!==tfd.id);ra();}},  '削除');acts.appendChild(dl);}
  const cn=Bt({cls:'btn-s',onclick:()=>ra()},'キャンセル');acts.appendChild(cn);
  wrap.appendChild(acts);
  main.appendChild(wrap);
}

function renderLogForm(type){

  const hdr=D({cls:'form-hdr'});
  const bk=Bt({cls:'btn-s',onclick:()=>{S.forming=null;S.editing=null;S.fd={};ra();}},'← 戻る');
  hdr.appendChild(bk);
  hdr.appendChild(D({},D({css:'font-size:13px;color:var(--di);margin-bottom:2px'},meta.label),D({css:`font-size:16px;color:${meta.ac}`},'深く考えた後に記録する')));

async function saveLog(status){
  const r={...S.fd,status,id:S.fd.id||uid(),date:S.fd.date||tod(),type:S.forming||S.editing?.type};
  await dbput('logs',r);
  const i=S.logs.findIndex(x=>x.id===r.id);if(i>=0)S.logs[i]=r;else S.logs.unshift(r);
  S.logs.sort((a,b)=>b.date.localeCompare(a.date));
  S.forming=null;S.editing=null;S.fd={};ra();
}

/* ── Log card ── */
function logCard(r){
  const meta=TM[r.type]||{};
  const item=D({cls:'log-item'});
  // 日付行：日付・タイプバッジ・下書き
  const dr=D({cls:'log-date'});
  dr.appendChild(document.createTextNode(r.date));
  dr.appendChild(Sp({cls:'tbadge',css:`background:${meta.bg||'#f5f5f5'};color:${meta.ac||'#888'}`},meta.label||r.type));
  if(r.status==='draft')dr.appendChild(Sp({cls:'draft-badge'},'下書き'));
  item.appendChild(dr);
  // タイトル
  item.appendChild(D({cls:'log-title'},r.title||'（無題）'));
  // テーマバッジ
  const thNames=(r.themes||[]).map(id=>S.themes.find(t=>t.id===id)?.title).filter(Boolean);
  if(thNames.length){
    const thRow=D({css:'display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px'});
    thNames.forEach(n=>thRow.appendChild(Sp({css:'font-size:11px;background:var(--go-lt);color:var(--go);border-radius:10px;padding:1px 8px;'},n)));
    item.appendChild(thRow);
  } else {
    item.appendChild(Sp({css:'font-size:11px;color:#b09040;background:#fdf8e8;border:1px solid #e8d880;border-radius:10px;padding:1px 8px;margin:4px 0 2px;display:inline-block'},'テーマ未紐づけ'));
  }
  // 気づき・学び（1行）
  if(r.lesson){const ls=r.lesson.split(/\n/).find(l=>l.trim())||'';const lsc=ls.trim();item.appendChild(D({cls:'log-lesson'},lsc.length>100?lsc.slice(0,100)+'…':lsc));}
  if(r.question){const ql=r.question.split(/\n/).find(l=>l.trim())||'';const qt=ql.trim();item.appendChild(D({cls:'log-q'},'？ '+(qt.length>80?qt.slice(0,80)+'…':qt)));}
  if(r.nextExp){const nl=r.nextExp.split(/\n/).find(l=>l.trim())||'';const nt=nl.trim();item.appendChild(D({cls:'log-exp'},'▶ '+(nt.length>80?nt.slice(0,80)+'…':nt)));}
  const acts=D({cls:'log-acts'});
  acts.appendChild(D({css:'flex:1'}));
  const ed=Bt({cls:'btn-g',onclick:e=>{e.stopPropagation();S.editing=r;S.forming=null;S.fd=JSON.parse(JSON.stringify(r));ra();}},'編集');
  const dl=Bt({cls:'btn-d',onclick:async e=>{e.stopPropagation();if(!confirm('削除しますか？'))return;await dbdel('logs',r.id);S.logs=S.logs.filter(x=>x.id!==r.id);ra();}},'削除');
  acts.appendChild(ed);acts.appendChild(dl);item.appendChild(acts);
  return item;
}

const TYPE_MAP = {
  '振り返り':'note','振り返':'note','note':'note',
  'モヤモヤ':'moya','もやもや':'moya','moya':'moya',
  'VISION点検':'vision','vision点検':'vision','vision':'vision','ビジョン':'vision',
  '戦略テーマ':'strategy','戦略':'strategy','strategy':'strategy',
  '思想変化':'philosophy','philosophy':'philosophy',
};

function extractField(block, keys, multiline=false){
  for(const key of keys){
    // 次のラベル行（「キー：」）か【ブロック】が来るまで取得
    const re = new RegExp(key + '[：:：][ \\t]*([\\s\\S]+?)(?=\\n[ \\t]*[ァ-ヺぁ-ゔA-Za-z一-龥々・]+[：:：]|\\n【[^】]+】|$)', 'i');
    const m = block.match(re);
    if(m && m[1].trim()){
      const raw = m[1].trim();
      if(multiline) return raw;
      return raw.split('\n')[0].trim();
    }
  }
  return '';
}

// 番号付きリスト・箇条書きを含む複数行フィールド用
function extractMultiField(block, keys){
  return extractField(block, keys, true);
}

function parseAiReflect(text){
  const entries = [];
  const blocks = text.split(/(?=【[^】]+】)/);
  blocks.forEach(block => {
    const hm = block.match(/^【([^】]+)】/);
    if(!hm) return;
    const rawType = hm[1].trim();
    const typKey = TYPE_MAP[rawType] || TYPE_MAP[rawType.toLowerCase()] || null;
    if(!typKey) return;

    const title      = extractField(block, ['タイトル','title']);
    const rawDate    = extractField(block, ['日付','date']);
    const date       = (rawDate.match(/\d{4}-\d{2}-\d{2}/) || [tod()])[0];
    const learned    = extractMultiField(block, ['気づき・学び','気づき','学び','learned']);
    const question   = extractMultiField(block, ['問い','question']);
    const nextExp    = extractMultiField(block, ['次の実験','次のアクション','nextExp','next']);

    if(!title && !learned) return;
    const entry = {
      id:uid(), type:typKey, date, status:'published',
      title: title || learned.slice(0,40),
      lesson: learned,
      nextExp,
      question
    };
    if(typKey==='moya')        entry.moya_what    = extractField(block, ['何にモヤモヤ','モヤモヤ詳細']);
    if(typKey==='vision')      entry.vision_change= extractField(block, ['VISIONの変化','変化']);
    if(typKey==='strategy')    entry.progress     = extractField(block, ['進捗','progress']);
    if(typKey==='philosophy'){
      entry.old_belief   = extractField(block, ['当時の思想','以前の考え']);
      entry.what_changed = extractField(block, ['何が変わったか','変化']);
      entry.new_belief   = extractField(block, ['今の理解','新しい考え']);
      entry.pivot        = extractField(block, ['転換点']);
    }
    entries.push(entry);
  });
  return entries;
}

async function registerAiInput(){
  const text = document.getElementById('ai-input').value.trim();
  const statusEl = document.getElementById('ai-parse-status');
  if(!text){ statusEl.textContent='入力が空です'; statusEl.className='ai-status err'; return; }
  let entries;
  try { entries = parseAiReflect(text); }
  catch(err){ statusEl.textContent='解析エラー: '+err.message; statusEl.className='ai-status err'; return; }
  if(!entries.length){
    statusEl.textContent='【振り返り】などのタイプ行が見つかりません'; statusEl.className='ai-status err'; return;
  }
  for(const r of entries){
    await dbput('logs', r);
    const i = S.logs.findIndex(x=>x.id===r.id);
    if(i>=0) S.logs[i]=r; else S.logs.unshift(r);
  }
  S.logs.sort((a,b)=>b.date.localeCompare(a.date));
  // 未紐づきチェック
  const unlinked=entries.filter(e=>!(e.themes&&e.themes.length));
  if(unlinked.length) S._unlinkedNotice=unlinked.length;
  statusEl.textContent = entries.length+'件を登録しました ✓'; statusEl.className='ai-status ok';
  document.getElementById('ai-input').value='';
  setTimeout(()=>{S.tab='home';ra();updateNav();},800);
}

/* ── ARCHIVE tab ── */
function renderArchive(){
  const f=document.createDocumentFragment();
  f.appendChild(D({cls:'sec-lbl',css:'margin-bottom:20px'},'アーカイブ'));
  const pub=S.logs.filter(r=>r.status!=='draft'&&r.nextExp?.trim());
  const rows=[];
  pub.forEach(r=>{
    const lines=r.nextExp.split(/\n/).filter(l=>l.trim());
    lines.forEach((line,i)=>{
      const ckId='e_'+r.id+'_'+i;
      const st=S.checks[ckId]||'todo';
      if(st!=='done'&&st!=='skip') return;
      rows.push({line,ckId,r,st});
    });
  });
  if(!rows.length){f.appendChild(D({cls:'empty'},'完了・やらないに移した実験がここに蓄積されます'));return f;}
  // 完了
  const done=rows.filter(x=>x.st==='done');
  if(done.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-top:0;margin-bottom:12px;font-size:11px'},'完了（'+done.length+'件）'));
    const dl=D({cls:'checklist'});
    done.forEach(({line,ckId,r})=>dl.appendChild(buildExpRow(line,ckId,r)));
    f.appendChild(dl);
  }
  // やらない
  const skip=rows.filter(x=>x.st==='skip');
  if(skip.length){
    f.appendChild(D({cls:'sec-lbl',css:'margin-top:24px;margin-bottom:12px;font-size:11px'},'やらない（'+skip.length+'件）'));
    const sl=D({cls:'checklist'});
    skip.forEach(({line,ckId,r})=>sl.appendChild(buildExpRow(line,ckId,r)));
    f.appendChild(sl);
  }
  return f;
}

/* ── EXPERIMENTS tab ── */
function buildExpRow(line, ckId, r){
  const st=S.checks[ckId]||'todo'; // todo / doing / done / skip
  const row=D({cls:'cl-row'+(st==='doing'?' cl-doing':st==='done'?' cl-done':st==='skip'?' cl-skip':'')});
  const lbl=D({cls:'cl-label'});lbl.textContent=line.replace(/^[・\-\d\.）\)\s]+/,'');
  const thNames=(r.themes||[]).map(id=>S.themes.find(t=>t.id===id)?.title).filter(Boolean);
  const from=D({cls:'cl-from'});from.textContent=r.date+' / '+(r.title||'')+(thNames.length?' ／ '+thNames.join('・'):'');
  // 状態ボタン
  async function setSt(newSt){
    S.checks[ckId]=newSt;
    await dbput('checks',{id:ckId,done:newSt==='done',state:newSt});
    ra();
  }
  const doingBtn=D({cls:'exp-state-btn'+(st==='doing'?' doing':'')});doingBtn.textContent='実験中';
  doingBtn.addEventListener('click',e=>{e.stopPropagation();setSt(st==='doing'?'todo':'doing');});
  const doneBtn=D({cls:'exp-state-btn'+(st==='done'?' doing':'')});doneBtn.textContent='完了';
  doneBtn.addEventListener('click',e=>{e.stopPropagation();setSt(st==='done'?'todo':'done');});
  const skipBtn=D({cls:'exp-state-btn'+(st==='skip'?' skip':'')});skipBtn.textContent='やらない';
  skipBtn.addEventListener('click',e=>{e.stopPropagation();setSt(st==='skip'?'todo':'skip');});
  row.appendChild(lbl);row.appendChild(from);
  const btns=D({css:'display:flex;gap:2px;margin-left:auto;flex-shrink:0'});
  btns.appendChild(doingBtn);btns.appendChild(doneBtn);btns.appendChild(skipBtn);
  row.appendChild(btns);
  return row;
}

/* ── Project OS 同期 ── */
const POS_STATUS_MAP={'進行中':'実行中','構想中':'構想中','保留':'保留','完了':'完了','中止':'完了'};
async function syncFromProjectOS(){
  try{
    const raw=localStorage.getItem('pos_v4');
    if(!raw){console.info('pos_v4 not found. Open Project OS first.');return -1;}
    const pos=JSON.parse(raw);
    const projects=(pos.projects||[]).filter(p=>p.name&&p.status!=='完了'&&p.status!=='中止');
    const existing=await dball('themes');
    let added=0;
    for(const p of projects){
      const syncId='pos_'+p.id;
      const already=existing.find(t=>t.id===syncId);
      const mapped={
        id:syncId,
        title:p.name,
        status:POS_STATUS_MAP[p.status]||'構想中',
        priority:p.priority==='高'?'A':p.priority==='中'?'B':'C',
        goal:p.goal||'',
        summary:p.goal||(p.nextAction||'').slice(0,60)||'',
        createdAt:tod(),
        updatedAt:tod(),
        _fromProjectOS:true
      };
      if(!already){await dbput('themes',mapped);added++;}
      else if(already.title!==p.name||already.status!==mapped.status){
        await dbput('themes',{...already,...mapped,updatedAt:tod()});
      }
    }
    // 削除されたプロジェクトを非表示に（completedに移動）
    const posIds=new Set(projects.map(p=>'pos_'+p.id));
    for(const t of existing.filter(t=>t._fromProjectOS&&!posIds.has(t.id))){
      await dbput('themes',{...t,status:'完了',updatedAt:tod()});
    }
    return added;
  }catch(e){console.warn('Project OS sync error:',e);return 0;}
}
